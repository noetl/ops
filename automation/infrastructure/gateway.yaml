apiVersion: noetl.io/v2
kind: Playbook
metadata:
  name: gateway_automation
  path: automation/infrastructure/gateway
  description: Build and deploy Gateway API/UI in local kind

executor:
  profile: local
  version: noetl-runtime/1

workload:
  action: help # build-image, load-image, deploy, deploy-image, deploy-all, remove, redeploy, restart, status, logs, test
  gateway_repo_dir: "../gateway"
  expected_kube_context: "kind-noetl"
  gateway_namespace: "gateway"
  gateway_release_name: "noetl-gateway"
  image_repository: "ghcr.io/noetl/noetl-gateway"
  image_tag: "latest"
  image_pull_policy: "Always"
  gateway_service_type: "NodePort"
  gateway_node_port: 30090
  noetl_base_url: "http://noetl.noetl.svc.cluster.local:8082"
  auth_bypass: "true"

workflow:
  - step: run
    desc: Run selected action
    tool:
      kind: shell
      cmds:
        - |
          set -euo pipefail
          ACTION="{{ workload.action }}"
          GATEWAY_REPO="{{ workload.gateway_repo_dir }}"
          EXPECTED_CONTEXT="{{ workload.expected_kube_context }}"
          GATEWAY_NAMESPACE="{{ workload.gateway_namespace }}"
          GATEWAY_RELEASE_NAME="{{ workload.gateway_release_name }}"
          IMAGE_REPOSITORY="{{ workload.image_repository }}"
          IMAGE_TAG="{{ workload.image_tag }}"
          IMAGE_PULL_POLICY="{{ workload.image_pull_policy }}"
          GATEWAY_SERVICE_TYPE="{{ workload.gateway_service_type }}"
          GATEWAY_NODE_PORT="{{ workload.gateway_node_port }}"
          NOETL_BASE_URL="{{ workload.noetl_base_url }}"
          AUTH_BYPASS="{{ workload.auth_bypass }}"

          ensure_gateway_repo() {
            if [ ! -d "$GATEWAY_REPO" ]; then
              echo "ERROR: Gateway repository not found: $GATEWAY_REPO"
              exit 1
            fi
          }

          ensure_kind_context() {
            CURRENT_CONTEXT="$(kubectl config current-context 2>/dev/null || true)"
            if [ -z "$CURRENT_CONTEXT" ]; then
              echo "ERROR: No active kubectl context found."
              echo "Set context to $EXPECTED_CONTEXT before deploy/status actions."
              exit 1
            fi
            if [ "$CURRENT_CONTEXT" != "$EXPECTED_CONTEXT" ]; then
              echo "ERROR: Refusing to run local kind deploy against context '$CURRENT_CONTEXT'."
              echo "Expected context: '$EXPECTED_CONTEXT'"
              exit 1
            fi
          }

          build() {
            ensure_gateway_repo
            docker buildx build --load --platform linux/amd64 \
              -t noetl-gateway:latest \
              -f "$GATEWAY_REPO/Dockerfile" "$GATEWAY_REPO"
          }

          load() {
            if ! docker image inspect noetl-gateway:latest >/dev/null 2>&1; then
              echo "ERROR: noetl-gateway:latest image not found in Docker"
              exit 1
            fi
            kind load docker-image noetl-gateway:latest --name noetl
          }

          deploy_api() {
            kubectl apply -f ci/manifests/gateway/namespace.yaml
            kubectl apply -f ci/manifests/gateway/deployment.yaml
            kubectl apply -f ci/manifests/gateway/service.yaml
          }

          deploy_ui() {
            kubectl apply -f ci/manifests/gateway/configmap-ui.yaml
            kubectl apply -f ci/manifests/gateway/configmap-ui-files.yaml
            kubectl apply -f ci/manifests/gateway/deployment-ui.yaml
            kubectl apply -f ci/manifests/gateway/service-ui.yaml
          }

          deploy_registry_image() {
            ensure_kind_context
            helm upgrade --install "$GATEWAY_RELEASE_NAME" automation/helm/gateway \
              --namespace "$GATEWAY_NAMESPACE" --create-namespace \
              --set image.repository="$IMAGE_REPOSITORY" \
              --set image.tag="$IMAGE_TAG" \
              --set image.pullPolicy="$IMAGE_PULL_POLICY" \
              --set service.type="$GATEWAY_SERVICE_TYPE" \
              --set service.nodePort="$GATEWAY_NODE_PORT" \
              --set env.noetlBaseUrl="$NOETL_BASE_URL" \
              --set env.authBypass="$AUTH_BYPASS"

            kubectl -n "$GATEWAY_NAMESPACE" rollout status deployment/gateway --timeout=180s
          }

          case "$ACTION" in
            build-image)
              build
              load
              ;;

            load-image)
              load
              ;;

            deploy)
              deploy_api
              ;;

            deploy-image)
              deploy_registry_image
              ;;

            deploy-all)
              build
              load
              deploy_api
              deploy_ui
              ;;

            remove)
              kubectl delete namespace gateway --ignore-not-found=true
              ;;

            redeploy)
              build
              load
              kubectl rollout restart deployment/gateway -n gateway
              kubectl rollout status deployment/gateway -n gateway --timeout=60s
              ;;

            restart)
              kubectl rollout restart deployment/gateway -n gateway
              kubectl rollout restart deployment/gateway-ui -n gateway
              ;;

            status)
              ensure_kind_context
              kubectl get all -n gateway
              ;;

            logs)
              kubectl logs -n gateway -l app=gateway --tail=100 -f
              ;;

            test)
              curl -s http://localhost:8090/graphql | head -20 || true
              curl -s http://localhost:8080/health || true
              ;;

            help|*)
              echo "Usage:"
              echo "  noetl run automation/infrastructure/gateway.yaml --runtime local --set action=<action>"
              echo ""
              echo "Actions: build-image, load-image, deploy, deploy-image, deploy-all, remove, redeploy, restart, status, logs, test"
              echo "Registry deploy without building:"
              echo "  --set action=deploy-image --set image_repository=ghcr.io/noetl/noetl-gateway --set image_tag=v2.8.4"
              echo "Optional: --set gateway_repo_dir=../gateway"
              ;;
          esac
    next:
      - step: end

  - step: end
    desc: End workflow
    tool:
      kind: noop
