apiVersion: noetl.io/v2
kind: Playbook
metadata:
  name: minio_automation
  path: automation/infrastructure/minio

executor:
  profile: local
  version: noetl-runtime/1
workload:
  action: help  # deploy, remove, status, logs, clear-cache

workflow:
  - step: start
    desc: Entry point for MinIO automation
    tool:
      kind: shell
      cmds:
        - echo "MinIO Automation - Action '{{ workload.action }}'"
    next:
      spec:
        mode: exclusive
      arcs:
        - step: deploy_minio
          when: "{{ workload.action == 'deploy' }}"
        - step: remove_minio
          when: "{{ workload.action == 'remove' }}"
        - step: check_status
          when: "{{ workload.action == 'status' }}"
        - step: show_logs
          when: "{{ workload.action == 'logs' }}"
        - step: clear_cache
          when: "{{ workload.action == 'clear-cache' }}"
        - step: show_help

  - step: deploy_minio
    desc: Deploy MinIO to kind cluster
    tool:
      kind: shell
      cmds:
        - |
          echo ""
          echo "Deploying MinIO to kind cluster..."
          kubectl config use-context kind-noetl
          kubectl apply -f ci/manifests/minio/namespace.yaml
          sleep 2
          kubectl apply -f ci/manifests/minio/
    next:
      spec:
        mode: exclusive
      arcs:
        - step: end

  - step: remove_minio
    desc: Remove MinIO from kind cluster
    tool:
      kind: shell
      cmds:
        - |
          echo ""
          echo "Removing MinIO from kind cluster..."
          kubectl config use-context kind-noetl
          kubectl delete -f ci/manifests/minio/
    next:
      spec:
        mode: exclusive
      arcs:
        - step: end

  - step: check_status
    desc: Check MinIO deployment status
    tool:
      kind: shell
      cmds:
        - |
          echo ""
          echo "MinIO Status:"
          echo "=================="
          kubectl get pods -n minio
          echo ""
          kubectl get svc -n minio
    next:
      spec:
        mode: exclusive
      arcs:
        - step: end

  - step: show_logs
    desc: Show MinIO logs
    tool:
      kind: shell
      cmds:
        - |
          echo ""
          echo "MinIO Logs:"
          kubectl logs -n minio -l app=minio --tail=50
    next:
      spec:
        mode: exclusive
      arcs:
        - step: end

  - step: clear_cache
    desc: Clear MinIO data cache directory
    tool:
      kind: shell
      cmds:
        - |
          echo ""
          echo "Clearing MinIO cache directory..."
          rm -rf ci/kind/cache/minio-data/*
    next:
      spec:
        mode: exclusive
      arcs:
        - step: end

  - step: show_help
    desc: Display available actions
    tool:
      kind: shell
      cmds:
        - |
          echo "====================================="
          echo " MinIO Automation"
          echo "====================================="
          echo ""
          echo "Usage:"
          echo "  noetl run automation/infrastructure/minio.yaml --set action=<action>"
          echo ""
          echo "Available actions:"
          echo "  deploy        - Deploy MinIO to kind cluster"
          echo "  remove        - Remove MinIO from kind cluster"
          echo "  status        - Check deployment status"
          echo "  logs          - Show MinIO logs"
          echo "  clear-cache   - Clear MinIO data cache directory"
          echo ""
          echo "Examples:"
          echo "  noetl run automation/infrastructure/minio.yaml --set action=deploy"
          echo "  noetl run automation/infrastructure/minio.yaml --set action=status"
          echo ""
    next:
      spec:
        mode: exclusive
      arcs:
        - step: end

  - step: end
    desc: End workflow
    tool:
      kind: noop
