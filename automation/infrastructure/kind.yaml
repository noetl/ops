apiVersion: noetl.io/v2
kind: Playbook
metadata:
  name: kind_automation
  path: automation/infrastructure/kind

executor:
  profile: local
  version: noetl-runtime/1
workload:
  action: help  # create, delete, list, image-load, images-list, status, context-set

workflow:
  - step: start
    desc: Entry point for Kind cluster automation
    tool:
      kind: shell
      cmds:
        - echo "Kind Cluster Automation - Action '{{ workload.action }}'"
    next:
      spec:
        mode: exclusive
      arcs:
        - step: create_cluster
          when: "{{ workload.action == 'create' }}"
        - step: delete_cluster
          when: "{{ workload.action == 'delete' }}"
        - step: list_clusters
          when: "{{ workload.action == 'list' }}"
        - step: load_image
          when: "{{ workload.action == 'image-load' }}"
        - step: list_images
          when: "{{ workload.action == 'images-list' }}"
        - step: check_status
          when: "{{ workload.action == 'status' }}"
        - step: set_context
          when: "{{ workload.action == 'context-set' }}"
        - step: show_help
          when: "{{ workload.action == 'help' }}"
        - step: show_help

  - step: create_cluster
    desc: Create Kind Kubernetes cluster
    tool:
      kind: shell
      cmds:
        - |
          ensure_podman_running() {
            if ! command -v podman >/dev/null 2>&1; then
              echo "ERROR: Podman is required but is not installed."
              echo "Install with: brew install podman"
              exit 1
            fi
            if ! podman machine list 2>/dev/null | grep -q "noetl-dev.*running"; then
              echo "ERROR: Podman machine 'noetl-dev' is not running."
              echo "Start it: podman machine start noetl-dev"
              exit 1
            fi
          }

          ensure_podman_running
          echo ""
          echo "Creating Kind cluster 'noetl'..."
          kind create cluster --config=ci/kind/config.yaml
          detect_lan_host() {
            local host=""
            if command -v scutil >/dev/null 2>&1; then
              host="$(scutil --get LocalHostName 2>/dev/null || true)"
            fi
            if [ -z "$host" ]; then
              host="$(hostname -s 2>/dev/null || hostname 2>/dev/null || true)"
            fi
            if [ -z "$host" ]; then
              echo "localhost"
            elif echo "$host" | grep -q '\.'; then
              echo "$host"
            else
              echo "${host}.local"
            fi
          }
          LAN_HOST="$(detect_lan_host)"
          echo "Kind cluster created with host port mappings on 0.0.0.0"
          echo "Preferred NoETL endpoint: http://${LAN_HOST}:8082"
    next:
      spec:
        mode: exclusive
      arcs:
        - step: end

  - step: delete_cluster
    desc: Delete Kind Kubernetes cluster
    tool:
      kind: shell
      cmds:
        - |
          echo ""
          echo "Deleting Kind cluster 'noetl'..."
          kind delete cluster --name=noetl
    next:
      spec:
        mode: exclusive
      arcs:
        - step: end

  - step: list_clusters
    desc: List all Kind clusters
    tool:
      kind: shell
      cmds:
        - |
          echo ""
          echo "Kind Clusters:"
          echo "=============="
          kind get clusters
    next:
      spec:
        mode: exclusive
      arcs:
        - step: end

  - step: load_image
    desc: Load NoETL image to Kind cluster
    tool:
      kind: shell
      cmds:
        - |
          ensure_podman_running() {
            if ! podman machine list 2>/dev/null | grep -q "noetl-dev.*running"; then
              echo "ERROR: Podman machine 'noetl-dev' must be running to load images into kind."
              echo "Start it: podman machine start noetl-dev"
              exit 1
            fi
          }

          ensure_podman_running
          echo ""
          echo "Loading NoETL image to Kind cluster..."
          IMAGE_TAG=$(cat .noetl_last_build_tag.txt)
          kind load docker-image local/noetl:$IMAGE_TAG --name noetl
    next:
      spec:
        mode: exclusive
      arcs:
        - step: end

  - step: list_images
    desc: List images in Kind cluster
    tool:
      kind: shell
      cmds:
        - |
          ensure_podman_running() {
            if ! podman machine list 2>/dev/null | grep -q "noetl-dev.*running"; then
              echo "ERROR: Podman machine 'noetl-dev' must be running to inspect kind node images."
              echo "Start it: podman machine start noetl-dev"
              exit 1
            fi
          }

          ensure_podman_running
          echo ""
          echo "Images in Kind cluster:"
          echo "======================="
          podman exec -it noetl-control-plane crictl images
    next:
      spec:
        mode: exclusive
      arcs:
        - step: end

  - step: check_status
    desc: Check Kind cluster status
    tool:
      kind: shell
      cmds:
        - |
          echo ""
          echo "Kind Cluster Status:"
          echo "===================="
          echo ""
          echo "=== Kind Clusters ==="
          kind get clusters 2>/dev/null || echo "No Kind clusters found"
          echo ""
          echo "=== Cluster Info (noetl) ==="
          if kind get clusters 2>/dev/null | grep -q "^noetl$"; then
            kubectl cluster-info --context kind-noetl 2>/dev/null || echo "Cannot connect to noetl cluster"
          else
            echo "Cluster 'noetl' does not exist"
          fi
          echo ""
          echo "=== Cluster Nodes ==="
          kubectl get nodes --context kind-noetl 2>/dev/null || echo "No nodes (cluster not running)"
          echo ""
          echo "=== Host Access Endpoint ==="
          detect_lan_host() {
            local host=""
            if command -v scutil >/dev/null 2>&1; then
              host="$(scutil --get LocalHostName 2>/dev/null || true)"
            fi
            if [ -z "$host" ]; then
              host="$(hostname -s 2>/dev/null || hostname 2>/dev/null || true)"
            fi
            if [ -z "$host" ]; then
              echo "localhost"
            elif echo "$host" | grep -q '\.'; then
              echo "$host"
            else
              echo "${host}.local"
            fi
          }
          LAN_HOST="$(detect_lan_host)"
          echo "  Preferred: http://${LAN_HOST}:8082"
          echo "  Local fallback: http://localhost:8082"
    next:
      spec:
        mode: exclusive
      arcs:
        - step: end

  - step: set_context
    desc: Set kubectl context to kind-noetl cluster
    tool:
      kind: shell
      cmds:
        - |
          echo ""
          echo "Setting kubectl context to kind-noetl..."
          kubectl config use-context kind-noetl
    next:
      spec:
        mode: exclusive
      arcs:
        - step: end

  - step: show_help
    desc: Display available actions
    tool:
      kind: shell
      cmds:
        - |
          echo "=================================================="
          echo " Kind Cluster Automation"
          echo "=================================================="
          echo ""
          echo "Usage:"
          echo "  noetl run automation/infrastructure/kind.yaml --set action=<action>"
          echo ""
          echo "Cluster Management:"
          echo "  create      - Create Kind cluster 'noetl'"
          echo "  delete      - Delete Kind cluster 'noetl'"
          echo "  list        - List all Kind clusters"
          echo "  status      - Check cluster status and nodes"
          echo "  context-set - Set kubectl context to kind-noetl"
          echo "  (requires Podman machine 'noetl-dev' running)"
          echo ""
          echo "Image Management:"
          echo "  image-load  - Load NoETL image to cluster"
          echo "  images-list - List images in cluster"
          echo ""
          echo "Examples:"
          echo "  # Create Kind cluster"
          echo "  noetl run automation/infrastructure/kind.yaml --set action=create"
          echo ""
          echo "  # Check status"
          echo "  noetl run automation/infrastructure/kind.yaml --set action=status"
          echo ""
          echo "  # Load NoETL image"
          echo "  noetl run automation/infrastructure/kind.yaml --set action=image-load"
          echo ""
          echo "  # List clusters"
          echo "  noetl run automation/infrastructure/kind.yaml --set action=list"
          echo ""
          echo "LAN access:"
          echo "  Kind host mappings are configured with listenAddress=0.0.0.0"
          echo "  Recreate cluster after config changes to apply port binding updates."
          echo ""
    next:
      spec:
        mode: exclusive
      arcs:
        - step: end

  - step: end
    desc: End workflow
    tool:
      kind: noop
