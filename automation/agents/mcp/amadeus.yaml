apiVersion: noetl.io/v2
kind: Playbook
metadata:
  name: amadeus_mcp
  path: automation/agents/mcp/amadeus
  description: |
    Amadeus MCP server playbook. Exposes Amadeus capabilities through
    NoETL's playbook-as-MCP JSON-RPC endpoint so MCP clients (Claude
    Desktop, NoetlPrompt's `cd /mcp/amadeus`, agent-to-agent calls) can
    use Amadeus the same way they'd use any other MCP server.

    Surface follows the MCP spec — `tools/list` returns the catalog,
    `tools/call` dispatches by tool name to the right Amadeus endpoint.
    Tools: search_flights, search_hotels, search_locations,
    search_activities, get_token (debug).

    Same Amadeus capability as automation/agents/travel/runtime, but
    callable through MCP rather than as a single agent flow. The
    travel agent could itself use this MCP server (agent → MCP hop)
    for its Amadeus calls — phase 2 of the flagship round.
  agent: true
  exposes_as_mcp: true
  exposed_in_ui: false
  version: "1.0"
  tags: [mcp, amadeus, travel, ai-os]
  terminal:
    visible: true
    workspace: amadeus
    scopes: [/mcp/amadeus]

workload:
  pg_auth: pg_k8s
  gcp_auth: google_oauth
  amadeus_env: test
  amadeus_key_path: projects/1014428265962/secrets/api-key-test-api-amadeus-com/versions/1
  amadeus_secret_path: projects/1014428265962/secrets/api-secret-test-api-amadeus-com/versions/1
  amadeus_production_key_path: projects/1014428265962/secrets/amadeus-production-client-id/versions/1
  amadeus_production_secret_path: projects/1014428265962/secrets/amadeus-production-client-secret/versions/1
  # MCP request fields. Populated by the JSON-RPC dispatcher.
  method: "tools/list"            # tools/list | tools/call
  tool: ""                        # search_flights | search_hotels | search_locations | search_activities | get_token
  arguments: {}                   # tool-specific kwargs

keychain:
  # Mirrors the proven pattern in
  # repos/e2e/fixtures/playbooks/api_integration/amadeus_ai_api/amadeus_ai_api.yaml.
  # Keychain Jinja templates resolve workload fields via BARE
  # references; `workload.X` yields empty strings at bind time and
  # downstream HTTP steps see empty Bearer tokens. Keep the endpoint
  # conditional simple and validate both modes before relying on a new
  # environment switch.
  - name: amadeus_credentials
    kind: secrets
    provider: gcp
    scope: global
    auth: "{{ gcp_auth }}"
    map:
      client_id: "{{ amadeus_production_key_path if amadeus_env == 'production' else amadeus_key_path }}"
      client_secret: "{{ amadeus_production_secret_path if amadeus_env == 'production' else amadeus_secret_path }}"

  - name: amadeus_token
    kind: oauth2
    scope: global
    auto_renew: true
    endpoint: "{{ 'https://api.amadeus.com' if amadeus_env == 'production' else 'https://test.api.amadeus.com' }}/v1/security/oauth2/token"
    method: POST
    headers:
      Content-Type: application/x-www-form-urlencoded
    data:
      grant_type: client_credentials
      client_id: "{{ keychain.amadeus_credentials.client_id }}"
      client_secret: "{{ keychain.amadeus_credentials.client_secret }}"

workflow:
  # ---------------------------------------------------------------------
  # 1. Dispatch on method/tool. tools/list returns the catalog;
  # tools/call branches by tool name.
  # ---------------------------------------------------------------------
  - step: start
    desc: Entry point — the Rust runtime requires a step named `start`; routes to dispatch
    tool:
      kind: noop
    next:
      spec: { mode: exclusive }
      arcs:
        - step: dispatch

  - step: dispatch
    desc: Branch on MCP method + tool name
    tool:
      kind: python
      input:
        method: "{{ workload.method }}"
        tool: "{{ workload.tool }}"
        arguments: "{{ workload.arguments }}"
      code: |
        result = {
            "method": str(method or "tools/list").strip().lower(),
            "tool": str(tool or "").strip().lower(),
            "arguments": arguments if isinstance(arguments, dict) else {},
        }
    next:
      spec: { mode: exclusive }
      arcs:
        - step: tools_list
          when: "{{ dispatch.method == 'tools/list' }}"
        - step: amadeus_search_flights
          when: "{{ dispatch.method == 'tools/call' and dispatch.tool == 'search_flights' }}"
        - step: amadeus_search_locations
          when: "{{ dispatch.method == 'tools/call' and dispatch.tool == 'search_locations' }}"
        - step: amadeus_search_hotels
          when: "{{ dispatch.method == 'tools/call' and dispatch.tool == 'search_hotels' }}"
        - step: amadeus_search_activities
          when: "{{ dispatch.method == 'tools/call' and dispatch.tool == 'search_activities' }}"
        - step: get_token_status
          when: "{{ dispatch.method == 'tools/call' and dispatch.tool == 'get_token' }}"
        - step: unknown_method
          when: "{{ dispatch.method != 'tools/list' and dispatch.method != 'tools/call' }}"
        - step: unknown_tool
          when: "{{ dispatch.method == 'tools/call' and dispatch.tool not in ['search_flights', 'search_locations', 'search_hotels', 'search_activities', 'get_token'] }}"

  # ---------------------------------------------------------------------
  # 2. tools/list — return the catalog as MCP-shaped tools array.
  # ---------------------------------------------------------------------
  - step: tools_list
    desc: Return the MCP tool catalog
    tool:
      kind: python
      code: |
        tools = [
            {
                "name": "search_flights",
                "title": "Search flights",
                "description": "Amadeus Flight Offers Search. Required: origin, destination, departureDate. Optional: adults, returnDate, cabin.",
                "inputSchema": {
                    "type": "object",
                    "required": ["origin", "destination", "departureDate"],
                    "properties": {
                        "origin": {"type": "string", "description": "IATA code"},
                        "destination": {"type": "string", "description": "IATA code"},
                        "departureDate": {"type": "string", "description": "YYYY-MM-DD"},
                        "returnDate": {"type": "string"},
                        "adults": {"type": "integer", "minimum": 1, "default": 1},
                        "cabin": {"type": "string", "enum": ["ECONOMY", "PREMIUM_ECONOMY", "BUSINESS", "FIRST"]},
                    },
                },
            },
            {
                "name": "search_hotels",
                "title": "Search hotels",
                "description": "Amadeus Hotel Search by city. Required: cityCode (IATA city code, e.g. NYC, PAR).",
                "inputSchema": {
                    "type": "object",
                    "required": ["cityCode"],
                    "properties": {
                        "cityCode": {"type": "string", "description": "IATA city code"},
                        "checkInDate": {"type": "string"},
                        "checkOutDate": {"type": "string"},
                        "adults": {"type": "integer", "minimum": 1, "default": 1},
                    },
                },
            },
            {
                "name": "search_locations",
                "title": "Search locations / IATA lookup",
                "description": "Amadeus Reference Data Locations. Lookup airports and cities by keyword.",
                "inputSchema": {
                    "type": "object",
                    "required": ["keyword"],
                    "properties": {
                        "keyword": {"type": "string"},
                        "subType": {"type": "string", "default": "AIRPORT,CITY"},
                    },
                },
            },
            {
                "name": "search_activities",
                "title": "Search activities / points of interest",
                "description": "Amadeus Activities by lat/long radius.",
                "inputSchema": {
                    "type": "object",
                    "required": ["latitude", "longitude"],
                    "properties": {
                        "latitude": {"type": "number"},
                        "longitude": {"type": "number"},
                        "radius": {"type": "integer", "default": 5},
                    },
                },
            },
            {
                "name": "get_token",
                "title": "Get OAuth token status (debug)",
                "description": "Returns whether the Amadeus OAuth bind succeeded. Returns no secret material.",
                "inputSchema": {"type": "object"},
            },
        ]
        result = {
            "status": "ok",
            "content": [{"type": "text", "text": "Amadeus MCP — 5 tools available"}],
            "isError": False,
            "_meta": {"backend": "amadeus", "tool_count": len(tools)},
            "data": {"tools": tools},
        }
    next:
      spec: { mode: exclusive }
      arcs:
        - step: end

  # ---------------------------------------------------------------------
  # 3a. tools/call search_flights
  #
  # Uses urllib in a Python step (not `kind: http`) because the noetl
  # HTTP tool currently aborts the step on 5xx (pending task #88: "noetl
  # HTTP tool: preserve response body in error events"). Wrapping the
  # call lets us return an MCP-shaped envelope even when Amadeus replies
  # with 5xx — clients see `isError: true` and the error message instead
  # of an opaque "Tool returned error".
  # ---------------------------------------------------------------------
  - step: amadeus_search_flights
    desc: Amadeus Flight Offers Search via urllib (catches errors)
    tool:
      kind: python
      input:
        amadeus_env: "{{ workload.amadeus_env | default('test') }}"
        amadeus_base_url: "{{ 'https://api.amadeus.com' if workload.amadeus_env == 'production' else 'https://test.api.amadeus.com' }}"
        access_token: "{{ keychain.amadeus_token.access_token }}"
        origin: "{{ workload.arguments.origin | default('') }}"
        destination: "{{ workload.arguments.destination | default('') }}"
        departure_date: "{{ workload.arguments.departureDate | default('') }}"
      code: |
        import json
        import urllib.request
        import urllib.error

        base_url = str(amadeus_base_url or "https://test.api.amadeus.com").rstrip("/")
        url = f"{base_url}/v2/shopping/flight-offers"
        payload = {
            "currencyCode": "USD",
            "originDestinations": [{
                "id": "1",
                "originLocationCode": origin,
                "destinationLocationCode": destination,
                "departureDateTimeRange": {"date": departure_date},
            }],
            "travelers": [{"id": "1", "travelerType": "ADULT"}],
            "sources": ["GDS"],
            "searchCriteria": {"maxFlightOffers": 10},
        }
        req = urllib.request.Request(
            url,
            data=json.dumps(payload).encode("utf-8"),
            headers={"Authorization": f"Bearer {access_token}", "Content-Type": "application/json"},
            method="POST",
        )
        body = None
        ok = False
        status_code = 0
        try:
            with urllib.request.urlopen(req, timeout=30) as resp:
                body_text = resp.read().decode("utf-8")
                try: body = json.loads(body_text)
                except Exception: body = {"raw": body_text[:2000]}
                ok, status_code = True, resp.status
        except urllib.error.HTTPError as e:
            try: err_text = e.read().decode("utf-8", errors="replace")
            except Exception: err_text = ""
            try: body = json.loads(err_text)
            except Exception: body = {"raw": err_text[:2000]}
            status_code = e.code
        except urllib.error.URLError as e:
            body = {"error": str(getattr(e, "reason", e))}
        except Exception as e:
            body = {"error": f"{type(e).__name__}: {e}"}

        offers = body.get("data") if (ok and isinstance(body, dict)) else []
        if not isinstance(offers, list):
            offers = []
        result = {
            # Keep the NoETL step green even when the upstream call fails;
            # MCP clients read `isError` plus data.error for the upstream status.
            "status": "ok",
            "content": [{"type": "text", "text": json.dumps({"offers_total": len(offers), "offers": offers[:10], "status_code": status_code, "error": None if ok else body}, separators=(",", ":"))}],
            "isError": not ok,
            "_meta": {"backend": "amadeus", "tool": "search_flights", "amadeus_env": amadeus_env, "offers_total": len(offers), "status_code": status_code},
            "data": {"amadeus_env": amadeus_env, "offers": offers, "offers_total": len(offers), "status_code": status_code, "ok": ok, "error": None if ok else body},
        }
    next:
      spec: { mode: exclusive }
      arcs:
        - step: end

  # ---------------------------------------------------------------------
  # 3b. tools/call search_locations — same urllib pattern as 3a.
  # ---------------------------------------------------------------------
  - step: amadeus_search_locations
    desc: Amadeus Reference Data Locations via urllib (catches errors)
    tool:
      kind: python
      input:
        amadeus_env: "{{ workload.amadeus_env | default('test') }}"
        amadeus_base_url: "{{ 'https://api.amadeus.com' if workload.amadeus_env == 'production' else 'https://test.api.amadeus.com' }}"
        access_token: "{{ keychain.amadeus_token.access_token }}"
        keyword: "{{ workload.arguments.keyword | default('') }}"
        sub_type: "{{ workload.arguments.subType | default('AIRPORT,CITY') }}"
      code: |
        import json
        import urllib.parse
        import urllib.request
        import urllib.error

        params = {"keyword": keyword, "subType": sub_type}
        base_url = str(amadeus_base_url or "https://test.api.amadeus.com").rstrip("/")
        url = f"{base_url}/v1/reference-data/locations?" + urllib.parse.urlencode(params)
        req = urllib.request.Request(
            url,
            headers={"Authorization": f"Bearer {access_token}"},
            method="GET",
        )
        body = None
        ok = False
        status_code = 0
        try:
            with urllib.request.urlopen(req, timeout=30) as resp:
                body_text = resp.read().decode("utf-8")
                try: body = json.loads(body_text)
                except Exception: body = {"raw": body_text[:2000]}
                ok, status_code = True, resp.status
        except urllib.error.HTTPError as e:
            try: err_text = e.read().decode("utf-8", errors="replace")
            except Exception: err_text = ""
            try: body = json.loads(err_text)
            except Exception: body = {"raw": err_text[:2000]}
            status_code = e.code
        except urllib.error.URLError as e:
            body = {"error": str(getattr(e, "reason", e))}
        except Exception as e:
            body = {"error": f"{type(e).__name__}: {e}"}

        items = body.get("data") if (ok and isinstance(body, dict)) else []
        if not isinstance(items, list):
            items = []
        result = {
            # Keep the NoETL step green even when the upstream call fails;
            # MCP clients read `isError` plus data.error for the upstream status.
            "status": "ok",
            "content": [{"type": "text", "text": json.dumps({"items_total": len(items), "items": items[:25], "status_code": status_code, "error": None if ok else body}, separators=(",", ":"))}],
            "isError": not ok,
            "_meta": {"backend": "amadeus", "tool": "search_locations", "amadeus_env": amadeus_env, "items_total": len(items), "status_code": status_code},
            "data": {"amadeus_env": amadeus_env, "items": items, "items_total": len(items), "status_code": status_code, "ok": ok, "error": None if ok else body},
        }
    next:
      spec: { mode: exclusive }
      arcs:
        - step: end

  # ---------------------------------------------------------------------
  # 3c. tools/call search_hotels — same urllib pattern as 3a.
  # ---------------------------------------------------------------------
  - step: amadeus_search_hotels
    desc: Amadeus Hotel List by city via urllib (catches errors)
    tool:
      kind: python
      input:
        amadeus_env: "{{ workload.amadeus_env | default('test') }}"
        amadeus_base_url: "{{ 'https://api.amadeus.com' if workload.amadeus_env == 'production' else 'https://test.api.amadeus.com' }}"
        access_token: "{{ keychain.amadeus_token.access_token }}"
        city_code: "{{ workload.arguments.cityCode | default('') }}"
      code: |
        import json
        import urllib.parse
        import urllib.request
        import urllib.error

        base_url = str(amadeus_base_url or "https://test.api.amadeus.com").rstrip("/")
        url = f"{base_url}/v1/reference-data/locations/hotels/by-city?" + urllib.parse.urlencode({"cityCode": city_code})
        req = urllib.request.Request(
            url,
            headers={"Authorization": f"Bearer {access_token}"},
            method="GET",
        )
        body = None
        ok = False
        status_code = 0
        try:
            with urllib.request.urlopen(req, timeout=30) as resp:
                body_text = resp.read().decode("utf-8")
                try: body = json.loads(body_text)
                except Exception: body = {"raw": body_text[:2000]}
                ok, status_code = True, resp.status
        except urllib.error.HTTPError as e:
            try: err_text = e.read().decode("utf-8", errors="replace")
            except Exception: err_text = ""
            try: body = json.loads(err_text)
            except Exception: body = {"raw": err_text[:2000]}
            status_code = e.code
        except urllib.error.URLError as e:
            body = {"error": str(getattr(e, "reason", e))}
        except Exception as e:
            body = {"error": f"{type(e).__name__}: {e}"}

        items = body.get("data") if (ok and isinstance(body, dict)) else []
        if not isinstance(items, list):
            items = []
        result = {
            # Keep the NoETL step green even when the upstream call fails;
            # MCP clients read `isError` plus data.error for the upstream status.
            "status": "ok",
            "content": [{"type": "text", "text": json.dumps({"hotels_total": len(items), "hotels": items[:25], "status_code": status_code, "error": None if ok else body}, separators=(",", ":"))}],
            "isError": not ok,
            "_meta": {"backend": "amadeus", "tool": "search_hotels", "amadeus_env": amadeus_env, "hotels_total": len(items), "status_code": status_code},
            "data": {"amadeus_env": amadeus_env, "hotels": items, "hotels_total": len(items), "status_code": status_code, "ok": ok, "error": None if ok else body},
        }
    next:
      spec: { mode: exclusive }
      arcs:
        - step: end

  # ---------------------------------------------------------------------
  # 3d. tools/call search_activities — same urllib pattern as 3a.
  # ---------------------------------------------------------------------
  - step: amadeus_search_activities
    desc: Amadeus Activities by lat/long via urllib (catches errors)
    tool:
      kind: python
      input:
        amadeus_env: "{{ workload.amadeus_env | default('test') }}"
        amadeus_base_url: "{{ 'https://api.amadeus.com' if workload.amadeus_env == 'production' else 'https://test.api.amadeus.com' }}"
        access_token: "{{ keychain.amadeus_token.access_token }}"
        latitude: "{{ workload.arguments.latitude | default('') }}"
        longitude: "{{ workload.arguments.longitude | default('') }}"
        radius: "{{ workload.arguments.radius | default(5) }}"
      code: |
        import json
        import urllib.parse
        import urllib.request
        import urllib.error

        base_url = str(amadeus_base_url or "https://test.api.amadeus.com").rstrip("/")
        url = f"{base_url}/v1/shopping/activities?" + urllib.parse.urlencode({
            "latitude": latitude,
            "longitude": longitude,
            "radius": radius,
        })
        req = urllib.request.Request(
            url,
            headers={"Authorization": f"Bearer {access_token}"},
            method="GET",
        )
        body = None
        ok = False
        status_code = 0
        try:
            with urllib.request.urlopen(req, timeout=30) as resp:
                body_text = resp.read().decode("utf-8")
                try: body = json.loads(body_text)
                except Exception: body = {"raw": body_text[:2000]}
                ok, status_code = True, resp.status
        except urllib.error.HTTPError as e:
            try: err_text = e.read().decode("utf-8", errors="replace")
            except Exception: err_text = ""
            try: body = json.loads(err_text)
            except Exception: body = {"raw": err_text[:2000]}
            status_code = e.code
        except urllib.error.URLError as e:
            body = {"error": str(getattr(e, "reason", e))}
        except Exception as e:
            body = {"error": f"{type(e).__name__}: {e}"}

        items = body.get("data") if (ok and isinstance(body, dict)) else []
        if not isinstance(items, list):
            items = []
        result = {
            # Keep the NoETL step green even when the upstream call fails;
            # MCP clients read `isError` plus data.error for the upstream status.
            "status": "ok",
            "content": [{"type": "text", "text": json.dumps({"activities_total": len(items), "activities": items[:25], "status_code": status_code, "error": None if ok else body}, separators=(",", ":"))}],
            "isError": not ok,
            "_meta": {"backend": "amadeus", "tool": "search_activities", "amadeus_env": amadeus_env, "activities_total": len(items), "status_code": status_code},
            "data": {"amadeus_env": amadeus_env, "activities": items, "activities_total": len(items), "status_code": status_code, "ok": ok, "error": None if ok else body},
        }
    next:
      spec: { mode: exclusive }
      arcs:
        - step: end

  # ---------------------------------------------------------------------
  # 3e. tools/call get_token (debug)
  # ---------------------------------------------------------------------
  - step: get_token_status
    desc: Report Amadeus OAuth bind status (debug; returns no secret)
    tool:
      kind: python
      input:
        amadeus_env: "{{ workload.amadeus_env | default('test') }}"
        token_present: "{{ keychain.amadeus_token.access_token is defined and keychain.amadeus_token.access_token != '' }}"
      code: |
        ok = bool(token_present)
        result = {
            "status": "ok" if ok else "error",
            "content": [{"type": "text", "text": "Amadeus OAuth bind " + ("OK" if ok else "FAILED")}],
            "isError": not ok,
            "_meta": {"backend": "amadeus", "tool": "get_token", "amadeus_env": amadeus_env, "token_bound": ok},
            "data": {"amadeus_env": amadeus_env, "token_bound": ok},
        }
    next:
      spec: { mode: exclusive }
      arcs:
        - step: end

  # ---------------------------------------------------------------------
  # 4. Unknown method / tool — MCP error envelope.
  # ---------------------------------------------------------------------
  - step: unknown_method
    desc: Unknown MCP method
    tool:
      kind: python
      input:
        method: "{{ workload.method }}"
      code: |
        result = {
            "status": "error",
            "content": [{"type": "text", "text": f"Unknown MCP method: {method}"}],
            "isError": True,
            "_meta": {"backend": "amadeus", "supported_methods": ["tools/list", "tools/call"]},
            "data": {"method": str(method)},
        }
    next:
      spec: { mode: exclusive }
      arcs:
        - step: end

  - step: unknown_tool
    desc: Unknown tool name
    tool:
      kind: python
      input:
        tool: "{{ workload.tool }}"
      code: |
        result = {
            "status": "error",
            "content": [{"type": "text", "text": f"Unknown tool: {tool}. Run tools/list to see the catalog."}],
            "isError": True,
            "_meta": {"backend": "amadeus", "supported_tools": ["search_flights", "search_hotels", "search_locations", "search_activities", "get_token"]},
            "data": {"tool": str(tool)},
        }
    next:
      spec: { mode: exclusive }
      arcs:
        - step: end

  - step: end
    desc: Done
    tool:
      kind: noop
