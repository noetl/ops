# PRODUCTION IMPLEMENTATION.
# Real Vertex AI / Gemini MCP backend for deployment-mode pointer swap.
# The local validation stub remains at automation/agents/mcp/vertex-ai-stub.yaml.
apiVersion: noetl.io/v2
kind: Playbook
metadata:
  name: chat_completion
  path: automation/agents/mcp/vertex-ai
  description: |
    Vertex AI / Gemini MCP backend for production triage. It is exposed
    through NoETL's playbook-as-MCP JSON-RPC endpoint and implements
    the same chat_completion contract as mcp/ollama and the local
    mcp/vertex-ai-stub playbook.

    Authentication prefers GKE Workload Identity via the metadata
    server. GOOGLE_OAUTH_ACCESS_TOKEN and GOOGLE_APPLICATION_CREDENTIALS
    are supported as local/operator fallbacks.
  agent: true
  exposes_as_mcp: true
  exposed_in_ui: false
  tags:
    - mcp
    - vertex-ai
    - gemini
    - triage
    - production

workload:
  # Standard MCP chat_completion surface.
  model: "gemini-2.0-flash"
  messages: []
  system: ""
  temperature: 0.1

  # Vertex-specific knobs. `vertex_project` is required for real calls;
  # callers may pass either `vertex_model` or the MCP `model` argument.
  vertex_project: ""
  vertex_region: "us-central1"
  vertex_model: "gemini-2.0-flash"
  vertex_credential: ""

workflow:
  - step: vertex_generate_content
    desc: Call Vertex AI GenerateContent and return MCP chat_completion shape
    tool:
      kind: python
      code: |
        import base64
        import json
        import os
        import time
        import urllib.error
        import urllib.parse
        import urllib.request

        SCOPE = "https://www.googleapis.com/auth/cloud-platform"

        class VertexMcpError(Exception):
          pass

        def _b64url(data):
          return base64.urlsafe_b64encode(data).rstrip(b"=").decode("ascii")

        def _json_dumps(data):
          return json.dumps(data, separators=(",", ":"), sort_keys=True)

        def _service_account_jwt_token(credentials_path, scope):
          try:
            from cryptography.hazmat.backends import default_backend
            from cryptography.hazmat.primitives import hashes, serialization
            from cryptography.hazmat.primitives.asymmetric import padding
          except Exception as exc:
            raise VertexMcpError(
              "GOOGLE_APPLICATION_CREDENTIALS fallback requires cryptography "
              f"to sign the service-account JWT: {type(exc).__name__}: {exc}"
            )

          try:
            with open(credentials_path, "r", encoding="utf-8") as fh:
              info = json.load(fh)
          except Exception as exc:
            raise VertexMcpError(
              f"failed to read GOOGLE_APPLICATION_CREDENTIALS: {type(exc).__name__}: {exc}"
            )

          private_key = info.get("private_key")
          client_email = info.get("client_email")
          token_uri = info.get("token_uri") or "https://oauth2.googleapis.com/token"
          if not private_key or not client_email:
            raise VertexMcpError("service-account credentials missing private_key or client_email")

          now = int(time.time())
          header = {"alg": "RS256", "typ": "JWT"}
          claim = {
            "iss": client_email,
            "scope": scope,
            "aud": token_uri,
            "iat": now,
            "exp": now + 3600,
          }
          signing_input = (
            _b64url(_json_dumps(header).encode("utf-8"))
            + "."
            + _b64url(_json_dumps(claim).encode("utf-8"))
          )
          key = serialization.load_pem_private_key(
            private_key.encode("utf-8"),
            password=None,
            backend=default_backend(),
          )
          signature = key.sign(
            signing_input.encode("ascii"),
            padding.PKCS1v15(),
            hashes.SHA256(),
          )
          assertion = signing_input + "." + _b64url(signature)
          data = urllib.parse.urlencode(
            {
              "grant_type": "urn:ietf:params:oauth:grant-type:jwt-bearer",
              "assertion": assertion,
            }
          ).encode("utf-8")
          req = urllib.request.Request(
            token_uri,
            data=data,
            headers={"Content-Type": "application/x-www-form-urlencoded"},
            method="POST",
          )
          try:
            with urllib.request.urlopen(req, timeout=20) as resp:
              payload = json.loads(resp.read().decode("utf-8"))
          except urllib.error.HTTPError as exc:
            body = exc.read().decode("utf-8", errors="replace")
            raise VertexMcpError(f"service-account token exchange failed HTTP {exc.code}: {body}")
          except Exception as exc:
            raise VertexMcpError(f"service-account token exchange failed: {type(exc).__name__}: {exc}")
          token = payload.get("access_token")
          if not token:
            raise VertexMcpError("service-account token exchange returned no access_token")
          return token

        def _metadata_token(scope, service_account):
          account = service_account or "default"
          url = (
            "http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/"
            + urllib.parse.quote(account, safe="")
            + "/token?scopes="
            + urllib.parse.quote(scope, safe="")
          )
          req = urllib.request.Request(url, headers={"Metadata-Flavor": "Google"})
          try:
            with urllib.request.urlopen(req, timeout=5) as resp:
              payload = json.loads(resp.read().decode("utf-8"))
          except urllib.error.HTTPError as exc:
            body = exc.read().decode("utf-8", errors="replace")
            raise VertexMcpError(f"metadata token request failed HTTP {exc.code}: {body}")
          except Exception as exc:
            raise VertexMcpError(f"metadata token request failed: {type(exc).__name__}: {exc}")
          token = payload.get("access_token")
          if not token:
            raise VertexMcpError("metadata token request returned no access_token")
          return token

        def _access_token(scope, service_account):
          env_token = os.environ.get("GOOGLE_OAUTH_ACCESS_TOKEN", "").strip()
          if env_token:
            return env_token
          credentials_path = os.environ.get("GOOGLE_APPLICATION_CREDENTIALS", "").strip()
          if credentials_path:
            return _service_account_jwt_token(credentials_path, scope)
          return _metadata_token(scope, service_account)

        def _message_content(message):
          if isinstance(message, str):
            return message
          if not isinstance(message, dict):
            return str(message)
          content = message.get("content", "")
          if isinstance(content, str):
            return content
          if isinstance(content, list):
            parts = []
            for item in content:
              if isinstance(item, dict):
                if isinstance(item.get("text"), str):
                  parts.append(item["text"])
                elif isinstance(item.get("content"), str):
                  parts.append(item["content"])
              elif item is not None:
                parts.append(str(item))
            return "\n".join(parts)
          return str(content)

        def _to_vertex_contents(messages):
          contents = []
          for message in messages if isinstance(messages, list) else []:
            if not isinstance(message, dict):
              contents.append({"role": "user", "parts": [{"text": str(message)}]})
              continue
            role = str(message.get("role") or "user").lower()
            if role == "system":
              continue
            vertex_role = "model" if role in ("assistant", "model") else "user"
            text = _message_content(message).strip()
            if text:
              contents.append({"role": vertex_role, "parts": [{"text": text}]})
          return contents or [{"role": "user", "parts": [{"text": "Diagnose the supplied NoETL execution failure."}]}]

        def _extract_text(response):
          candidates = response.get("candidates") if isinstance(response, dict) else []
          if not candidates or not isinstance(candidates[0], dict):
            return ""
          content = candidates[0].get("content") or {}
          parts = content.get("parts") if isinstance(content, dict) else []
          texts = []
          for part in parts or []:
            if isinstance(part, dict) and isinstance(part.get("text"), str):
              texts.append(part["text"])
          return "\n".join(texts).strip()

        project = str(vertex_project or "").strip()
        region = str(vertex_region or "us-central1").strip()
        model_name = str(vertex_model or model or "gemini-2.0-flash").strip()
        service_account = str(vertex_credential or "").strip()

        if not project:
          error = {
            "category": "bad_request",
            "confidence": 1.0,
            "root_cause": "mcp/vertex-ai requires workload.vertex_project.",
            "suggested_action": "Pass vertex_project in the MCP tool arguments or deployment workload.",
            "user_message": "Vertex AI project is missing.",
            "source": "vertex-ai",
          }
          result = {
            "status": "error",
            "content": [{"type": "text", "text": json.dumps(error, separators=(",", ":"))}],
            "isError": True,
            "_meta": {"backend": "vertex-ai", "model": model_name, "usage": {}, "error": "missing_vertex_project"},
            "data": {"diagnosis": error, "_meta": {"backend": "vertex-ai", "model": model_name, "usage": {}}},
            "summary": error["user_message"],
            "text": json.dumps(error, separators=(",", ":")),
          }
        else:
          try:
            token = _access_token(SCOPE, service_account)
            body = {
              "contents": _to_vertex_contents(messages),
              "generationConfig": {
                "temperature": float(temperature if temperature is not None else 0.1),
              },
            }
            system_text = str(system or "").strip()
            if system_text:
              body["systemInstruction"] = {"parts": [{"text": system_text}]}

            endpoint = (
              f"https://{region}-aiplatform.googleapis.com/v1/projects/{project}"
              f"/locations/{region}/publishers/google/models/{model_name}:generateContent"
            )
            req = urllib.request.Request(
              endpoint,
              data=json.dumps(body).encode("utf-8"),
              headers={
                "Authorization": f"Bearer {token}",
                "Content-Type": "application/json",
                "x-goog-user-project": project,
              },
              method="POST",
            )
            with urllib.request.urlopen(req, timeout=120) as resp:
              request_id = resp.headers.get("x-request-id") or resp.headers.get("x-goog-request-id") or ""
              vertex_response = json.loads(resp.read().decode("utf-8"))

            text = _extract_text(vertex_response)
            if not text:
              text = json.dumps(
                {
                  "category": "unknown",
                  "confidence": 0.0,
                  "root_cause": "Vertex AI returned no text candidate.",
                  "suggested_action": "Inspect Vertex safety ratings and finish reason.",
                  "user_message": "Vertex AI returned an empty response.",
                  "source": "vertex-ai",
                },
                separators=(",", ":"),
              )

            usage_meta = vertex_response.get("usageMetadata") if isinstance(vertex_response, dict) else {}
            usage = {
              "prompt_tokens": int(usage_meta.get("promptTokenCount") or 0) if isinstance(usage_meta, dict) else 0,
              "completion_tokens": int(usage_meta.get("candidatesTokenCount") or 0) if isinstance(usage_meta, dict) else 0,
              "total_tokens": int(usage_meta.get("totalTokenCount") or 0) if isinstance(usage_meta, dict) else 0,
            }
            first_candidate = (vertex_response.get("candidates") or [{}])[0] if isinstance(vertex_response, dict) else {}
            safety = {
              "finish_reason": first_candidate.get("finishReason") if isinstance(first_candidate, dict) else None,
              "safety_ratings": first_candidate.get("safetyRatings") if isinstance(first_candidate, dict) else None,
            }
            meta = {
              "backend": "vertex-ai",
              "model": model_name,
              "project": project,
              "region": region,
              "usage": usage,
              "request_id": request_id,
              "safety": safety,
              "ollama_response": {
                # Compatibility path for existing evidence walkers.
                "model": model_name,
                "backend": "vertex-ai",
                "usage": usage,
              },
            }
            result = {
              "status": "ok",
              "content": [{"type": "text", "text": text}],
              "isError": False,
              "_meta": meta,
              "usage": usage,
              "usage_prompt_tokens": usage["prompt_tokens"],
              "usage_completion_tokens": usage["completion_tokens"],
              "usage_total_tokens": usage["total_tokens"],
              "data": {"_meta": meta, "vertex_response": vertex_response},
              "summary": "Vertex AI returned a triage response.",
              "text": text,
            }
          except urllib.error.HTTPError as exc:
            body = exc.read().decode("utf-8", errors="replace")
            error = {
              "category": "tool_error",
              "confidence": 1.0,
              "root_cause": f"Vertex AI GenerateContent failed with HTTP {exc.code}.",
              "suggested_action": "Check Vertex AI API enablement, Workload Identity, IAM roles/aiplatform.user, model name, and region.",
              "user_message": "Vertex AI call failed.",
              "source": "vertex-ai",
            }
            meta = {"backend": "vertex-ai", "model": model_name, "project": project, "region": region, "usage": {}, "error": body[:2000]}
            result = {
              "status": "error",
              "content": [{"type": "text", "text": json.dumps(error, separators=(",", ":"))}],
              "isError": True,
              "_meta": meta,
              "data": {"diagnosis": error, "_meta": meta},
              "summary": error["root_cause"],
              "text": json.dumps(error, separators=(",", ":")),
            }
          except Exception as exc:
            error = {
              "category": "tool_error",
              "confidence": 1.0,
              "root_cause": f"Vertex AI MCP call failed: {type(exc).__name__}: {exc}",
              "suggested_action": "Check Workload Identity, GOOGLE_APPLICATION_CREDENTIALS, Vertex AI API enablement, model name, region, and network egress.",
              "user_message": "Vertex AI MCP call failed.",
              "source": "vertex-ai",
            }
            meta = {"backend": "vertex-ai", "model": model_name, "project": project, "region": region, "usage": {}, "error": str(exc)[:2000]}
            result = {
              "status": "error",
              "content": [{"type": "text", "text": json.dumps(error, separators=(",", ":"))}],
              "isError": True,
              "_meta": meta,
              "data": {"diagnosis": error, "_meta": meta},
              "summary": error["root_cause"],
              "text": json.dumps(error, separators=(",", ":")),
            }
      args:
        model: "{{ workload.model }}"
        messages: "{{ workload.messages }}"
        system: "{{ workload.system }}"
        temperature: "{{ workload.temperature }}"
        vertex_project: "{{ workload.vertex_project }}"
        vertex_region: "{{ workload.vertex_region }}"
        vertex_model: "{{ workload.vertex_model }}"
        vertex_credential: "{{ workload.vertex_credential }}"
    next:
      arcs:
        - step: end

  - step: end
    tool:
      kind: noop
