apiVersion: noetl.io/v2
kind: Playbook
metadata:
  name: hotelbeds_mcp
  path: automation/agents/mcp/hotelbeds
  description: |
    HotelBeds (APITUDE) Hotel Booking API MCP server playbook — hotel
    availability search for the travel ("Muno") itinerary planner. Replaces
    the removed Amadeus hotels path (dev API dropped) with HotelBeds as the
    HOTELS provider.

    This is one of three independent HotelBeds APITUDE products, each with
    its OWN apikey/secret, GSM secret, and rate limit (the SHA256 signature
    scheme is shared): hotels (this file), activities
    (hotelbeds-activities.yaml), transfers (hotelbeds-transfers.yaml).

    Auth (test environment) — per the official HotelBeds getting-started
    docs (https://developer.hotelbeds.com/documentation/getting-started/):
    - Every HotelBeds call carries: Api-key, X-Signature,
      Accept: application/json, Accept-Encoding: gzip. The signature is
      X-Signature = SHA256(apiKey + secret + current_unix_time_seconds)
      as a lowercase hex digest, recomputed per request (the timestamp is
      part of the digest, so a stale signature is rejected).
    - The apikey + secret are NEVER hardcoded in this playbook. They live
      in the GCP Secret Manager secret `hotelbeds-hotels-test` (a JSON blob
      `{"apikey": "...", "secret": "..."}`), and the playbook reads them at
      runtime using the worker pod's GKE Workload Identity:
        1. mint an OAuth2 access token from the GKE metadata server
           (GET http://metadata.google.internal/.../service-accounts/default/token
           with Metadata-Flavor: Google) — stdlib urllib, no google-auth lib,
        2. read the secret via the Secret Manager REST API with that token.
      This is the same library-free Workload-Identity pattern the reworked
      google-places MCP playbook uses (noetl/ai-meta#137). The keychain
      credential reference `hotelbeds_hotels` (kind secret_manager, pointing
      at the same GSM secret) is the declarative record of this dependency;
      the in-playbook read above is the mechanism proven on the Rust worker.

    Endpoint (per official docs): POST /hotel-api/1.0/hotels with a JSON body
    {stay:{checkIn,checkOut}, occupancies:[{rooms,adults,children}],
    geolocation:{latitude,longitude,radius,unit}}. Response hotels live under
    body.hotels.hotels[]. Each availability rate carries a `rateKey` — the
    opaque, short-lived token that identifies a bookable rate. search_hotels
    surfaces the cheapest room's first `rateKey` so the planner can carry it to
    booking (mirrors how a Duffel offer id flows to create_order).

    Booking (TEST/SANDBOX ONLY) — book_hotel mirrors the Duffel create_order
    flow. APITUDE booking is a two-call dance:
      1. checkRate (POST /hotel-api/1.0/checkrates with
         {rooms:[{rateKey}]}) re-prices the selected rate and returns a fresh,
         confirmed rateKey + final net price. Availability rateKeys can drift
         in price or expire; checkRate is the authoritative re-price.
      2. bookings (POST /hotel-api/1.0/bookings with
         {holder:{name,surname}, rooms:[{rateKey, paxes:[...]}],
         clientReference}) confirms the reservation and returns
         booking.reference, booking.hotel.{name,checkIn,checkOut},
         booking.totalNet, booking.currency, booking.status.
    SAFETY: book_hotel refuses to issue a booking unless the configured base
    host is the HotelBeds TEST/SANDBOX host (api.test.hotelbeds.com). A
    non-test base returns a `not_sandbox` error and books nothing — no
    real-money reservation is ever issued from this playbook. This is the
    HotelBeds analogue of the Duffel create_order `duffel_env=test` gate.

    Operator prerequisites (until these land, backend calls return a clear
    auth/permission error — NOT a missing-library or parse error):
    - GSM secret `hotelbeds-hotels-test` exists with the JSON value loaded.
    - The worker pod's GSA `noetl-worker-mcp@noetl-demo-19700101.iam.gserviceaccount.com`
      holds roles/secretmanager.secretAccessor on `hotelbeds-hotels-test`.

    Rate limits (HotelBeds hotels test): 8 requests / 4 seconds; quota
    50 / 86400s. This playbook issues at most one availability request per
    tools/call, so a single planner turn stays well inside the limit. Do not
    loop it.

    Tools: search_hotels (availability), book_hotel (TEST/SANDBOX
    checkRate+booking), list_destinations (debug).
  agent: true
  exposes_as_mcp: true
  exposed_in_ui: false
  version: "1.2"
  tags: [mcp, hotelbeds, apitude, travel, hotels]
  terminal:
    visible: true
    workspace: hotelbeds
    scopes: [/mcp/hotelbeds]

workload:
  method: "tools/list"
  tool: ""
  arguments: {}
  hotelbeds_env: test
  hotelbeds_api_base: "https://api.test.hotelbeds.com"
  google_project: "noetl-demo-19700101"
  # GSM secret holding {"apikey": "...", "secret": "..."}. The value is loaded
  # out-of-band by the operator; this playbook only references the name.
  hotelbeds_secret_name: "hotelbeds-hotels-test"
  max_hotels: 10

workflow:
  - step: start
    desc: Entry point — the Rust runtime requires a step named `start`; routes to hotelbeds_dispatch
    tool:
      kind: noop
    next:
      spec: { mode: exclusive }
      arcs:
        - step: hotelbeds_dispatch

  - step: hotelbeds_dispatch
    desc: Dispatch HotelBeds MCP tools (Workload-Identity GSM secret read + SHA256 signature)
    tool:
      kind: python
      input:
        method: "{{ workload.method }}"
        tool: "{{ workload.tool }}"
        arguments: "{{ workload.arguments }}"
        hotelbeds_env: "{{ workload.hotelbeds_env | default('test') }}"
        hotelbeds_api_base: "{{ workload.hotelbeds_api_base | default('https://api.test.hotelbeds.com') }}"
        google_project: "{{ workload.google_project | default('noetl-demo-19700101') }}"
        hotelbeds_secret_name: "{{ workload.hotelbeds_secret_name | default('hotelbeds-api-test') }}"
        max_hotels: "{{ workload.max_hotels | default(10) }}"
        # book_hotel tolerance (%). HotelBeds default is 2.0; in TEST/SANDBOX the
        # price drifts between checkRate and bookings, so a generous default lets
        # the re-priced test booking complete (no real money). Override per call.
        book_tolerance: "{{ workload.book_tolerance | default(15) }}"
      code: |
        import base64
        import gzip
        import hashlib
        import json
        import time
        import urllib.error
        import urllib.parse
        import urllib.request

        METADATA_TOKEN_URL = (
            "http://metadata.google.internal/computeMetadata/v1/"
            "instance/service-accounts/default/token"
        )
        AVAILABILITY_PATH = "/hotel-api/1.0/hotels"
        CHECKRATES_PATH = "/hotel-api/1.0/checkrates"
        BOOKINGS_PATH = "/hotel-api/1.0/bookings"
        DESTINATIONS_PATH = "/hotel-api/1.0/locations/destinations"
        # SAFETY: any base host whose substring matches one of these is treated
        # as the APITUDE test/sandbox environment. book_hotel refuses to issue a
        # reservation against any other host so a real-money booking can never
        # be made from this playbook.
        SANDBOX_HOST_MARKERS = ("api.test.hotelbeds.com", "sandbox")

        # City -> geolocation fallback. Mirrors the planner's `_city_hint` known
        # cities so a bare "hotels in Paris" (no coords resolved yet) still issues
        # a geolocation availability search. lat/lng supplied by the caller take
        # precedence; this is only the fallback when the caller has no coords.
        CITY_GEO = {
            "paris": {"latitude": 48.8566, "longitude": 2.3522},
            "miami": {"latitude": 25.7617, "longitude": -80.1918},
            "boston": {"latitude": 42.3601, "longitude": -71.0589},
            "new york": {"latitude": 40.7128, "longitude": -74.0060},
            "nyc": {"latitude": 40.7128, "longitude": -74.0060},
            "london": {"latitude": 51.5074, "longitude": -0.1278},
            "par": {"latitude": 48.8566, "longitude": 2.3522},
            "mia": {"latitude": 25.7617, "longitude": -80.1918},
            "bos": {"latitude": 42.3601, "longitude": -71.0589},
            "lon": {"latitude": 51.5074, "longitude": -0.1278},
        }

        def _as_dict(value):
            return value if isinstance(value, dict) else {}

        def _as_list(value):
            return value if isinstance(value, list) else []

        def _cap(value, default=10, maximum=25):
            try:
                parsed = int(value)
            except (TypeError, ValueError):
                parsed = default
            return max(1, min(parsed, maximum))

        def _text(value, default=""):
            value = default if value is None else value
            return str(value).strip()

        # A friendly, retry-safe line for a human when a HotelBeds call fails.
        # Keep them generic so they read the same across search vs booking.
        HOTELS_UNAVAILABLE_MSG = "Hotels are temporarily unavailable, please try again in a moment."
        BOOKING_UNAVAILABLE_MSG = "Hotel booking is temporarily unavailable — please try again in a moment."

        def _error(tool_name, message, detail=None, status_code=0, code=None, user_message=None):
            # `text` is the full diagnostic (message + the raw HotelBeds body),
            # kept in _meta/data for logs. `display` is what the caller surfaces
            # to the end user: when a friendly `user_message` is supplied (e.g.
            # a price change or a provider 5xx) we show that instead of the raw
            # HotelBeds JSON blob. The travel planner renders
            # error_card.description from this response's `summary`, so a raw
            # blob here is exactly what leaked to the Muno UI before — this
            # mirrors the Duffel-5xx hardening (noetl/ai-meta#173).
            text = message if detail is None else f"{message}: {str(detail)[:700]}"
            display = user_message or text
            payload = {"ok": False, "status": "error", "error": text[:2000], "status_code": status_code, "hotels": []}
            if code:
                payload["code"] = code
            if user_message:
                payload["user_message"] = user_message
            return {
                # Keep the NoETL step green; MCP clients read isError plus
                # control_data.status for the upstream/tool-level error.
                "status": "ok",
                "content": [{"type": "text", "text": display}],
                "isError": True,
                "_meta": {"backend": "hotelbeds", "tool": tool_name, "hotelbeds_env": hotelbeds_env, "status_code": status_code, "error": text[:2000], "code": code},
                "data": payload,
                "control_data": payload,
                "summary": display,
                "text": display,
            }

        def _ok(tool_name, data, text=None, meta=None):
            meta = meta if isinstance(meta, dict) else {}
            payload = data if isinstance(data, dict) else {"value": data}
            payload.setdefault("ok", True)
            return {
                "status": "ok",
                "content": [{"type": "text", "text": text or f"HotelBeds {tool_name} ok"}],
                "isError": False,
                "_meta": {"backend": "hotelbeds", "tool": tool_name, "hotelbeds_env": hotelbeds_env, **meta},
                "data": payload,
                "control_data": payload,
                "summary": text or f"HotelBeds {tool_name} ok",
                "text": text or f"HotelBeds {tool_name} ok",
            }

        def _metadata_token():
            # Mint an OAuth2 access token from the GKE metadata server using the
            # worker pod's Workload Identity. No google-auth library: this is the
            # same endpoint google.auth.default() reads under the hood on GKE, so a
            # direct urllib GET is the library-free equivalent (noetl/ai-meta#137).
            req = urllib.request.Request(
                METADATA_TOKEN_URL,
                headers={"Metadata-Flavor": "Google"},
                method="GET",
            )
            try:
                with urllib.request.urlopen(req, timeout=10) as resp:
                    payload = json.loads(resp.read().decode("utf-8") or "{}")
            except urllib.error.HTTPError as exc:
                body = exc.read().decode("utf-8", errors="replace")[:300]
                raise RuntimeError(
                    "metadata token mint failed HTTP "
                    f"{exc.code}: Workload Identity is not bound to a GCP service "
                    f"account with Secret Manager access for this worker pod ({body})"
                )
            except urllib.error.URLError as exc:
                raise RuntimeError(
                    "metadata server unreachable "
                    f"({getattr(exc, 'reason', exc)}): the worker pod has no GKE "
                    "Workload Identity metadata endpoint (expected off-cluster, e.g. kind)"
                )
            token = (payload or {}).get("access_token") if isinstance(payload, dict) else None
            if not token:
                raise RuntimeError("metadata token endpoint returned no access_token")
            return token

        def _secret_json(project, secret_name):
            # Read the GSM secret value (the {"apikey","secret"} JSON) using the
            # WI metadata token. Raises with a credential/permission-flavoured
            # message so the failure mode is unambiguous on kind / pre-grant prod.
            token = _metadata_token()
            name = f"projects/{project}/secrets/{secret_name}/versions/latest:access"
            req = urllib.request.Request(
                f"https://secretmanager.googleapis.com/v1/{name}",
                headers={"Authorization": f"Bearer {token}"},
                method="GET",
            )
            try:
                with urllib.request.urlopen(req, timeout=15) as resp:
                    payload = json.loads(resp.read().decode("utf-8") or "{}")
            except urllib.error.HTTPError as exc:
                body = exc.read().decode("utf-8", errors="replace")[:300]
                raise RuntimeError(
                    f"secret manager access HTTP {exc.code} for '{secret_name}': the "
                    f"worker GSA lacks secretmanager.secretAccessor on this secret, or "
                    f"the secret is not loaded yet ({body})"
                )
            encoded = ((payload.get("payload") or {}).get("data") or "").strip()
            if not encoded:
                raise RuntimeError(f"secret '{secret_name}' has no payload data")
            raw = base64.b64decode(encoded).decode("utf-8").strip()
            try:
                parsed = json.loads(raw)
            except Exception:
                raise RuntimeError(f"secret '{secret_name}' is not valid JSON (expected apikey/secret fields)")
            apikey = _text(parsed.get("apikey") or parsed.get("api_key") or parsed.get("key"))
            secret = _text(parsed.get("secret") or parsed.get("shared_secret"))
            if not apikey or not secret:
                raise RuntimeError(f"secret '{secret_name}' JSON is missing apikey/secret fields")
            return apikey, secret

        def _signature(apikey, secret, ts=None):
            # X-Signature = SHA256(apikey + secret + unix_seconds) hex digest.
            if ts is None:
                ts = int(time.time())
            digest = hashlib.sha256(f"{apikey}{secret}{int(ts)}".encode("utf-8")).hexdigest()
            return digest, int(ts)

        def _decode_body(resp_or_exc, raw_bytes):
            # HotelBeds honours Accept-Encoding: gzip; urllib does not auto-
            # decompress, so inflate when the response says it is gzipped.
            encoding = ""
            try:
                encoding = (resp_or_exc.headers.get("Content-Encoding") or "").lower()
            except Exception:
                encoding = ""
            if "gzip" in encoding:
                try:
                    raw_bytes = gzip.decompress(raw_bytes)
                except Exception:
                    pass
            return raw_bytes.decode("utf-8", errors="replace")

        def _request(http_method, url, apikey, secret, payload=None, params=None):
            if params:
                url += ("&" if "?" in url else "?") + urllib.parse.urlencode(params, doseq=True)
            signature, _ts = _signature(apikey, secret)
            headers = {
                "Api-key": apikey,
                "X-Signature": signature,
                "Accept": "application/json",
                "Accept-Encoding": "gzip",
            }
            body = None
            if payload is not None:
                headers["Content-Type"] = "application/json"
                body = json.dumps(payload, separators=(",", ":")).encode("utf-8")
            req = urllib.request.Request(url, data=body, headers=headers, method=http_method)
            try:
                with urllib.request.urlopen(req, timeout=45) as resp:
                    raw = _decode_body(resp, resp.read())
                    return True, resp.status, json.loads(raw or "{}")
            except urllib.error.HTTPError as exc:
                raw = _decode_body(exc, exc.read())
                try:
                    parsed = json.loads(raw or "{}")
                except Exception:
                    parsed = {"raw": raw[:2000]}
                return False, exc.code, parsed
            except urllib.error.URLError as exc:
                return False, 0, {"error": str(getattr(exc, "reason", exc))}
            except Exception as exc:
                return False, 0, {"error": f"{type(exc).__name__}: {exc}"}

        def _geo_from_args(args):
            # Caller-supplied coords win; else fall back to the city map.
            lat = args.get("latitude") if args.get("latitude") is not None else args.get("lat")
            lng = args.get("longitude") if args.get("longitude") is not None else args.get("lng")
            try:
                if lat is not None and lng is not None:
                    return float(lat), float(lng)
            except (TypeError, ValueError):
                pass
            for key in ("city", "city_code", "destination", "query"):
                hint = _text(args.get(key)).lower()
                if hint in CITY_GEO:
                    geo = CITY_GEO[hint]
                    return geo["latitude"], geo["longitude"]
            return None, None

        def _first_bookable_rate(hotel):
            # Availability hotels carry rooms[].rates[]; each rate has the
            # short-lived `rateKey` needed to book. Pick the cheapest rate
            # (lowest net) across all rooms so the planner can carry one
            # bookable token per hotel — the HotelBeds analogue of a Duffel
            # offer id flowing to create_order.
            best = None
            best_net = None
            for room in _as_list(hotel.get("rooms")):
                if not isinstance(room, dict):
                    continue
                for rate in _as_list(room.get("rates")):
                    if not isinstance(rate, dict):
                        continue
                    key = _text(rate.get("rateKey"))
                    if not key:
                        continue
                    try:
                        net = float(rate.get("net")) if rate.get("net") is not None else None
                    except (TypeError, ValueError):
                        net = None
                    if best is None or (net is not None and (best_net is None or net < best_net)):
                        best = {
                            "rateKey": key,
                            "net": rate.get("net"),
                            "rateClass": rate.get("rateClass"),
                            "rateType": rate.get("rateType"),
                            "boardName": rate.get("boardName") or rate.get("boardCode"),
                            "roomName": room.get("name"),
                            "roomCode": room.get("code"),
                        }
                        best_net = net
            return best or {}

        def _hotel_summary(hotel):
            hotel = _as_dict(hotel)
            rates = _as_list(hotel.get("rooms"))
            min_rate = hotel.get("minRate")
            currency = hotel.get("currency")
            bookable = _first_bookable_rate(hotel)
            return {
                "code": hotel.get("code"),
                "name": hotel.get("name"),
                "categoryName": hotel.get("categoryName"),
                "categoryCode": hotel.get("categoryCode"),
                "destinationName": hotel.get("destinationName"),
                "zoneName": hotel.get("zoneName"),
                "latitude": hotel.get("latitude"),
                "longitude": hotel.get("longitude"),
                "minRate": min_rate,
                "maxRate": hotel.get("maxRate"),
                "currency": currency,
                "rooms_count": len(rates),
                "reviews": _as_list(hotel.get("reviews")),
                "address": hotel.get("address"),
                # Bookable rate token (short-lived) + its board/class so the
                # planner can carry it from search → book_hotel.
                "rateKey": bookable.get("rateKey", ""),
                "boardName": bookable.get("boardName"),
                "rateClass": bookable.get("rateClass"),
                "rateType": bookable.get("rateType"),
                "roomName": bookable.get("roomName"),
                # Photo URLs, filled from the Content API after availability
                # (availability itself carries no images). Empty until enriched.
                "images": [],
            }

        # HotelBeds AVAILABILITY responses carry no photos — hotel images live
        # in the separate Content API (hotel content by code). Each image is a
        # `path` (e.g. 29/290725/290725a_hb_ro_037.jpg) served from the GIATA
        # CDN; prepend the CDN base to get a browser-fetchable URL. `bigger` is
        # a card-sized derivative (original size can be multi-MB per photo).
        CONTENT_IMAGES_PATH = "/hotel-content-api/1.0/hotels"
        PHOTO_CDN = "https://photos.hotelbeds.com/giata/bigger/"

        def _image_url(path):
            p = _text(path).lstrip("/")
            return (PHOTO_CDN + p) if p else ""

        def _image_order(img):
            img = _as_dict(img)
            raw = img.get("visualOrder") if img.get("visualOrder") is not None else img.get("order")
            try:
                return int(raw)
            except (TypeError, ValueError):
                return 9999

        def _hotel_images(base, apikey, secret, codes, max_per=6):
            # Fetch images for ALL availability hotel codes in ONE Content API
            # call and map code -> [CDN url]. Fully graceful: any failure (no
            # content entitlement on the test key, network, parse) returns {} so
            # search still returns hotels with the prior empty-photos behaviour
            # — the availability path is never broken by a content hiccup.
            code_list = [str(c) for c in codes if _text(c)]
            if not code_list:
                return {}, None
            window = max(1, min(len(code_list), 50))
            params = {
                "fields": "images",
                "codes": ",".join(code_list[:50]),
                "language": "ENG",
                "from": 1,
                "to": window,
                "useSecondaryLanguage": "false",
            }
            try:
                ok, status_code, body = _request("GET", base + CONTENT_IMAGES_PATH, apikey, secret, params=params)
            except Exception as exc:  # noqa: BLE001 — never break search on content
                return {}, f"{type(exc).__name__}: {exc}"
            if not ok:
                return {}, f"content images HTTP {status_code}"
            out = {}
            for hotel in _as_list(_as_dict(body).get("hotels")):
                hotel = _as_dict(hotel)
                code = str(hotel.get("code") or "")
                if not code:
                    continue
                urls = []
                for img in sorted(_as_list(hotel.get("images")), key=_image_order):
                    url = _image_url(_as_dict(img).get("path"))
                    if url and url not in urls:
                        urls.append(url)
                    if len(urls) >= max_per:
                        break
                if urls:
                    out[code] = urls
            return out, None

        def _tools_list():
            tools = [
                {
                    "name": "search_hotels",
                    "title": "Search hotel availability",
                    "description": "HotelBeds availability for a city or coordinates. Required: a city/coords plus stay dates. Optional: adults, rooms, children, radius.",
                    "inputSchema": {
                        "type": "object",
                        "properties": {
                            "city": {"type": "string", "description": "City name, e.g. Paris"},
                            "city_code": {"type": "string", "description": "City code hint, e.g. PAR"},
                            "latitude": {"type": "number"},
                            "longitude": {"type": "number"},
                            "radius": {"type": "integer", "default": 20, "description": "km radius for geolocation search"},
                            "check_in": {"type": "string", "description": "YYYY-MM-DD"},
                            "check_out": {"type": "string", "description": "YYYY-MM-DD"},
                            "adults": {"type": "integer", "minimum": 1, "default": 2},
                            "rooms": {"type": "integer", "minimum": 1, "default": 1},
                            "children": {"type": "integer", "minimum": 0, "default": 0},
                        },
                    },
                },
                {
                    "name": "book_hotel",
                    "title": "Book a hotel (TEST/SANDBOX)",
                    "description": "Confirm a HotelBeds reservation for a selected rate. checkRate re-prices the rateKey, then bookings confirms. TEST/SANDBOX environment only — no real money. Required: rate_key. Optional: holder_name, holder_surname, adults, children, rooms, client_reference.",
                    "inputSchema": {
                        "type": "object",
                        "required": ["rate_key"],
                        "properties": {
                            "rate_key": {"type": "string", "description": "Bookable rateKey from search_hotels"},
                            "holder_name": {"type": "string", "default": "Alex"},
                            "holder_surname": {"type": "string", "default": "Traveler"},
                            "adults": {"type": "integer", "minimum": 1, "default": 1},
                            "children": {"type": "integer", "minimum": 0, "default": 0},
                            "rooms": {"type": "integer", "minimum": 1, "default": 1},
                            "client_reference": {"type": "string", "description": "Caller booking reference (defaults to a generated MUNO-* tag)"},
                        },
                    },
                },
                {
                    "name": "list_destinations",
                    "title": "List HotelBeds destinations",
                    "description": "Debug: list HotelBeds destination codes (first page).",
                    "inputSchema": {
                        "type": "object",
                        "properties": {
                            "countryCode": {"type": "string"},
                            "limit": {"type": "integer", "minimum": 1, "maximum": 100, "default": 100},
                        },
                    },
                },
            ]
            return _ok("tools/list", {"tools": tools, "tool_count": len(tools)}, f"HotelBeds MCP — {len(tools)} tools available", {"tool_count": len(tools)})

        def _search_hotels(args, base, apikey, secret, limit):
            lat, lng = _geo_from_args(args)
            if lat is None or lng is None:
                return _error(
                    "search_hotels",
                    "could not resolve a geolocation: supply latitude/longitude or a known city",
                    code="validation_error",
                )
            check_in = _text(args.get("check_in") or args.get("checkIn"))
            check_out = _text(args.get("check_out") or args.get("checkOut"))
            if not check_in or not check_out:
                return _error("search_hotels", "check_in and check_out (YYYY-MM-DD) are required", code="validation_error")
            adults = _cap(args.get("adults"), default=2, maximum=8)
            rooms = _cap(args.get("rooms"), default=1, maximum=4)
            try:
                children = max(0, int(args.get("children") or 0))
            except (TypeError, ValueError):
                children = 0
            try:
                radius = max(1, min(int(args.get("radius") or 20), 100))
            except (TypeError, ValueError):
                radius = 20
            payload = {
                "stay": {"checkIn": check_in, "checkOut": check_out},
                "occupancies": [{"rooms": rooms, "adults": adults, "children": children}],
                "geolocation": {"latitude": lat, "longitude": lng, "radius": radius, "unit": "km"},
            }
            ok, status_code, body = _request("POST", base + AVAILABILITY_PATH, apikey, secret, payload=payload)
            if not ok:
                return _error("search_hotels", f"HotelBeds availability failed HTTP {status_code}", body, status_code,
                              code="availability_failed", user_message=HOTELS_UNAVAILABLE_MSG)
            container = _as_dict(body.get("hotels") if isinstance(body, dict) else {})
            hotels = _as_list(container.get("hotels"))
            summarised = [_hotel_summary(hotel) for hotel in hotels[:limit] if isinstance(hotel, dict)]
            # Enrich each hotel with photo URLs from the Content API (one call
            # for all codes). Graceful: on any failure hotels keep empty photos.
            images_map, images_error = _hotel_images(
                base, apikey, secret, [h.get("code") for h in summarised])
            for h in summarised:
                h["images"] = images_map.get(str(h.get("code") or ""), [])
            images_with_photos = sum(1 for h in summarised if h.get("images"))
            currency = None
            for hotel in summarised:
                if hotel.get("currency"):
                    currency = hotel.get("currency")
                    break
            return _ok(
                "search_hotels",
                {
                    "source": "hotelbeds",
                    "hotelbeds_env": hotelbeds_env,
                    "status_code": status_code,
                    "hotels": summarised,
                    "hotels_total": len(summarised),
                    "raw_total": container.get("total") if isinstance(container.get("total"), int) else len(hotels),
                    "checkIn": check_in,
                    "checkOut": check_out,
                    "geolocation": payload["geolocation"],
                    "meta": {"count": len(summarised), "source": "hotelbeds", "currency": currency,
                             "images_source": "hotelbeds-content" if images_with_photos else None,
                             "images_with_photos": images_with_photos, "images_error": images_error},
                },
                f"{len(summarised)} HotelBeds hotel(s)",
                {"status_code": status_code, "hotels_total": len(summarised), "images_with_photos": images_with_photos},
            )

        def _is_sandbox(base):
            low = _text(base).lower()
            return any(marker in low for marker in SANDBOX_HOST_MARKERS)

        def _checkrate(base, apikey, secret, rate_key):
            # Re-price the selected availability rateKey. Returns the fresh,
            # bookable rateKey (rates expire / drift; checkRate is the
            # authoritative re-price) plus the confirmed net/currency.
            payload = {"rooms": [{"rateKey": rate_key}]}
            ok, status_code, body = _request("POST", base + CHECKRATES_PATH, apikey, secret, payload=payload)
            if not ok:
                return None, status_code, body
            hotel = _as_dict(body.get("hotel") if isinstance(body, dict) else {})
            for room in _as_list(hotel.get("rooms")):
                for rate in _as_list(_as_dict(room).get("rates")):
                    rate = _as_dict(rate)
                    fresh = _text(rate.get("rateKey"))
                    if fresh:
                        return {
                            "rateKey": fresh,
                            "net": rate.get("net"),
                            "currency": hotel.get("currency"),
                            "boardName": rate.get("boardName"),
                            "rateClass": rate.get("rateClass"),
                            "rooms_payload": _as_list(rate.get("rooms")),
                            "hotel_name": hotel.get("name"),
                            "checkIn": hotel.get("checkIn"),
                            "checkOut": hotel.get("checkOut"),
                        }, status_code, body
            return None, status_code, body

        def _safe_booking(booking):
            booking = _as_dict(booking)
            hotel = _as_dict(booking.get("hotel"))
            return {
                "reference": booking.get("reference"),
                "status": booking.get("status"),
                "clientReference": booking.get("clientReference"),
                "creationDate": booking.get("creationDate"),
                "hotel_name": hotel.get("name"),
                "hotel_code": hotel.get("code"),
                "destinationName": hotel.get("destinationName"),
                "zoneName": hotel.get("zoneName"),
                "checkIn": hotel.get("checkIn"),
                "checkOut": hotel.get("checkOut"),
                "totalNet": hotel.get("totalNet") or booking.get("totalNet"),
                "currency": hotel.get("currency") or booking.get("currency"),
                "rooms": [
                    {
                        "name": _as_dict(room).get("name"),
                        "boardName": _as_dict(room).get("rates", [{}])[0].get("boardName") if _as_list(_as_dict(room).get("rates")) else None,
                    }
                    for room in _as_list(hotel.get("rooms"))
                ],
            }

        def _num(value):
            try:
                return float(value) if value is not None else None
            except (TypeError, ValueError):
                return None

        def _book_hotel(args, base, apikey, secret, tolerance=15.0):
            # SAFETY GATE — never book against a non test/sandbox host.
            if not _is_sandbox(base):
                return _error(
                    "book_hotel",
                    "refusing to book: configured HotelBeds host is not the test/sandbox environment "
                    f"(base={base!r}). No reservation was issued.",
                    code="not_sandbox",
                    user_message=BOOKING_UNAVAILABLE_MSG,
                )
            rate_key = _text(args.get("rate_key") or args.get("rateKey"))
            if not rate_key:
                return _error("book_hotel", "rate_key is required (from search_hotels)", code="validation_error",
                              user_message="Please pick a hotel from the search results first.")
            holder_name = _text(args.get("holder_name") or "Alex") or "Alex"
            holder_surname = _text(args.get("holder_surname") or "Traveler") or "Traveler"
            try:
                adults = max(1, int(args.get("adults") or 1))
            except (TypeError, ValueError):
                adults = 1
            try:
                children = max(0, int(args.get("children") or 0))
            except (TypeError, ValueError):
                children = 0
            # The price the user saw at search time (optional). When supplied we
            # can report a material re-price after checkRate.
            expected_net = _num(args.get("expected_net") if args.get("expected_net") is not None else args.get("expected_price"))
            # 1) re-price the rate. checkRate returns the authoritative BOOKABLE
            # rateKey + its current net; a stale/expired rate can't be booked.
            checked, status_code, body = _checkrate(base, apikey, secret, rate_key)
            if not checked or not checked.get("rateKey"):
                return _error("book_hotel", f"HotelBeds checkRate failed HTTP {status_code}", body, status_code,
                              code="checkrate_failed",
                              user_message="That hotel is no longer available at that rate — please search again.")
            checked_net = _num(checked.get("net"))
            checked_currency = _text(checked.get("currency"))
            price_changed = bool(
                expected_net is not None and checked_net is not None and expected_net > 0
                and abs(checked_net - expected_net) / expected_net > 0.02
            )
            # 2) build paxes (room 1) and confirm the booking using the fresh,
            # re-priced rateKey. HotelBeds' booking `tolerance` (% default 2.0)
            # rejects if the price moved beyond it. In TEST/SANDBOX prices drift
            # between checkRate and bookings, so we book against the re-priced
            # rateKey with a generous tolerance — the test booking completes and
            # `price_changed` records that the amount moved. No real money.
            try:
                tol = max(2.0, min(float(tolerance), 100.0))
            except (TypeError, ValueError):
                tol = 15.0
            paxes = [{"roomId": 1, "type": "AD", "name": holder_name, "surname": holder_surname}]
            for idx in range(max(0, adults - 1)):
                paxes.append({"roomId": 1, "type": "AD", "name": f"Guest{idx + 2}", "surname": holder_surname})
            for idx in range(children):
                paxes.append({"roomId": 1, "type": "CH", "age": 8, "name": f"Child{idx + 1}", "surname": holder_surname})
            client_reference = _text(args.get("client_reference")) or f"MUNO-{int(time.time())}"
            payload = {
                "holder": {"name": holder_name, "surname": holder_surname},
                "rooms": [{"rateKey": checked["rateKey"], "paxes": paxes}],
                "clientReference": client_reference[:50],
                "remark": "Muno test booking",
                "tolerance": tol,
            }
            ok, status_code, body = _request("POST", base + BOOKINGS_PATH, apikey, secret, payload=payload)
            if not ok:
                # NO raw HotelBeds JSON reaches the UI — the raw body stays in
                # _meta/data; `user_message` is what the planner renders. A
                # residual price-tolerance rejection surfaces the fresh price
                # for the user to re-confirm (search again to book the latest).
                blob = (body if isinstance(body, str) else json.dumps(body, default=str)).lower()
                if "price" in blob and ("tolerance" in blob or "changed" in blob):
                    price_line = ""
                    if checked_net is not None:
                        price_line = f" The latest rate is {checked_net}{(' ' + checked_currency) if checked_currency else ''}."
                    return _error("book_hotel", f"HotelBeds booking failed HTTP {status_code}", body, status_code,
                                  code="price_changed",
                                  user_message=f"That hotel's price just changed.{price_line} Please search again to book the latest rate.")
                return _error("book_hotel", f"HotelBeds booking failed HTTP {status_code}", body, status_code,
                              code="booking_failed", user_message=BOOKING_UNAVAILABLE_MSG)
            booking = _safe_booking(body.get("booking") if isinstance(body, dict) else {})
            text = f"HotelBeds booking {booking.get('reference') or 'confirmed'} ({booking.get('status') or 'OK'})"
            return _ok(
                "book_hotel",
                {
                    "source": "hotelbeds",
                    "hotelbeds_env": hotelbeds_env,
                    "status_code": status_code,
                    "booking": booking,
                    "booking_reference": booking.get("reference"),
                    "status": booking.get("status"),
                    "hotel_name": booking.get("hotel_name"),
                    "checkIn": booking.get("checkIn"),
                    "checkOut": booking.get("checkOut"),
                    "totalNet": booking.get("totalNet"),
                    "currency": booking.get("currency"),
                    # Re-price transparency: whether the confirmed net moved from
                    # the search-time price the user saw, and by how much.
                    "price_changed": price_changed,
                    "expected_net": expected_net,
                    "checked_net": checked_net,
                    "tolerance_used": tol,
                },
                text,
                {"status_code": status_code, "booking_reference": booking.get("reference"), "status": booking.get("status"), "price_changed": price_changed},
            )

        def _list_destinations(args, base, apikey, secret):
            params = {
                "fields": "all",
                "language": "ENG",
                "from": 1,
                "to": _cap(args.get("limit"), default=100, maximum=100),
                "useSecondaryLanguage": "false",
            }
            if _text(args.get("countryCode")):
                params["countryCodes"] = _text(args.get("countryCode")).upper()
            ok, status_code, body = _request("GET", base + DESTINATIONS_PATH, apikey, secret, params=params)
            if not ok:
                return _error("list_destinations", f"HotelBeds destinations failed HTTP {status_code}", body, status_code)
            destinations = _as_list(body.get("destinations") if isinstance(body, dict) else [])
            return _ok(
                "list_destinations",
                {"source": "hotelbeds", "status_code": status_code, "destinations": destinations, "destinations_total": len(destinations)},
                f"{len(destinations)} HotelBeds destination(s)",
                {"status_code": status_code, "destinations_total": len(destinations)},
            )

        globals().update({
            "base64": base64,
            "gzip": gzip,
            "hashlib": hashlib,
            "json": json,
            "time": time,
            "urllib": urllib,
            "METADATA_TOKEN_URL": METADATA_TOKEN_URL,
            "AVAILABILITY_PATH": AVAILABILITY_PATH,
            "DESTINATIONS_PATH": DESTINATIONS_PATH,
            "CITY_GEO": CITY_GEO,
            "_as_dict": _as_dict,
            "_as_list": _as_list,
            "_cap": _cap,
            "_text": _text,
            "_error": _error,
            "_ok": _ok,
            "_metadata_token": _metadata_token,
            "_secret_json": _secret_json,
            "_signature": _signature,
            "_decode_body": _decode_body,
            "_request": _request,
            "_geo_from_args": _geo_from_args,
            "_first_bookable_rate": _first_bookable_rate,
            "_hotel_summary": _hotel_summary,
            "_image_url": _image_url,
            "_image_order": _image_order,
            "_hotel_images": _hotel_images,
            "_tools_list": _tools_list,
            "_search_hotels": _search_hotels,
            "_is_sandbox": _is_sandbox,
            "_checkrate": _checkrate,
            "_safe_booking": _safe_booking,
            "_num": _num,
            "_book_hotel": _book_hotel,
            "_list_destinations": _list_destinations,
            "CHECKRATES_PATH": CHECKRATES_PATH,
            "BOOKINGS_PATH": BOOKINGS_PATH,
            "CONTENT_IMAGES_PATH": CONTENT_IMAGES_PATH,
            "PHOTO_CDN": PHOTO_CDN,
            "SANDBOX_HOST_MARKERS": SANDBOX_HOST_MARKERS,
            "HOTELS_UNAVAILABLE_MSG": HOTELS_UNAVAILABLE_MSG,
            "BOOKING_UNAVAILABLE_MSG": BOOKING_UNAVAILABLE_MSG,
        })

        method_name = _text(method, "tools/list").lower()
        tool_name = _text(tool).lower()
        args = _as_dict(arguments)
        base = _text(hotelbeds_api_base, "https://api.test.hotelbeds.com").rstrip("/")
        project = _text(google_project, "noetl-demo-19700101")
        secret_name = _text(hotelbeds_secret_name, "hotelbeds-api-test")
        limit = _cap(max_hotels, default=10, maximum=25)
        try:
            book_tol = float(book_tolerance)
        except (TypeError, ValueError):
            book_tol = 15.0
        # A friendly per-tool line so a credential / unexpected failure never
        # leaks a raw diagnostic to the Muno UI (search vs booking wording).
        _friendly = BOOKING_UNAVAILABLE_MSG if tool_name == "book_hotel" else HOTELS_UNAVAILABLE_MSG

        if method_name == "tools/list":
            result = _tools_list()
        elif method_name != "tools/call":
            result = _error(method_name, f"Unknown MCP method: {method_name}")
        elif tool_name not in ("search_hotels", "book_hotel", "list_destinations"):
            result = _error(tool_name or "unknown", f"Unknown tool: {tool_name}. Run tools/list to see the catalog.")
        else:
            # Resolve the HotelBeds apikey/secret from GSM via Workload Identity.
            # On kind (no metadata server) or pre-grant prod this raises a clear
            # credential/permission error rather than a parse/wedge failure.
            try:
                apikey, secret = _secret_json(project, secret_name)
            except Exception as exc:
                result = _error(tool_name, "HotelBeds credential unavailable", f"{type(exc).__name__}: {exc}", code="credential_unavailable", user_message=_friendly)
            if "result" not in locals() or result is None:
                try:
                    if tool_name == "search_hotels":
                        result = _search_hotels(args, base, apikey, secret, limit)
                    elif tool_name == "book_hotel":
                        result = _book_hotel(args, base, apikey, secret, tolerance=book_tol)
                    else:
                        result = _list_destinations(args, base, apikey, secret)
                except Exception as exc:
                    result = _error(tool_name, "HotelBeds tool failed", f"{type(exc).__name__}: {exc}", user_message=_friendly)
    next:
      spec: { mode: exclusive }
      arcs:
        - step: end

  - step: end
    desc: Done
    tool:
      kind: noop
