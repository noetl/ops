                                "description": "\"1\" adds one GET /air/offers/{id} per offer for priced baggage/conditions options. OFF by default — it costs ~+6-7s per 10 offers.",
                            },
                        },
                    },
                },
                {
                    "name": "get_offer",
                    "title": "Get offer",
                    "description": "Fetch one Duffel offer by id.",
                    "inputSchema": {
                        "type": "object",
                        "required": ["offer_id"],
                        "properties": {"offer_id": {"type": "string"}},
                    },
                },
                {
                    "name": "search_places",
                    "title": "Search flight places",
                    "description": "Duffel airport/city autocomplete for flight origin and destination fields.",
                    "inputSchema": {
                        "type": "object",
                        "required": ["query"],
                        "properties": {
                            "query": {"type": "string"},
