apiVersion: noetl.io/v2
kind: Playbook
metadata:
  name: duffel_mcp
  path: automation/agents/mcp/duffel
  description: |
    Duffel MCP server playbook for flight search and test-order capabilities.

    Order creation is test-environment only and uses Duffel wallet balance
    payments. Live orders, seat maps, card payments, and payment collection
    are out of scope for this playbook version.

    Auth (test environment) — the Duffel API bearer is NEVER hardcoded here.
    It lives in the GCP Secret Manager secret `duffel-api-test` (the operator
    uploaded the full credential file
    `{"name":"duffel_token","type":"secret_manager","data":{"token":"duffel_test_…"},...}`
    so the bearer is at `.data.token` inside the payload), and the playbook
    reads it at runtime using the worker pod's GKE Workload Identity:
      1. mint an OAuth2 access token from the GKE metadata server
         (GET http://metadata.google.internal/.../service-accounts/default/token
         with Metadata-Flavor: Google) — stdlib urllib, no google-auth lib,
      2. read the secret via the Secret Manager REST API with that token,
      3. base64-decode the payload, json-parse it, and extract `.data.token`.
    This is the same library-free Workload-Identity pattern the HotelBeds
    (hotelbeds*.yaml) and google-places MCP playbooks use (noetl/ai-meta#137).

    This REPLACES the earlier `kind: secrets` / `provider: gcp` keychain
    *wallet* shape (and the older `kind: credential_ref` shape). On the
    current prod Rust runtime the `keychain.<alias>.<field>` template
    namespace is NOT populated from those entries, so the bearer rendered
    empty → `Authorization: Bearer ` → Duffel 401
    `invalid_authorization_header`. The in-python read above is the mechanism
    proven on the Rust worker; see noetl/ai-meta#137 and the wallet-resolution
    platform-gap note.

    Operator prerequisites (until these land, backend calls return a clear
    auth/permission error — NOT a missing-library or parse error):
    - GSM secret `duffel-api-test` exists with the credential JSON loaded.
    - The worker pod's GSA `noetl-worker-mcp@shastaratech-noetl-prod.iam.gserviceaccount.com`
      holds roles/secretmanager.secretAccessor on `duffel-api-test`.

    search_offers detail level (adiona/frontend#21). The normaliser used to keep
    only an IATA code per segment and a single collapsed baggage verdict per
    offer; it now carries the detail Duffel already returns and previously
    discarded:
    - Airline LOGOS: `logo_symbol_url` / `logo_lockup_url` on every segment
      carrier, on the offer `owner`, and deduplicated on `offers[].airlines`.
    - Per-segment detail: departure/arrival {iata, at, airport_name, city,
      terminal, country_code, time_zone}, marketing AND operating carrier with
      names, flight numbers, aircraft, cabin_class, duration, and technical
      stops. Each leg of a connection is its own segment, as before.
    - `baggage_options[]` / `conditions_options[]` — ARRAYS of options, each
      tagged `scope`. "included" is the allowance the fare carries; "available"
      is a PRICED add-on from `available_services`. The old collapsed
      `baggage` / `conditions` DICTS are unchanged and still emitted, because
      the itinerary planner's ranker reads them.
    - `direction` on every offer: "one-way", or "outbound" / "inbound" for a
      round trip. `round_trip_mode` defaults to "split" (two one-way searches,
      each offer independently priced and bookable); "combined" runs one
      round-trip search and returns whole-trip offers tagged "round-trip".
      A combined fare is often cheaper than two one-ways — the default trades
      that for per-leg selectability, and it is one argument to switch.
    - Children are REAL aged passengers (`children: [{"age": 9}]`), which is
      what Duffel prices a child fare from. A bare child COUNT is rejected
      rather than silently priced as an adult.
    - `max_offers` cap is 50 (was 10), applied per direction set.

    `enrich_offers` is OFF by default and MUST stay off for the latency
    budget: it costs one GET /air/offers/{id} per offer (~+6-7s per 10). With
    it off, `available` baggage options and `conditions` are simply absent —
    absent means UNKNOWN, never "not allowed", and nothing is guessed.
  agent: true
  exposes_as_mcp: true
  exposed_in_ui: false
  version: "1.4"
  tags: [mcp, duffel, travel, flights, ai-os]
  terminal:
    visible: true
    workspace: duffel
    scopes: [/mcp/duffel]

workload:
  duffel_env: test
  duffel_api_base: https://api.duffel.com
  duffel_api_version: v2
  google_project: "shastaratech-noetl-prod"
  # GSM secret holding the Duffel credential file (bearer at `.data.token`).
  # The value is loaded out-of-band by the operator; this playbook only
  # references the name. Rotation is a plain
  # `gcloud secrets versions add duffel-api-test --data-file=…` with no
  # NoETL-side re-registration (the read is pinned to versions/latest).
  duffel_secret_name: "duffel-api-test"
  method: "tools/list"
  tool: ""
  arguments: {}

workflow:
  - step: start
    desc: Entry point — the Rust runtime requires a step named `start`; routes to duffel_dispatch
    tool:
      kind: noop
    next:
      spec: { mode: exclusive }
      arcs:
        - step: duffel_dispatch

  - step: duffel_dispatch
    desc: Dispatch Duffel MCP tools (Workload-Identity GSM secret read for the bearer)
    tool:
      kind: python
      input:
        method: "{{ workload.method }}"
        tool: "{{ workload.tool }}"
        arguments: "{{ workload.arguments }}"
        duffel_env: "{{ workload.duffel_env | default('test') }}"
        duffel_api_base: "{{ workload.duffel_api_base | default('https://api.duffel.com') }}"
        duffel_api_version: "{{ workload.duffel_api_version | default('v2') }}"
        google_project: "{{ workload.google_project | default('shastaratech-noetl-prod') }}"
        duffel_secret_name: "{{ workload.duffel_secret_name | default('duffel-api-test') }}"
      code: |
        import base64
        import json
        import random
        import time
        from datetime import datetime, timezone
        import urllib.error
        import urllib.parse
        import urllib.request

        METADATA_TOKEN_URL = (
            "http://metadata.google.internal/computeMetadata/v1/"
            "instance/service-accounts/default/token"
        )

        def _metadata_token():
            # Mint an OAuth2 access token from the GKE metadata server using the
            # worker pod's Workload Identity. No google-auth library: this is the
            # same endpoint google.auth.default() reads under the hood on GKE, so a
            # direct urllib GET is the library-free equivalent (noetl/ai-meta#137).
            req = urllib.request.Request(
                METADATA_TOKEN_URL,
                headers={"Metadata-Flavor": "Google"},
                method="GET",
            )
            try:
                with urllib.request.urlopen(req, timeout=10) as resp:
                    payload = json.loads(resp.read().decode("utf-8") or "{}")
            except urllib.error.HTTPError as exc:
                body = exc.read().decode("utf-8", errors="replace")[:300]
                raise RuntimeError(
                    "metadata token mint failed HTTP "
                    f"{exc.code}: Workload Identity is not bound to a GCP service "
                    f"account with Secret Manager access for this worker pod ({body})"
                )
            except urllib.error.URLError as exc:
                raise RuntimeError(
                    "metadata server unreachable "
                    f"({getattr(exc, 'reason', exc)}): the worker pod has no GKE "
                    "Workload Identity metadata endpoint (expected off-cluster, e.g. kind)"
                )
            token = (payload or {}).get("access_token") if isinstance(payload, dict) else None
            if not token:
                raise RuntimeError("metadata token endpoint returned no access_token")
            return token

        def _extract_token(raw):
            # The GSM secret `duffel-api-test` holds the full Duffel credential
            # file ({"data":{"token":…}}); tolerate a bare {"token":…} object or
            # a raw token string too, so a future `gcloud secrets versions add`
            # in any of those shapes keeps resolving without a playbook edit.
            # Never logged/printed.
            s = "" if raw is None else str(raw).strip()
            if s.startswith("{"):
                try:
                    obj = json.loads(s)
                except Exception:
                    return s
                if isinstance(obj, dict):
                    data = obj.get("data")
                    if isinstance(data, dict) and data.get("token"):
                        return str(data.get("token")).strip()
                    if obj.get("token"):
                        return str(obj.get("token")).strip()
                return s
            return s

        def _secret_bearer(project, secret_name):
            # Read the GSM secret value (the full Duffel credential file JSON)
            # using the WI metadata token and collapse it to the bare bearer.
            # Raises with a credential/permission-flavoured message so the
            # failure mode is unambiguous on kind / pre-grant prod.
            token = _metadata_token()
            name = f"projects/{project}/secrets/{secret_name}/versions/latest:access"
            req = urllib.request.Request(
                f"https://secretmanager.googleapis.com/v1/{name}",
                headers={"Authorization": f"Bearer {token}"},
                method="GET",
            )
            try:
                with urllib.request.urlopen(req, timeout=15) as resp:
                    payload = json.loads(resp.read().decode("utf-8") or "{}")
            except urllib.error.HTTPError as exc:
                body = exc.read().decode("utf-8", errors="replace")[:300]
                raise RuntimeError(
                    f"secret manager access HTTP {exc.code} for '{secret_name}': the "
                    f"worker GSA lacks secretmanager.secretAccessor on this secret, or "
                    f"the secret is not loaded yet ({body})"
                )
            encoded = ((payload.get("payload") or {}).get("data") or "").strip()
            if not encoded:
                raise RuntimeError(f"secret '{secret_name}' has no payload data")
            raw = base64.b64decode(encoded).decode("utf-8").strip()
            bearer = _extract_token(raw)
            if not bearer:
                raise RuntimeError(f"secret '{secret_name}' payload had no Duffel token (.data.token)")
            return bearer

        # adiona/frontend#21 — the offer cap was 10 and hardcoded in three
        # places.  It is one named constant now so it cannot drift again.
        MAX_OFFERS = 50

        def _as_dict(value):
            return value if isinstance(value, dict) else {}

        def _as_list(value):
            return value if isinstance(value, list) else []

        def _cap(value, default=10, maximum=10):
            try:
                parsed = int(value)
            except (TypeError, ValueError):
                parsed = default
            return max(1, min(parsed, maximum))

        def _text(value, default=""):
            value = default if value is None else value
            return str(value).strip()

        def _error(tool_name, message, detail=None, status_code=0, code=None, user_message=None):
            # `text` is the full diagnostic (message + the raw provider body),
            # kept in _meta/data for logs. `display` is what the caller surfaces
            # to the end user: when a friendly `user_message` is supplied (e.g.
            # for a transient provider 5xx) we show that instead of the raw
            # Duffel JSON blob. The travel planner renders error_card.description
            # from this response's `summary`, so a raw blob here is exactly what
            # leaked to the Muno UI before (noetl/ai-meta Duffel-5xx hardening).
            text = message if detail is None else f"{message}: {str(detail)[:700]}"
            display = user_message or text
            payload = {"ok": False, "status": "error", "error": text[:2000], "status_code": status_code}
            if code:
                payload["code"] = code
            if user_message:
                payload["user_message"] = user_message
            return {
                # Keep the NoETL step green; MCP clients read isError plus
                # control_data.status for the upstream/tool-level error.
                "status": "ok",
                "content": [{"type": "text", "text": display}],
                "isError": True,
                "_meta": {"backend": "duffel", "tool": tool_name, "duffel_env": duffel_env, "status_code": status_code, "error": text[:2000], "code": code},
                "data": payload,
                "control_data": payload,
                "summary": display,
                "text": display,
            }

        # A friendly, retry-safe line for any transient Duffel failure surfaced
        # to a human. Keep it generic ("Flights") so it reads the same whether
        # the failing call was a search or a booking.
        PROVIDER_UNAVAILABLE_MSG = "Flights are temporarily unavailable, please try again in a moment."

        def _is_transient_provider_error(status_code, body):
            # Transient == worth surfacing as "try again": provider 5xx, a
            # network-layer failure (status_code 0 from URLError / timeout), or
            # Duffel's explicit service_unavailable error code.
            if isinstance(status_code, int) and (status_code >= 500 or status_code == 0):
                return True
            errors = body.get("errors") if isinstance(body, dict) else None
            for err in errors or []:
                if isinstance(err, dict) and str(err.get("code")) == "service_unavailable":
                    return True
            return False

        def _ok(tool_name, data, text=None, meta=None):
            meta = meta if isinstance(meta, dict) else {}
            payload = data if isinstance(data, dict) else {"value": data}
            payload.setdefault("ok", True)
            return {
                "status": "ok",
                "content": [{"type": "text", "text": text or f"Duffel {tool_name} ok"}],
                "isError": False,
                "_meta": {"backend": "duffel", "tool": tool_name, "duffel_env": duffel_env, **meta},
                "data": payload,
                "control_data": payload,
                "summary": text or f"Duffel {tool_name} ok",
                "text": text or f"Duffel {tool_name} ok",
            }

        def _request(http_method, path, payload=None, params=None, retryable=False, max_attempts=3):
            # retryable=True is passed only by idempotent-safe calls (flight/
            # place/airline searches and GET fetches). A transient failure
            # (5xx or network error) on those is retried with exponential
            # backoff + jitter. create_order (POST /air/orders) leaves the
            # default retryable=False: Duffel exposes NO Idempotency-Key
            # header, so a retried create_order can double-book. See
            # https://duffel.com/docs/api/overview/response-handling — a 503 on
            # order creation "may have created the order"; do not auto-retry.
            base = _text(duffel_api_base, "https://api.duffel.com").rstrip("/")
            url = base + path
            if params:
                url += "?" + urllib.parse.urlencode(params, doseq=True)
            headers = {
                "Authorization": f"Bearer {duffel_token}",
                "Accept": "application/json",
                "Duffel-Version": _text(duffel_api_version, "v2"),
            }
            body = None
            if payload is not None:
                headers["Content-Type"] = "application/json"
                body = json.dumps(payload, separators=(",", ":")).encode("utf-8")

            attempts = max(1, int(max_attempts)) if retryable else 1
            last = (False, 0, {"error": "request not attempted"})
            for attempt in range(attempts):
                req = urllib.request.Request(url, data=body, headers=headers, method=http_method)
                try:
                    with urllib.request.urlopen(req, timeout=45) as resp:
                        raw = resp.read().decode("utf-8")
                        parsed = json.loads(raw or "{}")
                        return True, resp.status, parsed
                except urllib.error.HTTPError as exc:
                    raw = exc.read().decode("utf-8", errors="replace")
                    try:
                        parsed = json.loads(raw or "{}")
                    except Exception:
                        parsed = {"raw": raw[:2000]}
                    last = (False, exc.code, parsed)
                    transient = exc.code >= 500
                except urllib.error.URLError as exc:
                    last = (False, 0, {"error": str(getattr(exc, "reason", exc))})
                    transient = True
                except Exception as exc:
                    last = (False, 0, {"error": f"{type(exc).__name__}: {exc}"})
                    transient = True
                # Retry only when the caller opted in AND the failure looks
                # transient AND we have another attempt left; otherwise return
                # the last result unchanged (4xx and non-retryable calls fall
                # straight through here on the first pass).
                if not (retryable and transient and attempt < attempts - 1):
                    return last
                time.sleep(min(4.0, 0.5 * (2 ** attempt)) + random.uniform(0.0, 0.25))
            return last

        def _duration(value):
            return _text(value, "?") or "?"

        def _iata(place):
            if isinstance(place, dict):
                return place.get("iata_code") or place.get("iataCode") or place.get("id") or "?"
            return "?"

        # adiona/frontend#21 — airline LOGOS.  Duffel airline objects carry
        # `logo_symbol_url` (square mark) and `logo_lockup_url` (wordmark);
        # `_carrier()` kept ONLY the IATA code, so every downstream card had to
        # omit the logo or invent a URL.  `_carrier_obj()` hands back the whole
        # airline object and `_airline_card()` reduces it to the fields a card
        # needs.  `_carrier()` is untouched so existing callers keep working.
        def _carrier(segment):
            for key in ("marketing_carrier", "operating_carrier"):
                carrier = segment.get(key)
                if isinstance(carrier, dict) and carrier.get("iata_code"):
                    return carrier.get("iata_code")
            return segment.get("marketing_carrier_iata_code") or segment.get("operating_carrier_iata_code") or "?"

        def _carrier_obj(segment):
            for key in ("marketing_carrier", "operating_carrier"):
                carrier = segment.get(key)
                if isinstance(carrier, dict) and carrier.get("iata_code"):
                    return carrier
            return {}

        def _airline_card(carrier):
            # Returns None when Duffel gave us nothing — an empty-string logo is
            # a real "provider has no logo", None is "there was no airline
            # object at all".  The caller can tell those apart; a {} cannot.
            carrier = carrier if isinstance(carrier, dict) else {}
            if not carrier.get("iata_code") and not carrier.get("name"):
                return None
            return {
                "iata_code": carrier.get("iata_code") or "",
                "name": carrier.get("name") or "",
                "logo_symbol_url": carrier.get("logo_symbol_url") or "",
                "logo_lockup_url": carrier.get("logo_lockup_url") or "",
                "conditions_of_carriage_url": carrier.get("conditions_of_carriage_url") or "",
                "id": carrier.get("id") or "",
            }

        def _place_card(place):
            # adiona/frontend#21 — Duffel origin/destination objects already carry
            # `name` (airport name) and `city_name`; `_normalise_segment` threw
            # both away and kept the bare IATA code, so a segment could only ever
            # render "JFK -> LHR".
            place = place if isinstance(place, dict) else {}
            city = place.get("city") if isinstance(place.get("city"), dict) else {}
            return {
                "iataCode": _iata(place),
                "iata": _iata(place),
                "airport_name": place.get("name") or "",
                "city": place.get("city_name") or city.get("name") or "",
                "city_iata": city.get("iata_code") or place.get("iata_city_code") or "",
                "country_code": place.get("iata_country_code") or city.get("iata_country_code") or "",
                "time_zone": place.get("time_zone") or "",
                "type": place.get("type") or "",
            }

        def _segment_baggages(segment):
            # ⚠ Duffel puts baggage allowances at
            # slices[].segments[].passengers[].baggages — NOT on the offer's
            # top-level `passengers`.  Reading the top level yields nothing and
            # every offer then reads as "unknown baggage", which looks exactly
            # like a provider that does not supply it.
            out = []
            for _p in _as_list(segment.get("passengers")):
                if not isinstance(_p, dict):
                    continue
                for _b in _as_list(_p.get("baggages")):
                    if isinstance(_b, dict):
                        out.append(_b)
            return out

        def _normalise_segment(segment):
            origin = segment.get("origin") if isinstance(segment.get("origin"), dict) else {}
            destination = segment.get("destination") if isinstance(segment.get("destination"), dict) else {}
            marketing = segment.get("marketing_carrier") if isinstance(segment.get("marketing_carrier"), dict) else {}
            operating = segment.get("operating_carrier") if isinstance(segment.get("operating_carrier"), dict) else {}
            aircraft = segment.get("aircraft") if isinstance(segment.get("aircraft"), dict) else {}
            departure = _place_card(origin)
            arrival = _place_card(destination)
            departure["at"] = segment.get("departing_at") or segment.get("departure_time") or "?"
            arrival["at"] = segment.get("arriving_at") or segment.get("arrival_time") or "?"
            departure["terminal"] = _text(segment.get("origin_terminal"))
            arrival["terminal"] = _text(segment.get("destination_terminal"))
            marketing_card = _airline_card(marketing)
            operating_card = _airline_card(operating)
            # A "technical stop" — the aircraft touches down mid-segment without
            # the passenger changing plane.  Distinct from a connection, which is
            # an extra SEGMENT.  Both are real; conflating them undercounts.
            technical = []
            for _s in _as_list(segment.get("stops")):
                if not isinstance(_s, dict):
                    continue
                technical.append({
                    "airport": _place_card(_s.get("airport")),
                    "arriving_at": _s.get("arriving_at") or "",
                    "departing_at": _s.get("departing_at") or "",
                    "duration": _duration(_s.get("duration")),
                })
            return {
                "id": segment.get("id") or "",
                "departure": departure,
                "arrival": arrival,
                "carrierCode": _carrier(segment),
                "carrier": marketing_card.get("iata_code") if marketing_card else _carrier(segment),
                "carrier_name": (marketing_card or {}).get("name") or (operating_card or {}).get("name") or "",
                "marketing_carrier": marketing_card,
                "operating_carrier": operating_card,
                "operating_carrier_name": (operating_card or {}).get("name") or "",
                "number": _text(segment.get("marketing_carrier_flight_number") or segment.get("flight_number")),
                "operating_flight_number": _text(segment.get("operating_carrier_flight_number")),
                "aircraft": {"iata_code": aircraft.get("iata_code") or "", "name": aircraft.get("name") or ""} if aircraft else None,
                "cabin_class": _text(segment.get("cabin_class")) or None,
                "duration": _duration(segment.get("duration")),
                "distance": _text(segment.get("distance")) or None,
                "technical_stops": technical,
                "numberOfStops": len(technical),
            }

        # adiona/frontend#21 Tier A — baggage and fare conditions as ARRAYS of
        # options rather than a single collapsed verdict.  Two scopes appear:
        #   "included"  — the allowance the fare already carries
        #                 (slices[].segments[].passengers[].baggages)
        #   "available" — a PRICED add-on from `available_services`, which only
        #                 exists on the single-offer GET /air/offers/{id}.  With
        #                 enrichment off this scope is simply absent; it is never
        #                 guessed.
        BAGGAGE_TYPES = ("checked", "carry_on")

        def _collect_included_baggages(offer):
            # `_baggages` is set ONLY by enrichment, from the single-offer GET.
            # When it is present it is authoritative and used ALONE: merging it
            # with whatever the list response carried would emit two
            # contradictory allowances for the same bag type (the list's stale
            # "checked: 0" next to the enriched "checked: 1") and a reader has
            # no way to tell which one the fare actually grants.
            enriched = [b for b in _as_list(offer.get("_baggages")) if isinstance(b, dict)]
            if enriched:
                return enriched
            bags = []
            for _p in _as_list(offer.get("passengers")):
                if isinstance(_p, dict):
                    bags.extend(b for b in _as_list(_p.get("baggages")) if isinstance(b, dict))
            for _sl in _as_list(offer.get("slices")):
                if not isinstance(_sl, dict):
                    continue
                for _sg in _as_list(_sl.get("segments")):
                    if isinstance(_sg, dict):
                        bags.extend(_segment_baggages(_sg))
            return [b for b in bags if isinstance(b, dict)]

        def _baggage_options(offer):
            out = []
            seen = set()

            def _push(entry):
                key = (entry.get("scope"), entry.get("type"), entry.get("quantity"),
                       str(entry.get("amount")), entry.get("service_id"))
                if key in seen:
                    return
                seen.add(key)
                out.append(entry)

            for _b in _collect_included_baggages(offer):
                _t = str(_b.get("type") or "")
                if _t not in BAGGAGE_TYPES:
                    continue
                try:
                    _q = int(_b.get("quantity") or 0)
                except (TypeError, ValueError):
                    _q = 0
                _push({
                    "scope": "included",
                    "type": _t,
                    "quantity": _q,
                    "amount": None,
                    "currency": None,
                    "service_id": None,
                })
            for _svc in _as_list(offer.get("available_services")):
                if not isinstance(_svc, dict) or str(_svc.get("type") or "") != "baggage":
                    continue
                meta = _svc.get("metadata") if isinstance(_svc.get("metadata"), dict) else {}
                try:
                    _q = int(_svc.get("maximum_quantity") or 1)
                except (TypeError, ValueError):
                    _q = 1
                _push({
                    "scope": "available",
                    "type": str(meta.get("type") or "checked"),
                    "quantity": _q,
                    "amount": _svc.get("total_amount"),
                    "currency": _svc.get("total_currency"),
                    "service_id": _svc.get("id"),
                    "max_weight_kg": meta.get("maximum_weight_kg"),
                    "max_height_cm": meta.get("maximum_height_cm"),
                    "max_length_cm": meta.get("maximum_length_cm"),
                    "max_depth_cm": meta.get("maximum_depth_cm"),
                    "segment_ids": _as_list(_svc.get("segment_ids")),
                    "passenger_ids": _as_list(_svc.get("passenger_ids")),
                })
            return out

        CONDITION_TERMS = (("change_before_departure", "change"), ("refund_before_departure", "refund"))

        def _conditions_options(offer):
            # A null term means the fare does not STATE it: unknown, NOT
            # "not allowed".  `allowed: None` is carried through so a caller can
            # tell unknown from known-false and never claims a term Duffel did
            # not give.  When the container is absent entirely we emit nothing.
            out = []

            def _emit(scope, container, extra):
                if not isinstance(container, dict):
                    return
                for key, kind in CONDITION_TERMS:
                    term = container.get(key)
                    entry = {"scope": scope, "type": kind, "key": key,
                             "allowed": None, "penalty_amount": None, "penalty_currency": None}
                    if isinstance(term, dict):
                        entry["allowed"] = bool(term.get("allowed"))
                        entry["penalty_amount"] = term.get("penalty_amount")
                        entry["penalty_currency"] = term.get("penalty_currency")
                    entry.update(extra)
                    out.append(entry)

            _emit("offer", offer.get("conditions"), {})
            for _sl in _as_list(offer.get("slices")):
                if isinstance(_sl, dict):
                    _emit("slice", _sl.get("conditions"), {"slice_id": _sl.get("id"), "slice_direction": _sl.get("_direction") or ""})
            return out

        def _normalise_offer(offer, direction=""):
            slices = _as_list(offer.get("slices"))
            itineraries = []
            validating = []
            airlines = []
            airline_codes = set()
            for item in slices:
                raw_segments = [seg for seg in _as_list(item.get("segments")) if isinstance(seg, dict)]
                segments = [_normalise_segment(seg) for seg in raw_segments]
                for seg in segments:
                    code = seg.get("carrierCode")
                    if code and code != "?" and code not in validating:
                        validating.append(code)
                    for card in (seg.get("marketing_carrier"), seg.get("operating_carrier")):
                        if card and card.get("iata_code") and card["iata_code"] not in airline_codes:
                            airline_codes.add(card["iata_code"])
                            airlines.append(card)
                item_origin = item.get("origin") if isinstance(item.get("origin"), dict) else {}
                item_destination = item.get("destination") if isinstance(item.get("destination"), dict) else {}
                itineraries.append({
                    "id": item.get("id") or "",
                    "direction": item.get("_direction") or direction or "",
                    "origin": _place_card(item_origin),
                    "destination": _place_card(item_destination),
                    "duration": _duration(item.get("duration")),
                    # A connection is an extra SEGMENT; 3 segments == 2 stops.
                    "stops": max(0, len(segments) - 1),
                    "segments": segments,
                })
            # Tier A dict form — kept BYTE-COMPATIBLE with the itinerary
            # planner's ranker, which reads baggage.checked / conditions.refundable.
            # The richer arrays live alongside it in `baggage_options` /
            # `conditions_options`; changing these two in place would have
            # silently broken the planner's exclusion logic.
            _bag = {"checked": 0, "carry_on": 0, "known": False}
            for _b in _collect_included_baggages(offer):
                _t = str(_b.get("type") or "")
                try:
                    _q = int(_b.get("quantity") or 0)
                except (TypeError, ValueError):
                    _q = 0
                if _t in _bag:
                    _bag[_t] = max(_bag[_t], _q)
                    _bag["known"] = True
            _cond = offer.get("conditions") if isinstance(offer.get("conditions"), dict) else {}

            def _term(v):
                if isinstance(v, dict):
                    return bool(v.get("allowed"))
                return None

            owner = _airline_card(offer.get("owner"))
            baggage_options = _baggage_options(offer)
            conditions_options = _conditions_options(offer)
            return {
                "id": offer.get("id"),
                "source": "duffel",
                "direction": offer.get("_direction") or direction or "",
                "price": {
                    "total": offer.get("total_amount") or offer.get("base_amount") or "?",
                    "currency": offer.get("total_currency") or offer.get("base_currency") or "USD",
                    "base": offer.get("base_amount"),
                    "tax": offer.get("tax_amount"),
                },
                "itineraries": itineraries,
                "validatingAirlineCodes": validating,
                "airlines": airlines,
                "owner": owner,
                "expires_at": offer.get("expires_at"),
                "live_mode": offer.get("live_mode"),
                "passenger_count": len(_as_list(offer.get("passengers"))) or None,
                "baggage": {"checked": _bag["checked"], "carry_on": _bag["carry_on"],
                            "known": _bag["known"]},
                "conditions": {"changeable": _term(_cond.get("change_before_departure")),
                               "refundable": _term(_cond.get("refund_before_departure"))},
                "baggage_options": baggage_options,
                "baggage_known": bool(baggage_options),
                "conditions_options": conditions_options,
                "conditions_known": bool(conditions_options),
                "fare_brand": offer.get("fare_brand_name"),
            }
        def _tools_list():
            tools = [
                {
                    "name": "search_offers",
                    "title": "Search flight offers",
                    "description": "Duffel flight offers search. Required: origin, destination, departure_date. Optional: return_date, adults, children (aged), cabin_class, max_offers, round_trip_mode, enrich_offers.",
                    "inputSchema": {
                        "type": "object",
                        "required": ["origin", "destination", "departure_date"],
                        "properties": {
                            "origin": {"type": "string", "description": "IATA airport or city code"},
                            "destination": {"type": "string", "description": "IATA airport or city code"},
                            "departure_date": {"type": "string", "description": "YYYY-MM-DD"},
                            "return_date": {"type": "string", "description": "YYYY-MM-DD"},
                            "adults": {"type": "integer", "minimum": 1, "maximum": 9, "default": 1},
                            "children": {
                                "type": "array",
                                "description": "Child passengers as real aged travellers. A bare count is REJECTED: Duffel prices a child fare from the age and this provider will not invent one.",
                                "items": {"type": "object", "required": ["age"], "properties": {"age": {"type": "integer", "minimum": 0, "maximum": 17}}},
                            },
                            "cabin_class": {"type": "string", "enum": ["economy", "premium_economy", "business", "first"], "default": "economy"},
                            "max_offers": {"type": "integer", "minimum": 1, "maximum": 50, "default": 50, "description": "Cap per direction set."},
                            "max_connections": {"type": "integer", "minimum": 0, "description": "Duffel search parameter (0 = nonstop only)."},
                            "round_trip_mode": {
