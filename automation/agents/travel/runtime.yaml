apiVersion: noetl.io/v2
kind: Playbook
metadata:
  name: travel_agent
  path: automation/agents/travel/runtime
  description: |
    Travel agent — flagship demo of NoETL DSL as a templating library
    for AI agents and MCP tooling using only playbooks.

    Takes a natural-language query, classifies intent (flights / hotels
    / locations / activities / help) via OpenAI, Anthropic, Vertex AI, or Ollama,
    routes to the right Amadeus endpoint, and emits the result as a
    widget tree in `result.render`. The widget renderer in NoetlPrompt
    materialises the tree in the terminal; the travel canvas in
    GatewayAssistant renders the same shape.

    The AI provider is parameterised via `workload.ai_provider`.
    OpenAI is the default; Anthropic is handled by the HTTP provider
    branch, Vertex AI routes through the Vertex AI MCP playbook so
    GCP auth remains owned by that single MCP implementation, and
    Ollama routes through the in-cluster Ollama MCP playbook.
  version: "1.0"
  agent: true
  tags: [agent, travel, widgets, ai-os, flagship]
  terminal:
    visible: true
    workspace: travel
    scopes: [/mcp/amadeus, /mcp/duffel, /mcp/google-places]
  capabilities: [mcp:amadeus, mcp:duffel, mcp:google-places, mcp:vertex-ai, mcp:ollama, ai:openai, ai:anthropic, ai:vertex-ai, ai:ollama]

workload:
  pg_auth: pg_k8s
  gcp_auth: google_oauth
  ai_provider: openai            # openai | anthropic | vertex-ai | ollama
  query: "Help"
  request_id: ""
  callback_url: ""
  amadeus_env: test              # test | production
  flight_provider: duffel        # duffel | amadeus
  duffel_env: test               # test only in the search-only round
  gcp_project: "noetl-demo-19700101"
  vertex_project: "noetl-demo-19700101"
  vertex_region: "us-central1"
  vertex_model: "gemini-2.5-flash"
  ollama_model: "gemma3:4b"
  openai_model: "gpt-4o-mini"
  anthropic_model: "claude-haiku-4-5-20251001"
  ollama_bridge_url: "http://ollama-bridge.noetl.svc.cluster.local:8765/jsonrpc"
  enrich_with_google_places: false
  classifier_system_prompt: |
    You are a travel agent classifier. Given a user query, return ONLY
    a JSON object with these keys:
    - intent: one of "flights", "hotels", "locations", "activities", "help"
    - origin: IATA code (or null)
    - destination: IATA code (or null)
    - departureDate: YYYY-MM-DD (convert relative dates; or null)
    - adults: integer, default 1
    - city: human-readable city name for hotels (or null)
    - cityCode: IATA city code for hotels, e.g. NYC, PAR, LON (or null)
    - keyword: free-text filter for locations or activities (or null)
    - latitude: decimal degrees for activities (or null)
    - longitude: decimal degrees for activities (or null)
    Use null for fields that don't apply.
  # Secret-manager paths. Provider keychain entries are bound
  # unconditionally with bare references; the Python classifier selects
  # the effective provider and falls back cleanly when Anthropic is
  # requested but its token is empty.
  openai_secret_path: projects/1014428265962/secrets/openai-api-key/versions/1
  anthropic_secret_path: projects/1014428265962/secrets/anthropic-api-key/versions/1
  amadeus_key_path: projects/1014428265962/secrets/api-key-test-api-amadeus-com/versions/1
  amadeus_secret_path: projects/1014428265962/secrets/api-secret-test-api-amadeus-com/versions/1

keychain:
  # Mirrors the proven pattern in
  # repos/e2e/fixtures/playbooks/api_integration/amadeus_ai_api/amadeus_ai_api.yaml.
  # Key learnings from the AMBER round at
  # bridge/outbox/20260509-051749-travel-agent-amber-to-green.result.json:
  #   1. Keychain Jinja templates resolve workload fields via BARE
  #      references (`{{ gcp_auth }}`), not `{{ workload.gcp_auth }}`.
  #      Mixing `workload.X` here yields empty strings at bind time,
  #      which silently leaves keychain entries unbound and downstream
  #      HTTP steps see empty Bearer tokens.
  #   2. The OAuth2 endpoint URL must be a plain string — Jinja
  #      conditionals on the endpoint don't render in keychain context.
  #   3. `when:` predicates on keychain entries appear to be unsupported
  #      today; entries are simply present-or-absent. Provider switching
  #      belongs in normal workflow code, not in keychain predicates.
  - name: openai_token
    kind: secrets
    provider: gcp
    scope: global
    auth: "{{ gcp_auth }}"
    map:
      api_key: "{{ openai_secret_path }}"

  - name: anthropic_token
    kind: secrets
    provider: gcp
    scope: global
    auth: "{{ gcp_auth }}"
    map:
      api_key: "{{ anthropic_secret_path }}"

  - name: amadeus_credentials
    kind: secrets
    provider: gcp
    scope: global
    auth: "{{ gcp_auth }}"
    map:
      client_id: "{{ amadeus_key_path }}"
      client_secret: "{{ amadeus_secret_path }}"

  - name: amadeus_token
    kind: oauth2
    scope: global
    auto_renew: true
    endpoint: https://test.api.amadeus.com/v1/security/oauth2/token
    method: POST
    headers:
      Content-Type: application/x-www-form-urlencoded
    data:
      grant_type: client_credentials
      client_id: "{{ keychain.amadeus_credentials.client_id }}"
      client_secret: "{{ keychain.amadeus_credentials.client_secret }}"

workflow:
  # ---------------------------------------------------------------------
  # 1. Bootstrap the audit-log tables (idempotent).
  # ---------------------------------------------------------------------
  - step: start
    desc: Ensure event-log tables exist
    tool:
      kind: postgres
      auth: "{{ workload.pg_auth }}"
      query: |
        CREATE TABLE IF NOT EXISTS travel_agent_events (
          id BIGSERIAL PRIMARY KEY,
          execution_id TEXT NOT NULL,
          event_time TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
          event_type TEXT NOT NULL,
          ai_provider TEXT,
          intent TEXT,
          payload JSONB
        );
    next:
      spec: { mode: exclusive }
      arcs:
        - step: classify_via_vertex_mcp
          when: "{{ workload.ai_provider == 'vertex-ai' }}"
        - step: classify_via_ollama_mcp
          when: "{{ workload.ai_provider == 'ollama' }}"
        - step: classify_via_http_provider
          when: "{{ workload.ai_provider in ['openai', 'anthropic'] or workload.ai_provider == '' or workload.ai_provider is none }}"

  # ---------------------------------------------------------------------
  # 2a. Intent classification — OpenAI + Anthropic HTTP providers.
  #
  # Provider switching happens inside this Python step, not through
  # keychain `when:` predicates or Jinja conditionals on URL/headers/body.
  # This follows docs/reference/playbook_authoring_guide.md: bind
  # provider tokens unconditionally with bare keychain refs, then choose
  # request shape and response unwrap in normal code.
  # ---------------------------------------------------------------------
  - step: classify_via_http_provider
    desc: Classify intent via OpenAI or Anthropic; extract structured params
    tool:
      kind: python
      input:
        query: "{{ workload.query }}"
        requested_provider: "{{ workload.ai_provider }}"
        system_prompt: "{{ workload.classifier_system_prompt }}"
        openai_model: "{{ workload.openai_model }}"
        anthropic_model: "{{ workload.anthropic_model }}"
        openai_api_key: "{{ keychain.openai_token.api_key | default('') }}"
        anthropic_api_key: "{{ keychain.anthropic_token.api_key | default('') }}"
      code: |
        import json
        import re
        import urllib.error
        import urllib.request

        def _coerce(value):
            if value in (None, "", "null"):
                return None
            return value

        def _coerce_float(value):
            value = _coerce(value)
            if value is None:
                return None
            try:
                return float(value)
            except (TypeError, ValueError):
                return None

        def _activity_coordinates(parsed, intent):
            latitude = _coerce_float(parsed.get("latitude"))
            longitude = _coerce_float(parsed.get("longitude"))
            if intent != "activities" or (latitude is not None and longitude is not None):
                return latitude, longitude
            hint = " ".join(str(parsed.get(k) or "") for k in ("keyword", "city")).lower()
            known = {
                "times square": (40.7580, -73.9855),
                "new york": (40.7128, -74.0060),
                "nyc": (40.7128, -74.0060),
                "boston": (42.3601, -71.0589),
                "paris": (48.8566, 2.3522),
            }
            for key, coords in known.items():
                if key in hint:
                    return coords
            return 40.7128, -74.0060

        # NoETL executes snippets with separate globals/locals maps.
        # Helpers that call sibling helpers need those names published.
        globals().update({
            "_coerce": _coerce,
            "_coerce_float": _coerce_float,
            "_activity_coordinates": _activity_coordinates,
        })

        def _post_json(url, headers, payload, json=json, urllib_request=urllib.request):
            req = urllib_request.Request(
                url,
                data=json.dumps(payload).encode("utf-8"),
                headers=headers,
                method="POST",
            )
            with urllib_request.urlopen(req, timeout=30) as resp:
                return json.loads(resp.read().decode("utf-8"))

        def _openai_text(
            system_prompt=system_prompt,
            query=query,
            openai_model=openai_model,
            openai_api_key=openai_api_key,
            _post_json=_post_json,
        ):
            body = {
                "model": openai_model,
                "response_format": {"type": "json_object"},
                "messages": [
                    {"role": "system", "content": system_prompt},
                    {"role": "user", "content": query},
                ],
            }
            data = _post_json(
                "https://api.openai.com/v1/chat/completions",
                {
                    "Authorization": f"Bearer {openai_api_key}",
                    "Content-Type": "application/json",
                },
                body,
            )
            choices = (data or {}).get("choices") or []
            if choices:
                return ((choices[0] or {}).get("message") or {}).get("content") or ""
            return ""

        def _anthropic_text(
            system_prompt=system_prompt,
            query=query,
            anthropic_model=anthropic_model,
            anthropic_api_key=anthropic_api_key,
            _post_json=_post_json,
        ):
            body = {
                "model": anthropic_model,
                "max_tokens": 512,
                "temperature": 0,
                "system": system_prompt,
                "messages": [{"role": "user", "content": query}],
            }
            data = _post_json(
                "https://api.anthropic.com/v1/messages",
                {
                    "x-api-key": anthropic_api_key,
                    "anthropic-version": "2023-06-01",
                    "Content-Type": "application/json",
                },
                body,
            )
            parts = (data or {}).get("content") or []
            return "".join(str((part or {}).get("text") or "") for part in parts if (part or {}).get("type") == "text")

        requested = (requested_provider or "openai").strip().lower()
        effective_provider = requested if requested in ("openai", "anthropic") else "openai"
        provider_fallback_reason = None
        if requested == "anthropic" and not (anthropic_api_key or "").strip():
            effective_provider = "openai"
            provider_fallback_reason = "anthropic token missing"
        elif requested not in ("openai", "anthropic"):
            effective_provider = "openai"
            provider_fallback_reason = f"{requested or 'empty'} provider unsupported"

        try:
            text = _anthropic_text() if effective_provider == "anthropic" else _openai_text()
            provider_error = None
        except urllib.error.HTTPError as exc:
            provider_error = f"{effective_provider} HTTP {exc.code}"
            if effective_provider == "anthropic":
                effective_provider = "openai"
                provider_fallback_reason = provider_error
                try:
                    text = _openai_text()
                    provider_error = None
                except Exception as fallback_exc:
                    text = ""
                    provider_error = f"openai fallback failed: {type(fallback_exc).__name__}: {fallback_exc}"
            else:
                text = ""
        except Exception as exc:
            provider_error = f"{effective_provider} {type(exc).__name__}: {exc}"
            if effective_provider == "anthropic":
                effective_provider = "openai"
                provider_fallback_reason = provider_error
                try:
                    text = _openai_text()
                    provider_error = None
                except Exception as fallback_exc:
                    text = ""
                    provider_error = f"openai fallback failed: {type(fallback_exc).__name__}: {fallback_exc}"
            else:
                text = ""

        # Strip markdown fences if the AI ignored response_format.
        text = (text or "").strip()
        if text.startswith("```"):
            text = re.sub(r'^```\w*\n?', '', text)
            text = re.sub(r'\n?```$', '', text)
            text = text.strip()

        try:
            parsed = json.loads(text) if text else {}
        except Exception:
            parsed = {}

        intent = (parsed.get("intent") or "help").lower().strip()
        if intent not in ("flights", "hotels", "locations", "activities", "help"):
            intent = "help"
        latitude, longitude = _activity_coordinates(parsed, intent)

        result = {
            "intent": intent,
            "origin": _coerce(parsed.get("origin")),
            "destination": _coerce(parsed.get("destination")),
            "departureDate": _coerce(parsed.get("departureDate")),
            "adults": int(parsed.get("adults") or 1),
            "city": _coerce(parsed.get("city")),
            "cityCode": _coerce(parsed.get("cityCode")),
            "keyword": _coerce(parsed.get("keyword")),
            "latitude": latitude,
            "longitude": longitude,
            "requested_provider": requested,
            "effective_provider": effective_provider,
            "provider_fallback_reason": provider_fallback_reason,
            "provider_error": provider_error,
            "raw_text": text[:600],
        }
        # Pre-serialise to a JSON string for the audit SQL. This sidesteps
        # the failure mode in the original cut where the audit step tried
        # `{{ classify_intent | tojson | replace("'", "''") }}` inside
        # a YAML `|` block — the apostrophes inside the replace filter
        # collided with the SQL string delimiters and Postgres saw a
        # malformed literal (see bridge/outbox/20260509-044651-...result.json
        # phase 7). The proven pattern in repos/e2e/.../amadeus_ai_api.yaml
        # is: dump JSON to a string in Python, then escape with
        # `| replace("'", "''")` in the SQL template — which is a single
        # field reference, not an inline dict serialisation.
        result["json_str"] = json.dumps(result, separators=(",", ":"))
    next:
      spec: { mode: exclusive }
      arcs:
        - step: classify_intent

  # ---------------------------------------------------------------------
  # 2b. Intent classification — Vertex AI through the MCP playbook.
  #
  # Mirrors the Phase 2 Amadeus agent→MCP hop: the travel runtime
  # dispatches, while automation/agents/mcp/vertex-ai owns Workload
  # Identity / metadata server / env-token / service-account auth.
  # ---------------------------------------------------------------------
  - step: classify_via_vertex_mcp
    desc: Classify intent via the Vertex AI MCP playbook
    tool:
      kind: agent
      framework: noetl
      entrypoint: automation/agents/mcp/vertex-ai
      payload:
        model: "{{ workload.vertex_model }}"
        messages:
          - role: user
            content: "{{ workload.query }}"
        system: "{{ workload.classifier_system_prompt }}"
        temperature: 0
        vertex_project: "{{ workload.vertex_project | default(workload.gcp_project) }}"
        vertex_region: "{{ workload.vertex_region }}"
        vertex_model: "{{ workload.vertex_model }}"
    next:
      spec: { mode: exclusive }
      arcs:
        - step: classify_intent

  # ---------------------------------------------------------------------
  # 2c. Intent classification — Ollama through the MCP playbook.
  #
  # Mirrors the Vertex AI branch: the travel runtime dispatches through
  # a NoETL agent hop while automation/agents/mcp/ollama owns the
  # in-cluster ollama-bridge JSON-RPC endpoint.
  # ---------------------------------------------------------------------
  - step: classify_via_ollama_mcp
    desc: Classify intent via the Ollama MCP playbook
    tool:
      kind: agent
      framework: noetl
      entrypoint: automation/agents/mcp/ollama
      payload:
        method: tools/call
        tool: chat_completion
        arguments:
          messages:
            - role: user
              content: "{{ workload.query }}"
          system: "{{ workload.classifier_system_prompt }}"
          temperature: 0
          model: "{{ workload.ollama_model }}"
          ollama_endpoint: "{{ workload.ollama_bridge_url }}"
    next:
      spec: { mode: exclusive }
      arcs:
        - step: classify_intent

  # ---------------------------------------------------------------------
  # 2d. Intent classification merger.
  #
  # Downstream steps keep their long-lived `classify_intent.X` contract.
  # The HTTP branch already produces that shape. MCP branches may only
  # expose scalar agent metadata at the parent level, so this merger can
  # read child execution events to recover the MCP response text.
  # ---------------------------------------------------------------------
  - step: classify_intent
    desc: Normalize HTTP, Vertex MCP, or Ollama MCP classification into the canonical shape
    tool:
      kind: python
      input:
        query: "{{ workload.query }}"
        requested_provider: "{{ workload.ai_provider }}"
        http_result: "{{ classify_via_http_provider | default({}) }}"
        vertex_result: "{{ classify_via_vertex_mcp | default({}) }}"
        ollama_result: "{{ classify_via_ollama_mcp | default({}) }}"
        system_prompt: "{{ workload.classifier_system_prompt }}"
        openai_model: "{{ workload.openai_model }}"
        openai_api_key: "{{ keychain.openai_token.api_key | default('') }}"
      code: |
        import json
        import os
        import re
        import urllib.error
        import urllib.request

        def _coerce(value):
            if value in (None, "", "null"):
                return None
            return value

        def _coerce_float(value):
            value = _coerce(value)
            if value is None:
                return None
            try:
                return float(value)
            except (TypeError, ValueError):
                return None

        def _activity_coordinates(parsed, intent):
            parsed = parsed if isinstance(parsed, dict) else {}
            latitude = _coerce_float(parsed.get("latitude"))
            longitude = _coerce_float(parsed.get("longitude"))
            if intent != "activities" or (latitude is not None and longitude is not None):
                return latitude, longitude
            hint = " ".join(str(parsed.get(k) or "") for k in ("keyword", "city")).lower()
            known = {
                "times square": (40.7580, -73.9855),
                "new york": (40.7128, -74.0060),
                "nyc": (40.7128, -74.0060),
                "boston": (42.3601, -71.0589),
                "paris": (48.8566, 2.3522),
            }
            for key, coords in known.items():
                if key in hint:
                    return coords
            return 40.7128, -74.0060

        def _strip_fences(text):
            text = (text or "").strip()
            if text.startswith("```"):
                text = re.sub(r'^```\w*\n?', '', text)
                text = re.sub(r'\n?```$', '', text)
            return text.strip()

        def _normalise(parsed, *, requested, effective, fallback_reason=None, provider_error=None, raw_text=""):
            parsed = parsed if isinstance(parsed, dict) else {}
            intent = (parsed.get("intent") or "help").lower().strip()
            if intent not in ("flights", "hotels", "locations", "activities", "help"):
                intent = "help"
            latitude, longitude = _activity_coordinates(parsed, intent)
            result = {
                "intent": intent,
                "origin": _coerce(parsed.get("origin")),
                "destination": _coerce(parsed.get("destination")),
                "departureDate": _coerce(parsed.get("departureDate")),
                "adults": int(parsed.get("adults") or 1),
                "city": _coerce(parsed.get("city")),
                "cityCode": _coerce(parsed.get("cityCode")),
                "keyword": _coerce(parsed.get("keyword")),
                "latitude": latitude,
                "longitude": longitude,
                "requested_provider": requested,
                "effective_provider": effective,
                "provider_fallback_reason": fallback_reason,
                "provider_error": provider_error,
                "raw_text": (raw_text or "")[:600],
            }
            result["json_str"] = json.dumps(result, separators=(",", ":"))
            return result

        def _post_json(url, headers, payload, json=json, urllib_request=urllib.request):
            req = urllib_request.Request(
                url,
                data=json.dumps(payload).encode("utf-8"),
                headers=headers,
                method="POST",
            )
            with urllib_request.urlopen(req, timeout=30) as resp:
                return json.loads(resp.read().decode("utf-8"))

        def _openai_text(
            query=query,
            openai_api_key=openai_api_key,
            openai_model=openai_model,
            system_prompt=system_prompt,
            _post_json=_post_json,
        ):
            body = {
                "model": openai_model,
                "response_format": {"type": "json_object"},
                "messages": [
                    {"role": "system", "content": system_prompt},
                    {"role": "user", "content": query},
                ],
            }
            data = _post_json(
                "https://api.openai.com/v1/chat/completions",
                {
                    "Authorization": f"Bearer {openai_api_key}",
                    "Content-Type": "application/json",
                },
                body,
            )
            choices = (data or {}).get("choices") or []
            if choices:
                return ((choices[0] or {}).get("message") or {}).get("content") or ""
            return ""

        def _extract_vertex_text_from_context(ctx):
            if not isinstance(ctx, dict):
                return "", False, None
            is_error = bool(ctx.get("isError")) or str(ctx.get("status") or "").lower() == "error"
            text = ctx.get("text") if isinstance(ctx.get("text"), str) else ""
            if not text:
                content = ctx.get("content")
                if isinstance(content, list) and content:
                    first = content[0] if isinstance(content[0], dict) else {}
                    text = first.get("text") if isinstance(first.get("text"), str) else ""
            if not text:
                data = ctx.get("data") if isinstance(ctx.get("data"), dict) else {}
                meta = data.get("_meta") if isinstance(data.get("_meta"), dict) else {}
                text = meta.get("text") if isinstance(meta.get("text"), str) else ""
            meta = ctx.get("_meta") if isinstance(ctx.get("_meta"), dict) else {}
            error = meta.get("error") if isinstance(meta.get("error"), str) else None
            return text, is_error, error

        def _extract_ollama_text_from_context(ctx):
            if not isinstance(ctx, dict):
                return "", False, None
            is_error = bool(ctx.get("isError")) or str(ctx.get("status") or "").lower() == "error"
            text = ctx.get("text") if isinstance(ctx.get("text"), str) else ""
            if not text:
                content = ctx.get("content")
                if isinstance(content, list) and content:
                    first = content[0] if isinstance(content[0], dict) else {}
                    text = first.get("text") if isinstance(first.get("text"), str) else ""
            if not text:
                data = ctx.get("data") if isinstance(ctx.get("data"), dict) else {}
                meta = data.get("_meta") if isinstance(data.get("_meta"), dict) else {}
                text = meta.get("text") if isinstance(meta.get("text"), str) else ""
            meta = ctx.get("_meta") if isinstance(ctx.get("_meta"), dict) else {}
            error = meta.get("error") if isinstance(meta.get("error"), str) else None
            return text, is_error, error

        # NoETL executes snippets with separate globals/locals maps.
        # Helpers that call sibling helpers need those names published.
        globals().update({
            "json": json,
            "os": os,
            "re": re,
            "urllib": urllib,
            "_coerce": _coerce,
            "_coerce_float": _coerce_float,
            "_activity_coordinates": _activity_coordinates,
            "_strip_fences": _strip_fences,
            "_normalise": _normalise,
            "_post_json": _post_json,
            "_openai_text": _openai_text,
            "_extract_vertex_text_from_context": _extract_vertex_text_from_context,
            "_extract_ollama_text_from_context": _extract_ollama_text_from_context,
        })

        requested = (requested_provider or "openai").strip().lower()
        if requested == "ollama":
            ollama_envelope = ollama_result if isinstance(ollama_result, dict) else {}
            ollama_context = ollama_envelope.get("data") if isinstance(ollama_envelope.get("data"), dict) else ollama_envelope
            text, is_error, provider_error = _extract_ollama_text_from_context(ollama_context)

            text = _strip_fences(text)
            parsed = {}
            if text and not is_error:
                try:
                    parsed = json.loads(text)
                except Exception as exc:
                    is_error = True
                    provider_error = f"ollama JSON parse failed: {type(exc).__name__}: {exc}"

            if text and not is_error and isinstance(parsed, dict):
                result = _normalise(
                    parsed,
                    requested="ollama",
                    effective="ollama",
                    raw_text=text,
                )
            else:
                fallback_reason = provider_error or "ollama returned no usable classifier text"
                try:
                    fallback_text = _strip_fences(_openai_text())
                    try:
                        parsed = json.loads(fallback_text) if fallback_text else {}
                    except Exception:
                        parsed = {}
                    result = _normalise(
                        parsed,
                        requested="ollama",
                        effective="openai",
                        fallback_reason=fallback_reason,
                        raw_text=fallback_text,
                    )
                except Exception as exc:
                    result = _normalise(
                        {},
                        requested="ollama",
                        effective="openai",
                        fallback_reason=fallback_reason,
                        provider_error=f"openai fallback failed: {type(exc).__name__}: {exc}",
                    )
        elif requested != "vertex-ai":
            result = http_result if isinstance(http_result, dict) and http_result else {}
            if result:
                result["json_str"] = result.get("json_str") or json.dumps(result, separators=(",", ":"))
            else:
                result = _normalise({}, requested=requested, effective="openai", fallback_reason="empty http classifier result")
        else:
            vertex_envelope = vertex_result if isinstance(vertex_result, dict) else {}
            vertex_context = vertex_envelope.get("data") if isinstance(vertex_envelope.get("data"), dict) else vertex_envelope
            text, is_error, provider_error = _extract_vertex_text_from_context(vertex_context)

            text = _strip_fences(text)
            parsed = {}
            if text and not is_error:
                try:
                    parsed = json.loads(text)
                except Exception as exc:
                    is_error = True
                    provider_error = f"vertex-ai JSON parse failed: {type(exc).__name__}: {exc}"

            if text and not is_error and isinstance(parsed, dict):
                result = _normalise(
                    parsed,
                    requested="vertex-ai",
                    effective="vertex-ai",
                    raw_text=text,
                )
            else:
                fallback_reason = provider_error or "vertex-ai returned no usable classifier text"
                try:
                    fallback_text = _strip_fences(_openai_text())
                    try:
                        parsed = json.loads(fallback_text) if fallback_text else {}
                    except Exception:
                        parsed = {}
                    result = _normalise(
                        parsed,
                        requested="vertex-ai",
                        effective="openai",
                        fallback_reason=fallback_reason,
                        raw_text=fallback_text,
                    )
                except Exception as exc:
                    result = _normalise(
                        {},
                        requested="vertex-ai",
                        effective="openai",
                        fallback_reason=fallback_reason,
                        provider_error=f"openai fallback failed: {type(exc).__name__}: {exc}",
                    )
    next:
      spec: { mode: exclusive }
      arcs:
        - step: log_classification

  - step: log_classification
    desc: Audit the classification
    tool:
      kind: postgres
      auth: "{{ workload.pg_auth }}"
      query: |
        INSERT INTO travel_agent_events (execution_id, event_type, ai_provider, intent, payload)
        VALUES (
          '{{ execution_id }}',
          'classify_intent',
          '{{ classify_intent.effective_provider | default(workload.ai_provider) }}',
          '{{ classify_intent.intent }}',
          '{{ classify_intent.json_str | default("{}") | replace("'", "''") }}'::jsonb
        );
    next:
      spec: { mode: exclusive }
      arcs:
        - step: duffel_via_mcp_flights
          when: "{{ classify_intent.intent == 'flights' and (workload.flight_provider | default('duffel')) == 'duffel' }}"
        - step: amadeus_via_mcp_flights
          when: "{{ classify_intent.intent == 'flights' and (workload.flight_provider | default('duffel')) == 'amadeus' }}"
        - step: amadeus_via_mcp_locations
          when: "{{ classify_intent.intent == 'locations' }}"
        - step: amadeus_via_mcp_hotels
          when: "{{ classify_intent.intent == 'hotels' }}"
        - step: amadeus_via_mcp_activities
          when: "{{ classify_intent.intent == 'activities' }}"
        - step: render_help
          when: "{{ classify_intent.intent == 'help' }}"

  # ---------------------------------------------------------------------
  # 4a. Flights branch.
  #
  # Duffel is the default flight provider. Amadeus remains available as an
  # explicit opt-out with `flight_provider: amadeus`.
  # ---------------------------------------------------------------------
  - step: duffel_via_mcp_flights
    desc: Call Duffel MCP search_offers via a NoETL agent hop
    tool:
      kind: agent
      framework: noetl
      entrypoint: automation/agents/mcp/duffel
      payload:
        method: tools/call
        tool: search_offers
        duffel_env: "{{ workload.duffel_env | default('test') }}"
        arguments:
          origin: "{{ classify_intent.origin | default('SFO') }}"
          destination: "{{ classify_intent.destination | default('JFK') }}"
          departure_date: "{{ classify_intent.departureDate | default('2026-07-15') }}"
          adults: "{{ classify_intent.adults | default(1) }}"
          cabin_class: economy
    next:
      spec: { mode: exclusive }
      arcs:
        - step: render_flights
          when: "{{ duffel_via_mcp_flights.data.ok == true }}"
        - step: render_amadeus_failure
          when: "{{ True }}"

  - step: amadeus_via_mcp_flights
    desc: Call Amadeus MCP search_flights via a NoETL agent hop
    tool:
      kind: agent
      framework: noetl
      entrypoint: automation/agents/mcp/amadeus
      payload:
        method: tools/call
        tool: search_flights
        arguments:
          origin: "{{ classify_intent.origin | default('SFO') }}"
          destination: "{{ classify_intent.destination | default('JFK') }}"
          departureDate: "{{ classify_intent.departureDate | default('2026-07-15') }}"
          adults: "{{ classify_intent.adults | default(1) }}"
    next:
      spec: { mode: exclusive }
      arcs:
        - step: render_flights
          when: "{{ amadeus_via_mcp_flights.data.ok == true }}"
        - step: render_amadeus_failure
          when: "{{ True }}"

  - step: render_flights
    desc: Project flights into a widget tree
    tool:
      kind: python
      input:
        envelope: "{{ duffel_via_mcp_flights | default(amadeus_via_mcp_flights | default({})) }}"
        classification: "{{ classify_intent }}"
        query: "{{ workload.query }}"
        execution_id: "{{ execution_id }}"
        provider: "{{ classify_intent.effective_provider | default(workload.ai_provider) }}"
        flight_provider: "{{ workload.flight_provider | default('duffel') }}"
        pg_auth: "{{ workload.pg_auth }}"
      code: |
        import json

        # The Amadeus MCP playbook returns an MCP-shaped envelope.
        # Agent executor versions may expose the sub-playbook result
        # directly or nested under data, so normalize both shapes.
        mcp = envelope.get("data") if isinstance(envelope, dict) and isinstance(envelope.get("data"), dict) and "offers" not in envelope else envelope
        if not isinstance(mcp, dict):
            mcp = {}
        data = mcp.get("data") if isinstance(mcp.get("data"), dict) else mcp
        offers = data.get("offers") if isinstance(data, dict) else None
        if not isinstance(offers, list):
            offers = []
        effective_flight_provider = (data.get("source") if isinstance(data, dict) else None) or flight_provider or "duffel"

        def _seg(o):
            its = o.get("itineraries") or []
            segs = (its[0] or {}).get("segments") or [] if its else []
            first = segs[0] if segs else {}
            last = segs[-1] if segs else {}
            return {
                "carrier": first.get("carrierCode") or "?",
                "flight": (first.get("number") or first.get("flightNumber") or ""),
                "departure": (first.get("departure") or {}).get("at") or "?",
                "arrival": (last.get("arrival") or {}).get("at") or "?",
                "duration": (its[0] or {}).get("duration") if its else "?",
                "stops": max(0, len(segs) - 1),
            }

        def _offer_card(o):
            seg = _seg(o)
            price = (o.get("price") or {}).get("total") or "?"
            currency = (o.get("price") or {}).get("currency") or "USD"
            data_rows = [
                ["Carrier", f"{seg['carrier']} {seg['flight']}".strip()],
                ["Departure", seg["departure"]],
                ["Arrival", seg["arrival"]],
                ["Duration", seg["duration"]],
                ["Stops", str(seg["stops"])],
                ["Price", f"{price} {currency}"],
            ]
            return {
                "type": "app:column",
                "args": {
                    "gap": 6,
                    "children": [
                        {
                            "type": "app:title",
                            "args": {"text": f"{seg['carrier']} {seg['flight']} · {price} {currency}", "size": 16, "boldness": 600},
                        },
                        {
                            "type": "app:grouped_table",
                            "args": {"groups": [{"title": "Itinerary", "data": data_rows}]},
                        },
                    ],
                },
            }

        globals().update({
            "_seg": _seg,
            "_offer_card": _offer_card,
        })

        refine_form = {
            "type": "app:form",
            "args": {
                "fields": [
                    {"id": "origin", "title": "Origin (IATA)", "default_value": classification.get("origin") or "SFO"},
                    {"id": "destination", "title": "Destination (IATA)", "default_value": classification.get("destination") or "JFK"},
                    {"id": "departureDate", "title": "Departure date", "default_value": classification.get("departureDate") or "2026-07-15"},
                    {"id": "adults", "title": "Adults", "default_value": str(classification.get("adults") or 1)},
                ],
                "buttons": [
                    {
                        "text": "Refine search",
                        "colorType": "primary",
                        "event": {
                            "key": "command",
                            "value": "travel flights from {origin} to {destination} on {departureDate} for {adults} adults",
                        },
                    }
                ],
            },
        }

        if not offers:
            render = {
                "type": "app:column",
                "args": {
                    "gap": 8,
                    "children": [
                        {"type": "app:title", "args": {"text": "Travel agent · flights", "size": 18, "boldness": 700}},
                        {"type": "app:text", "args": {"title": "Query", "message": query}},
                        {"type": "app:statusbar", "args": {"text": f"effective_provider={provider}", "styleKey": "info"}},
                        {"type": "app:alert", "args": {"variant": "warning", "message": f"No flights matched {classification.get('origin') or '?'} → {classification.get('destination') or '?'} on {classification.get('departureDate') or '?'}."}},
                    ],
                },
            }
        else:
            cards = [_offer_card(o) for o in offers[:6]]
            render = {
                "type": "app:column",
                "args": {
                    "gap": 8,
                    "children": [
                        {"type": "app:title", "args": {"text": f"Travel agent · {len(offers)} flight{'s' if len(offers) != 1 else ''}", "size": 18, "boldness": 700}},
                        {"type": "app:text", "args": {"title": "Query", "message": query}},
                        {
                            "type": "app:row",
                            "args": {"gap": 8, "children": [
                                {"type": "app:statusbar", "args": {"text": f"intent=flights", "styleKey": "success"}},
                                {"type": "app:statusbar", "args": {"text": f"effective_provider={provider}", "styleKey": "info"}},
                                {"type": "app:statusbar", "args": {"text": f"flight_provider={effective_flight_provider}", "styleKey": "info"}},
                                {"type": "app:statusbar", "args": {"text": f"{classification.get('origin') or '?'} → {classification.get('destination') or '?'}", "styleKey": "info"}},
                                {"type": "app:statusbar", "args": {"text": classification.get("departureDate") or "?", "styleKey": "info"}},
                            ]},
                        },
                        {
                            "type": "app:carousel",
                            "args": {"carouselHeight": 320, "widgets": cards},
                        },
                        {
                            "type": "app:row",
                            "args": {"gap": 8, "children": [
                                {"type": "app:button", "args": {"text": "rerun this search", "variant": "outlined", "event": {"key": "command", "value": f"rerun {execution_id}"}}},
                                {"type": "app:button", "args": {"text": "open execution detail", "variant": "outlined", "event": {"key": "navigate", "value": f"/execution/{execution_id}"}}},
                            ]},
                        },
                    ],
                },
            }

        render["args"]["children"].append(refine_form)

        result = {
            "intent": "flights",
            "offers_total": len(offers),
            "requested_provider": classification.get("requested_provider"),
            "effective_provider": provider,
            "requested_flight_provider": flight_provider,
            "effective_flight_provider": effective_flight_provider,
            "provider_fallback_reason": classification.get("provider_fallback_reason"),
            "summary": f"{len(offers)} flight offer(s) returned",
            "text": f"{len(offers)} flight offer(s) returned for {classification.get('origin') or '?'} → {classification.get('destination') or '?'}",
            "render": render,
        }

        def _audit_pg_conn_info(pg_auth_name):
            from noetl.worker.secrets import fetch_credential_by_key as _audit_fetch_credential
            _credential = _audit_fetch_credential(str(pg_auth_name or "pg_k8s"))
            _data = _credential.get("data") if isinstance(_credential, dict) and isinstance(_credential.get("data"), dict) else _credential
            if not isinstance(_data, dict):
                raise RuntimeError("postgres credential missing")
            _dsn = _data.get("dsn") or _data.get("connection_string") or _data.get("db_conn_string")
            if _dsn:
                return _dsn
            return {
                "host": _data.get("db_host") or _data.get("host") or _data.get("pg_host"),
                "port": int(_data.get("db_port") or _data.get("port") or 5432),
                "dbname": _data.get("db_name") or _data.get("database") or _data.get("dbname"),
                "user": _data.get("db_user") or _data.get("user") or _data.get("username"),
                "password": _data.get("db_password") or _data.get("password"),
            }

        try:
            import psycopg as _audit_psycopg
            _audit_payload = {
                "render_kind": "flights",
                "render_type": render.get("type"),
                "envelope_status_code": data.get("status_code") if isinstance(data, dict) else None,
                "envelope_ok": bool(data.get("ok")) if isinstance(data, dict) else False,
                "envelope_total": len(offers),
                "flight_provider": effective_flight_provider,
                "provider_fallback_reason": classification.get("provider_fallback_reason"),
                "classified_intent": classification,
            }
            _conn_info = _audit_pg_conn_info(pg_auth)
            _conn = _audit_psycopg.connect(_conn_info, connect_timeout=5) if isinstance(_conn_info, str) else _audit_psycopg.connect(**_conn_info, connect_timeout=5)
            try:
                with _conn.cursor() as _cur:
                    _cur.execute(
                        "INSERT INTO travel_agent_events (execution_id, event_type, ai_provider, intent, payload) "
                        "VALUES (%s, %s, %s, %s, %s::jsonb)",
                        (
                            execution_id,
                            "render_flights",
                            classification.get("effective_provider"),
                            classification.get("intent"),
                            json.dumps(_audit_payload, separators=(",", ":"), default=str),
                        ),
                    )
                    _conn.commit()
            finally:
                _conn.close()
        except Exception as _audit_exc:
            print(f"travel_agent_events audit insert failed: {type(_audit_exc).__name__}: {_audit_exc}")
    # Workflow tail — see comment block before the render_* steps.

  # ---------------------------------------------------------------------
  # 4b. Locations branch — IATA / city lookup via MCP.
  # ---------------------------------------------------------------------
  - step: amadeus_via_mcp_locations
    desc: Call Amadeus MCP search_locations via a NoETL agent hop
    tool:
      kind: agent
      framework: noetl
      entrypoint: automation/agents/mcp/amadeus
      payload:
        method: tools/call
        tool: search_locations
        arguments:
          keyword: "{{ classify_intent.keyword | default(classify_intent.city) | default(classify_intent.origin) | default(workload.query) }}"
          subType: AIRPORT,CITY
    next:
      spec: { mode: exclusive }
      arcs:
        - step: enrich_google_places_locations
          when: "{{ workload.enrich_with_google_places == true and amadeus_via_mcp_locations.data.ok | default(false) }}"
        - step: render_locations
          when: "{{ amadeus_via_mcp_locations.data.ok | default(false) }}"
        - step: render_amadeus_failure
          when: "{{ True }}"

  - step: enrich_google_places_locations
    desc: Best-effort Google Places enrichment for Amadeus locations
    tool:
      kind: agent
      framework: noetl
      entrypoint: automation/agents/mcp/google-places
      payload:
        method: tools/call
        tool: search_text
        arguments:
          intent: locations
          query: "{{ workload.query }}"
          max_enrichments: 10
          items: "{{ amadeus_via_mcp_locations.data.data.items | default(amadeus_via_mcp_locations.data.items) | default([]) }}"
    next:
      spec: { mode: exclusive }
      arcs:
        - step: render_locations
          when: "{{ True }}"

  - step: render_locations
    desc: Project locations into a widget tree
    tool:
      kind: python
      input:
        envelope: "{{ enrich_google_places_locations | default(amadeus_via_mcp_locations) }}"
        classification: "{{ classify_intent }}"
        query: "{{ workload.query }}"
        execution_id: "{{ execution_id }}"
        provider: "{{ classify_intent.effective_provider | default(workload.ai_provider) }}"
        pg_auth: "{{ workload.pg_auth }}"
      code: |
        import json
        mcp = envelope.get("data") if isinstance(envelope, dict) and isinstance(envelope.get("data"), dict) and "items" not in envelope else envelope
        if not isinstance(mcp, dict):
            mcp = {}
        data = mcp.get("data") if isinstance(mcp.get("data"), dict) else mcp
        items = data.get("items") if isinstance(data, dict) else None
        if not isinstance(items, list):
            items = []

        rows = []
        for it in items[:25]:
            google = it.get("_google") if isinstance(it.get("_google"), dict) else {}
            rows.append({
                "id": it.get("id") or it.get("iataCode") or "?",
                "name": it.get("name") or "?",
                "iataCode": it.get("iataCode") or "?",
                "subType": it.get("subType") or "?",
                "cityName": (it.get("address") or {}).get("cityName") or "",
                "countryName": (it.get("address") or {}).get("countryName") or "",
                "rating": google.get("rating") or "",
                "reviews": google.get("user_rating_count") or "",
                "googleAddress": google.get("address") or "",
            })
        enriched_count = sum(1 for it in items if isinstance(it, dict) and isinstance(it.get("_google"), dict))
        first_google = next((it.get("_google") for it in items if isinstance(it, dict) and isinstance(it.get("_google"), dict) and it.get("_google", {}).get("image_url")), {})

        refine_form = {
            "type": "app:form",
            "args": {
                "fields": [
                    {"id": "keyword", "title": "Keyword", "default_value": classification.get("keyword") or classification.get("city") or "Boston"},
                ],
                "buttons": [
                    {
                        "text": "Refine search",
                        "colorType": "primary",
                        "event": {"key": "command", "value": "travel locations near {keyword}"},
                    }
                ],
            },
        }

        render = {
            "type": "app:column",
            "args": {
                "gap": 8,
                "children": [
                    {"type": "app:title", "args": {"text": f"Travel agent · {len(items)} location{'s' if len(items) != 1 else ''}", "size": 18, "boldness": 700}},
                    {"type": "app:text", "args": {"title": "Query", "message": query}},
                    {"type": "app:row", "args": {"gap": 8, "children": [
                        {"type": "app:statusbar", "args": {"text": "intent=locations", "styleKey": "success"}},
                        {"type": "app:statusbar", "args": {"text": f"effective_provider={provider}", "styleKey": "info"}},
                        {"type": "app:statusbar", "args": {"text": f"keyword={classification.get('keyword') or query}", "styleKey": "info"}},
                        {"type": "app:statusbar", "args": {"text": f"google_enriched={enriched_count}", "styleKey": "info" if enriched_count else "default"}},
                    ]}},
                    *([{"type": "app:picture", "args": {"imageUrl": first_google.get("image_url"), "altText": first_google.get("name") or "Google Places image", "maxWidth": 420, "maxHeight": 260}}] if first_google else []),
                    {"type": "app:recordtable", "args": {
                        "columns": [
                            {"title": "Code", "dataIndex": "iataCode", "sorter": True},
                            {"title": "Name", "dataIndex": "name", "sorter": True, "filter": True},
                            {"title": "Type", "dataIndex": "subType", "sorter": True},
                            {"title": "Rating", "dataIndex": "rating", "sorter": True},
                            {"title": "Reviews", "dataIndex": "reviews", "sorter": True},
                            {"title": "City", "dataIndex": "cityName", "sorter": True},
                            {"title": "Country", "dataIndex": "countryName", "sorter": True},
                            {"title": "Google address", "dataIndex": "googleAddress"},
                        ],
                        "data": rows,
                        "pageSize": 12,
                    }},
                ],
            },
        }
        render["args"]["children"].append(refine_form)

        result = {
            "intent": "locations",
            "items_total": len(items),
            "google_enriched_count": enriched_count,
            "requested_provider": classification.get("requested_provider"),
            "effective_provider": provider,
            "provider_fallback_reason": classification.get("provider_fallback_reason"),
            "summary": f"{len(items)} location(s) found",
            "text": f"{len(items)} location(s) returned",
            "render": render,
        }

        def _audit_pg_conn_info(pg_auth_name):
            from noetl.worker.secrets import fetch_credential_by_key as _audit_fetch_credential
            _credential = _audit_fetch_credential(str(pg_auth_name or "pg_k8s"))
            _data = _credential.get("data") if isinstance(_credential, dict) and isinstance(_credential.get("data"), dict) else _credential
            if not isinstance(_data, dict):
                raise RuntimeError("postgres credential missing")
            _dsn = _data.get("dsn") or _data.get("connection_string") or _data.get("db_conn_string")
            if _dsn:
                return _dsn
            return {
                "host": _data.get("db_host") or _data.get("host") or _data.get("pg_host"),
                "port": int(_data.get("db_port") or _data.get("port") or 5432),
                "dbname": _data.get("db_name") or _data.get("database") or _data.get("dbname"),
                "user": _data.get("db_user") or _data.get("user") or _data.get("username"),
                "password": _data.get("db_password") or _data.get("password"),
            }

        try:
            import psycopg as _audit_psycopg
            _audit_payload = {
                "render_kind": "locations",
                "render_type": render.get("type"),
                "envelope_status_code": data.get("status_code") if isinstance(data, dict) else None,
                "envelope_ok": bool(data.get("ok")) if isinstance(data, dict) else False,
                "envelope_total": len(items),
                "provider_fallback_reason": classification.get("provider_fallback_reason"),
                "classified_intent": classification,
            }
            _conn_info = _audit_pg_conn_info(pg_auth)
            _conn = _audit_psycopg.connect(_conn_info, connect_timeout=5) if isinstance(_conn_info, str) else _audit_psycopg.connect(**_conn_info, connect_timeout=5)
            try:
                with _conn.cursor() as _cur:
                    _cur.execute(
                        "INSERT INTO travel_agent_events (execution_id, event_type, ai_provider, intent, payload) "
                        "VALUES (%s, %s, %s, %s, %s::jsonb)",
                        (
                            execution_id,
                            "render_locations",
                            classification.get("effective_provider"),
                            classification.get("intent"),
                            json.dumps(_audit_payload, separators=(",", ":"), default=str),
                        ),
                    )
                    _conn.commit()
            finally:
                _conn.close()
        except Exception as _audit_exc:
            print(f"travel_agent_events audit insert failed: {type(_audit_exc).__name__}: {_audit_exc}")
    # Workflow tail — see comment block before the render_* steps.

  # ---------------------------------------------------------------------
  # 4c. Hotels branch — hotel lookup via MCP.
  # ---------------------------------------------------------------------
  - step: amadeus_via_mcp_hotels
    desc: Call Amadeus MCP search_hotels via a NoETL agent hop
    tool:
      kind: agent
      framework: noetl
      entrypoint: automation/agents/mcp/amadeus
      payload:
        method: tools/call
        tool: search_hotels
        arguments:
          cityCode: "{{ classify_intent.cityCode or 'NYC' }}"
          checkInDate: "{{ classify_intent.departureDate or '2026-07-15' }}"
          checkOutDate: "{{ classify_intent.departureDate or '2026-07-15' }}"
    next:
      spec: { mode: exclusive }
      arcs:
        - step: enrich_google_places_hotels
          when: "{{ workload.enrich_with_google_places == true and amadeus_via_mcp_hotels.data.ok | default(false) }}"
        - step: render_hotels
          when: "{{ amadeus_via_mcp_hotels.data.ok | default(false) }}"
        - step: render_amadeus_failure
          when: "{{ True }}"

  - step: enrich_google_places_hotels
    desc: Best-effort Google Places enrichment for Amadeus hotels
    tool:
      kind: agent
      framework: noetl
      entrypoint: automation/agents/mcp/google-places
      payload:
        method: tools/call
        tool: search_text
        arguments:
          intent: hotels
          query: "{{ workload.query }}"
          max_enrichments: 10
          items: "{{ amadeus_via_mcp_hotels.data.data.items | default(amadeus_via_mcp_hotels.data.items) | default([]) }}"
    next:
      spec: { mode: exclusive }
      arcs:
        - step: render_hotels
          when: "{{ True }}"

  - step: render_hotels
    desc: Project hotels into a widget tree
    tool:
      kind: python
      input:
        envelope: "{{ enrich_google_places_hotels | default(amadeus_via_mcp_hotels) }}"
        classification: "{{ classify_intent }}"
        query: "{{ workload.query }}"
        execution_id: "{{ execution_id }}"
        provider: "{{ classify_intent.effective_provider | default(workload.ai_provider) }}"
        pg_auth: "{{ workload.pg_auth }}"
      code: |
        import json

        mcp = envelope.get("data") if isinstance(envelope, dict) and isinstance(envelope.get("data"), dict) and "items" not in envelope else envelope
        if not isinstance(mcp, dict):
            mcp = {}
        data = mcp.get("data") if isinstance(mcp.get("data"), dict) else mcp
        items = data.get("items") if isinstance(data, dict) else None
        if not isinstance(items, list):
            items = []

        def _geo_text(value):
            if isinstance(value, dict):
                lat = value.get("latitude")
                lng = value.get("longitude")
                if lat is not None and lng is not None:
                    return f"{lat}, {lng}"
                return json.dumps(value, separators=(",", ":"))[:120]
            return value or ""

        rows = []
        for it in items[:25]:
            google = it.get("_google") if isinstance(it.get("_google"), dict) else {}
            rows.append({
                "id": it.get("hotelId") or it.get("id") or it.get("name") or "?",
                "name": it.get("name") or "?",
                "chainCode": it.get("chainCode") or "",
                "iataCode": it.get("iataCode") or classification.get("cityCode") or "",
                "geoCode": _geo_text(it.get("geoCode")),
                "rating": google.get("rating") or "",
                "reviews": google.get("user_rating_count") or "",
                "googleAddress": google.get("address") or "",
            })
        enriched_count = sum(1 for it in items if isinstance(it, dict) and isinstance(it.get("_google"), dict))
        first_google = next((it.get("_google") for it in items if isinstance(it, dict) and isinstance(it.get("_google"), dict) and it.get("_google", {}).get("image_url")), {})

        city_code = classification.get("cityCode") or "NYC"
        refine_form = {
            "type": "app:form",
            "args": {
                "fields": [
                    {"id": "cityCode", "title": "City (IATA)", "default_value": city_code},
                    {"id": "departureDate", "title": "Check-in date", "default_value": classification.get("departureDate") or "2026-08-15"},
                ],
                "buttons": [
                    {
                        "text": "Refine search",
                        "colorType": "primary",
                        "event": {"key": "command", "value": "travel hotels in {cityCode} on {departureDate}"},
                    }
                ],
            },
        }
        render = {
            "type": "app:column",
            "args": {
                "gap": 8,
                "children": [
                    {"type": "app:title", "args": {"text": f"Travel agent · {len(items)} hotel{'s' if len(items) != 1 else ''} in {city_code}", "size": 18, "boldness": 700}},
                    {"type": "app:text", "args": {"title": "Query", "message": query}},
                    {"type": "app:row", "args": {"gap": 8, "children": [
                        {"type": "app:statusbar", "args": {"text": "intent=hotels", "styleKey": "success"}},
                        {"type": "app:statusbar", "args": {"text": f"effective_provider={provider}", "styleKey": "info"}},
                        {"type": "app:statusbar", "args": {"text": f"cityCode={city_code}", "styleKey": "info"}},
                        {"type": "app:statusbar", "args": {"text": f"google_enriched={enriched_count}", "styleKey": "info" if enriched_count else "default"}},
                    ]}},
                    *([{"type": "app:picture", "args": {"imageUrl": first_google.get("image_url"), "altText": first_google.get("name") or "Google Places hotel image", "maxWidth": 420, "maxHeight": 260}}] if first_google else []),
                    {"type": "app:recordtable", "args": {
                        "columns": [
                            {"title": "Name", "dataIndex": "name", "sorter": True, "filter": True},
                            {"title": "Chain", "dataIndex": "chainCode", "sorter": True},
                            {"title": "City", "dataIndex": "iataCode", "sorter": True},
                            {"title": "Rating", "dataIndex": "rating", "sorter": True},
                            {"title": "Reviews", "dataIndex": "reviews", "sorter": True},
                            {"title": "Geo", "dataIndex": "geoCode"},
                            {"title": "Google address", "dataIndex": "googleAddress"},
                        ],
                        "data": rows,
                        "pageSize": 12,
                    }},
                    {"type": "app:row", "args": {"gap": 8, "children": [
                        {"type": "app:button", "args": {"text": "rerun this search", "variant": "outlined", "event": {"key": "command", "value": f"rerun {execution_id}"}}},
                        {"type": "app:button", "args": {"text": "open execution detail", "variant": "outlined", "event": {"key": "navigate", "value": f"/execution/{execution_id}"}}},
                    ]}},
                ],
            },
        }
        render["args"]["children"].append(refine_form)

        result = {
            "intent": "hotels",
            "items_total": len(items),
            "google_enriched_count": enriched_count,
            "cityCode": city_code,
            "requested_provider": classification.get("requested_provider"),
            "effective_provider": provider,
            "provider_fallback_reason": classification.get("provider_fallback_reason"),
            "summary": f"{len(items)} hotel(s) found in {city_code}",
            "text": f"{len(items)} hotel(s) returned for {city_code}",
            "render": render,
        }

        def _audit_pg_conn_info(pg_auth_name):
            from noetl.worker.secrets import fetch_credential_by_key as _audit_fetch_credential
            _credential = _audit_fetch_credential(str(pg_auth_name or "pg_k8s"))
            _data = _credential.get("data") if isinstance(_credential, dict) and isinstance(_credential.get("data"), dict) else _credential
            if not isinstance(_data, dict):
                raise RuntimeError("postgres credential missing")
            _dsn = _data.get("dsn") or _data.get("connection_string") or _data.get("db_conn_string")
            if _dsn:
                return _dsn
            return {
                "host": _data.get("db_host") or _data.get("host") or _data.get("pg_host"),
                "port": int(_data.get("db_port") or _data.get("port") or 5432),
                "dbname": _data.get("db_name") or _data.get("database") or _data.get("dbname"),
                "user": _data.get("db_user") or _data.get("user") or _data.get("username"),
                "password": _data.get("db_password") or _data.get("password"),
            }

        try:
            import psycopg as _audit_psycopg
            _audit_payload = {
                "render_kind": "hotels",
                "render_type": render.get("type"),
                "envelope_status_code": data.get("status_code") if isinstance(data, dict) else None,
                "envelope_ok": bool(data.get("ok")) if isinstance(data, dict) else False,
                "envelope_total": len(items),
                "provider_fallback_reason": classification.get("provider_fallback_reason"),
                "classified_intent": classification,
            }
            _conn_info = _audit_pg_conn_info(pg_auth)
            _conn = _audit_psycopg.connect(_conn_info, connect_timeout=5) if isinstance(_conn_info, str) else _audit_psycopg.connect(**_conn_info, connect_timeout=5)
            try:
                with _conn.cursor() as _cur:
                    _cur.execute(
                        "INSERT INTO travel_agent_events (execution_id, event_type, ai_provider, intent, payload) "
                        "VALUES (%s, %s, %s, %s, %s::jsonb)",
                        (
                            execution_id,
                            "render_hotels",
                            classification.get("effective_provider"),
                            classification.get("intent"),
                            json.dumps(_audit_payload, separators=(",", ":"), default=str),
                        ),
                    )
                    _conn.commit()
            finally:
                _conn.close()
        except Exception as _audit_exc:
            print(f"travel_agent_events audit insert failed: {type(_audit_exc).__name__}: {_audit_exc}")
    # Workflow tail — see comment block before the render_* steps.

  # ---------------------------------------------------------------------
  # 4d. Activities branch — tours and activities lookup via MCP.
  # ---------------------------------------------------------------------
  - step: amadeus_via_mcp_activities
    desc: Call Amadeus MCP search_activities via a NoETL agent hop
    tool:
      kind: agent
      framework: noetl
      entrypoint: automation/agents/mcp/amadeus
      payload:
        method: tools/call
        tool: search_activities
        arguments:
          latitude: "{{ classify_intent.latitude or 40.7128 }}"
          longitude: "{{ classify_intent.longitude or -74.0060 }}"
          radius: 5
    next:
      spec: { mode: exclusive }
      arcs:
        - step: enrich_google_places_activities
          when: "{{ workload.enrich_with_google_places == true and amadeus_via_mcp_activities.data.ok | default(false) }}"
        - step: render_activities
          when: "{{ amadeus_via_mcp_activities.data.ok | default(false) }}"
        - step: render_amadeus_failure
          when: "{{ True }}"

  - step: enrich_google_places_activities
    desc: Best-effort Google Places enrichment for Amadeus activities
    tool:
      kind: agent
      framework: noetl
      entrypoint: automation/agents/mcp/google-places
      payload:
        method: tools/call
        tool: search_text
        arguments:
          intent: activities
          query: "{{ workload.query }}"
          max_enrichments: 10
          items: "{{ amadeus_via_mcp_activities.data.data.items | default(amadeus_via_mcp_activities.data.items) | default([]) }}"
    next:
      spec: { mode: exclusive }
      arcs:
        - step: render_activities
          when: "{{ True }}"

  - step: render_activities
    desc: Project activities into a widget tree
    tool:
      kind: python
      input:
        envelope: "{{ enrich_google_places_activities | default(amadeus_via_mcp_activities) }}"
        classification: "{{ classify_intent }}"
        query: "{{ workload.query }}"
        execution_id: "{{ execution_id }}"
        provider: "{{ classify_intent.effective_provider | default(workload.ai_provider) }}"
        pg_auth: "{{ workload.pg_auth }}"
      code: |
        import json

        mcp = envelope.get("data") if isinstance(envelope, dict) and isinstance(envelope.get("data"), dict) and "items" not in envelope else envelope
        if not isinstance(mcp, dict):
            mcp = {}
        data = mcp.get("data") if isinstance(mcp.get("data"), dict) else mcp
        items = data.get("items") if isinstance(data, dict) else None
        if not isinstance(items, list):
            items = []

        def _geo_text(value):
            if isinstance(value, dict):
                lat = value.get("latitude")
                lng = value.get("longitude")
                if lat is not None and lng is not None:
                    return f"{lat}, {lng}"
                return json.dumps(value, separators=(",", ":"))[:120]
            return value or ""

        def _price_text(value):
            if isinstance(value, dict):
                amount = value.get("amount") or value.get("total")
                currency = value.get("currencyCode") or value.get("currency")
                if amount and currency:
                    return f"{amount} {currency}"
                return json.dumps(value, separators=(",", ":"))[:120]
            return value or ""

        rows = []
        for it in items[:25]:
            google = it.get("_google") if isinstance(it.get("_google"), dict) else {}
            rows.append({
                "id": it.get("id") or it.get("name") or "?",
                "name": it.get("name") or "?",
                "type": it.get("type") or it.get("category") or "",
                "geoCode": _geo_text(it.get("geoCode")),
                "price": _price_text(it.get("price")),
                "rating": google.get("rating") or "",
                "reviews": google.get("user_rating_count") or "",
                "openNow": google.get("open_now") if google.get("open_now") is not None else "",
            })
        enriched_count = sum(1 for it in items if isinstance(it, dict) and isinstance(it.get("_google"), dict))
        first_google = next((it.get("_google") for it in items if isinstance(it, dict) and isinstance(it.get("_google"), dict) and it.get("_google", {}).get("image_url")), {})

        lat = classification.get("latitude") if classification.get("latitude") is not None else 40.7128
        lng = classification.get("longitude") if classification.get("longitude") is not None else -74.0060
        keyword = classification.get("keyword") or classification.get("city") or "Times Square"
        refine_form = {
            "type": "app:form",
            "args": {
                "fields": [
                    {"id": "keyword", "title": "Place or landmark", "default_value": keyword},
                ],
                "buttons": [
                    {
                        "text": "Refine search",
                        "colorType": "primary",
                        "event": {"key": "command", "value": "travel activities near {keyword}"},
                    }
                ],
            },
        }
        render = {
            "type": "app:column",
            "args": {
                "gap": 8,
                "children": [
                    {"type": "app:title", "args": {"text": f"Travel agent · {len(items)} activit{'ies' if len(items) != 1 else 'y'} near ({lat}, {lng})", "size": 18, "boldness": 700}},
                    {"type": "app:text", "args": {"title": "Query", "message": query}},
                    {"type": "app:row", "args": {"gap": 8, "children": [
                        {"type": "app:statusbar", "args": {"text": "intent=activities", "styleKey": "success"}},
                        {"type": "app:statusbar", "args": {"text": f"effective_provider={provider}", "styleKey": "info"}},
                        {"type": "app:statusbar", "args": {"text": f"lat={lat}", "styleKey": "info"}},
                        {"type": "app:statusbar", "args": {"text": f"lng={lng}", "styleKey": "info"}},
                        {"type": "app:statusbar", "args": {"text": f"google_enriched={enriched_count}", "styleKey": "info" if enriched_count else "default"}},
                    ]}},
                    *([{"type": "app:picture", "args": {"imageUrl": first_google.get("image_url"), "altText": first_google.get("name") or "Google Places activity image", "maxWidth": 420, "maxHeight": 260}}] if first_google else []),
                    {"type": "app:recordtable", "args": {
                        "columns": [
                            {"title": "Name", "dataIndex": "name", "sorter": True, "filter": True},
                            {"title": "Type", "dataIndex": "type", "sorter": True},
                            {"title": "Rating", "dataIndex": "rating", "sorter": True},
                            {"title": "Reviews", "dataIndex": "reviews", "sorter": True},
                            {"title": "Open now", "dataIndex": "openNow"},
                            {"title": "Geo", "dataIndex": "geoCode"},
                            {"title": "Price", "dataIndex": "price", "sorter": True},
                        ],
                        "data": rows,
                        "pageSize": 12,
                    }},
                    {"type": "app:row", "args": {"gap": 8, "children": [
                        {"type": "app:button", "args": {"text": "rerun this search", "variant": "outlined", "event": {"key": "command", "value": f"rerun {execution_id}"}}},
                        {"type": "app:button", "args": {"text": "open execution detail", "variant": "outlined", "event": {"key": "navigate", "value": f"/execution/{execution_id}"}}},
                    ]}},
                ],
            },
        }
        render["args"]["children"].append(refine_form)

        result = {
            "intent": "activities",
            "items_total": len(items),
            "google_enriched_count": enriched_count,
            "latitude": lat,
            "longitude": lng,
            "requested_provider": classification.get("requested_provider"),
            "effective_provider": provider,
            "provider_fallback_reason": classification.get("provider_fallback_reason"),
            "summary": f"{len(items)} activit{'ies' if len(items) != 1 else 'y'} found near ({lat}, {lng})",
            "text": f"{len(items)} activit{'ies' if len(items) != 1 else 'y'} returned near ({lat}, {lng})",
            "render": render,
        }

        def _audit_pg_conn_info(pg_auth_name):
            from noetl.worker.secrets import fetch_credential_by_key as _audit_fetch_credential
            _credential = _audit_fetch_credential(str(pg_auth_name or "pg_k8s"))
            _data = _credential.get("data") if isinstance(_credential, dict) and isinstance(_credential.get("data"), dict) else _credential
            if not isinstance(_data, dict):
                raise RuntimeError("postgres credential missing")
            _dsn = _data.get("dsn") or _data.get("connection_string") or _data.get("db_conn_string")
            if _dsn:
                return _dsn
            return {
                "host": _data.get("db_host") or _data.get("host") or _data.get("pg_host"),
                "port": int(_data.get("db_port") or _data.get("port") or 5432),
                "dbname": _data.get("db_name") or _data.get("database") or _data.get("dbname"),
                "user": _data.get("db_user") or _data.get("user") or _data.get("username"),
                "password": _data.get("db_password") or _data.get("password"),
            }

        try:
            import psycopg as _audit_psycopg
            _audit_payload = {
                "render_kind": "activities",
                "render_type": render.get("type"),
                "envelope_status_code": data.get("status_code") if isinstance(data, dict) else None,
                "envelope_ok": bool(data.get("ok")) if isinstance(data, dict) else False,
                "envelope_total": len(items),
                "provider_fallback_reason": classification.get("provider_fallback_reason"),
                "classified_intent": classification,
            }
            _conn_info = _audit_pg_conn_info(pg_auth)
            _conn = _audit_psycopg.connect(_conn_info, connect_timeout=5) if isinstance(_conn_info, str) else _audit_psycopg.connect(**_conn_info, connect_timeout=5)
            try:
                with _conn.cursor() as _cur:
                    _cur.execute(
                        "INSERT INTO travel_agent_events (execution_id, event_type, ai_provider, intent, payload) "
                        "VALUES (%s, %s, %s, %s, %s::jsonb)",
                        (
                            execution_id,
                            "render_activities",
                            classification.get("effective_provider"),
                            classification.get("intent"),
                            json.dumps(_audit_payload, separators=(",", ":"), default=str),
                        ),
                    )
                    _conn.commit()
            finally:
                _conn.close()
        except Exception as _audit_exc:
            print(f"travel_agent_events audit insert failed: {type(_audit_exc).__name__}: {_audit_exc}")
    # Workflow tail — see comment block before the render_* steps.

  # ---------------------------------------------------------------------
  # 4e. Help / unsupported intent — render onboarding widget.
  # ---------------------------------------------------------------------
  - step: render_help
    desc: Render an onboarding widget when intent is help
    tool:
      kind: python
      input:
        classification: "{{ classify_intent }}"
        query: "{{ workload.query }}"
        execution_id: "{{ execution_id }}"
        provider: "{{ classify_intent.effective_provider | default(workload.ai_provider) }}"
      code: |
        intent = classification.get("intent") or "help"
        note = "I can search flights, hotels, locations, and activities. Try one of the examples below."

        examples = [
            {"type": "app:button", "args": {"text": "flights SFO→JFK on 2026-07-15", "variant": "outlined", "event": {"key": "command", "value": "travel flights from SFO to JFK on 2026-07-15 for 2 adults"}}},
            {"type": "app:button", "args": {"text": "locations near Boston", "variant": "outlined", "event": {"key": "command", "value": "travel locations near Boston"}}},
            {"type": "app:button", "args": {"text": "hotels in Paris", "variant": "outlined", "event": {"key": "command", "value": "travel hotels in Paris on 2026-08-15"}}},
            {"type": "app:button", "args": {"text": "activities near Times Square", "variant": "outlined", "event": {"key": "command", "value": "travel activities near Times Square"}}},
        ]

        render = {
            "type": "app:column",
            "args": {
                "gap": 8,
                "children": [
                    {"type": "app:title", "args": {"text": "Travel agent · help", "size": 18, "boldness": 700}},
                    {"type": "app:text", "args": {"title": "Query", "message": query}},
                    {"type": "app:alert", "args": {"variant": "info", "message": note}},
                    {"type": "app:row", "args": {"gap": 8, "children": examples}},
                    {"type": "app:horizontalline", "args": {}},
                    {"type": "app:statusbar", "args": {"text": f"effective_provider={provider}", "styleKey": "info"}},
                    {"type": "app:text", "args": {"title": "Provider", "message": "Use --provider vertex-ai, --provider anthropic, or --provider ollama to switch classifiers."}},
                ],
            },
        }

        result = {
            "intent": intent,
            "requested_provider": classification.get("requested_provider"),
            "effective_provider": provider,
            "provider_fallback_reason": classification.get("provider_fallback_reason"),
            "summary": note,
            "text": note,
            "render": render,
        }
    # Workflow tail — see comment block before the render_* steps.

  # ---------------------------------------------------------------------
  # 4f. Amadeus failure renderer — friendly error widget.
  # ---------------------------------------------------------------------
  - step: render_amadeus_failure
    desc: Surface a friendly Amadeus failure as a widget
    tool:
      kind: python
      input:
        duffel_envelope: "{{ duffel_via_mcp_flights | default({}) }}"
        flights_envelope: "{{ amadeus_via_mcp_flights | default({}) }}"
        locations_envelope: "{{ amadeus_via_mcp_locations | default({}) }}"
        hotels_envelope: "{{ amadeus_via_mcp_hotels | default({}) }}"
        activities_envelope: "{{ amadeus_via_mcp_activities | default({}) }}"
        classification: "{{ classify_intent }}"
        query: "{{ workload.query }}"
        execution_id: "{{ execution_id }}"
        provider: "{{ classify_intent.effective_provider | default(workload.ai_provider) }}"
        pg_auth: "{{ workload.pg_auth }}"
      code: |
        import json
        import os
        import urllib.request

        # Provider branches call MCP playbooks via NoETL agent hops.
        # Normalize the MCP-shaped envelope whether it is returned directly
        # or nested under data by the agent executor.
        envelope = {}
        for candidate in (duffel_envelope, flights_envelope, locations_envelope, hotels_envelope, activities_envelope):
            if isinstance(candidate, dict) and candidate:
                envelope = candidate
                break
        if not isinstance(envelope, dict):
            envelope = {}
        mcp = envelope.get("data") if isinstance(envelope.get("data"), dict) and "status_code" not in envelope else envelope
        data = mcp.get("data") if isinstance(mcp, dict) and isinstance(mcp.get("data"), dict) else mcp
        if not isinstance(data, dict):
            data = {}

        # The NoETL agent envelope preserves scalar control metadata
        # (`execution_id`, `status`) but projects away the child `data` field.
        # That is enough for this phase: the travel runtime no longer calls
        # Amadeus directly, and the child MCP execution still records the
        # upstream status in its command.completed metadata.
        child_execution_id = (
            envelope.get("execution_id")
            or (envelope.get("context") or {}).get("execution_id")
            or data.get("execution_id")
        )
        if child_execution_id and not data.get("status_code"):
            server_url = os.getenv("NOETL_SERVER_URL", "http://noetl.noetl.svc.cluster.local:8082").rstrip("/")
            if not server_url.endswith("/api"):
                server_url = f"{server_url}/api"
            try:
                with urllib.request.urlopen(f"{server_url}/executions/{child_execution_id}/events", timeout=10) as resp:
                    events_doc = json.loads(resp.read().decode("utf-8"))
                for evt in events_doc.get("events", []):
                    if evt.get("event_type") != "command.completed":
                        continue
                    node = evt.get("node_name") or evt.get("step") or ""
                    if not (str(node).startswith("amadeus_search_") or str(node) == "duffel_dispatch"):
                        continue
                    ctx = ((evt.get("result") or {}).get("context") or {})
                    meta = ctx.get("_meta") if isinstance(ctx.get("_meta"), dict) else {}
                    if meta.get("status_code"):
                        data["status_code"] = meta.get("status_code")
                    data["isError"] = ctx.get("isError")
                    data["mcp_tool"] = meta.get("tool") or node
                    break
            except Exception as exc:
                data["mcp_event_lookup_error"] = f"{type(exc).__name__}: {exc}"

        status_code = data.get("status_code")
        error_body = data.get("error")
        if isinstance(error_body, dict):
            errors = error_body.get("errors") if isinstance(error_body.get("errors"), list) else None
            if errors:
                body_msg = "; ".join(str((e or {}).get("title") or (e or {}).get("detail") or e) for e in errors)
            elif error_body.get("error"):
                body_msg = str(error_body.get("error"))[:600]
            else:
                body_msg = str(error_body)[:600]
        elif isinstance(error_body, str):
            body_msg = error_body[:600]
        else:
            body_msg = "(no response body captured)"

        intent = classification.get("intent") or "travel"
        if status_code and 500 <= int(status_code) <= 599:
            user_message = "The travel provider's search service is temporarily unavailable. Please try again."
        elif status_code == 429:
            user_message = "We're being rate-limited by the travel provider. Try again in a few seconds."
        elif status_code in (401, 403):
            user_message = "Couldn't authenticate with the travel provider. Operator may need to refresh credentials."
        elif status_code in (400, 422):
            user_message = f"The {intent} query couldn't be parsed. Try rephrasing it with the location and date details."
        else:
            user_message = f"The {intent} search failed. Please try again, or contact support if it persists."

        def _refine_form_for_intent(intent_name):
            if intent_name == "flights":
                return {
                    "type": "app:form",
                    "args": {
                        "fields": [
                            {"id": "origin", "title": "Origin (IATA)", "default_value": classification.get("origin") or "SFO"},
                            {"id": "destination", "title": "Destination (IATA)", "default_value": classification.get("destination") or "JFK"},
                            {"id": "departureDate", "title": "Departure date", "default_value": classification.get("departureDate") or "2026-07-15"},
                            {"id": "adults", "title": "Adults", "default_value": str(classification.get("adults") or 1)},
                        ],
                        "buttons": [{
                            "text": "Try again with new values",
                            "colorType": "primary",
                            "event": {"key": "command", "value": "travel flights from {origin} to {destination} on {departureDate} for {adults} adults"},
                        }],
                    },
                }
            if intent_name == "hotels":
                return {
                    "type": "app:form",
                    "args": {
                        "fields": [
                            {"id": "cityCode", "title": "City (IATA)", "default_value": classification.get("cityCode") or "NYC"},
                            {"id": "departureDate", "title": "Check-in date", "default_value": classification.get("departureDate") or "2026-08-15"},
                        ],
                        "buttons": [{
                            "text": "Try again with new values",
                            "colorType": "primary",
                            "event": {"key": "command", "value": "travel hotels in {cityCode} on {departureDate}"},
                        }],
                    },
                }
            if intent_name == "activities":
                return {
                    "type": "app:form",
                    "args": {
                        "fields": [
                            {"id": "keyword", "title": "Place or landmark", "default_value": classification.get("keyword") or classification.get("city") or "Times Square"},
                        ],
                        "buttons": [{
                            "text": "Try again with new values",
                            "colorType": "primary",
                            "event": {"key": "command", "value": "travel activities near {keyword}"},
                        }],
                    },
                }
            return {
                "type": "app:form",
                "args": {
                    "fields": [
                        {"id": "keyword", "title": "Keyword", "default_value": classification.get("keyword") or classification.get("city") or "Boston"},
                    ],
                    "buttons": [{
                        "text": "Try again with new values",
                        "colorType": "primary",
                        "event": {"key": "command", "value": "travel locations near {keyword}"},
                    }],
                },
            }

        render = {
            "type": "app:column",
            "args": {
                "gap": 8,
                "children": [
                    {"type": "app:title", "args": {"text": "Travel agent · search failed", "size": 18, "boldness": 700}},
                    {"type": "app:text", "args": {"title": "Query", "message": query}},
                    {"type": "app:alert", "args": {"variant": "error", "message": user_message}},
                    {"type": "app:infotable", "args": {
                        "data": {
                            "intent": classification.get("intent"),
                            "effective_provider": provider,
                            "status_code": status_code,
                            "upstream_message": body_msg,
                        },
                        "fields": [
                            {"label": "Intent", "key": "intent"},
                            {"label": "Provider", "key": "effective_provider"},
                            {"label": "Upstream status", "key": "status_code"},
                            {"label": "Upstream message", "key": "upstream_message"},
                        ],
                    }},
                    {"type": "app:row", "args": {"gap": 8, "children": [
                        {"type": "app:button", "args": {"text": "rerun this search", "variant": "outlined", "event": {"key": "command", "value": f"rerun {execution_id}"}}},
                        {"type": "app:button", "args": {"text": "diagnose", "variant": "outlined", "event": {"key": "command", "value": f"fix {execution_id}"}}},
                    ]}},
                    _refine_form_for_intent(intent),
                ],
            },
        }

        result = {
            # IMPORTANT: do NOT set `status: failed` here. NoETL treats
            # `result.status == "failed"` at the step level as a step
            # failure, which propagates to the whole execution. We want
            # this step to *succeed at the NoETL level* — the upstream
            # 5xx is captured in `upstream_status_code` + `user_message`
            # and the widget renderer surfaces it as a friendly error.
            # The execution itself completes normally so the auto-render
            # watcher attaches the widget to the prompt.
            "outcome": "amadeus_failure",
            "stage": "amadeus_search",
            "intent": classification.get("intent"),
            "requested_provider": classification.get("requested_provider"),
            "effective_provider": provider,
            "provider_fallback_reason": classification.get("provider_fallback_reason"),
            "user_message": user_message,
            "upstream_status_code": status_code,
            "upstream_message": body_msg,
            "summary": user_message,
            "text": user_message,
            "render": render,
        }

        def _audit_pg_conn_info(pg_auth_name):
            from noetl.worker.secrets import fetch_credential_by_key as _audit_fetch_credential
            _credential = _audit_fetch_credential(str(pg_auth_name or "pg_k8s"))
            _data = _credential.get("data") if isinstance(_credential, dict) and isinstance(_credential.get("data"), dict) else _credential
            if not isinstance(_data, dict):
                raise RuntimeError("postgres credential missing")
            _dsn = _data.get("dsn") or _data.get("connection_string") or _data.get("db_conn_string")
            if _dsn:
                return _dsn
            return {
                "host": _data.get("db_host") or _data.get("host") or _data.get("pg_host"),
                "port": int(_data.get("db_port") or _data.get("port") or 5432),
                "dbname": _data.get("db_name") or _data.get("database") or _data.get("dbname"),
                "user": _data.get("db_user") or _data.get("user") or _data.get("username"),
                "password": _data.get("db_password") or _data.get("password"),
            }

        try:
            import psycopg as _audit_psycopg
            _audit_payload = {
                "render_kind": intent,
                "render_type": render.get("type"),
                "envelope_status_code": status_code,
                "envelope_ok": bool(data.get("ok")) if isinstance(data, dict) else False,
                "envelope_total": 0,
                "provider_fallback_reason": classification.get("provider_fallback_reason"),
                "classified_intent": classification,
            }
            _conn_info = _audit_pg_conn_info(pg_auth)
            _conn = _audit_psycopg.connect(_conn_info, connect_timeout=5) if isinstance(_conn_info, str) else _audit_psycopg.connect(**_conn_info, connect_timeout=5)
            try:
                with _conn.cursor() as _cur:
                    _cur.execute(
                        "INSERT INTO travel_agent_events (execution_id, event_type, ai_provider, intent, payload) "
                        "VALUES (%s, %s, %s, %s, %s::jsonb)",
                        (
                            execution_id,
                            "render_amadeus_failure",
                            classification.get("effective_provider"),
                            classification.get("intent"),
                            json.dumps(_audit_payload, separators=(",", ":"), default=str),
                        ),
                    )
                    _conn.commit()
            finally:
                _conn.close()
        except Exception as _audit_exc:
            print(f"travel_agent_events audit insert failed: {type(_audit_exc).__name__}: {_audit_exc}")

  # ---------------------------------------------------------------------
  # 5. Workflow tails.
  #
  # Each render_* step is the FINAL step on its branch — no further
  # arcs. NoETL takes the last step's result as `execution.result`, so
  # `execution.result.render` is automatically the widget tree the
  # render_* step produced. The auto-render watcher and `report`
  # command both find the widget at the top of the result.
  #
  # Earlier rounds chained render_* → persist_and_callback (postgres)
  # → send_callback (http) → end (python). That chain broke render
  # visibility in two ways: (a) postgres step's result overwrote the
  # render step's result on the way to `end`, and (b) NoETL's
  # variable scope from `end` couldn't see arbitrary upstream step
  # outputs reliably (round 6 result file documents this). Letting
  # render_* be the tail is the simplest correct shape.
  #
  # Audit trail: the render_flights/render_hotels/render_locations/
  # render_activities/render_amadeus_failure steps now write
  # `travel_agent_events` rows as best-effort side effects inside the
  # render_* python step. Keep audit/callback work inside the render
  # tail so it cannot clobber `execution.result.render`.
  #
  # Gateway SSE callback: only relevant in gateway-mode deploys (where
  # workload.request_id is set). Local kind doesn't use it. When the
  # gateway integration round picks this back up, do the callback as
  # a SIDE EFFECT inside the render_* step (urllib POST) — same
  # pattern as the audit, for the same reason.
  # ---------------------------------------------------------------------
