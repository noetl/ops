namespace: gateway

image:
  repository: ""
  tag: "latest"
  pullPolicy: Always

# ---------------------------------------------------------------------------
# EHDB (Event Horizon Database) integration — DISABLED BY DEFAULT.
#
# When `enabled: false` (the default) the gateway deployment renders
# byte-identical to pre-EHDB: no NOETL_EHDB_* env, no attach, no behavior
# change.
#
# The gateway is a CONTROL-PLANE role.  When enabled it receives
# control-plane-only EHDB env (NOETL_EHDB_MODE=control_plane,
# NOETL_EHDB_CAPABILITIES=control_plane) and NEVER a data-plane storage handle
# (no NOETL_EHDB_LOCAL_REFERENCE_LOG).  The boundary is enforced in
# `templates/_ehdb.tpl` keyed on the gateway client role — it is not
# values-configurable.  The noetl worker/system data-plane roles live in the
# separate `automation/helm/noetl` chart.
#
# See https://github.com/noetl/ehdb/wiki/Claude-Handoff-EHDB-NoETL-Integration
# (Phase A).
ehdb:
  enabled: false
  roles:
    gateway:
      enabled: true

service:
  type: LoadBalancer
  port: 8090
  nodePort: null
  loadBalancerIP: "34.46.180.136"

ingress:
  enabled: false
  className: gce
  annotations: {}
  host: gateway.mestumre.dev
  tls:
    enabled: true
    secretName: ""
  managedCertificate:
    enabled: true
    name: gateway-managed-cert

env:
  routerPort: "8090"
  noetlBaseUrl: "http://noetl.noetl.svc.cluster.local:8082"
  rustLog: "info,gateway=debug"
  corsAllowedOrigins: "http://localhost:8080,http://localhost:8090,http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173,https://mestumre.dev,https://travel.mestumre.dev,https://gateway.mestumre.dev"
  # NATS subject prefix the gateway's playbook_state listener
  # subscribes to (``{prefix}>``).  Must match the noetl event publisher's
  # ``NOETL_EVENT_NATS_SUBJECT_PREFIX`` (``noetl.events`` by default),
  # plus a trailing dot.  The publisher emits subjects of the form
  # ``noetl.events.{tenant}.{org}.{exec_id}.{shard}`` — see
  # ``noetl/core/messaging/nats_client.py::subject_for_event``.
  #
  # The legacy ``"playbooks.executions."`` prefix did not match any
  # subject the noetl publisher emits — the gateway silently received
  # zero ``playbook.completed`` messages and the travel SPA hung at
  # ``Muno is planning…`` indefinitely (see
  # gateway PR #12 + ai-meta handoff
  # 2026-05-27-itinerary-planner-spa-hang).  Gateway image must be
  # rebuilt with PR #12 alongside this value flip so the corrected
  # subject tail is parsed into the execution id correctly.
  natsUpdatesSubjectPrefix: "noetl.events."
  authPlaybookTimeoutSecs: "12"
  publicUrl: ""
  # Set to "true" to bypass auth validation (for testing only)
  authBypass: "true"

  # Auth0 application metadata.  These values are surfaced verbatim
  # by the gateway's ``GET /api/runtime/contract`` endpoint under an
  # ``auth0`` block so the ``noetl`` CLI can bootstrap a context
  # with one command:
  #
  #   noetl context init <name> --from-gateway https://gateway.example.com
  #
  # The gateway does NOT use these values for token validation —
  # validation happens per-request against whichever
  # ``auth0_domain`` the login payload carries (see
  # ``src/auth/mod.rs::login_handler``).  These fields are
  # informational only, telling the CLI which Auth0 application
  # the SPA + this gateway expect operators to authenticate
  # against.
  #
  # Leave the values empty when the deployment doesn't use Auth0;
  # the runtime contract simply omits the ``auth0`` block in that
  # case.
  auth0Domain: "mestumre-development.us.auth0.com"
  auth0ClientId: "Jqop7YoaiZalLHdBRo5ScNQ1RJhbhbDN"
  auth0RedirectUri: "https://travel.mestumre.dev/login"
  auth0Audience: ""

resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "512Mi"
    cpu: "500m"
