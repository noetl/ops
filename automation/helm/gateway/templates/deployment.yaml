apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Values.namespace }}
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.env.routerPort }}
              name: http
              protocol: TCP
          env:
            - name: ROUTER_PORT
              value: {{ .Values.env.routerPort | quote }}
            - name: NOETL_BASE_URL
              value: {{ .Values.env.noetlBaseUrl | quote }}
            - name: RUST_LOG
              value: {{ .Values.env.rustLog | quote }}
            - name: CORS_ALLOWED_ORIGINS
              value: {{ .Values.env.corsAllowedOrigins | quote }}
            - name: NATS_URL
              value: {{ .Values.env.natsUrl | quote }}
            - name: NATS_UPDATES_SUBJECT_PREFIX
              value: {{ .Values.env.natsUpdatesSubjectPrefix | quote }}
            - name: AUTH_PLAYBOOK_TIMEOUT_SECS
              value: {{ .Values.env.authPlaybookTimeoutSecs | quote }}
            {{- if .Values.env.publicUrl }}
            - name: GATEWAY_PUBLIC_URL
              value: {{ .Values.env.publicUrl | quote }}
            {{- end }}
            {{- if .Values.env.authBypass }}
            - name: GATEWAY_AUTH_BYPASS
              value: {{ .Values.env.authBypass | quote }}
            {{- end }}
            # Auth0 application metadata — informational only.
            # Surfaced via ``GET /api/runtime/contract`` so the
            # ``noetl`` CLI can bootstrap a context with the right
            # client_id + redirect_uri without operators looking
            # them up in the SPA source.  When any field is empty
            # the runtime contract simply omits it from the
            # ``auth0`` block (or omits the whole block when domain
            # is unset).
            {{- if .Values.env.auth0Domain }}
            - name: GATEWAY_AUTH0_DOMAIN
              value: {{ .Values.env.auth0Domain | quote }}
            {{- end }}
            {{- if .Values.env.auth0ClientId }}
            - name: GATEWAY_AUTH0_CLIENT_ID
              value: {{ .Values.env.auth0ClientId | quote }}
            {{- end }}
            {{- if .Values.env.auth0RedirectUri }}
            - name: GATEWAY_AUTH0_REDIRECT_URI
              value: {{ .Values.env.auth0RedirectUri | quote }}
            {{- end }}
            {{- if .Values.env.auth0Audience }}
            - name: GATEWAY_AUTH0_AUDIENCE
              value: {{ .Values.env.auth0Audience | quote }}
            {{- end }}
            {{- if and .Values.ehdb .Values.ehdb.enabled }}
            # EHDB control-plane-only env (gateway role) — see templates/_ehdb.tpl.
            {{- include "noetl.ehdb.podEnv" (dict "clientRole" "gateway" "roleKey" "gateway" "root" $) | nindent 12 }}
            {{- end }}
          resources:
{{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.env.routerPort }}
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.env.routerPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
