{{- /*
  Defensive value resolution mirroring worker-keda-scaledobject.yaml,
  so `helm upgrade --reuse-values` does not crash if the live release
  predates the worker.autoscaling.keda block. The two templates are
  mutually exclusive: keda.enabled=true selects the ScaledObject, and
  any other state selects this CPU/memory HPA when autoscaling.enabled
  is true.
*/ -}}
{{- $autoscaling := .Values.worker.autoscaling | default dict -}}
{{- $keda := $autoscaling.keda | default dict -}}
{{- if and ($autoscaling.enabled | default false) (not ($keda.enabled | default false)) }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: noetl-worker
  namespace: {{ .Values.namespace }}
  labels:
    app: noetl-worker
    component: worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: noetl-worker
  minReplicas: {{ $autoscaling.minReplicas | default 1 }}
  maxReplicas: {{ $autoscaling.maxReplicas | default 20 }}
  metrics:
    {{- if $autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if $autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ $autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
  {{- with $autoscaling.behavior }}
  behavior:
{{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
