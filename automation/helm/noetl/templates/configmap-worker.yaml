apiVersion: v1
kind: ConfigMap
metadata:
  name: noetl-worker-config
  namespace: {{ .Values.namespace }}
  labels:
    app: noetl-worker
data:
{{- range $key, $value := .Values.config.worker }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
{{- if and .Values.ehdb .Values.ehdb.enabled }}
  # EHDB bounded data-plane env (worker role, local_reference) — see templates/_ehdb.tpl.
{{- include "noetl.ehdb.configmapEnv" (dict "clientRole" "worker" "roleKey" "worker" "root" $) | nindent 2 }}
{{- end }}
