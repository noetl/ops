{{- if .Values.workerPool.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: noetl-worker-pool-config
  namespace: {{ .Values.namespace }}
data:
{{- range $key, $value := .Values.config.workerPool }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
{{- if and .Values.ehdb .Values.ehdb.enabled }}
  # EHDB bounded data-plane env (worker role, local_reference) — see templates/_ehdb.tpl.
{{- include "noetl.ehdb.configmapEnv" (dict "clientRole" "worker" "roleKey" "workerPool" "root" $) | nindent 2 }}
{{- end }}
{{- end }}
