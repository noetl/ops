{{- /*
  Defensive value resolution so `helm upgrade --reuse-values` does not
  crash on this template when the live release was rendered with a
  prior chart version that did not yet have the worker.autoscaling.keda
  block. The chart's documented defaults live in values.yaml; the
  fallbacks here mirror them so a release upgraded with --reuse-values
  still produces the GKE-shaped ScaledObject correctly.

  See https://github.com/noetl/ops/wiki/automation-gcp-gke for the
  install/upgrade path and the --reuse-values gotcha that motivates
  this pattern.
*/ -}}
{{- $autoscaling := .Values.worker.autoscaling | default dict -}}
{{- $keda := $autoscaling.keda | default dict -}}
{{- $nats := $keda.nats | default dict -}}
{{- if and ($autoscaling.enabled | default false) ($keda.enabled | default false) }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: noetl-worker
  namespace: {{ .Values.namespace }}
  labels:
    app: noetl-worker
    component: worker
    managed-by: helm
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: noetl-worker
  pollingInterval: {{ $keda.pollingInterval | default 10 }}
  cooldownPeriod: {{ $keda.cooldownPeriod | default 30 }}
  minReplicaCount: {{ $autoscaling.minReplicas | default 1 }}
  maxReplicaCount: {{ $autoscaling.maxReplicas | default 20 }}
  triggers:
    - type: nats-jetstream
      metadata:
        natsServerMonitoringEndpoint: {{ $nats.monitoringEndpoint | default "nats-headless.nats.svc.cluster.local:8222" | quote }}
        account: {{ $nats.account | default "$G" | quote }}
        stream: {{ $nats.stream | default "NOETL_COMMANDS" | quote }}
        consumer: {{ $nats.consumer | default "noetl_worker_pool" | quote }}
        lagThreshold: {{ $nats.lagThreshold | default "10" | quote }}
        activationLagThreshold: {{ $nats.activationLagThreshold | default "1" | quote }}
        useHttps: {{ $nats.useHttps | default "false" | quote }}
{{- end }}
