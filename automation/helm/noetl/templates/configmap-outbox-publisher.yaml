{{- if .Values.outboxPublisher.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: noetl-outbox-publisher-config
  namespace: {{ .Values.namespace }}
  labels:
    app: noetl-outbox-publisher
    component: outbox-publisher
data:
{{- range $key, $value := .Values.config.outboxPublisher }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
{{- if and .Values.ehdb .Values.ehdb.enabled }}
  # EHDB bounded data-plane env (system role, local_reference) — see templates/_ehdb.tpl.
{{- include "noetl.ehdb.configmapEnv" (dict "clientRole" "system" "roleKey" "outboxPublisher" "root" $) | nindent 2 }}
{{- end }}
{{- end }}
