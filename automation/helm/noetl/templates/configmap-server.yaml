apiVersion: v1
kind: ConfigMap
metadata:
  name: noetl-server-config
  namespace: {{ .Values.namespace }}
  labels:
    app: noetl-server
data:
{{- range $key, $value := .Values.config.server }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
  # NOETL_EVENT_MIRROR_ENABLED / NOETL_EVENT_NATS_{STREAM,SUBJECT_PREFIX,SHARD_COUNT}
  # were removed here along with the Python projector they configured.
  #
  # The server reads its config through `envy::prefixed("NOETL_")` over
  # `AppConfig` (repos/server/src/config/app.rs).  `AppConfig` has no field for
  # any of them — and no `env::var` reads them either — so every one of these
  # keys was rendered into the ConfigMap and then read by nothing.  They
  # described the JetStream stream the projector drained; the projector is gone
  # and the Rust materializer (`NOETL_MATERIALIZER_SOURCE=ehdb`) replaced it.
  #
  # Keeping them "corrected" rather than deleted would have made a dead
  # component more convincing, not less (noetl/ai-meta#243).
{{- if and .Values.ehdb .Values.ehdb.enabled }}
  # EHDB control-plane-only env (server role) — see templates/_ehdb.tpl.
{{- include "noetl.ehdb.configmapEnv" (dict "clientRole" "server" "roleKey" "server" "root" $) | nindent 2 }}
{{- end }}
