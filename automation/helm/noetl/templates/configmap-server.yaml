apiVersion: v1
kind: ConfigMap
metadata:
  name: noetl-server-config
  namespace: {{ .Values.namespace }}
  labels:
    app: noetl-server
data:
{{- range $key, $value := .Values.config.server }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
  # ``NOETL_EVENT_MIRROR_ENABLED`` lives in ``config.server`` (see
  # ``automation/helm/noetl/values.yaml``) so operators can override it
  # the same way they override every other server env var.  An earlier
  # shape hardcoded this to ``ternary "true" "false" .Values.projector.enabled``
  # which silently overrode any ``--set config.server.NOETL_EVENT_MIRROR_ENABLED=true``
  # the operator passed.  The override applies AFTER the ``range`` above
  # only when the value is NOT already present in ``config.server`` — fall
  # back to ``.Values.projector.enabled`` for chart-version compat.  Once
  # ``config.server.NOETL_EVENT_MIRROR_ENABLED`` is in the values file
  # (PR #121) the fallback is dead code; it stays here for older
  # deploy values that may omit the key.
{{- if not (hasKey .Values.config.server "NOETL_EVENT_MIRROR_ENABLED") }}
  NOETL_EVENT_MIRROR_ENABLED: {{ ternary "true" "false" .Values.projector.enabled | quote }}
{{- end }}
  NOETL_EVENT_NATS_STREAM: {{ .Values.config.projector.NOETL_PROJECTOR_NATS_STREAM | quote }}
  NOETL_EVENT_NATS_SUBJECT_PREFIX: "noetl.events"
  NOETL_EVENT_NATS_SHARD_COUNT: {{ .Values.projector.replicas | quote }}
