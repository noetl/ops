{{- if .Values.workerPool.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: noetl-worker-pool
  namespace: {{ .Values.namespace }}
  labels:
    app: noetl-worker-pool
    component: worker
    runtime: rust
    worker-pool: {{ .Values.workerPool.poolName }}
spec:
  replicas: {{ .Values.workerPool.replicas }}
  strategy:
{{- toYaml .Values.workerPool.strategy | nindent 4 }}
  selector:
    matchLabels:
      app: noetl-worker-pool
      worker-pool: {{ .Values.workerPool.poolName }}
  template:
    metadata:
      labels:
        app: noetl-worker-pool
        component: worker
        runtime: rust
        worker-pool: {{ .Values.workerPool.poolName }}
    spec:
      serviceAccountName: noetl-worker
      initContainers:
        - name: wait-for-api
          image: curlimages/curl:8.7.1
          imagePullPolicy: IfNotPresent
{{- if .Values.tls.enabled }}
          # Phase 4 mTLS: plain-HTTP curl can't complete against an mTLS
          # listener (the cert-less handshake is rejected before /api/health
          # is evaluated).  Curl with the mounted client cert.
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
          command:
            - sh
            - -c
            - "until curl -sf --cacert /tls/ca.crt --cert /tls/tls.crt --key /tls/tls.key https://noetl-server.{{ .Values.namespace }}.svc.cluster.local:{{ .Values.service.port }}/api/health; do echo 'Waiting for NoETL mTLS API...'; sleep 3; done"
{{- else }}
          command:
            - sh
            - -c
            - "until curl -sf http://noetl.{{ .Values.namespace }}.svc.cluster.local:{{ .Values.service.port }}/api/health; do echo 'Waiting for NoETL API...'; sleep 3; done"
{{- end }}
      containers:
        - name: worker-pool
          image: "{{ .Values.workerPool.image.repository }}:{{ .Values.workerPool.image.tag }}"
          imagePullPolicy: {{ .Values.workerPool.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: noetl-worker-pool-config
          env:
            - name: WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
{{- if .Values.tls.enabled }}
            # Secrets Wallet Phase 4b (noetl/ai-meta#61) — values-gated mTLS
            # client.  The Rust noetl-worker consumes this env (worker
            # v5.12.0+) to present a client cert + verify the server.
            - name: NOETL_TLS_CLIENT_CERT
              value: /tls/tls.crt
            - name: NOETL_TLS_CLIENT_KEY
              value: /tls/tls.key
            - name: NOETL_TLS_CA
              value: /tls/ca.crt
            # Override the configmap's plain-HTTP server URL so registration
            # + claims + event posts speak https from the start.
            - name: NOETL_SERVER_URL
              value: https://noetl-server.{{ .Values.namespace }}.svc.cluster.local:{{ .Values.service.port }}
{{- end }}
          volumeMounts:
{{- if .Values.persistence.data.enabled }}
            - name: noetl-data
              mountPath: /opt/noetl/data
{{- end }}
{{- if .Values.tls.enabled }}
            - name: tls
              mountPath: /tls
              readOnly: true
{{- end }}
          resources:
{{- toYaml .Values.workerPool.resources | nindent 12 }}
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "pgrep noetl-worker"
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
{{- if .Values.persistence.data.enabled }}
        - name: noetl-data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.data.name }}
{{- end }}
{{- if .Values.tls.enabled }}
        - name: tls
          secret:
            secretName: {{ .Values.tls.certManager.worker.secretName }}
{{- end }}
{{- end }}
