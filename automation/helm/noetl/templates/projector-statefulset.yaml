{{- if .Values.projector.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: noetl-projector
  namespace: {{ .Values.namespace }}
  labels:
    app: noetl-projector
    component: projector
spec:
  serviceName: {{ .Values.projector.serviceName }}
  replicas: {{ .Values.projector.replicas }}
  podManagementPolicy: {{ .Values.projector.podManagementPolicy }}
  updateStrategy:
{{- toYaml .Values.projector.updateStrategy | nindent 4 }}
  selector:
    matchLabels:
      app: noetl-projector
  template:
    metadata:
      labels:
        app: noetl-projector
        component: projector
    spec:
      serviceAccountName: noetl-worker
      initContainers:
        - name: wait-for-api
          image: curlimages/curl:8.7.1
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - "until curl -sf http://noetl.{{ .Values.namespace }}.svc.cluster.local:{{ .Values.service.port }}/api/health; do echo 'Waiting for NoETL API...'; sleep 3; done"
      containers:
        - name: projector
          image: "{{ default .Values.image.repository .Values.projector.image.repository }}:{{ default .Values.image.tag .Values.projector.image.tag }}"
          imagePullPolicy: {{ default .Values.image.pullPolicy .Values.projector.image.pullPolicy }}
          command:
            - python
          args:
            - -m
            - noetl.projector
          ports:
            - name: metrics
              containerPort: 9090
          env:
            - name: NOETL_PROJECTOR_SHARD_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NOETL_PROJECTOR_NATS_CONSUMER
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          envFrom:
            - configMapRef:
                name: noetl-projector-config
            - secretRef:
                name: noetl-secret
          volumeMounts:
{{- if .Values.persistence.data.enabled }}
            - name: noetl-data
              mountPath: /opt/noetl/data
{{- end }}
          resources:
{{- toYaml .Values.projector.resources | nindent 12 }}
      volumes:
{{- if .Values.persistence.data.enabled }}
        - name: noetl-data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.data.name }}
{{- end }}
{{- end }}
