{{- if .Values.objectStore.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.objectStore.storage.name }}
  namespace: {{ .Values.objectStore.namespace }}
  labels:
    app: object-store
    object-store.noetl.io/backend: {{ .Values.objectStore.kind | quote }}
spec:
{{- if .Values.objectStore.storage.storageClassName }}
  storageClassName: {{ .Values.objectStore.storage.storageClassName | quote }}
{{- end }}
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.objectStore.storage.size }}
{{- end }}
