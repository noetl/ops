namespace: noetl

image:
  repository: ""
  tag: "latest"
  pullPolicy: Always

server:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  resources:
    limits:
      cpu: "2"
      memory: "2Gi"
    requests:
      cpu: "100m"
      memory: "256Mi"

worker:
  replicas: 6
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "2Gi"

# Rust-based worker pool (noetl-tools)
workerPool:
  enabled: false
  poolName: worker-rust-pool
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  image:
    repository: ""
    tag: "latest"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "1"
      memory: "1Gi"

service:
  type: ClusterIP
  port: 8082

externalService:
  enabled: false
  type: ClusterIP
  port: 8082
  nodePort: null

ingress:
  enabled: false
  className: gce
  annotations: {}
  host: api.mestumre.dev
  tls:
    enabled: true
    secretName: ""
  managedCertificate:
    enabled: true
    name: noetl-managed-cert

persistence:
  data:
    enabled: true
    name: noetl-data-shared
    accessMode: ReadWriteMany
    size: 10Gi
    storageClassName: standard-rwx
  logs:
    enabled: true
    name: noetl-logs
    accessMode: ReadWriteOnce
    size: 5Gi
    storageClassName: standard

config:
  server:
    TZ: "UTC"
    LOG_LEVEL: "INFO"
    PYTHONPATH: "/opt/noetl"
    NOETL_RUN_MODE: "server"
    NOETL_DATA_DIR: "/opt/noetl/data"
    NOETL_DEBUG: "false"
    NOETL_HTTP_MOCK_LOCAL: "false"
    PAGINATION_API_URL: "http://paginated-api.test-server.svc.cluster.local:5555"
    NOETL_SERVER_URL: "http://noetl.noetl.svc.cluster.local:8082"
    NOETL_DISABLE_METRICS: "true"
    NOETL_VICTORIALOGS_URL: ""
    NOETL_LOG_FORMAT: "json"
    NATS_URL: "nats://noetl:noetl@nats.nats.svc.cluster.local:4222"
    NATS_USER: "noetl"
    NATS_PASSWORD: "noetl"
    NATS_STREAM: "NOETL_COMMANDS"
    NATS_CONSUMER: "noetl_worker_pool"
    NATS_SUBJECT: "noetl.commands"
    NOETL_KEYCHAIN_REFRESH_THRESHOLD: "900"
    NOETL_ENABLE_UI: "true"
    NOETL_HOST: "0.0.0.0"
    NOETL_PORT: "8082"
    NOETL_SERVER_NAME: "server-k8s"
    NOETL_SERVER: "uvicorn"
    NOETL_SERVER_WORKERS: "1"
    NOETL_SERVER_RELOAD: "false"
    NOETL_AUTO_RECREATE_RUNTIME: "true"
    NOETL_HEARTBEAT_RETRY_AFTER: "3"
    NOETL_RUNTIME_SWEEP_INTERVAL: "15"
    NOETL_RUNTIME_OFFLINE_SECONDS: "180"
    NOETL_COMMAND_CLAIM_LEASE_SECONDS: "180"
    NOETL_COMMAND_WORKER_HEARTBEAT_STALE_SECONDS: "90"
    NOETL_COMMAND_CLAIM_HEALTHY_WORKER_HARD_TIMEOUT_SECONDS: "3600"
    NOETL_COMMAND_REAPER_WORKER_STALE_SECONDS: "180"
    NOETL_SERVER_METRICS_INTERVAL: "60"
    POSTGRES_HOST: "postgres.postgres.svc.cluster.local"
    POSTGRES_PORT: "5432"
    NOETL_POSTGRES_DB: "noetl"
    NOETL_USER: "noetl"
    NOETL_SCHEMA: "noetl"
    NOETL_DB_STARTUP_TIMEOUT: "180"
    NOETL_DB_RETRY_INTERVAL: "5"
    NOETL_POSTGRES_POOL_MIN_SIZE: "2"
    NOETL_POSTGRES_POOL_MAX_SIZE: "12"
    NOETL_POSTGRES_POOL_MAX_WAITING: "200"
    NOETL_POSTGRES_POOL_TIMEOUT_SECONDS: "30"
    NOETL_CLAIM_DB_ACQUIRE_TIMEOUT_SECONDS: "0.25"
    NOETL_COMMAND_CLAIM_RETRY_AFTER_SECONDS: "2"
    NOETL_TEMPSTORE_MAX_REF_CACHE_ENTRIES: "50000"
    NOETL_TEMPSTORE_MAX_MEMORY_CACHE_ENTRIES: "20000"
  worker:
    TZ: "UTC"
    LOG_LEVEL: "INFO"
    PYTHONPATH: "/opt/noetl"
    NOETL_RUN_MODE: "worker"
    NOETL_DATA_DIR: "/opt/noetl/data"
    NOETL_DEBUG: "false"
    NOETL_HTTP_MOCK_LOCAL: "false"
    PAGINATION_API_URL: "http://paginated-api.test-server.svc.cluster.local:5555"
    NOETL_SERVER_URL: "http://noetl.noetl.svc.cluster.local:8082"
    NOETL_DISABLE_METRICS: "true"
    NOETL_VICTORIALOGS_URL: ""
    NOETL_LOG_FORMAT: "json"
    NATS_URL: "nats://noetl:noetl@nats.nats.svc.cluster.local:4222"
    NATS_USER: "noetl"
    NATS_PASSWORD: "noetl"
    NATS_STREAM: "NOETL_COMMANDS"
    NATS_CONSUMER: "noetl_worker_pool"
    NATS_SUBJECT: "noetl.commands"
    NOETL_WORKER_NATS_FETCH_TIMEOUT_SECONDS: "30"
    NOETL_WORKER_NATS_FETCH_HEARTBEAT_SECONDS: "5"
    NOETL_WORKER_NATS_MAX_ACK_PENDING: "64"
    NOETL_WORKER_NATS_MAX_DELIVER: "1000"
    NOETL_KEYCHAIN_REFRESH_THRESHOLD: "900"
    NOETL_WORKER_MAX_INFLIGHT_COMMANDS: "8"
    NOETL_WORKER_MAX_INFLIGHT_DB_COMMANDS: "3"
    NOETL_WORKER_THROTTLE_POLL_INTERVAL_SECONDS: "0.2"
    NOETL_WORKER_POSTGRES_POOL_WAITING_THRESHOLD: "2"
    NOETL_COMMAND_HEARTBEAT_INTERVAL_SECONDS: "10"
    NOETL_COMMAND_HEARTBEAT_TIMEOUT_SECONDS: "3"
    NOETL_COMMAND_HEARTBEAT_MAX_RETRIES: "1"
    # Result Storage Configuration (RisingWave-aligned, phase 1)
    NOETL_INLINE_MAX_BYTES: "65536"
    NOETL_PREVIEW_MAX_BYTES: "1024"
    NOETL_DEFAULT_STORAGE_TIER: "kv"
    NOETL_TEMPSTORE_MAX_REF_CACHE_ENTRIES: "50000"
    NOETL_TEMPSTORE_MAX_MEMORY_CACHE_ENTRIES: "20000"
    NOETL_POSTGRES_POOL_MIN_SIZE: "1"
    NOETL_POSTGRES_POOL_MAX_SIZE: "8"
    NOETL_POSTGRES_POOL_MAX_WAITING: "100"
    NOETL_POSTGRES_POOL_TIMEOUT_SECONDS: "30"
    # Cloud durable tier for DISK async spill. 's3' covers MinIO via NOETL_S3_ENDPOINT.
    NOETL_STORAGE_CLOUD_TIER: "s3"
    NOETL_S3_ENDPOINT: "http://minio.minio.svc.cluster.local:9000"
    NOETL_S3_BUCKET: "noetl-results"
    NOETL_S3_REGION: "us-east-1"
    # DISK tier (phase 1 DiskCacheBackend) uses the shared PVC at NOETL_DATA_DIR.
    # 2 GB data pool (~90%) + 256 MB meta pool (~10%) fit inside 10Gi RWX PVC.
    NOETL_STORAGE_LOCAL_CACHE_DIR: "/opt/noetl/data/disk_cache"
    NOETL_STORAGE_LOCAL_DATA_CACHE_CAPACITY_MB: "2048"
    NOETL_STORAGE_LOCAL_META_CACHE_CAPACITY_MB: "256"
    # Rate limit bytes/sec. RisingWave recommends ~90% of sequential write
    # for local SSD, 50-80% for cloud block storage. 200 MB/s is safe for NVMe.
    NOETL_STORAGE_LOCAL_CACHE_INSERT_RATE_MB: "200"
    # Quiet = re-index cache on worker restart for warm replay performance.
    NOETL_STORAGE_LOCAL_CACHE_RECOVER_MODE: "Quiet"
  workerPool:
    RUST_LOG: "info,worker_pool=debug,noetl_tools=debug"
    WORKER_POOL_NAME: "worker-rust-pool"
    NOETL_SERVER_URL: "http://noetl.noetl.svc.cluster.local:8082"
    NATS_URL: "nats://noetl:noetl@nats.nats.svc.cluster.local:4222"
    NATS_STREAM: "NOETL_COMMANDS"
    NATS_CONSUMER: "noetl_worker_pool"
    WORKER_HEARTBEAT_INTERVAL: "15"
    WORKER_MAX_CONCURRENT: "4"

# Optional AI-bridge sidecar.
#
# Disabled by default — the chart's optional-dependency contract
# means a NoETL deployment without AI features must keep working.
# Operators opt in by setting `ollamaBridge.enabled: true` and
# pointing `ollama.url` at their Ollama instance (in-cluster
# StatefulSet, external endpoint, etc.).
#
# What this deploys when enabled:
#   - Deployment running `python -m noetl.tools.ollama_bridge`
#     out of the same noetl image (the bridge ships in
#     noetl.tools.ollama_bridge, so no separate image is needed)
#   - ClusterIP Service on port 8765 reachable in-cluster as
#     `ollama-bridge.<namespace>.svc.cluster.local:8765`
#
# Once deployed, register the catalog template at
# noetl/tools/ollama_bridge/catalog_template.yaml so playbooks
# can call `tool: kind: mcp server: mcp/ollama tool: chat ...`.
# See docs/operations/ollama_bridge.md for the full runbook.
ollamaBridge:
  enabled: false
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  image:
    # Override only when running a non-default bridge image. Empty
    # values fall back to the chart-level `image.repository` /
    # `image.tag` so most deployments only have to bump one tag.
    repository: ""
    tag: ""
    pullPolicy: ""
  service:
    type: ClusterIP
    port: 8765
  bridge:
    host: "0.0.0.0"
  ollama:
    # URL of the Ollama instance the bridge fronts. Default points
    # at an in-cluster Ollama service in the noetl namespace; for
    # remote / external Ollama, set this to the reachable URL.
    url: "http://ollama.noetl.svc.cluster.local:11434"
    # Wall-clock timeout for upstream calls. 120s covers cold-start
    # model loads on commodity CPU; tune down for warm fleets.
    timeoutSeconds: 120
  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  # Schedule the bridge close to the Ollama backend it talks to.
  # Empty defaults — operators set these when they want GPU-pinning
  # or AZ-affinity.
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # Extra env vars merged into the container spec — useful for
  # propagating site-specific values (proxy settings, custom
  # logging targets, etc.) without forking the chart.
  extraEnv: []

secrets:
  postgresPassword: "demo"
  noetlPassword: "noetl"
