namespace: noetl

image:
  repository: ""
  tag: "latest"
  pullPolicy: Always

# ---------------------------------------------------------------------------
# EHDB (Event Horizon Database) integration — DISABLED BY DEFAULT.
#
# When `enabled: false` (the default) the chart renders byte-identical to
# pre-EHDB: no NOETL_EHDB_* env appears in ANY configmap or pod, no attach,
# no behavior change.  Enabling is explicit — flip `enabled: true` in a values
# overlay (optionally scoping to specific roles via `roles.<role>.enabled`).
#
# When enabled, each NoETL role receives role-specific EHDB env with a hard
# control-plane vs data-plane boundary enforced in `templates/_ehdb.tpl`
# (NOT here — an operator editing values cannot leak a data-plane storage
# handle into a control-plane role):
#   * Control-plane roles (server, api, gateway) get control-plane-only env:
#       NOETL_EHDB_MODE=control_plane, NOETL_EHDB_CAPABILITIES=control_plane.
#       They NEVER receive NOETL_EHDB_LOCAL_REFERENCE_LOG.
#   * Data-plane roles (worker, playbook, system) get bounded local-reference
#       env: NOETL_EHDB_MODE=local_reference plus NOETL_EHDB_LOCAL_REFERENCE_LOG
#       pointing at a pod-local JSONL log under NOETL_DATA_DIR.
#
# `roles.<key>` maps a chart deployment (server/worker/workerPool/projector/
# outboxPublisher) to its NoETL client role.  worker + workerPool are worker
# data-plane; projector + outboxPublisher are system data-plane; server is
# control-plane.  The gateway (a separate chart, automation/helm/gateway) is
# control-plane.  Set a role's `enabled: false` to withhold EHDB env from just
# that role while leaving the master switch on.
#
# The env contract is validated by `noetl.core.ehdb_contract`
# (feature-gated, disabled-by-default) in the noetl image.  Under a runtime
# that does not read NOETL_EHDB_* (e.g. the Rust gateway) the vars are inert.
#
# See https://github.com/noetl/ehdb/wiki/Claude-Handoff-EHDB-NoETL-Integration
# (Phase A) and the local kind smoke Job at
# `ci/manifests/noetl/ehdb/smoke-job.yaml`.
ehdb:
  enabled: false
  # Pod-local path for the worker/playbook/system local-reference JSONL log.
  # Lives under NOETL_DATA_DIR on the shared data PVC.
  localReferenceLog: "/opt/noetl/data/ehdb/local-reference.jsonl"
  # Optional per-role opt-out.  Each chart deployment maps to a fixed NoETL
  # client role (server=control-plane; worker + workerPool=worker data-plane;
  # projector + outboxPublisher=system data-plane) — that mapping is hardcoded
  # in `templates/_ehdb.tpl` and cannot be overridden here (the boundary is not
  # values-configurable).  Every role defaults to enabled when the master
  # switch above is on; set a role's `enabled: false` to withhold EHDB env
  # from just that deployment.
  roles:
    server:
      enabled: true
    worker:
      enabled: true
    workerPool:
      enabled: true
    projector:
      enabled: true
    outboxPublisher:
      enabled: true

server:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  resources:
    limits:
      cpu: "2"
      memory: "2Gi"
    requests:
      cpu: "100m"
      memory: "256Mi"

worker:
  replicas: 1
  metrics:
    enabled: true
    serviceName: noetl-worker-metrics
    port: 9091
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: null
    keda:
      enabled: false
      pollingInterval: 10
      cooldownPeriod: 30
      nats:
        account: "$G"
        monitoringEndpoint: nats-headless.nats.svc.cluster.local:8222
        stream: NOETL_COMMANDS
        consumer: noetl_worker_pool
        lagThreshold: "10"
        activationLagThreshold: "1"
        useHttps: "false"
    behavior:
      scaleUp:
        stabilizationWindowSeconds: 0
        policies:
          - type: Percent
            value: 100
            periodSeconds: 60
          - type: Pods
            value: 4
            periodSeconds: 60
        selectPolicy: Max
      scaleDown:
        stabilizationWindowSeconds: 300
        policies:
          - type: Percent
            value: 50
            periodSeconds: 300
        selectPolicy: Max
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "2Gi"

projector:
  enabled: false
  replicas: 1
  serviceName: noetl-projector
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  image:
    repository: ""
    tag: ""
    pullPolicy: ""
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"

outboxPublisher:
  enabled: false
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  image:
    repository: ""
    tag: ""
    pullPolicy: ""
  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

# Rust-based worker pool (noetl-tools)
workerPool:
  enabled: false
  poolName: worker-rust-pool
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  image:
    repository: ""
    tag: "latest"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "1"
      memory: "1Gi"

service:
  type: ClusterIP
  port: 8082

externalService:
  enabled: false
  type: ClusterIP
  port: 8082
  nodePort: null

ingress:
  enabled: false
  className: gce
  annotations: {}
  host: api.mestumre.dev
  tls:
    enabled: true
    secretName: ""
  managedCertificate:
    enabled: true
    name: noetl-managed-cert

# ---------------------------------------------------------------------------
# Control-plane TLS / mTLS (Secrets Wallet Phase 4, noetl/ai-meta#61).
#
# Disabled by default — when `enabled: false` the chart renders identical to
# pre-Phase-4 (no Certificate templates, no mTLS env, httpGet probes).  When
# the operator flips `enabled: true`:
#   * `tls-certificates.yaml` issues a server cert (serverAuth, SAN = the
#     in-cluster Service DNS) + a worker-pool cert (clientAuth) via the
#     referenced cert-manager Issuer.
#   * The server deployment mounts the server Secret and gets `NOETL_TLS_CERT`
#     / `NOETL_TLS_KEY` / `NOETL_TLS_CLIENT_CA` (when `mtls.enabled: true`).
#     Probes switch to `tcpSocket` — an httpGet probe can't present a client
#     cert under mTLS.
#   * The worker pool mounts the worker Secret and gets
#     `NOETL_TLS_CLIENT_CERT` / `NOETL_TLS_CLIENT_KEY` / `NOETL_TLS_CA`, plus
#     an `https://` `NOETL_SERVER_URL`.  Its `wait-for-api` init container is
#     rewritten to curl the mTLS endpoint WITH the client cert.
#
# The env contract above is the Rust noetl-server / noetl-worker contract
# (`noetl/server` v2.30.0+, `noetl/worker` v5.12.0+).  Under a Python-image
# server / worker the env vars are no-ops — Python ignores unknown env, so
# setting `tls.enabled: true` on a Python-stack deployment is a misconfig the
# operator catches at probe time (the listener is still plain HTTP, the
# server cert is unused).  Helm-managed cutover to the Rust binaries is a
# separate concern.
#
# The kind reference for the same shape lives at
# `ci/manifests/noetl/tls/` (Phase 4c, ops#163).
tls:
  enabled: false
  # When true, the server requires + verifies client certs (`mtls=true`).
  # When false, the server serves HTTPS but accepts any client (server-only
  # TLS — useful when a service mesh sidecar handles client identity).
  mtls:
    enabled: true
  certManager:
    # When false, the chart skips creating Certificate / Issuer resources and
    # assumes the operator has materialised the Secrets named below by some
    # other means (a Kubernetes Secret committed via SealedSecrets, an
    # external-secrets operator, etc.).
    enabled: true
    issuerRef:
      # The cert-manager Issuer that signs the server + worker leaf certs.
      # On kind use the in-cluster `noetl-ca-issuer` from
      # `ci/manifests/noetl/tls/certificates.yaml` (set `bootstrap.enabled:
      # true` below to have the chart issue it).  On GKE point this at a
      # `ClusterIssuer` backed by GCP Certificate Authority Service or a
      # SPIRE/SPIFFE federation.
      name: noetl-ca-issuer
      kind: Issuer  # or ClusterIssuer
    # When `bootstrap.enabled: true` the chart provisions a self-signed CA
    # Issuer + CA Certificate + the CA Issuer that signs the leaf certs.
    # For non-prod / smoke tests — production points `issuerRef` at an
    # external issuer (GCP CAS / SPIRE) and leaves this off.
    bootstrap:
      enabled: false
      caCertificateName: noetl-ca
      caSecretName: noetl-ca-tls
      caDuration: 87600h   # 10y
    server:
      # Name of the Secret cert-manager materialises with the server cert.
      secretName: noetl-server-tls
      # Subject alt names included on the server cert.  When empty the
      # chart uses `noetl-server.<namespace>.svc[.cluster.local]` + the
      # in-cluster Service short name + `localhost` (port-forward).
      dnsNames: []
      duration: 8760h      # 1y
      renewBefore: 720h    # 30d
    worker:
      secretName: noetl-worker-tls
      duration: 8760h
      renewBefore: 720h

persistence:
  data:
    enabled: true
    name: noetl-data-shared
    accessMode: ReadWriteMany
    size: 10Gi
    storageClassName: standard-rwx
  logs:
    enabled: true
    name: noetl-logs
    accessMode: ReadWriteOnce
    size: 5Gi
    storageClassName: standard

objectStore:
  enabled: true
  kind: seaweedfs # seaweedfs | rustfs
  replicas: 1
  namespace: object-store
  serviceName: object-store
  port: 9000
  bucket: noetl
  credentials:
    accessKey: noetl-access
    secretKey: noetl-secret
  image:
    seaweedfs:
      repository: chrislusf/seaweedfs
      tag: "3.97"
      pullPolicy: IfNotPresent
    rustfs:
      repository: rustfs/rustfs
      tag: latest
      pullPolicy: IfNotPresent
  storage:
    name: object-store-data
    size: 50Gi
    storageClassName: ""
    hostPath: ""
  service:
    type: ClusterIP
    nodePort: null

config:
  server:
    TZ: "UTC"
    LOG_LEVEL: "INFO"
    PYTHONPATH: "/opt/noetl"
    NOETL_RUN_MODE: "server"
    NOETL_DATA_DIR: "/opt/noetl/data"
    NOETL_DEBUG: "false"
    NOETL_HTTP_MOCK_LOCAL: "false"
    PAGINATION_API_URL: "http://paginated-api.test-server.svc.cluster.local:5555"
    NOETL_SERVER_URL: "http://noetl.noetl.svc.cluster.local:8082"
    NOETL_DISABLE_METRICS: "true"
    NOETL_WORKER_METRICS_HOST: "0.0.0.0"
    NOETL_WORKER_METRICS_PORT: "9091"
    NOETL_VICTORIALOGS_URL: ""
    NOETL_LOG_FORMAT: "json"
    NATS_USER: "noetl"
    NATS_PASSWORD: "noetl"
    NATS_STREAM: "NOETL_COMMANDS"
    NATS_CONSUMER: "noetl_worker_pool"
    NATS_SUBJECT: "noetl.commands"
    NOETL_KEYCHAIN_REFRESH_THRESHOLD: "900"
    NOETL_ENABLE_UI: "true"
    NOETL_HOST: "0.0.0.0"
    NOETL_PORT: "8082"
    NOETL_SERVER_NAME: "server-k8s"
    NOETL_SERVER: "uvicorn"
    NOETL_SERVER_WORKERS: "1"
    NOETL_SERVER_RELOAD: "false"
    NOETL_AUTO_RECREATE_RUNTIME: "true"
    NOETL_HEARTBEAT_RETRY_AFTER: "3"
    NOETL_RUNTIME_SWEEP_INTERVAL: "15"
    NOETL_RUNTIME_OFFLINE_SECONDS: "180"
    NOETL_COMMAND_CLAIM_LEASE_SECONDS: "180"
    NOETL_COMMAND_WORKER_HEARTBEAT_STALE_SECONDS: "90"
    NOETL_COMMAND_CLAIM_HEALTHY_WORKER_HARD_TIMEOUT_SECONDS: "300"
    NOETL_COMMAND_REAPER_INTERVAL_SECONDS: "30"
    NOETL_COMMAND_REAPER_WORKER_STALE_SECONDS: "180"
    NOETL_COMMAND_REAPER_HEALTHY_HARD_TIMEOUT_SECONDS: "300"
    NOETL_SERVER_METRICS_INTERVAL: "60"
    # Enable the transactional outbox + NATS event mirror.  Without
    # this flag every event append skips the outbox and the
    # NATSEventPublisher never publishes anything on
    # ``noetl.events.{tenant}.{org}.{exec_id}.{shard}``.  The gateway's
    # ``playbook_state_listener`` subscribes to that subject; with the
    # flag off it receives zero ``playbook.completed`` messages and the
    # travel SPA hangs at ``Muno is planning…`` indefinitely.  Mirror
    # the value to ``config.worker`` below — both producers feed the
    # same outbox.
    #
    # See ``noetl/server/api/broker/service.py:_is_event_mirror_enabled``,
    # ``noetl/core/event_store/postgres.py``, and the corresponding
    # static manifest in ``ci/manifests/noetl/configmap-server.yaml:25``
    # which already had it on.  The chart was missing this entry, so
    # Helm-deployed clusters silently ran with the publisher disabled.
    NOETL_EVENT_MIRROR_ENABLED: "true"
    POSTGRES_HOST: "postgres.postgres.svc.cluster.local"
    POSTGRES_PORT: "5432"
    NOETL_POSTGRES_DB: "noetl"
    NOETL_USER: "noetl"
    NOETL_SCHEMA: "noetl"
    NOETL_DB_STARTUP_TIMEOUT: "180"
    NOETL_DB_RETRY_INTERVAL: "5"
    NOETL_POSTGRES_POOL_MIN_SIZE: "2"
    NOETL_POSTGRES_POOL_MAX_SIZE: "12"
    NOETL_POSTGRES_POOL_MAX_WAITING: "200"
    NOETL_POSTGRES_POOL_TIMEOUT_SECONDS: "30"
    NOETL_CLAIM_DB_ACQUIRE_TIMEOUT_SECONDS: "0.25"
    NOETL_COMMAND_CLAIM_RETRY_AFTER_SECONDS: "2"
    NOETL_TEMPSTORE_MAX_REF_CACHE_ENTRIES: "50000"
    NOETL_TEMPSTORE_MAX_MEMORY_CACHE_ENTRIES: "20000"
    # GKE production cloud spillover tier. Keep the S3-compatible object-store
    # env below available for direct callers and rollback.
    NOETL_STORAGE_CLOUD_TIER: "gcs"
    NOETL_GCS_BUCKET: "noetl-demo-output"
    NOETL_GCS_PREFIX: "results/"
    # S3-compatible object-store configuration (SeaweedFS by default, RustFS opt-in).
    NOETL_S3_ENDPOINT: "http://object-store.object-store.svc.cluster.local:9000"
    NOETL_S3_BUCKET: "noetl"
    NOETL_S3_REGION: "us-east-1"
    AWS_ACCESS_KEY_ID: "noetl-access"
    AWS_SECRET_ACCESS_KEY: "noetl-secret"
  worker:
    TZ: "UTC"
    LOG_LEVEL: "INFO"
    PYTHONPATH: "/opt/noetl"
    NOETL_RUN_MODE: "worker"
    NOETL_DATA_DIR: "/opt/noetl/data"
    NOETL_DEBUG: "false"
    NOETL_HTTP_MOCK_LOCAL: "false"
    PAGINATION_API_URL: "http://paginated-api.test-server.svc.cluster.local:5555"
    NOETL_SERVER_URL: "http://noetl.noetl.svc.cluster.local:8082"
    NOETL_DISABLE_METRICS: "true"
    NOETL_VICTORIALOGS_URL: ""
    NOETL_LOG_FORMAT: "json"
    NATS_USER: "noetl"
    NATS_PASSWORD: "noetl"
    NATS_STREAM: "NOETL_COMMANDS"
    NATS_CONSUMER: "noetl_worker_pool"
    NATS_SUBJECT: "noetl.commands"
    NOETL_WORKER_NATS_FETCH_TIMEOUT_SECONDS: "30"
    NOETL_WORKER_NATS_FETCH_HEARTBEAT_SECONDS: "5"
    NOETL_WORKER_NATS_MAX_ACK_PENDING: "64"
    NOETL_WORKER_NATS_MAX_DELIVER: "1000"
    NOETL_CLUSTER_ID: ""
    NOETL_REGION: ""
    NOETL_ZONE: ""
    NOETL_KEYCHAIN_REFRESH_THRESHOLD: "900"
    NOETL_WORKER_MAX_INFLIGHT_COMMANDS: "8"
    NOETL_WORKER_MAX_INFLIGHT_DB_COMMANDS: "3"
    NOETL_WORKER_THROTTLE_POLL_INTERVAL_SECONDS: "0.2"
    NOETL_WORKER_POSTGRES_POOL_WAITING_THRESHOLD: "2"
    NOETL_COMMAND_HEARTBEAT_INTERVAL_SECONDS: "10"
    NOETL_COMMAND_HEARTBEAT_TIMEOUT_SECONDS: "10"
    NOETL_COMMAND_HEARTBEAT_MAX_RETRIES: "2"
    NOETL_CURSOR_FRAME_EVENT_TIMEOUT_SECONDS: "30"
    NOETL_CURSOR_FRAME_EVENT_MAX_RETRIES: "3"
    # Enable the transactional outbox + NATS event mirror on the
    # worker.  Mirrors the same-named entry under ``config.server``
    # above — see that block's comment for why the gateway needs
    # NATS-published events on ``noetl.events.{tenant}.{org}.{exec_id}.{shard}``.
    NOETL_EVENT_MIRROR_ENABLED: "true"
    # Inline-trivial-children execution mode (Round A detector / Round B
    # runner; see https://github.com/noetl/noetl/wiki/inline_execution and
    # https://github.com/noetl/noetl/wiki/inline_runner). Three values:
    #   - off (default): no detector call; zero overhead.
    #   - dry_run: detector runs + attaches meta.inline_decision to events;
    #              dispatch path unchanged (HTTP+NATS for every child).
    #   - enforce: detector-approved children run inline in the worker
    #              process, skipping the /api/execute + NATS round-trip
    #              (~5x faster on the validated firestore/vertex-ai-stub
    #              shape). Detector-declined children still go through
    #              dispatch — the detector is the safety net.
    # Default ``off`` because operators should validate Phase D
    # (latency, cancel cascade, payload parity) on their cluster before
    # flipping to enforce. Override per-cluster via Helm --set or a
    # values overlay (see gcp_gke/noetl_gke_fresh_stack.yaml for the
    # demo cluster's enforce override).
    NOETL_INLINE_TRIVIAL_CHILDREN: "off"
    # Result storage configuration (tiered hot/warm/cold cache, phase 1).
    NOETL_INLINE_MAX_BYTES: "65536"
    NOETL_PREVIEW_MAX_BYTES: "1024"
    NOETL_DEFAULT_STORAGE_TIER: "kv"
    NOETL_TEMPSTORE_MAX_REF_CACHE_ENTRIES: "50000"
    NOETL_TEMPSTORE_MAX_MEMORY_CACHE_ENTRIES: "20000"
    NOETL_POSTGRES_POOL_MIN_SIZE: "1"
    NOETL_POSTGRES_POOL_MAX_SIZE: "8"
    NOETL_POSTGRES_POOL_MAX_WAITING: "100"
    NOETL_POSTGRES_POOL_TIMEOUT_SECONDS: "30"
    # Cloud durable tier for DISK async spill. GKE uses GCS; the
    # S3-compatible object-store env below stays available for direct callers
    # and rollback.
    NOETL_STORAGE_CLOUD_TIER: "gcs"
    NOETL_GCS_BUCKET: "noetl-demo-output"
    NOETL_GCS_PREFIX: "results/"
    NOETL_S3_ENDPOINT: "http://object-store.object-store.svc.cluster.local:9000"
    NOETL_S3_BUCKET: "noetl"
    NOETL_S3_REGION: "us-east-1"
    AWS_ACCESS_KEY_ID: "noetl-access"
    AWS_SECRET_ACCESS_KEY: "noetl-secret"
    # DISK tier (phase 1 DiskCacheBackend) uses the shared PVC at NOETL_DATA_DIR.
    # 2 GB data pool (~90%) + 256 MB meta pool (~10%) fit inside 10Gi RWX PVC.
    NOETL_STORAGE_LOCAL_CACHE_DIR: "/opt/noetl/data/disk_cache"
    NOETL_STORAGE_LOCAL_DATA_CACHE_CAPACITY_MB: "2048"
    NOETL_STORAGE_LOCAL_META_CACHE_CAPACITY_MB: "256"
    # Rate limit bytes/sec. Keep sustained writes below device saturation;
    # 200 MB/s is conservative for local NVMe and typical cloud block storage.
    NOETL_STORAGE_LOCAL_CACHE_INSERT_RATE_MB: "200"
    # Quiet = re-index cache on worker restart for warm replay performance.
    NOETL_STORAGE_LOCAL_CACHE_RECOVER_MODE: "Quiet"
  projector:
    TZ: "UTC"
    LOG_LEVEL: "INFO"
    PYTHONPATH: "/opt/noetl"
    NOETL_RUN_MODE: "projector"
    NOETL_LOG_FORMAT: "json"
    NOETL_SERVER_URL: "http://noetl.noetl.svc.cluster.local:8082"
    NOETL_SERVER: "uvicorn"
    NOETL_SERVER_WORKERS: "1"
    NOETL_SERVER_RELOAD: "false"
    NOETL_PROJECTOR_NATS_STREAM: "NOETL_EVENTS"
    NOETL_PROJECTOR_NATS_SUBJECT: "noetl.events.>"
    NOETL_PROJECTOR_MAX_INFLIGHT: "8"
    NOETL_PROJECTOR_NATS_MAX_ACK_PENDING: "64"
    NOETL_PROJECTOR_NATS_FETCH_TIMEOUT_SECONDS: "30"
    NOETL_PROJECTOR_NATS_FETCH_HEARTBEAT_SECONDS: "5"
    NOETL_PROJECTOR_METRICS_PORT: "9090"
    POSTGRES_HOST: "postgres.postgres.svc.cluster.local"
    POSTGRES_PORT: "5432"
    NOETL_POSTGRES_DB: "noetl"
    NOETL_USER: "noetl"
    NOETL_SCHEMA: "noetl"
    NOETL_POSTGRES_POOL_MIN_SIZE: "1"
    NOETL_POSTGRES_POOL_MAX_SIZE: "4"
    NOETL_POSTGRES_POOL_MAX_WAITING: "50"
    NOETL_POSTGRES_POOL_TIMEOUT_SECONDS: "30"
  outboxPublisher:
    TZ: "UTC"
    LOG_LEVEL: "INFO"
    PYTHONPATH: "/opt/noetl"
    NOETL_RUN_MODE: "outbox-publisher"
    NOETL_LOG_FORMAT: "json"
    NOETL_EVENT_NATS_STREAM: "NOETL_EVENTS"
    NOETL_EVENT_NATS_SUBJECT_PREFIX: "noetl.events"
    NOETL_OUTBOX_PUBLISHER_BATCH_SIZE: "100"
    NOETL_OUTBOX_PUBLISHER_IDLE_SLEEP_SECONDS: "1"
    NOETL_OUTBOX_PUBLISHER_ERROR_SLEEP_SECONDS: "5"
    POSTGRES_HOST: "postgres.postgres.svc.cluster.local"
    POSTGRES_PORT: "5432"
    NOETL_POSTGRES_DB: "noetl"
    NOETL_USER: "noetl"
    NOETL_SCHEMA: "noetl"
    NOETL_POSTGRES_POOL_MIN_SIZE: "1"
    NOETL_POSTGRES_POOL_MAX_SIZE: "4"
    NOETL_POSTGRES_POOL_MAX_WAITING: "50"
    NOETL_POSTGRES_POOL_TIMEOUT_SECONDS: "30"
  workerPool:
    RUST_LOG: "info,worker_pool=debug,noetl_tools=debug"
    WORKER_POOL_NAME: "worker-rust-pool"
    NOETL_SERVER_URL: "http://noetl.noetl.svc.cluster.local:8082"
    NATS_STREAM: "NOETL_COMMANDS"
    NATS_CONSUMER: "noetl_worker_pool"
    WORKER_HEARTBEAT_INTERVAL: "15"
    WORKER_MAX_CONCURRENT: "4"

# Optional AI-bridge sidecar.
#
# Disabled by default — the chart's optional-dependency contract
# means a NoETL deployment without AI features must keep working.
# Operators opt in by setting `ollamaBridge.enabled: true` and
# pointing `ollama.url` at their Ollama instance (in-cluster
# StatefulSet, external endpoint, etc.).
#
# What this deploys when enabled:
#   - Deployment running `python -m noetl.tools.ollama_bridge`
#     out of the same noetl image (the bridge ships in
#     noetl.tools.ollama_bridge, so no separate image is needed)
#   - ClusterIP Service on port 8765 reachable in-cluster as
#     `ollama-bridge.<namespace>.svc.cluster.local:8765`
#
# Once deployed, register the catalog template at
# noetl/tools/ollama_bridge/catalog_template.yaml so playbooks
# can call `tool: kind: mcp server: mcp/ollama tool: chat ...`.
# See docs/operations/ollama_bridge.md for the full runbook.
ollamaBridge:
  enabled: false
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  image:
    # Override only when running a non-default bridge image. Empty
    # values fall back to the chart-level `image.repository` /
    # `image.tag` so most deployments only have to bump one tag.
    repository: ""
    tag: ""
    pullPolicy: ""
  service:
    type: ClusterIP
    port: 8765
  bridge:
    host: "0.0.0.0"
  ollama:
    # URL of the Ollama instance the bridge fronts. Default points
    # at an in-cluster Ollama service in the noetl namespace; for
    # remote / external Ollama, set this to the reachable URL.
    url: "http://ollama.noetl.svc.cluster.local:11434"
    # Wall-clock timeout for upstream calls. 120s covers cold-start
    # model loads on commodity CPU; tune down for warm fleets.
    timeoutSeconds: 120
  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  # Schedule the bridge close to the Ollama backend it talks to.
  # Empty defaults — operators set these when they want GPU-pinning
  # or AZ-affinity.
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # Extra env vars merged into the container spec — useful for
  # propagating site-specific values (proxy settings, custom
  # logging targets, etc.) without forking the chart.
  extraEnv: []

ollama:
  enabled: false
  replicas: 1
  strategy:
    type: Recreate
  image:
    repository: ollama/ollama
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 11434
  models:
    default: gemma3:4b
  persistence:
    enabled: true
    name: ollama-data
    accessMode: ReadWriteOnce
    size: 20Gi
    storageClassName: standard
  resources:
    requests:
      cpu: "500m"
      memory: "8Gi"
    limits:
      cpu: "2"
      memory: "10Gi"
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: []

secrets:
  postgresPassword: "demo"
  noetlPassword: "noetl"
