apiVersion: noetl.io/v2
kind: Playbook
metadata:
  name: playbook_composition_parent
  path: automation/examples/composition

executor:
  profile: local
  version: noetl-runtime/1
workload:
  environment: "production"
  version: "v2.5.3"

workflow:
  - step: start
    desc: "Parent playbook that calls child playbooks"
    tool:
      kind: noop
    next:
      spec:
        mode: exclusive
      arcs:
        - step: call_build

  - step: call_build
    desc: "Call build playbook"
    input:
      image_tag: "{{ workload.version }}"
      build_env: "{{ workload.environment }}"
    tool:
      kind: playbook
      path: ./build_child.yaml
      input:
        image_tag: "{{ input.image_tag }}"
        build_env: "{{ input.build_env }}"
    next:
      spec:
        mode: exclusive
      arcs:
        - step: call_deploy

  - step: call_deploy
    desc: "Call deploy playbook"
    input:
      image_tag: "{{ workload.version }}"
      target_env: "{{ workload.environment }}"
    tool:
      kind: playbook
      path: ./deploy_child.yaml
      input:
        image_tag: "{{ input.image_tag }}"
        target_env: "{{ input.target_env }}"
    next:
      spec:
        mode: exclusive
      arcs:
        - step: end

  - step: end
    desc: End workflow
    tool:
      kind: noop
