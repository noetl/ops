apiVersion: noetl.io/v2
kind: Playbook
metadata:
  name: gui_development_deploy
  path: automation/development/gui
  description: Build/load/deploy helpers for standalone GUI in local kind (direct NoETL API mode)

executor:
  profile: local
  version: noetl-runtime/1

workload:
  action: help # build, load, deploy, redeploy, status
  image_repository: localhost/local/noetl-gui
  image_tag: ""
  gui_repo_dir: "../gui"
  expected_kube_context: "kind-noetl"
  kind_cluster_name: "noetl"
  gui_namespace: "gui"
  gui_release_name: "noetl-gui"
  gui_service_type: "NodePort"
  gui_node_port: 30081
  image_pull_policy: "IfNotPresent"
  build_platform: "linux/arm64"
  api_mode: "direct"
  api_base_url: "http://722-2.local:8082"
  allow_skip_auth: "true"
  gateway_url: ""
  auth0_domain: ""
  auth0_client_id: ""
  auth0_redirect_uri: ""

workflow:
  - step: run
    desc: Run selected action
    tool:
      kind: shell
      cmds:
        - |
          set -euo pipefail
          ACTION="{{ workload.action }}"
          GUI_REPO="{{ workload.gui_repo_dir }}"
          IMAGE_REPOSITORY="{{ workload.image_repository }}"
          IMAGE_TAG_OVERRIDE="{{ workload.image_tag }}"
          EXPECTED_CONTEXT="{{ workload.expected_kube_context }}"
          KIND_CLUSTER_NAME="{{ workload.kind_cluster_name }}"
          GUI_NAMESPACE="{{ workload.gui_namespace }}"
          GUI_RELEASE_NAME="{{ workload.gui_release_name }}"
          GUI_SERVICE_TYPE="{{ workload.gui_service_type }}"
          GUI_NODE_PORT="{{ workload.gui_node_port }}"
          IMAGE_PULL_POLICY="{{ workload.image_pull_policy }}"
          BUILD_PLATFORM="{{ workload.build_platform }}"
          API_MODE="{{ workload.api_mode }}"
          API_BASE_URL="{{ workload.api_base_url }}"
          ALLOW_SKIP_AUTH="{{ workload.allow_skip_auth }}"
          GATEWAY_URL="{{ workload.gateway_url }}"
          AUTH0_DOMAIN="{{ workload.auth0_domain }}"
          AUTH0_CLIENT_ID="{{ workload.auth0_client_id }}"
          AUTH0_REDIRECT_URI="{{ workload.auth0_redirect_uri }}"

          LAST_TAG_FILE=".gui_last_build_tag.txt"
          CONTAINER_CLI=""

          detect_container_cli() {
            if command -v docker >/dev/null 2>&1; then
              CONTAINER_CLI="docker"
              return
            fi
            if command -v podman >/dev/null 2>&1; then
              CONTAINER_CLI="podman"
              return
            fi
            echo "ERROR: neither docker nor podman is available in PATH"
            exit 1
          }

          ensure_repo() {
            if [ ! -d "$GUI_REPO" ]; then
              echo "ERROR: GUI repository not found: $GUI_REPO"
              exit 1
            fi
            if [ ! -f "$GUI_REPO/Dockerfile" ]; then
              echo "ERROR: GUI Dockerfile not found at $GUI_REPO/Dockerfile"
              exit 1
            fi
          }

          ensure_kind_context() {
            CURRENT_CONTEXT=$(kubectl config current-context 2>/dev/null || echo "none")
            if [ "$CURRENT_CONTEXT" = "none" ]; then
              echo "ERROR: No kubernetes context selected."
              echo "Set context to $EXPECTED_CONTEXT before deploy/status actions."
              exit 1
            fi
            if [ "$CURRENT_CONTEXT" != "$EXPECTED_CONTEXT" ]; then
              echo "ERROR: Refusing to run local kind deploy against context '$CURRENT_CONTEXT'."
              echo "Expected context: '$EXPECTED_CONTEXT'"
              echo "Run: kubectl config use-context $EXPECTED_CONTEXT"
              exit 1
            fi
          }

          kind_load_image() {
            local image="$1"
            if kind load docker-image "$image" --name "$KIND_CLUSTER_NAME"; then
              return
            fi

            local archive="/tmp/$(echo "$image" | tr '/:' '__').tar"
            if [ "$CONTAINER_CLI" = "docker" ]; then
              docker save -o "$archive" "$image"
            else
              podman save -o "$archive" "$image"
            fi
            kind load image-archive "$archive" --name "$KIND_CLUSTER_NAME"
            rm -f "$archive"
          }

          build() {
            ensure_repo
            detect_container_cli
            IMAGE_TAG=$(date +%Y-%m-%d-%H-%M)
            IMAGE="$IMAGE_REPOSITORY:$IMAGE_TAG"

            if [ "$CONTAINER_CLI" = "docker" ]; then
              docker buildx build --load --platform "$BUILD_PLATFORM" \
                -t "$IMAGE" \
                -f "$GUI_REPO/Dockerfile" "$GUI_REPO"
            else
              podman build --platform "$BUILD_PLATFORM" \
                -t "$IMAGE" \
                -f "$GUI_REPO/Dockerfile" "$GUI_REPO"
            fi

            echo "$IMAGE_TAG" > "$LAST_TAG_FILE"
            echo "Built $IMAGE"
          }

          load() {
            detect_container_cli
            if [ ! -f "$LAST_TAG_FILE" ]; then
              echo "ERROR: $LAST_TAG_FILE not found. Run action=build first."
              exit 1
            fi
            IMAGE_TAG=$(cat "$LAST_TAG_FILE")
            IMAGE="$IMAGE_REPOSITORY:$IMAGE_TAG"
            echo "Loading $IMAGE into kind cluster '$KIND_CLUSTER_NAME'..."
            kind_load_image "$IMAGE"
          }

          deploy() {
            ensure_kind_context
            if [ -n "$IMAGE_TAG_OVERRIDE" ]; then
              IMAGE_TAG="$IMAGE_TAG_OVERRIDE"
            elif [ -f "$LAST_TAG_FILE" ]; then
              IMAGE_TAG=$(cat "$LAST_TAG_FILE")
            else
              echo "ERROR: $LAST_TAG_FILE not found. Run action=build first."
              echo "       Or provide --set image_tag=<tag> for a registry image deploy."
              exit 1
            fi

            helm upgrade --install "$GUI_RELEASE_NAME" automation/gcp_gke/helm/gui \
              --namespace "$GUI_NAMESPACE" --create-namespace \
              --set image.repository="$IMAGE_REPOSITORY" \
              --set image.tag="$IMAGE_TAG" \
              --set image.pullPolicy="$IMAGE_PULL_POLICY" \
              --set service.type="$GUI_SERVICE_TYPE" \
              --set service.nodePort="$GUI_NODE_PORT" \
              --set env.apiMode="$API_MODE" \
              --set env.apiBaseUrl="$API_BASE_URL" \
              --set env.allowSkipAuth="$ALLOW_SKIP_AUTH" \
              --set env.gatewayUrl="$GATEWAY_URL" \
              --set env.auth0Domain="$AUTH0_DOMAIN" \
              --set env.auth0ClientId="$AUTH0_CLIENT_ID" \
              --set env.auth0RedirectUri="$AUTH0_REDIRECT_URI"

            kubectl -n "$GUI_NAMESPACE" rollout status deployment/gui --timeout=180s
          }

          status() {
            ensure_kind_context
            kubectl get ns "$GUI_NAMESPACE" >/dev/null 2>&1 || {
              echo "Namespace '$GUI_NAMESPACE' not found"
              exit 0
            }
            kubectl -n "$GUI_NAMESPACE" get deploy,svc,pods -o wide
          }

          case "$ACTION" in
            build)
              build
              ;;
            load)
              load
              ;;
            deploy)
              deploy
              ;;
            redeploy)
              build
              load
              deploy
              status
              ;;
            status)
              status
              ;;
            help|*)
              echo "Usage:"
              echo "  noetl run automation/development/gui.yaml --runtime local --set action=<action>"
              echo ""
              echo "Actions: build, load, deploy, redeploy, status"
              echo ""
              echo "Direct API settings:"
              echo "  --set api_mode=direct"
              echo "  --set api_base_url=http://722-2.local:8082"
              echo "  --set allow_skip_auth=true"
              echo ""
              echo "Auth/gateway optional settings:"
              echo "  --set gateway_url=http://gateway.example.com"
              echo "  --set auth0_domain=<tenant>.us.auth0.com"
              echo "  --set auth0_client_id=<client-id>"
              echo "  --set auth0_redirect_uri=http://722-2.local:38081/login"
              echo ""
              echo "Other useful overrides:"
              echo "  --set gui_repo_dir=../gui"
              echo "  --set image_repository=localhost/local/noetl-gui"
              echo "  --set image_tag=v1.0.5"
              echo "  --set gui_namespace=gui"
              echo "  --set gui_service_type=NodePort"
              echo "  --set gui_node_port=30081"
              ;;
          esac
    next:
      - step: end

  - step: end
    desc: End workflow
    tool:
      kind: noop
