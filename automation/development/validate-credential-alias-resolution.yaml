# Phase #48 validation fixture — postgres step using a credential alias.
#
# The `auth: "{{ pg_auth }}"` template (resolves to `auth: "pg_local"`)
# is the shape that previously blew up on the Rust worker with
# `invalid type: string "pg_local", expected struct AuthConfig`.
# After the resolution helper lands in noetl/worker, the worker
# fetches `pg_local` via `/api/credentials/pg_local`, strips the
# `auth` field, and merges the credential's `db_*` fields into the
# postgres tool's flat connection-config slots.
#
# The query is harmless (SELECT 1); the goal is purely to assert the
# Rust worker dispatches the postgres step end-to-end without the
# AuthConfig serde error.
apiVersion: noetl.io/v2
kind: Playbook
metadata:
  name: credential_alias_resolution_test
  path: tests/fixtures/credential_alias_resolution
  description: |
    Phase #48 fixture — minimal postgres step with `auth: "<alias>"`
    that exercises the worker-side keychain resolution path.

executor:
  profile: local
  version: noetl-runtime/1

workload:
  pg_auth: pg_local

workflow:
  - step: probe
    desc: SELECT 1 against the resolved alias
    tool:
      kind: postgres
      auth: "{{ pg_auth }}"
      # The Rust postgres tool's `PostgresConfig` reads the SQL from
      # `query:` (matches the noetl-tools struct shape).  Python
      # playbooks often use `command:` for the same purpose; the
      # regression playbooks that fed #48 use `command:` too — that's
      # a separate translation concern, out of scope for the
      # alias-resolution validation here.
      query: |
        SELECT 1 AS one;
