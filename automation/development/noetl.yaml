apiVersion: noetl.io/v2
kind: Playbook
metadata:
  name: noetl_development_deploy
  path: automation/development/noetl
  description: Build/load/deploy helpers for NoETL in local kind

executor:
  profile: local
  version: noetl-runtime/1

workload:
  action: help # build, load, deploy, redeploy, status, reset
  registry: local
  image_name: noetl
  image_tag: ""
  image_pull_policy: "Never"
  noetl_repo_dir: "../noetl"
  e2e_repo_dir: "../e2e"
  expected_kube_context: "kind-noetl"
  force_test_server_build: "false"
  verify_test_server_contract: "true"

  # Podman machine name to require when running build/load/deploy on
  # macOS. Set to the empty string ("") to skip the check entirely —
  # useful for setups where kind runs on Podman Desktop, native podman,
  # or directly inside Linux without a separate Podman machine.
  # The default preserves the in-tree expectation that has shipped
  # since the deploy helper was authored.
  podman_machine: "noetl-dev"

workflow:
  - step: run
    desc: Run selected action
    tool:
      kind: shell
      cmds:
        - |
          set -euo pipefail
          ACTION="{{ workload.action }}"
          NOETL_REPO="{{ workload.noetl_repo_dir }}"
          E2E_REPO="{{ workload.e2e_repo_dir }}"
          REGISTRY="{{ workload.registry }}"
          IMAGE_NAME="{{ workload.image_name }}"
          IMAGE_TAG_OVERRIDE="{{ workload.image_tag }}"
          IMAGE_PULL_POLICY="{{ workload.image_pull_policy }}"
          EXPECTED_CONTEXT="{{ workload.expected_kube_context }}"
          PODMAN_MACHINE="{{ workload.podman_machine }}"
          FORCE_TEST_SERVER_BUILD="{{ workload.force_test_server_build }}"
          VERIFY_TEST_SERVER_CONTRACT="{{ workload.verify_test_server_contract }}"

          is_truthy() {
            case "$(printf '%s' "${1:-}" | tr '[:upper:]' '[:lower:]')" in
              1|true|yes|y|on) return 0 ;;
              *) return 1 ;;
            esac
          }

          detect_lan_host() {
            local host=""
            if [ -n "${NOETL_HOST:-}" ]; then
              echo "$NOETL_HOST"
              return
            fi
            if command -v scutil >/dev/null 2>&1; then
              host="$(scutil --get LocalHostName 2>/dev/null || true)"
            fi
            if [ -z "$host" ]; then
              host="$(hostname -s 2>/dev/null || hostname 2>/dev/null || true)"
            fi
            if [ -z "$host" ]; then
              echo "localhost"
            elif echo "$host" | grep -q '\.'; then
              echo "$host"
            else
              echo "${host}.local"
            fi
          }

          prepare_podman_storage() {
            podman system prune -f >/dev/null 2>&1 || true
          }

          resolve_latest_local_tag() {
            local tag=""
            tag="$(podman image ls "$REGISTRY/$IMAGE_NAME" --format '{{.Tag}}' | grep -v '<none>' | head -n1 || true)"
            if [ -z "$tag" ]; then
              tag="$(podman image ls "localhost/$REGISTRY/$IMAGE_NAME" --format '{{.Tag}}' | grep -v '<none>' | head -n1 || true)"
            fi
            echo "$tag"
          }

          ensure_local_image_aliases() {
            # Podman often stores unqualified local images as localhost/<name>.
            # Keep both aliases available so manifests and kind load use a stable reference.
            local image="$1"
            local alt="localhost/$image"
            local has_image=0
            local has_alt=0

            if podman image inspect "$image" >/dev/null 2>&1; then
              has_image=1
            fi

            if podman image inspect "$alt" >/dev/null 2>&1; then
              has_alt=1
            fi

            if [ "$has_image" -eq 0 ] && [ "$has_alt" -eq 0 ]; then
              return 1
            fi

            if [ "$has_image" -eq 1 ] && [ "$has_alt" -eq 0 ]; then
              podman image tag "$image" "$alt"
            elif [ "$has_image" -eq 0 ] && [ "$has_alt" -eq 1 ]; then
              podman image tag "$alt" "$image"
            fi

            return 0
          }

          kind_load_one_image() {
            local image="$1"

            if kind load docker-image "$image" --name noetl >/tmp/noetl-kind-load-image.log 2>&1; then
              rm -f /tmp/noetl-kind-load-image.log
              return 0
            fi

            # Fallback: load image archive when direct load fails under podman provider.
            echo "Direct kind image load did not find $image; falling back to podman image archive."
            local archive="/tmp/$(echo "$image" | tr '/:' '__').tar"
            podman save -o "$archive" "$image"
            kind load image-archive "$archive" --name noetl
            rm -f "$archive"
            rm -f /tmp/noetl-kind-load-image.log
          }

          kind_load_image() {
            local image="$1"
            local alt="localhost/$image"

            if ! ensure_local_image_aliases "$image"; then
              echo "ERROR: image '$image' not present locally (or as localhost/$image)"
              exit 1
            fi

            # Load both aliases to avoid ErrImageNeverPull due to name mismatch.
            kind_load_one_image "$image"
            kind_load_one_image "$alt"
          }

          resolve_deploy_image() {
            local image="$1"
            local alt="localhost/$image"

            if [ "${image#localhost/}" != "$image" ]; then
              echo "$image"
              return
            fi

            if podman image inspect "$alt" >/dev/null 2>&1; then
              echo "$alt"
              return
            fi

            echo "$image"
          }

          ensure_repo() {
            if [ ! -d "$NOETL_REPO" ]; then
              echo "ERROR: NoETL repository not found: $NOETL_REPO"
              exit 1
            fi
          }

          ensure_podman_running() {
            if ! command -v podman >/dev/null 2>&1; then
              echo "ERROR: Podman is required but is not installed."
              echo "Install with: brew install podman"
              exit 1
            fi
            # Empty PODMAN_MACHINE means "skip the machine check" —
            # we're running against native podman, Podman Desktop, or a
            # Linux host without a separate VM. Podman
            # is still required (above), we just don't insist on a
            # specific machine being running.
            if [ -z "$PODMAN_MACHINE" ]; then
              return 0
            fi
            if ! podman machine list 2>/dev/null | grep -q "${PODMAN_MACHINE}.*running"; then
              echo "ERROR: Podman machine '${PODMAN_MACHINE}' is not running."
              echo "Start it:    podman machine start ${PODMAN_MACHINE}"
              echo "Or override: --set podman_machine=<your-machine-name>"
              echo "Or disable:  --set podman_machine=\"\"  (skip the machine check entirely)"
              exit 1
            fi
          }

          # This playbook is the kind-cluster install path only. The GKE
          # install path lives under automation/gcp_gke/ and uses the
          # Helm chart at automation/helm/noetl/. See
          # https://github.com/noetl/ops/wiki/automation-gcp-gke.
          looks_like_managed_kubernetes() {
            # Match the well-known prefixes the major managed-Kubernetes
            # providers stamp into kubeconfig contexts. Conservative on
            # purpose — false positives here are a friendly redirect to
            # the right install path, not a data-loss event.
            case "${1:-}" in
              gke_*|arn:aws:eks:*|*.aks*|aks-*|do-*-k8s-*|*-doks-*) return 0 ;;
              *) return 1 ;;
            esac
          }

          ensure_kind_profile() {
            # Refuse to run kind-shaped build/load/deploy actions when the
            # operator points at a managed-Kubernetes cluster, whether by
            # overriding expected_kube_context or by leaving the live
            # context pointing at one.
            local override="${EXPECTED_CONTEXT:-}"
            local current="$(kubectl config current-context 2>/dev/null || true)"

            if looks_like_managed_kubernetes "$override"; then
              echo "ERROR: expected_kube_context='$override' looks like a managed-Kubernetes cluster."
              echo "       This playbook is the kind-cluster install path only."
              echo "       For GKE, use automation/gcp_gke/noetl_gke_fresh_stack.yaml."
              echo "       See https://github.com/noetl/ops/wiki/automation-gcp-gke."
              exit 1
            fi

            if [ -n "$current" ] && looks_like_managed_kubernetes "$current"; then
              echo "ERROR: Active kubectl context '$current' looks like a managed-Kubernetes cluster."
              echo "       This playbook is the kind-cluster install path only."
              echo "       For GKE, use automation/gcp_gke/noetl_gke_fresh_stack.yaml."
              echo "       See https://github.com/noetl/ops/wiki/automation-gcp-gke."
              echo "       Switch contexts first: kubectl config use-context $override"
              exit 1
            fi
          }

          ensure_kind_context() {
            ensure_kind_profile
            CURRENT_CONTEXT="$(kubectl config current-context 2>/dev/null || true)"
            if [ -z "$CURRENT_CONTEXT" ]; then
              echo "ERROR: No active kubectl context found."
              echo "Set context to $EXPECTED_CONTEXT before deploy/status actions."
              exit 1
            fi
            if [ "$CURRENT_CONTEXT" != "$EXPECTED_CONTEXT" ]; then
              echo "ERROR: Refusing to run local kind deploy against context '$CURRENT_CONTEXT'."
              echo "Expected context: '$EXPECTED_CONTEXT'"
              echo "Run: kubectl config use-context $EXPECTED_CONTEXT"
              exit 1
            fi
          }

          ensure_local_dependencies() {
            ensure_repo
            ensure_podman_running
            ensure_kind_context

            SCHEMA_DDL="$NOETL_REPO/noetl/database/ddl/postgres/schema_ddl.sql"
            TEST_SERVER_REPO="$NOETL_REPO"
            TEST_SERVER_DOCKERFILE="$NOETL_REPO/docker/test-server/Dockerfile"
            if [ -f "$E2E_REPO/docker/test-server/Dockerfile" ]; then
              TEST_SERVER_REPO="$E2E_REPO"
              TEST_SERVER_DOCKERFILE="$E2E_REPO/docker/test-server/Dockerfile"
            fi
            if [ ! -f "$SCHEMA_DDL" ]; then
              echo "ERROR: PostgreSQL schema DDL not found at $SCHEMA_DDL"
              exit 1
            fi
            if [ ! -f "$TEST_SERVER_DOCKERFILE" ]; then
              echo "ERROR: Test server Dockerfile not found."
              echo "Checked preferred e2e repo: $E2E_REPO/docker/test-server/Dockerfile"
              echo "Checked fallback noetl repo: $NOETL_REPO/docker/test-server/Dockerfile"
              exit 1
            fi

            kubectl apply -f "ci/manifests/noetl/namespace/"

            kubectl apply -f "ci/manifests/postgres/namespace/namespace.yaml"
            kubectl create configmap postgres-schema-ddl --namespace postgres \
              --from-file=schema_ddl.sql.norun="$SCHEMA_DDL" \
              --dry-run=client -o yaml | kubectl apply -f -
            kubectl apply -f "ci/manifests/postgres/config-files.yaml"
            kubectl apply -f "ci/manifests/postgres/configmap.yaml"
            kubectl apply -f "ci/manifests/postgres/secret.yaml"
            kubectl apply -f "ci/manifests/postgres/persistent-volume.yaml"
            kubectl apply -f "ci/manifests/postgres/service.yaml"
            kubectl apply -f "ci/manifests/postgres/service-external.yaml"
            kubectl apply -f "ci/manifests/postgres/deployment.yaml"

            kubectl apply -f "ci/manifests/nats/namespace.yaml"
            kubectl apply -f "ci/manifests/nats/nats.yaml"

            if is_truthy "$FORCE_TEST_SERVER_BUILD" || ! podman image inspect local/test-server:latest >/dev/null 2>&1; then
              echo "Building local test-server from $TEST_SERVER_REPO"
              podman build --platform linux/arm64 \
                -t local/test-server:latest \
                -f "$TEST_SERVER_DOCKERFILE" "$TEST_SERVER_REPO"
            else
              echo "Using existing local/test-server:latest (set force_test_server_build=true to refresh)"
            fi
            kind_load_image local/test-server:latest
            kubectl apply -f "ci/manifests/test-server/namespace.yaml"
            kubectl apply -f "ci/manifests/test-server/deployment.yaml"
            kubectl set image deployment/paginated-api -n test-server api=localhost/local/test-server:latest
            kubectl rollout restart deployment/paginated-api -n test-server

            kubectl rollout status deployment/postgres -n postgres --timeout=180s
            kubectl rollout status statefulset/nats -n nats --timeout=180s
            kubectl rollout status deployment/paginated-api -n test-server --timeout=180s

            if is_truthy "$VERIFY_TEST_SERVER_CONTRACT"; then
              verify_test_server_contract
            fi
          }

          verify_test_server_contract() {
            # `kubectl rollout status` returns once the new ReplicaSet is
            # available, but the old pod may still be in Terminating
            # state for a few seconds. `kubectl exec deployment/foo`
            # would happily pick the terminating pod, and the contract
            # script then dies with exit 137 when the pod is killed
            # mid-script. Wait for at least one fully Ready pod before
            # we exec.
            kubectl wait --for=condition=ready --timeout=60s \
              pod -n test-server -l app=paginated-api >/dev/null 2>&1 \
              || true
            local pod
            pod="$(kubectl get pod -n test-server -l app=paginated-api \
              --field-selector=status.phase=Running \
              -o jsonpath='{range .items[?(@.status.containerStatuses[0].ready==true)]}{.metadata.name}{"\n"}{end}' \
              | head -1)"
            if [ -z "$pod" ]; then
              echo "verify_test_server_contract: no Ready paginated-api pod found; skipping"
              return 0
            fi
            kubectl exec -i -n test-server "$pod" -- python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request

          BASE_URL = "http://127.0.0.1:5555"


          def get(path: str):
              return urllib.request.urlopen(f"{BASE_URL}{path}", timeout=10)


          # Wait for the uvicorn worker inside this pod to finish binding
          # its port. Right after `kubectl rollout restart`, the readiness
          # gate may report Ready before uvicorn finishes accepting on
          # 127.0.0.1:5555, which surfaces as `Errno 111 Connection
          # refused` on the very first /health call. Six 2-second
          # attempts (12s total) covers the observed gap without
          # masking real failures.
          last_error = None
          for attempt in range(6):
              try:
                  with get("/health") as response:
                      if response.status != 200:
                          raise SystemExit(f"health check returned {response.status}")
                      break
              except (urllib.error.URLError, ConnectionError) as exc:
                  last_error = exc
                  time.sleep(2)
          else:
              raise SystemExit(
                  f"health check could not reach 127.0.0.1:5555 after 6 attempts; last error: {last_error}"
              )

          comma_path = "/api/v1/pft/batch/assessments?patientIds=1%2C2&pageSize=1&patientsPerFacility=1000"
          try:
              get(comma_path)
          except urllib.error.HTTPError as exc:
              if exc.code != 410:
                  raise SystemExit(f"disabled batch endpoint returned {exc.code}, expected 410") from exc
          else:
              raise SystemExit("disabled batch endpoint was accepted; expected HTTP 410")

          repeated_path = "/api/v1/pft/batch/assessments?patientIds=1&patientIds=2&pageSize=1&patientsPerFacility=1000"
          try:
              get(repeated_path)
          except urllib.error.HTTPError as exc:
              if exc.code != 410:
                  raise SystemExit(f"disabled batch endpoint returned {exc.code}, expected 410") from exc
          else:
              raise SystemExit("disabled batch endpoint was accepted; expected HTTP 410")

          with get("/api/v1/pft/mds/details?assessmentId=MDS-contract-check") as response:
              payload = json.loads(response.read().decode("utf-8"))
              if response.status != 200:
                  raise SystemExit(f"single MDS detail returned {response.status}")
              if payload.get("rowCount") != 1:
                  raise SystemExit(f"single MDS detail returned unexpected rowCount: {payload.get('rowCount')}")

          print("test-server contract ok: batch endpoints disabled, singular MDS detail accepted")
          PY
          }

          build() {
            ensure_repo
            ensure_podman_running
            prepare_podman_storage
            PREV_TAG=""
            if [ -f .noetl_last_build_tag.txt ]; then
              PREV_TAG="$(cat .noetl_last_build_tag.txt)"
            fi

            IMAGE_TAG=$(date +%Y-%m-%d-%H-%M)
            if podman build --platform linux/arm64 \
              -t "$REGISTRY/$IMAGE_NAME:$IMAGE_TAG" \
              -f "$NOETL_REPO/docker/noetl/dev/Dockerfile" "$NOETL_REPO"; then
              ensure_local_image_aliases "$REGISTRY/$IMAGE_NAME:$IMAGE_TAG"
              echo "$IMAGE_TAG" > .noetl_last_build_tag.txt
              echo "Built $REGISTRY/$IMAGE_NAME:$IMAGE_TAG"
              return
            fi

            echo "WARNING: build failed; trying last known image tag"
            if [ -n "$PREV_TAG" ] && podman image inspect "$REGISTRY/$IMAGE_NAME:$PREV_TAG" >/dev/null 2>&1; then
              echo "$PREV_TAG" > .noetl_last_build_tag.txt
              echo "Using existing image $REGISTRY/$IMAGE_NAME:$PREV_TAG"
              return
            fi

            FALLBACK_TAG="$(resolve_latest_local_tag)"
            if [ -n "$FALLBACK_TAG" ] && podman image inspect "$REGISTRY/$IMAGE_NAME:$FALLBACK_TAG" >/dev/null 2>&1; then
              echo "$FALLBACK_TAG" > .noetl_last_build_tag.txt
              echo "Using latest available image $REGISTRY/$IMAGE_NAME:$FALLBACK_TAG"
              return
            fi

            echo "ERROR: build failed and no previous image is available"
            exit 1
          }

          load() {
            ensure_kind_profile
            ensure_podman_running
            if [ ! -f .noetl_last_build_tag.txt ]; then
              FALLBACK_TAG="$(resolve_latest_local_tag)"
              if [ -z "$FALLBACK_TAG" ]; then
                echo "ERROR: .noetl_last_build_tag.txt not found and no local image tag available. Run action=build first."
                exit 1
              fi
              echo "$FALLBACK_TAG" > .noetl_last_build_tag.txt
            fi
            prepare_podman_storage
            IMAGE_TAG=$(cat .noetl_last_build_tag.txt)
            IMAGE="$REGISTRY/$IMAGE_NAME:$IMAGE_TAG"
            kind_load_image "$IMAGE"
            echo "Loaded $IMAGE into kind"
          }

          deploy() {
            ensure_kind_context
            ensure_local_dependencies
            if [ -n "$IMAGE_TAG_OVERRIDE" ]; then
              IMAGE_TAG="$IMAGE_TAG_OVERRIDE"
            elif [ -f .noetl_last_build_tag.txt ]; then
              IMAGE_TAG=$(cat .noetl_last_build_tag.txt)
            else
              echo "ERROR: .noetl_last_build_tag.txt not found. Run action=build first."
              echo "       Or provide --set image_tag=<tag> for a registry image deploy."
              exit 1
            fi
            kubectl apply -f "ci/manifests/noetl/namespace/"
            IMAGE="$(resolve_deploy_image "$REGISTRY/$IMAGE_NAME:$IMAGE_TAG")"
            for manifest in ci/manifests/noetl/*.yaml; do
              if [ -f "$manifest" ]; then
                sed \
                  -e "s|image_name:image_tag|$IMAGE|g" \
                  "$manifest" | kubectl apply -f -
              fi
            done
            for deployment in $(kubectl get deployments -n noetl -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}'); do
              for container in $(kubectl get deployment "$deployment" -n noetl -o jsonpath='{range .spec.template.spec.containers[*]}{.name}{"\n"}{end}'); do
                kubectl patch deployment "$deployment" -n noetl --type=strategic \
                  -p "{\"spec\":{\"template\":{\"spec\":{\"containers\":[{\"name\":\"$container\",\"imagePullPolicy\":\"$IMAGE_PULL_POLICY\"}]}}}}"
              done
            done
            kubectl rollout restart deployment/noetl-server -n noetl 2>/dev/null || true
            kubectl rollout restart deployment/noetl-worker -n noetl 2>/dev/null || true
            kubectl rollout status deployment/noetl-server -n noetl --timeout=180s
            kubectl rollout status deployment/noetl-worker -n noetl --timeout=180s
          }

          status() {
            ensure_kind_context
            kubectl get pods -n noetl
            echo ""
            kubectl get svc -n noetl
            echo ""
            LAN_HOST="$(detect_lan_host)"
            echo "Preferred NoETL endpoint: http://${LAN_HOST}:8082"
            echo "Local fallback endpoint: http://localhost:8082"
          }

          reset() {
            ensure_kind_context
            echo "=== tearing down NoETL-deployed namespaces ==="
            kubectl delete ns noetl nats postgres test-server --wait=false --ignore-not-found 2>&1 || true
            echo "=== waiting for namespaces to drain (up to 120s) ==="
            local attempts=0
            while [ "$attempts" -lt 24 ]; do
              # `kubectl get` returns non-zero when no resources match,
              # which would trip `set -e`; `|| true` keeps the loop alive
              # so the wait terminates by attempt count rather than the
              # first "all-gone" tick.
              local remaining
              remaining="$( (kubectl get ns noetl nats postgres test-server -o name 2>/dev/null || true) | wc -l | tr -d ' ')"
              if [ "$remaining" = "0" ]; then
                echo "  all four namespaces gone"
                break
              fi
              sleep 5
              attempts=$((attempts + 1))
            done

            # Static PVs use reclaimPolicy: Retain so data persists across
            # teardowns. After the bound PVC is deleted, the PV still
            # carries a `spec.claimRef` pointing at the now-gone claim,
            # which blocks rebinding to a fresh PVC during the next
            # deploy. Clear claimRef on every static PV the deploy
            # provisions so the next `deploy` action can rebind cleanly.
            #
            # Without this, the operator has to manually patch each PV
            # ('kubectl patch pv <name> --type=json -p
            # [{"op":"remove","path":"/spec/claimRef"}]') after every
            # reset, which is the kind of footgun that derails repeated
            # local dev cycles.
            echo "=== unbinding static PVs (clearing claimRefs so deploy can rebind) ==="
            for pv in postgres noetl-data noetl-logs noetl-data-pv; do
              if kubectl get pv "$pv" >/dev/null 2>&1; then
                kubectl patch pv "$pv" --type=json \
                  -p='[{"op":"remove","path":"/spec/claimRef"}]' 2>&1 \
                  | sed "s/^/  $pv: /" || true
              fi
            done
            echo "=== reset complete; run action=deploy to provision ==="
          }

          case "$ACTION" in
            build)
              build
              ;;
            load)
              load
              ;;
            deploy)
              deploy
              ;;
            redeploy)
              build
              load
              deploy
              status
              ;;
            status)
              status
              ;;
            reset)
              reset
              ;;
            help|*)
              echo "Usage:"
              echo "  noetl run automation/development/noetl.yaml --runtime local --set action=<action>"
              echo ""
              echo "Profile: kind-cluster install path only."
              echo "For GKE see automation/gcp_gke/noetl_gke_fresh_stack.yaml or"
              echo "https://github.com/noetl/ops/wiki/automation-gcp-gke."
              echo ""
              echo "Actions: build, load, deploy, redeploy, status, reset"
              echo "Optional: --set noetl_repo_dir=../noetl"
              echo "Optional: --set e2e_repo_dir=../e2e"
              echo "Optional: --set force_test_server_build=true"
              echo "Optional: --set verify_test_server_contract=false"
              echo "Registry deploy without building:"
              echo "  --set registry=ghcr.io/noetl --set image_name=noetl --set image_tag=v2.23.2 --set image_pull_policy=Always"
              echo ""
              echo "Podman machine (macOS only):"
              echo "  --set podman_machine=<name>  default: noetl-dev"
              echo "  --set podman_machine=\"\"     skip the machine check"
              echo "                                (Podman Desktop / native podman / Linux)"
              echo ""
              echo "LAN access:"
              echo "  This workflow expects kind config listenAddress=0.0.0.0"
              echo "  Recreate kind cluster after changing port mappings."
              ;;
          esac
    next:
      - step: end

  - step: end
    desc: End workflow
    tool:
      kind: noop
