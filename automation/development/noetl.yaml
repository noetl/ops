apiVersion: noetl.io/v2
kind: Playbook
metadata:
  name: noetl_development_deploy
  path: automation/development/noetl
  description: Build/load/deploy helpers for NoETL in local kind

executor:
  profile: local
  version: noetl-runtime/1

workload:
  action: help # build, load, deploy, redeploy, status
  registry: local
  image_name: noetl
  noetl_repo_dir: "../noetl"
  expected_kube_context: "kind-noetl"

workflow:
  - step: run
    desc: Run selected action
    tool:
      kind: shell
      cmds:
        - |
          set -euo pipefail
          ACTION="{{ workload.action }}"
          NOETL_REPO="{{ workload.noetl_repo_dir }}"
          REGISTRY="{{ workload.registry }}"
          IMAGE_NAME="{{ workload.image_name }}"
          EXPECTED_CONTEXT="{{ workload.expected_kube_context }}"

          detect_lan_host() {
            local host=""
            if [ -n "${NOETL_HOST:-}" ]; then
              echo "$NOETL_HOST"
              return
            fi
            if command -v scutil >/dev/null 2>&1; then
              host="$(scutil --get LocalHostName 2>/dev/null || true)"
            fi
            if [ -z "$host" ]; then
              host="$(hostname -s 2>/dev/null || hostname 2>/dev/null || true)"
            fi
            if [ -z "$host" ]; then
              echo "localhost"
            elif echo "$host" | grep -q '\.'; then
              echo "$host"
            else
              echo "${host}.local"
            fi
          }

          prepare_docker_storage() {
            docker builder prune -a -f >/dev/null 2>&1 || true
            docker image prune -f >/dev/null 2>&1 || true
            docker container prune -f >/dev/null 2>&1 || true
          }

          resolve_latest_local_tag() {
            docker image ls "$REGISTRY/$IMAGE_NAME" --format '{{.Tag}}' | grep -v '<none>' | head -n1
          }

          ensure_repo() {
            if [ ! -d "$NOETL_REPO" ]; then
              echo "ERROR: NoETL repository not found: $NOETL_REPO"
              exit 1
            fi
          }

          ensure_colima_running() {
            if ! command -v colima >/dev/null 2>&1; then
              echo "ERROR: Colima is required for local kind workflow but is not installed."
              echo "Install Colima and start it before running this playbook."
              exit 1
            fi

            COLIMA_STATUS="$(colima status 2>/dev/null | awk -F': *' '/^Status:/ {print tolower($2)}' | tr -d '\r')"
            if [ "$COLIMA_STATUS" != "running" ]; then
              echo "ERROR: Colima is not running."
              echo "Start it first: colima start --runtime docker"
              exit 1
            fi

            DOCKER_CONTEXT="$(docker context show 2>/dev/null || true)"
            if [ "$DOCKER_CONTEXT" != "colima" ]; then
              echo "ERROR: Docker context must be 'colima' for this workflow."
              echo "Current context: ${DOCKER_CONTEXT:-<none>}"
              echo "Run: docker context use colima"
              exit 1
            fi
          }

          ensure_kind_context() {
            CURRENT_CONTEXT="$(kubectl config current-context 2>/dev/null || true)"
            if [ -z "$CURRENT_CONTEXT" ]; then
              echo "ERROR: No active kubectl context found."
              echo "Set context to $EXPECTED_CONTEXT before deploy/status actions."
              exit 1
            fi
            if [ "$CURRENT_CONTEXT" != "$EXPECTED_CONTEXT" ]; then
              echo "ERROR: Refusing to run local kind deploy against context '$CURRENT_CONTEXT'."
              echo "Expected context: '$EXPECTED_CONTEXT'"
              echo "Run: kubectl config use-context $EXPECTED_CONTEXT"
              exit 1
            fi
          }

          ensure_local_dependencies() {
            ensure_repo
            ensure_colima_running
            ensure_kind_context

            SCHEMA_DDL="$NOETL_REPO/noetl/database/ddl/postgres/schema_ddl.sql"
            TEST_SERVER_DOCKERFILE="$NOETL_REPO/docker/test-server/Dockerfile"
            if [ ! -f "$SCHEMA_DDL" ]; then
              echo "ERROR: PostgreSQL schema DDL not found at $SCHEMA_DDL"
              exit 1
            fi
            if [ ! -f "$TEST_SERVER_DOCKERFILE" ]; then
              echo "ERROR: Test server Dockerfile not found at $TEST_SERVER_DOCKERFILE"
              exit 1
            fi

            kubectl apply -f "$NOETL_REPO/ci/manifests/noetl/namespace/"

            if ! kubectl get secret gcs-credentials -n noetl >/dev/null 2>&1; then
              kubectl create secret generic gcs-credentials -n noetl \
                --from-literal=gcs-key.json='{}'
            fi

            kubectl apply -f "$NOETL_REPO/ci/manifests/postgres/namespace/namespace.yaml"
            kubectl create configmap postgres-schema-ddl --namespace postgres \
              --from-file=schema_ddl.sql.norun="$SCHEMA_DDL" \
              --dry-run=client -o yaml | kubectl apply -f -
            kubectl apply -f "$NOETL_REPO/ci/manifests/postgres/config-files.yaml"
            kubectl apply -f "$NOETL_REPO/ci/manifests/postgres/configmap.yaml"
            kubectl apply -f "$NOETL_REPO/ci/manifests/postgres/secret.yaml"
            kubectl apply -f "$NOETL_REPO/ci/manifests/postgres/persistent-volume.yaml"
            kubectl apply -f "$NOETL_REPO/ci/manifests/postgres/service.yaml"
            kubectl apply -f "$NOETL_REPO/ci/manifests/postgres/service-external.yaml"
            kubectl apply -f "$NOETL_REPO/ci/manifests/postgres/deployment.yaml"

            kubectl apply -f "$NOETL_REPO/ci/manifests/nats/namespace.yaml"
            kubectl apply -f "$NOETL_REPO/ci/manifests/nats/nats.yaml"

            if ! docker image inspect local/test-server:latest >/dev/null 2>&1; then
              docker buildx build --load --platform linux/amd64 \
                -t local/test-server:latest \
                -f "$TEST_SERVER_DOCKERFILE" "$NOETL_REPO"
            fi
            kind load docker-image local/test-server:latest --name noetl
            kubectl apply -f "$NOETL_REPO/ci/manifests/test-server/namespace.yaml"
            kubectl apply -f "$NOETL_REPO/ci/manifests/test-server/deployment.yaml"

            kubectl rollout status deployment/postgres -n postgres --timeout=180s
            kubectl rollout status statefulset/nats -n nats --timeout=180s
            kubectl rollout status deployment/paginated-api -n test-server --timeout=180s
          }

          build() {
            ensure_repo
            ensure_colima_running
            prepare_docker_storage
            PREV_TAG=""
            if [ -f .noetl_last_build_tag.txt ]; then
              PREV_TAG="$(cat .noetl_last_build_tag.txt)"
            fi

            IMAGE_TAG=$(date +%Y-%m-%d-%H-%M)
            if docker buildx build --load --platform linux/amd64 \
              -t "$REGISTRY/$IMAGE_NAME:$IMAGE_TAG" \
              -f "$NOETL_REPO/docker/noetl/dev/Dockerfile" "$NOETL_REPO"; then
              echo "$IMAGE_TAG" > .noetl_last_build_tag.txt
              echo "Built $REGISTRY/$IMAGE_NAME:$IMAGE_TAG"
              return
            fi

            echo "WARNING: build failed; trying last known image tag"
            if [ -n "$PREV_TAG" ] && docker image inspect "$REGISTRY/$IMAGE_NAME:$PREV_TAG" >/dev/null 2>&1; then
              echo "$PREV_TAG" > .noetl_last_build_tag.txt
              echo "Using existing image $REGISTRY/$IMAGE_NAME:$PREV_TAG"
              return
            fi

            FALLBACK_TAG="$(resolve_latest_local_tag)"
            if [ -n "$FALLBACK_TAG" ] && docker image inspect "$REGISTRY/$IMAGE_NAME:$FALLBACK_TAG" >/dev/null 2>&1; then
              echo "$FALLBACK_TAG" > .noetl_last_build_tag.txt
              echo "Using latest available image $REGISTRY/$IMAGE_NAME:$FALLBACK_TAG"
              return
            fi

            echo "ERROR: build failed and no previous image is available"
            exit 1
          }

          load() {
            ensure_colima_running
            if [ ! -f .noetl_last_build_tag.txt ]; then
              FALLBACK_TAG="$(resolve_latest_local_tag)"
              if [ -z "$FALLBACK_TAG" ]; then
                echo "ERROR: .noetl_last_build_tag.txt not found and no local image tag available. Run action=build first."
                exit 1
              fi
              echo "$FALLBACK_TAG" > .noetl_last_build_tag.txt
            fi
            prepare_docker_storage
            IMAGE_TAG=$(cat .noetl_last_build_tag.txt)
            IMAGE="$REGISTRY/$IMAGE_NAME:$IMAGE_TAG"
            kind load docker-image "$IMAGE" --name noetl
            echo "Loaded $IMAGE into kind"
          }

          deploy() {
            ensure_kind_context
            ensure_local_dependencies
            if [ ! -f .noetl_last_build_tag.txt ]; then
              echo "ERROR: .noetl_last_build_tag.txt not found. Run action=build first."
              exit 1
            fi
            kubectl apply -f "$NOETL_REPO/ci/manifests/noetl/namespace/"
            IMAGE_TAG=$(cat .noetl_last_build_tag.txt)
            IMAGE="$REGISTRY/$IMAGE_NAME:$IMAGE_TAG"
            for manifest in "$NOETL_REPO"/ci/manifests/noetl/*.yaml; do
              if [ -f "$manifest" ]; then
                sed "s|image_name:image_tag|$IMAGE|g" "$manifest" | kubectl apply -f -
              fi
            done
            kubectl rollout restart deployment/noetl-server -n noetl 2>/dev/null || true
            kubectl rollout restart deployment/noetl-worker -n noetl 2>/dev/null || true
            kubectl rollout status deployment/noetl-server -n noetl --timeout=180s
            kubectl rollout status deployment/noetl-worker -n noetl --timeout=180s
          }

          status() {
            ensure_kind_context
            kubectl get pods -n noetl
            echo ""
            kubectl get svc -n noetl
            echo ""
            LAN_HOST="$(detect_lan_host)"
            echo "Preferred NoETL endpoint: http://${LAN_HOST}:8082"
            echo "Local fallback endpoint: http://localhost:8082"
          }

          case "$ACTION" in
            build)
              build
              ;;
            load)
              load
              ;;
            deploy)
              deploy
              ;;
            redeploy)
              build
              load
              deploy
              status
              ;;
            status)
              status
              ;;
            help|*)
              echo "Usage:"
              echo "  noetl run automation/development/noetl.yaml --runtime local --set action=<action>"
              echo ""
              echo "Actions: build, load, deploy, redeploy, status"
              echo "Optional: --set noetl_repo_dir=../noetl"
              echo "Requirement: Colima must be running and Docker context set to 'colima'"
              echo ""
              echo "LAN access:"
              echo "  This workflow expects kind config listenAddress=0.0.0.0"
              echo "  Recreate kind cluster after changing port mappings."
              ;;
          esac
    next:
      - step: end

  - step: end
    desc: End workflow
    tool:
      kind: noop
