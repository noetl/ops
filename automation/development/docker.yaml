apiVersion: noetl.io/v2
kind: Playbook
metadata:
  name: podman_automation
  path: automation/development/docker
  description: Build and manage local NoETL container images via Podman

executor:
  profile: local
  version: noetl-runtime/1

workload:
  action: help # build, noetl-image-build, cleanup-all, images-clear, status
  noetl_repo_dir: "../noetl"
  gui_repo_dir: "../gui"

workflow:
  - step: run
    desc: Run selected action
    tool:
      kind: shell
      cmds:
        - |
          set -euo pipefail
          ACTION="{{ workload.action }}"
          NOETL_REPO="{{ workload.noetl_repo_dir }}"
          GUI_REPO="{{ workload.gui_repo_dir }}"

          ensure_repo() {
            if [ ! -d "$NOETL_REPO" ]; then
              echo "ERROR: NoETL repository not found: $NOETL_REPO"
              exit 1
            fi
          }

          case "$ACTION" in
            build)
              ensure_repo
              IMAGE_TAG=$(date +%Y-%m-%d-%H-%M)
              podman build -t "local/noetl:$IMAGE_TAG" -f "$NOETL_REPO/docker/noetl/dev/Dockerfile" "$NOETL_REPO"
              echo "$IMAGE_TAG" > .noetl_last_build_tag.txt
              echo "Built local/noetl:$IMAGE_TAG"
              ;;

            build-gui)
              if [ ! -d "$GUI_REPO" ]; then
                echo "ERROR: GUI repository not found: $GUI_REPO"
                exit 1
              fi
              IMAGE_TAG=$(date +%Y-%m-%d-%H-%M)
              podman build --build-arg VITE_API_MODE=direct -t "local/gui:$IMAGE_TAG" -f "$GUI_REPO/Dockerfile" "$GUI_REPO"
              echo "$IMAGE_TAG" > .gui_last_build_tag.txt
              echo "Built local/gui:$IMAGE_TAG"
              ;;

            noetl-image-build)
              ensure_repo
              IMAGE_TAG=$(date +%Y-%m-%d-%H-%M)
              podman build -t "local/noetl:$IMAGE_TAG" -f "$NOETL_REPO/docker/noetl/dev/Dockerfile" "$NOETL_REPO"
              echo "$IMAGE_TAG" > .noetl_last_build_tag.txt
              echo "Built local/noetl:$IMAGE_TAG"
              ;;

            cleanup-all)
              podman system prune --all --force
              podman volume prune --force
              ;;

            images-clear)
              podman images "local/noetl" --format "{{.ID}}" | xargs -r podman rmi -f
              ;;

            status)
              podman version
              echo ""
              podman images | head -20
              echo ""
              podman ps -a | head -20
              echo ""
              podman system df
              ;;

            help|*)
              echo "Usage:"
              echo "  noetl run automation/development/docker.yaml --runtime local --set action=<action>"
              echo ""
              echo "Actions:"
              echo "  build              Build NoETL image"
              echo "  build-gui          Build GUI image"
              echo "  noetl-image-build  Build without cache"
              echo "  cleanup-all        Remove images/volumes"
              echo "  images-clear       Remove local/noetl images"
              echo "  status             Show Podman status"
              echo ""
              echo "Optional:"
              echo "  --set noetl_repo_dir=../noetl"
              ;;
          esac
    next:
      - step: end

  - step: end
    desc: End workflow
    tool:
      kind: noop
