apiVersion: apps/v1
kind: Deployment
metadata:
  name: paginated-api
  namespace: test-server
  labels:
    app: paginated-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paginated-api
  template:
    metadata:
      labels:
        app: paginated-api
    spec:
      containers:
      - name: api
        image: ghcr.io/noetl/test-server:e2e-710c585
        imagePullPolicy: Always
        ports:
        - containerPort: 5555
          name: http
        env:
        - name: PFT_RATE_LIMIT
          value: "50"
        livenessProbe:
          httpGet:
            path: /health
            port: 5555
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5555
          initialDelaySeconds: 3
          periodSeconds: 5
        resources:
          requests:
            cpu: 500m
            memory: 2Gi
          limits:
            ephemeral-storage: 1Gi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: paginated-api
  namespace: test-server
  labels:
    app: paginated-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: paginated-api
  minReplicas: 1
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
---
apiVersion: v1
kind: Service
metadata:
  name: paginated-api
  namespace: test-server
  labels:
    app: paginated-api
spec:
  type: ClusterIP
  selector:
    app: paginated-api
  ports:
  - port: 5555
    targetPort: 5555
    protocol: TCP
    name: http
---
apiVersion: v1
kind: Service
metadata:
  name: paginated-api-ext
  namespace: test-server
  labels:
    app: paginated-api
spec:
  type: NodePort
  selector:
    app: paginated-api
  ports:
  - port: 5555
    targetPort: 5555
    nodePort: 30555
    protocol: TCP
    name: http
