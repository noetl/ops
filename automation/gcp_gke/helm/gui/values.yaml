namespace: gui

image:
  repository: ""
  tag: "latest"
  pullPolicy: Always

service:
  type: ClusterIP
  loadBalancerIP: ""
  port: 80
  targetPort: 8080
  nodePort: 30081

env:
  apiMode: "direct"
  apiBaseUrl: "http://localhost:8082"
  allowSkipAuth: "true"
  gatewayUrl: ""
  auth0Domain: ""
  auth0ClientId: ""
  auth0RedirectUri: ""
  mcpKubernetesEnabled: "false"
  mcpKubernetesUrl: ""
  # nginx-only upstream used by the GUI container entrypoint; not exposed to Vite/browser code.
  mcpKubernetesUpstream: ""

ingress:
  enabled: false
  className: gce
  annotations: {}
  host: gui.example.com
  managedCertificate:
    enabled: false
    name: gui-managed-cert

resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "512Mi"
    cpu: "500m"
