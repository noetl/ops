apiVersion: apps/v1
kind: Deployment
metadata:
  name: gui
  namespace: {{ .Values.namespace }}
  labels:
    app: gui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gui
  template:
    metadata:
      labels:
        app: gui
    spec:
      containers:
        - name: gui
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: VITE_API_MODE
              value: {{ .Values.env.apiMode | quote }}
            - name: VITE_API_BASE_URL
              value: {{ .Values.env.apiBaseUrl | quote }}
            - name: VITE_ALLOW_SKIP_AUTH
              value: {{ .Values.env.allowSkipAuth | quote }}
            - name: VITE_GATEWAY_URL
              value: {{ .Values.env.gatewayUrl | quote }}
            - name: VITE_AUTH0_DOMAIN
              value: {{ .Values.env.auth0Domain | quote }}
            - name: VITE_AUTH0_CLIENT_ID
              value: {{ .Values.env.auth0ClientId | quote }}
            - name: VITE_AUTH0_REDIRECT_URI
              value: {{ .Values.env.auth0RedirectUri | quote }}
            - name: VITE_MCP_KUBERNETES_URL
              value: {{ .Values.env.mcpKubernetesUrl | quote }}
            # Consumed by the nginx entrypoint to generate same-origin proxy config.
            # It is intentionally not VITE_ exposed to browser JavaScript.
            - name: MCP_KUBERNETES_UPSTREAM
              value: {{ .Values.env.mcpKubernetesUpstream | quote }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
              name: http
          resources:
{{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
