# Cloud Build — noetl/server (Rust control plane "noetl-control-plane")
# Builds the prod amd64 image for the GKE noetl-demo-19700101 stack.
# Cloud Build workers are linux/amd64, so the resulting image is amd64
# (matches the GKE node pool).  Pinned by commit sha tag + version tag;
# the deployment manifest should reference the immutable @sha256 digest
# printed at the end of the build.
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile
      - -t
      - ${_IMAGE_SHA}
      - -t
      - ${_IMAGE_VERSION}
      - .
images:
  - ${_IMAGE_SHA}
  - ${_IMAGE_VERSION}
substitutions:
  _IMAGE_SHA: us-central1-docker.pkg.dev/noetl-demo-19700101/noetl/server-rust:4644c49
  _IMAGE_VERSION: us-central1-docker.pkg.dev/noetl-demo-19700101/noetl/server-rust:v3.5.0
options:
  substitutionOption: ALLOW_LOOSE
  machineType: E2_HIGHCPU_8
timeout: 7200s
