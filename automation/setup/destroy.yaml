apiVersion: noetl.io/v2
kind: Playbook
metadata:
  name: noetl_destroy
  path: automation/setup/destroy
  description: Destroy NoETL development environment
executor:
  profile: local
  version: noetl-runtime/1
workflow:
- step: start
  desc: Begin destroy workflow
  tool:
    kind: shell
    cmds:
    - echo "Starting environment destroy..."
  next:
  - step: kill_port_forwards
- step: kill_port_forwards
  desc: Kill kubectl port-forward processes
  tool:
    kind: shell
    cmds:
    - 'echo "Killing port-forward processes..."

      pkill -f "kubectl port-forward" 2>/dev/null || true

      # Give Podman time to release ports

      sleep 2

      echo "OK Port-forward processes terminated"

      '
  next:
  - step: delete_cluster
- step: delete_cluster
  desc: Delete kind cluster
  tool:
    kind: shell
    cmds:
    - 'echo "Deleting kind cluster..."

      kind delete cluster --name=noetl 2>/dev/null || echo "INFO Cluster not found
      or already deleted"

      # Give Podman time to release ports after cluster deletion

      sleep 3

      '
  next:
  - step: cleanup_podman
- step: cleanup_podman
  desc: Clean up Podman resources
  tool:
    kind: shell
    cmds:
    - 'podman system prune --all --force

      podman volume prune --force || echo "Podman cleanup skipped or failed"

      '
  next:
  - step: clear_cache
- step: clear_cache
  desc: Clear cache directories
  tool:
    kind: shell
    cmds:
    - "rm -rf ci/kind/cache/pg-data/*\nrm -rf ci/kind/cache/noetl-data/*\nrm -rf ci/kind/cache/minio-data/*\nrm\
      \ -rf ci/kind/cache/noetl-logs/*\n"
  next:
  - step: clear_noetl_data
- step: clear_noetl_data
  desc: Clear NoETL data
  tool:
    kind: shell
    cmds:
    - rm -rf ci/kind/cache/noetl-data/* || echo "Data clear skipped or failed"
  next:
  - step: summary
- step: summary
  desc: Show destruction summary
  tool:
    kind: shell
    cmds:
    - 'echo ""

      echo "Environment Destroyed!"

      echo ""

      echo "Cleanup completed:"

      echo "  - Port-forward processes: killed"

      echo "  - Kind cluster: deleted"

      echo "  - Podman resources: cleaned"

      echo "  - Cache directories: cleared"

      echo "  - NoETL data: cleared"

      echo ""

      echo "You can now run bootstrap again:"

      echo "  noetl run boot"

      echo ""

      '
  next:
  - step: end
- step: end
  desc: End destroy workflow
  tool:
    kind: noop
