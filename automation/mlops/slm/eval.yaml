apiVersion: noetl.io/v2
kind: Playbook

metadata:
  name: slm_eval
  path: automation/mlops/slm/eval
  description: |
    Generic SLM eval template (MLOps-as-NoETL-playbooks).
    Domain-agnostic: driven entirely by an org slm.config.yaml passed as
    `config`. Given the dataset's eval split + a candidate producer (Phase A:
    the deterministic oracle, the trivial candidate that validates the harness
    and pins the FLOOR numbers), computes the configured metrics — match-rate
    vs the floor + the (deferred) teacher ceiling, tool/slot/render-intent
    accuracy, widget-schema validity, vocab validity, and candidate latency —
    gates them against the config targets, and writes eval_report.json.

    Reference instance: noetl/travel slm.config.yaml (Phase A, #140 / #64).

    Phase B (#141): set candidate=slm to score the fine-tuned model instead of
    the deterministic oracle.  The engine pulls the registered model artifact
    (model_ref, default 'latest') from the G3 registry, runs it under the SAME
    schema-constrained decoding the ceiling used, reports validity vs the oracle
    floor + per-field match gaps, and (register=true) registers an eval entry
    (kind=eval, lineage → the model).

    Tracks noetl/ai-meta#140 (Phase A) + #141 (Phase B).

executor:
  profile: local
  version: noetl-runtime/1

workload:
  config: repos/travel/automation/mlops/slm/travel/slm.config.yaml
  slm_lib: repos/ops/automation/mlops/slm/lib
  # optional dataset dir override ("" => derive from the config dataset_build block)
  dataset: ""
  dataset_version: ""         # "" => config dataset_build.version
  # candidate: "" => config eval.candidate; "deterministic_oracle" | "slm"
  candidate: ""
  model_ref: latest           # (slm) registry:// URN or 'latest'
  register: "false"           # (slm) register the eval run into G3
  tenant: muno
  project: travel

workflow:
  - step: start
    desc: Entry point
    tool:
      kind: noop
    next:
      spec: { mode: exclusive }
      arcs:
        - step: run_eval

  - step: run_eval
    desc: Run the generic eval engine against the org config + dataset eval split
    tool:
      kind: shell
      cmds:
        - |
          set -euo pipefail
          CONFIG='{{ workload.config }}'
          LIB='{{ workload.slm_lib }}'
          DATASET='{{ workload.dataset }}'
          [ -n '{{ workload.dataset_version }}' ] && export SLM_DATASET_VERSION='{{ workload.dataset_version }}'
          ARGS="--config ${CONFIG}"
          [ -n "${DATASET}" ] && ARGS="${ARGS} --dataset ${DATASET}"
          [ -n '{{ workload.candidate }}' ] && ARGS="${ARGS} --candidate {{ workload.candidate }}"
          [ '{{ workload.candidate }}' = 'slm' ] && ARGS="${ARGS} --model-ref {{ workload.model_ref }} --tenant {{ workload.tenant }} --project {{ workload.project }}"
          [ '{{ workload.register }}' = 'true' ] && ARGS="${ARGS} --register"
          echo "SLM eval :: config=${CONFIG} candidate={{ workload.candidate }}"
          python3 "${LIB}/slm_eval.py" ${ARGS}
    next:
      spec: { mode: exclusive }
      arcs:
        - step: end

  - step: end
    desc: Done
    tool:
      kind: noop
