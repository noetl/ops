# Control: no policy, no @latest. Every iteration runs the version the root saw at start.
apiVersion: noetl.io/v2
kind: Playbook
metadata:
  name: catalog_hot_pinned
  path: tests/catalog_hot/pinned
workload: { items: [1, 2, 3, 4, 5, 6] }
workflow:
  - step: start
    tool: { kind: noop }
    next: [ { step: each } ]
  - step: each
    loop: { in: "{{ workload.items }}", iterator: item }
    tool: { kind: playbook, path: "tests/catalog_hot/child", return_result: true }
    next: [ { step: end } ]
  - step: end
    tool: { kind: noop }
