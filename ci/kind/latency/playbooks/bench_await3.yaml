# Latency bench (ai-meta#557): three sequential awaited child hops
# (`kind: playbook`, return_result). Measures, per hop: child start → child
# terminal → parent call.done. Today the parent polls every poll_interval
# (default 2 s, min 1 s) and the first poll happens only AFTER one interval,
# holding the parent's worker slot the whole time (tools playbook.rs).
apiVersion: noetl.io/v2
kind: Playbook
metadata: { name: bench_await3, path: bench/await3 }
workflow:
  - step: start
    tool: { kind: noop }
    next: [ { step: h1 } ]
  - step: h1
    tool: { kind: playbook, path: bench/child, return_result: true, result_step: end, timeout: 120 }
    next: [ { step: h2 } ]
  - step: h2
    tool: { kind: playbook, path: bench/child, return_result: true, result_step: end, timeout: 120 }
    next: [ { step: h3 } ]
  - step: h3
    tool: { kind: playbook, path: bench/child, return_result: true, result_step: end, timeout: 120 }
    next: [ { step: end } ]
  - step: end
    tool: { kind: noop }
