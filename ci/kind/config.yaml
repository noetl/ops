kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: noetl
# Container log rotation (log-analytics stack, docs/specs/noetl-iac-log-analytics.md).
# The kubelet owns rotation of /var/log/pods/*: it rotates at containerLogMaxSize and
# keeps containerLogMaxFiles generations per container. These are the kubelet defaults
# made explicit, so the bound is part of the declared cluster, not an implicit default.
# Applies when the cluster is (re)created; `status` in
# automation/iap/kind/log_analytics.yaml reports the live values from /configz.
kubeadmConfigPatches:
  - |
    kind: KubeletConfiguration
    containerLogMaxSize: 10Mi
    containerLogMaxFiles: 5
nodes:
  - role: control-plane
    extraPortMappings:
        # NOETL
      - containerPort: 30082 
        hostPort: 8082
        listenAddress: "0.0.0.0" # optional: set the bind address on the host. 0.0.0.0 is the current default
        protocol: TCP # optional: set the protocol to one of TCP, UDP, SCTP. TCP is the default

        # Postgers
      - containerPort: 30321
        hostPort: 54321
        listenAddress: "0.0.0.0"
        protocol: TCP

        # Grafana
      - containerPort: 30300
        hostPort: 33000
        listenAddress: "0.0.0.0"
        protocol: TCP

        # VictoriaLogs
      - containerPort: 30428
        hostPort: 39428
        listenAddress: "0.0.0.0"
        protocol: TCP

        # ClickHouse HTTP
      - containerPort: 30123
        hostPort: 30123
        listenAddress: "0.0.0.0"
        protocol: TCP

        # ClickHouse Native
      - containerPort: 30900
        hostPort: 30900
        listenAddress: "0.0.0.0"
        protocol: TCP

        # Qdrant HTTP
      - containerPort: 30633
        hostPort: 30633
        listenAddress: "0.0.0.0"
        protocol: TCP

        # Qdrant gRPC
      - containerPort: 30634
        hostPort: 30634
        listenAddress: "0.0.0.0"
        protocol: TCP

        # NATS Client
      - containerPort: 30422
        hostPort: 4222
        listenAddress: "0.0.0.0"
        protocol: TCP

        # NATS Monitoring
      - containerPort: 30822
        hostPort: 8222
        listenAddress: "0.0.0.0"
        protocol: TCP

        # Superset (Analytics)
      - containerPort: 30888
        hostPort: 32888
        listenAddress: "0.0.0.0"
        protocol: TCP

        # JupyterLab (Analytics)
      - containerPort: 30999
        hostPort: 32999
        listenAddress: "0.0.0.0"
        protocol: TCP

        # Pagination Test Server
      - containerPort: 30555
        hostPort: 32555
        listenAddress: "0.0.0.0"
        protocol: TCP

        # IBKR Client Portal Gateway
      - containerPort: 30500
        hostPort: 15000
        listenAddress: "0.0.0.0"
        protocol: TCP

        # S3-compatible object-store API
      - containerPort: 30902
        hostPort: 9000
        listenAddress: "0.0.0.0"
        protocol: TCP

        # ClickHouse MCP server (log-analytics stack, streamable HTTP, bearer auth)
      - containerPort: 30124
        hostPort: 30124
        listenAddress: "127.0.0.1"
        protocol: TCP

        # Gateway API
      - containerPort: 30090
        hostPort: 38090
        listenAddress: "0.0.0.0"
        protocol: TCP

        # Gateway UI
      - containerPort: 30080
        hostPort: 38080
        listenAddress: "0.0.0.0"
        protocol: TCP

        # Standalone GUI
      - containerPort: 30081
        hostPort: 30081
        listenAddress: "0.0.0.0"
        protocol: TCP

    # ci/kind/cache added to .gitignore
    extraMounts:
      - hostPath: ci/kind/cache/pg-data
        containerPath: /mnt/data/pg-data

      - hostPath: ci/kind/cache/noetl-data
        containerPath: /mnt/data/noetl-data

      - hostPath: ci/kind/cache/object-store-data
        containerPath: /mnt/data/object-store-data

      - hostPath: ci/kind/cache/noetl-logs
        containerPath: /mnt/data/noetl-logs

      - hostPath: ../e2e/fixtures/gateway_ui
        containerPath: /mnt/gateway-ui
