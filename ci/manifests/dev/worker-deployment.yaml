apiVersion: apps/v1
kind: Deployment
metadata:
  name: noetl-worker
  namespace: noetl
  labels:
    app: noetl-worker
    component: worker
    runtime: cpu
    worker-pool: worker-cpu-01
spec:
  replicas: 3
  selector:
    matchLabels:
      app: noetl-worker
      worker-pool: worker-cpu-01
  template:
    metadata:
      labels:
        app: noetl-worker
        component: worker
        runtime: cpu
        worker-pool: worker-cpu-01
    spec:
      serviceAccountName: noetl-worker
      initContainers:
        - name: wait-for-api
          image: curlimages/curl:8.7.1
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - "until curl -sf http://noetl.noetl.svc.cluster.local:8082/api/health; do echo 'Waiting for NoETL API...'; sleep 3; done"
      containers:
        - name: worker
          image: image_name:image_tag
          imagePullPolicy: Never
          ports:
            - name: metrics
              containerPort: 9091
              protocol: TCP
          command:
            - python
          args:
            - -m
            - noetl.worker
          envFrom:
            - configMapRef:
                name: noetl-worker-config
          env:
            - name: NOETL_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # Arrow IPC shared-memory cache budget (noetl.core.storage.ipc_cache).
            # Pinned here next to the /dev/shm sizeLimit below so the two
            # stay coherent: sizeLimit (320Mi) MUST exceed this budget
            # (256Mi) or the worker SIGBUSes (exit 135) when the cache
            # fills past the tmpfs.  ipc_cache.py:51.
            - name: NOETL_IPC_CACHE_BUDGET_BYTES
              value: "268435456" # 256 MiB
          volumeMounts:
            - name: noetl-data
              mountPath: /opt/noetl/data
            # Memory-backed /dev/shm for the Arrow IPC cache.  The k8s
            # container-runtime default /dev/shm is a 64 MiB tmpfs; the
            # cache writes shm regions up to NOETL_IPC_CACHE_BUDGET_BYTES
            # and overruns 64 MiB, page-faulting into SIGBUS (exit 135).
            - name: dshm
              mountPath: /dev/shm
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              # 320Mi (/dev/shm tmpfs, charged to the cgroup) + worker RSS.
              memory: "768Mi"
      volumes:
        - name: noetl-data
          persistentVolumeClaim:
            claimName: noetl-data-shared # Use shared RWX PVC for DuckDB files
        - name: dshm
          emptyDir:
            medium: Memory
            # >= NOETL_IPC_CACHE_BUDGET_BYTES (256Mi) + 64Mi headroom for
            # tmpfs page rounding / fragmentation.  tmpfs usage counts
            # against the container memory limit above (768Mi), which
            # covers this plus the worker RSS.
            sizeLimit: 320Mi
