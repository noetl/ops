# NoETL gateway Service — PROD.  Captured live (noetl/ai-meta#267).
#
# ⚠ The previous version of this file would have stripped the GKE load-balancer
# wiring on apply: `cloud.google.com/neg`, `networking.gke.io/target-pool`, the
# allocated nodePort and the port mapping.  Those are cluster-authored and
# load-bearing for ingress.
apiVersion: v1
kind: Service
metadata:
  annotations:
    cloud.google.com/neg: '{"ingress":true}'
    networking.gke.io/target-pool: ae94654dcffe94eac82e64c96bb407c8
  finalizers:
  - gke.networking.io/l4-netlb-v1
  - service.kubernetes.io/load-balancer-cleanup
  labels:
    app: gateway
    app.kubernetes.io/managed-by: Helm
  name: gateway
  namespace: gateway
spec:
  allocateLoadBalancerNodePorts: true
  clusterIP: 34.118.234.255
  clusterIPs:
  - 34.118.234.255
  externalTrafficPolicy: Cluster
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - name: http
    nodePort: 31731
    port: 80
    protocol: TCP
    targetPort: 8090
  selector:
    app: gateway
  sessionAffinity: None
  type: LoadBalancer
