# NoETL gateway — PROD.  Captured from the live cluster (noetl/ai-meta#267).
#
# ⚠ WHAT THIS FILE USED TO SAY WAS DANGEROUS.  Before this capture it described a
# gateway that has not existed for a long time, and `kubectl apply -f` would have
# SILENTLY UNCONFIGURED THE LOGIN PATH:
#
#   deleted (present live, absent from the old file):
#     GATEWAY_AUTH0_DOMAIN, GATEWAY_AUTH0_CLIENT_ID, GATEWAY_AUTH0_REDIRECT_URI,
#     GATEWAY_PUBLIC_URL, NOETL_AUTH_SYNC, NOETL_AUTHZ_SYNC,
#     NOETL_EVENT_SOURCE, NOETL_KV_ADDR, NOETL_EVENT_FEED_ADDR,
#     NOETL_TIMEOUT_SECS, TRANSPORT_HEARTBEAT_INTERVAL_SECS,
#     GATEWAY_HEARTBEAT_INTERVAL_SECS, GATEWAY_CONNECTION_TIMEOUT_SECS
#
#   added (in the old file, not live):
#     NATS_CALLBACK_SUBJECT_PREFIX, NATS_UPDATES_SUBJECT_PREFIX  <- NATS was
#     deleted entirely in T5; these name a transport that no longer exists
#     AUTH_PLAYBOOK_*, NOETL_INTERNAL_API_TOKEN
#
#   and it replaced the pinned digest with the floating tag `noetl-gateway:latest`.
#
# Losing the three GATEWAY_AUTH0_* variables is a login outage, which this
# ecosystem has had before (noetl/ai-meta#161).
#
# ⚠ The live object still carries `app.kubernetes.io/managed-by: Helm`, but
# `helm list -A` reports NO releases.  The Helm ownership is a leftover label, not
# a live owner -- so nothing was reconciling this, which is how it drifted this far.
#
# GATEWAY_AUTH0_CLIENT_ID is a literal on purpose: an Auth0 client id is public by
# construction, and this exact value is already committed in
# gateway/configmap-ui-files.yaml and gui/deployment-prod.yaml.  Verified by
# sha256, not by assumption.
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    autopilot.gke.io/resource-adjustment: '{"input":{"containers":[{"limits":{"cpu":"500m","memory":"512Mi"},"requests":{"cpu":"100m","memory":"128Mi"},"name":"gateway"}]},"output":{"containers":[{"limits":{"cpu":"500m","ephemeral-storage":"1Gi","memory":"512Mi"},"requests":{"cpu":"100m","ephemeral-storage":"1Gi","memory":"128Mi"},"name":"gateway"}]},"computeClassAtAdmission":"Default","modified":true}'
    autopilot.gke.io/warden-version: 34.45.0-gke.0
  labels:
    app: gateway
    app.kubernetes.io/managed-by: Helm
  name: gateway
  namespace: gateway
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: gateway
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
      - env:
        - name: ROUTER_PORT
          value: '8090'
        - name: NOETL_BASE_URL
          value: http://noetl.noetl.svc.cluster.local:8082
        - name: RUST_LOG
          value: info,gateway=debug
        - name: CORS_ALLOWED_ORIGINS
          value: http://localhost:3001,http://localhost:5173,http://127.0.0.1:5173,https://mestumre.dev,https://gateway.mestumre.dev,http://mestumre.dev,http://gateway.mestumre.dev,https://travel.mestumre.dev,http://travel.mestumre.dev
        - name: NOETL_TIMEOUT_SECS
          value: '120'
        - name: TRANSPORT_HEARTBEAT_INTERVAL_SECS
          value: '15'
        - name: AUTH_PLAYBOOK_TIMEOUT_SECS
          value: '40'
        - name: GATEWAY_HEARTBEAT_INTERVAL_SECS
          value: '15'
        - name: GATEWAY_CONNECTION_TIMEOUT_SECS
          value: '300'
        - name: GATEWAY_PUBLIC_URL
          value: http://gateway.gateway.svc.cluster.local
        - name: GATEWAY_AUTH0_DOMAIN
          value: mestumre-development.us.auth0.com
        - name: GATEWAY_AUTH0_CLIENT_ID
          value: Jqop7YoaiZalLHdBRo5ScNQ1RJhbhbDN
        - name: GATEWAY_AUTH0_REDIRECT_URI
          value: https://travel.mestumre.dev/login
        - name: NOETL_AUTH_SYNC
          value: 'true'
        - name: NOETL_AUTHZ_SYNC
          value: 'true'
        - name: NOETL_EVENT_SOURCE
          value: ehdb
        - name: NOETL_KV_ADDR
          value: noetl-cmdbus-writer-0.noetl.svc.cluster.local:9107
        - name: NOETL_EVENT_FEED_ADDR
          value: noetl-cmdbus-writer-0.noetl.svc.cluster.local:9105
        image: us-central1-docker.pkg.dev/shastaratech-noetl-prod/noetl/noetl-gateway@sha256:02756b57840773e9eb008ad4434f2d33e91551617a7c58694c4ac6385854b7e3
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: 8090
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 1
        name: gateway
        ports:
        - containerPort: 8090
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: 8090
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            cpu: 500m
            ephemeral-storage: 1Gi
            memory: 512Mi
          requests:
            cpu: 100m
            ephemeral-storage: 1Gi
            memory: 128Mi
        securityContext:
          capabilities:
            drop:
            - NET_RAW
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      tolerations:
      - effect: NoSchedule
        key: kubernetes.io/arch
        operator: Equal
        value: amd64
