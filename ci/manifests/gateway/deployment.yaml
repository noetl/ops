# NoETL gateway — PROD.  Captured from the live cluster (noetl/ai-meta#267).
#
# STAGED, NOT APPLIED (mountshastaranch staff replies, docs/staff-replies.md in
# shastaranch/mountshastaranch): guests may also run shastaranch/chats/inbox,
# which the concierge page polls for the team's replies, in its own budget
# (GATEWAY_GUEST_PLAYBOOK_LIMITS, noetl/gateway feat/guest-playbook-limits).
# Needs a gateway release with that feature: the image line below is a
# placeholder that refuses to apply until the release digest is filled in.
# The jump from v3.16.0 also brings v3.17.0 (auth providers, inert while
# GATEWAY_AUTH_PROVIDERS is unset).  Diff the whole object first
# (agents/rules/apply-safety.md).
#
# RECONCILED AGAINST LIVE 2026-10-20 (noetl/ai-meta#484): v3.16.0
# (sha256:8e111f6a…) with guest sessions on for shastaranch/concierge/turn —
# GATEWAY_GUEST_* env, the guest-token-key CSI volume
# (secretproviderclass-guest-token-key-prod.yaml), cf-connecting-ip.  Applied
# from this file; `kubectl -n gateway diff -f` reported zero changes after.
#
# RECONCILED AGAINST LIVE 2026-10-16 (noetl/ai-meta#323).  The capture above was
# taken in #267 and had drifted again by two things: the image pin was
# sha256:02756b57… while prod ran sha256:af2f4ce2… (v3.15.0), so an apply would
# have ROLLED THE GATEWAY BACKWARD; and GATEWAY_USER_PLAYBOOKS sat near the top of
# the env list where live has it last, which is a pod-template-hash difference and
# therefore a rollout on apply even though every value agreed.
#
# `kubectl -n gateway diff -f` against prod now reports ZERO changed fields, so a
# DR apply reproduces the gateway instead of mutating it.  ⚠ Re-verify with that
# diff before trusting this sentence — it is true only until prod next changes,
# and per the note below NOTHING reconciles this file automatically.  That is why
# it drifted after #267 and why it will drift again.
#
# ⚠ WHAT THIS FILE USED TO SAY WAS DANGEROUS.  Before this capture it described a
# gateway that has not existed for a long time, and `kubectl apply -f` would have
# SILENTLY UNCONFIGURED THE LOGIN PATH:
#
#   deleted (present live, absent from the old file):
#     GATEWAY_AUTH0_DOMAIN, GATEWAY_AUTH0_CLIENT_ID, GATEWAY_AUTH0_REDIRECT_URI,
#     GATEWAY_PUBLIC_URL, NOETL_AUTH_SYNC, NOETL_AUTHZ_SYNC,
#     NOETL_EVENT_SOURCE, NOETL_KV_ADDR, NOETL_EVENT_FEED_ADDR,
#     NOETL_TIMEOUT_SECS, TRANSPORT_HEARTBEAT_INTERVAL_SECS,
#     GATEWAY_HEARTBEAT_INTERVAL_SECS, GATEWAY_CONNECTION_TIMEOUT_SECS
#
#   added (in the old file, not live):
#     NATS_CALLBACK_SUBJECT_PREFIX, NATS_UPDATES_SUBJECT_PREFIX  <- NATS was
#     deleted entirely in T5; these name a transport that no longer exists
#     AUTH_PLAYBOOK_*, NOETL_INTERNAL_API_TOKEN
#
#   and it replaced the pinned digest with the floating tag `noetl-gateway:latest`.
#
# Losing the three GATEWAY_AUTH0_* variables is a login outage, which this
# ecosystem has had before (noetl/ai-meta#161).
#
# ⚠ The live object still carries `app.kubernetes.io/managed-by: Helm`, but
# `helm list -A` reports NO releases.  The Helm ownership is a leftover label, not
# a live owner -- so nothing was reconciling this, which is how it drifted this far.
#
# GATEWAY_AUTH0_CLIENT_ID is a literal on purpose: an Auth0 client id is public by
# construction, and this exact value is already committed in
# gateway/configmap-ui-files.yaml and gui/deployment-prod.yaml.  Verified by
# sha256, not by assumption.
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    autopilot.gke.io/resource-adjustment: '{"input":{"containers":[{"limits":{"cpu":"500m","memory":"512Mi"},"requests":{"cpu":"100m","memory":"128Mi"},"name":"gateway"}]},"output":{"containers":[{"limits":{"cpu":"500m","ephemeral-storage":"1Gi","memory":"512Mi"},"requests":{"cpu":"100m","ephemeral-storage":"1Gi","memory":"128Mi"},"name":"gateway"}]},"computeClassAtAdmission":"Default","modified":true}'
    autopilot.gke.io/warden-version: 34.45.0-gke.0
  labels:
    app: gateway
    app.kubernetes.io/managed-by: Helm
  name: gateway
  namespace: gateway
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: gateway
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
      - env:
        - name: ROUTER_PORT
          value: '8090'
        - name: NOETL_BASE_URL
          value: http://noetl.noetl.svc.cluster.local:8082
        - name: RUST_LOG
          value: info,gateway=debug
        - name: CORS_ALLOWED_ORIGINS
          value: http://localhost:3001,http://localhost:5173,http://127.0.0.1:5173,https://mestumre.dev,https://gateway.mestumre.dev,http://mestumre.dev,http://gateway.mestumre.dev,https://travel.mestumre.dev,http://travel.mestumre.dev,https://team4.mestumre.dev,https://console.noetl.ai,https://mountshastaranch.com,https://www.mountshastaranch.com,https://mountshastaranch.pages.dev
        - name: NOETL_TIMEOUT_SECS
          value: '120'
        - name: TRANSPORT_HEARTBEAT_INTERVAL_SECS
          value: '15'
        - name: AUTH_PLAYBOOK_TIMEOUT_SECS
          value: '40'
        - name: GATEWAY_HEARTBEAT_INTERVAL_SECS
          value: '15'
        - name: GATEWAY_CONNECTION_TIMEOUT_SECS
          value: '300'
        - name: GATEWAY_PUBLIC_URL
          value: http://gateway.gateway.svc.cluster.local
        - name: GATEWAY_AUTH0_DOMAIN
          value: mestumre-development.us.auth0.com
        - name: GATEWAY_AUTH0_CLIENT_ID
          value: Jqop7YoaiZalLHdBRo5ScNQ1RJhbhbDN
        - name: GATEWAY_AUTH0_REDIRECT_URI
          value: https://travel.mestumre.dev/login
        - name: NOETL_AUTH_SYNC
          value: 'true'
        - name: NOETL_AUTHZ_SYNC
          value: 'true'
        - name: NOETL_EVENT_SOURCE
          value: ehdb
        - name: NOETL_KV_ADDR
          value: noetl-cmdbus-writer-0.noetl.svc.cluster.local:9107
        - name: NOETL_EVENT_FEED_ADDR
          value: noetl-cmdbus-writer-0.noetl.svc.cluster.local:9105
        # Playbooks a regular (non-admin) user may start (noetl/gateway#57). The
        # compiled-in default plus muno/playbooks/trip-intake (noetl/travel#154,
        # adiona/frontend#55). Applied live with `kubectl set env` 2026-10-16.
        - name: GATEWAY_USER_PLAYBOOKS
          value: muno/playbooks/itinerary-planner,muno/playbooks/hotel-cards,muno/playbooks/flights-details,muno/playbooks/profile,travel/playbooks/catalog/calendar/list,muno/playbooks/threads,muno/playbooks/trip-intake,shastaranch/concierge/turn
        # Guest sessions (noetl/ai-meta#484, gateway docs/guest-sessions.md):
        # signed-out visitors may run only these playbooks, rate-limited per
        # guest (20/h), per client IP (60/h; 20 mints/h) and in total (600/h).
        # shastaranch/chats/inbox (staff replies) is limited on its own below:
        # read-only, returns only the team's reply text for a thread id.
        # The client IP is Cloudflare's header; the LB still accepts direct
        # traffic, so per-IP limits are best effort until it is restricted to
        # Cloudflare ranges (the per-guest and total caps hold regardless).
        - name: GATEWAY_GUEST_PLAYBOOKS
          value: shastaranch/concierge/turn,shastaranch/chats/inbox
        # Polling for staff replies must not use up a guest's 20 chat
        # messages: chats/inbox has its own hourly budget, per guest / per IP /
        # total. The page asks at most every 2 min (refocus at most once a
        # minute), so 40/guest leaves headroom; a refusal just waits a turn.
        - name: GATEWAY_GUEST_PLAYBOOK_LIMITS
          value: shastaranch/chats/inbox=40/120/1200
        - name: GATEWAY_GUEST_TOKEN_KEY_FILE
          value: /var/secrets/guest/key
        - name: GATEWAY_CLIENT_IP_HEADER
          value: cf-connecting-ip
        # Placeholder: the digest of the gateway release with GATEWAY_GUEST_PLAYBOOK_LIMITS
        # (was sha256:8e111f6a…, v3.16.0). Invalid on purpose until filled in.
        image: us-central1-docker.pkg.dev/shastaratech-noetl-prod/noetl/noetl-gateway@sha256:REPLACE_WITH_RELEASE_DIGEST
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: 8090
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 1
        name: gateway
        ports:
        - containerPort: 8090
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: 8090
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            cpu: 500m
            ephemeral-storage: 1Gi
            memory: 512Mi
          requests:
            cpu: 100m
            ephemeral-storage: 1Gi
            memory: 128Mi
        securityContext:
          capabilities:
            drop:
            - NET_RAW
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /var/secrets/guest
          name: guest-token-key
          readOnly: true
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      tolerations:
      - effect: NoSchedule
        key: kubernetes.io/arch
        operator: Equal
        value: amd64
      volumes:
      - csi:
          driver: secrets-store-gke.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: gateway-guest-token-key
        name: guest-token-key
