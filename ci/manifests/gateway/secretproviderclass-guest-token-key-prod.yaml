# noetl/ai-meta#484 — the gateway guest-session signing key (HMAC-SHA256,
# >= 32 bytes) from GCP Secret Manager, mounted as a file and read through
# GATEWAY_GUEST_TOKEN_KEY_FILE. The value never appears in a manifest or env.
#
# Secret: projects/shastaratech-noetl-prod/secrets/gateway-guest-token-key
# (created 2026-10-19 from `openssl rand -base64 48`). Access: only
# roles/secretmanager.secretAccessor on this one secret for the KSA
# gateway/default, granted directly to the Workload Identity Federation
# principal (no GSA):
#   principal://iam.googleapis.com/projects/986938120811/locations/global/workloadIdentityPools/shastaratech-noetl-prod.svc.id.goog/subject/ns/gateway/sa/default
#
# Rotation (ends every guest session): add a new version, then restart the
# gateway (the CSI volume is read at pod start).
#
# provider: gke + driver secrets-store-gke.csi.k8s.io — see
# ci/manifests/noetl/secretproviderclass-internal-api-token-prod.yaml.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: gateway-guest-token-key
  namespace: gateway
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/shastaratech-noetl-prod/secrets/gateway-guest-token-key/versions/latest"
        path: "key"
