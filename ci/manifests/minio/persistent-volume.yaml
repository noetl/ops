---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: minio
  namespace: minio
spec:
  storageClassName: standard
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: 5Gi
  hostPath:
    path: /mnt/data/minio-data

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio
  namespace: minio
spec:
  volumeName: minio
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
