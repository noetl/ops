# ConfigMap for noetl-k8s-watcher.
#
# Holds the watcher's runtime config (env vars) AND the watcher
# script itself.  Shipping the script in a ConfigMap lets us
# iterate the contract without a new image — the deployment uses
# the alpine/k8s image, which has kubectl + jq + curl baked in.
#
# When the watcher graduates to a real Rust binary (follow-up to
# round 1), the script-via-ConfigMap shape goes away and only the
# env config remains here.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: noetl-k8s-watcher-config
  namespace: noetl
  labels:
    app: noetl-k8s-watcher
    component: k8s-watcher
data:
  # noetl-server's base URL for the callback endpoint.  Same
  # service the worker pool uses.
  NOETL_SERVER_URL: "http://noetl.noetl.svc.cluster.local:8082"

  # Namespace whose Jobs the watcher subscribes to.  Single-ns
  # for round 1; multi-ns is a follow-up.
  NOETL_K8S_WATCH_NAMESPACE: "noetl"

  # Label whose presence on a Job marks it as NoETL-dispatched.
  # The watcher ignores Jobs without this label even within the
  # watched namespace — keeps out-of-band Jobs (cert-manager,
  # backup pipelines) from generating stale callbacks.
  NOETL_K8S_WATCH_LABEL_SELECTOR: "noetl.execution-id"
---
# The watcher script itself.  Mounted at /opt/watcher/watcher.sh
# in the Deployment.  See README.md for the contract.
apiVersion: v1
kind: ConfigMap
metadata:
  name: noetl-k8s-watcher-script
  namespace: noetl
  labels:
    app: noetl-k8s-watcher
    component: k8s-watcher
data:
  watcher.sh: |
    #!/bin/sh
    # noetl-k8s-watcher MVP — shell wrapper around
    # `kubectl get jobs --watch -o json`.  Round 1 of
    # noetl/ai-meta#43.  Pure Rust binary is a clean follow-up.

    set -eu

    : "${NOETL_SERVER_URL:?NOETL_SERVER_URL must be set}"
    : "${NOETL_K8S_WATCH_NAMESPACE:?NOETL_K8S_WATCH_NAMESPACE must be set}"
    : "${NOETL_K8S_WATCH_LABEL_SELECTOR:?NOETL_K8S_WATCH_LABEL_SELECTOR must be set}"
    : "${NOETL_INTERNAL_API_TOKEN:?NOETL_INTERNAL_API_TOKEN must be set}"

    echo "noetl-k8s-watcher: starting"
    echo "  server:    $NOETL_SERVER_URL"
    echo "  namespace: $NOETL_K8S_WATCH_NAMESPACE"
    echo "  selector:  $NOETL_K8S_WATCH_LABEL_SELECTOR"

    # Track posted Jobs by UID so a retry on transport error doesn't
    # double-post on the next watch event.  In-memory only (pod
    # lifetime); the server's handler is idempotent per
    # (execution_id, step, job_name) so a missed dedupe is harmless.
    POSTED_DIR="/tmp/watcher-posted"
    mkdir -p "$POSTED_DIR"

    # Map a K8s Job's conditions to TerminalState.  Reads the JSON
    # of a single Job (stdin) and emits one of:
    #   succeeded|failed|failed_timeout
    # or empty (Job not yet terminal).  Job-level conditions can't
    # express OOMKilled / image-pull failures — those live on the
    # backing Pod's status and are resolved by classify_pod_failure
    # below, which refines a generic `failed` into the specific
    # variant from the umbrella's failure-mode taxonomy.
    classify_state() {
      jq -r '
        # Complete condition (exit 0)?
        if (.status.conditions // [])
             | map(select(.type == "Complete" and .status == "True"))
             | length > 0 then
          "succeeded"
        # Failed with a reason?
        elif (.status.conditions // [])
               | map(select(.type == "Failed" and .status == "True"))
               | length > 0 then
          (.status.conditions
            | map(select(.type == "Failed" and .status == "True"))
            | .[0].reason // "") as $r
          | if   $r == "BackoffLimitExceeded" then "failed"
            elif $r == "DeadlineExceeded"      then "failed_timeout"
            elif $r == "PodFailurePolicy"      then "failed"
            else                                    "failed"
            end
        else
          empty
        end
      '
    }

    # Refine a generic Job failure into the specific TerminalState
    # variant that only the backing Pod's status carries:
    #   OOMKilled                        -> failed_oom
    #   ImagePullBackOff / ErrImagePull  -> failed_image_pull
    # Echoes the refined state, or empty when no pod-level reason
    # applies (caller keeps the Job-level `failed`).  RBAC grants
    # pods/get,list,watch (see rbac.yaml).  Checks both the live
    # `state` and `lastState` so an already-reaped restart is still
    # seen, across regular and init containers.
    classify_pod_failure() {
      JOB_NAME="$1"
      PODS_JSON=$(kubectl get pods \
          -n "$NOETL_K8S_WATCH_NAMESPACE" \
          -l "job-name=$JOB_NAME" \
          --output=json 2>/dev/null) || return 0
      printf '%s' "$PODS_JSON" | jq -r '
        [ .items[]?
          | (.status.containerStatuses // []) + (.status.initContainerStatuses // [])
          | .[]?
        ] as $cs
        | if   ([ $cs[]
                  | select(.state.terminated.reason == "OOMKilled"
                        or .lastState.terminated.reason == "OOMKilled") ] | length) > 0 then
            "failed_oom"
          elif ([ $cs[]
                  | select(.state.waiting.reason == "ImagePullBackOff"
                        or .state.waiting.reason == "ErrImagePull") ] | length) > 0 then
            "failed_image_pull"
          else
            empty
          end
      '
    }

    # Build the POST body.  The watcher relays whatever exit_code
    # + reason the pod surfaced; the server normalises onto its
    # `TerminalState` enum.
    build_body() {
      JOB_JSON="$1"
      STATE="$2"
      # `completed_at` must be RFC3339 (the server parses it as a
      # chrono DateTime<Utc>).  A *failed* Job has no
      # `.status.completionTime`, so fall back to `now | todate`
      # (RFC3339) — NOT bare `now`, which is a numeric Unix epoch and
      # makes the server reject the body with HTTP 422.
      printf '%s' "$JOB_JSON" | jq --arg state "$STATE" '{
        state:        $state,
        job_name:     .metadata.name,
        job_uid:      .metadata.uid,
        completed_at: (.status.completionTime // (now | todate)),
        exit_code:    null,
        reason:       (
          (.status.conditions // [])
            | map(select(.status == "True"))
            | .[0].message // ""
        )
      }'
    }

    # POST a single terminal event to the server.  Retries 3x with
    # backoff on transport errors; idempotent per Round 2.
    post_callback() {
      EID="$1"
      STEP="$2"
      BODY="$3"
      URL="$NOETL_SERVER_URL/api/internal/container-callback/$EID/$STEP"
      ATTEMPT=0
      while [ $ATTEMPT -lt 3 ]; do
        STATUS=$(printf '%s' "$BODY" | curl -sS -o /tmp/last-resp -w '%{http_code}' \
          -X POST "$URL" \
          -H "Authorization: Bearer $NOETL_INTERNAL_API_TOKEN" \
          -H "Content-Type: application/json" \
          --data-binary @- || echo "000")
        case "$STATUS" in
          2*) return 0 ;;
          400|401|403|404)
            echo "noetl-k8s-watcher: $URL returned HTTP $STATUS; not retrying"
            cat /tmp/last-resp || true
            return 1
            ;;
          *)
            ATTEMPT=$((ATTEMPT + 1))
            echo "noetl-k8s-watcher: $URL returned HTTP $STATUS attempt $ATTEMPT/3; backing off"
            sleep $((ATTEMPT * 2))
            ;;
        esac
      done
      echo "noetl-k8s-watcher: $URL failed after 3 attempts; giving up"
      return 1
    }

    # Main watch loop.  Restarts on stream EOF (cluster pause /
    # apiserver restart).
    while true; do
      kubectl get jobs \
          -n "$NOETL_K8S_WATCH_NAMESPACE" \
          -l "$NOETL_K8S_WATCH_LABEL_SELECTOR" \
          --watch --output=json --output-watch-events 2>/dev/null \
        | while read -r LINE; do
            # Each event is a JSON object: { "type": "ADDED|MODIFIED|...", "object": {...} }
            EVENT_TYPE=$(printf '%s' "$LINE" | jq -r '.type // ""')
            [ "$EVENT_TYPE" = "MODIFIED" ] || [ "$EVENT_TYPE" = "ADDED" ] || continue

            JOB=$(printf '%s' "$LINE" | jq '.object')
            UID=$(printf '%s' "$JOB" | jq -r '.metadata.uid // ""')
            NAME=$(printf '%s' "$JOB" | jq -r '.metadata.name // ""')
            EID=$(printf '%s' "$JOB"  | jq -r '.metadata.labels."noetl.execution-id" // ""')
            STEP=$(printf '%s' "$JOB" | jq -r '.metadata.labels."noetl.step-name"    // ""')

            # Require both labels (filtering already requires the
            # presence-selector, but step-name is round-3 contract).
            [ -n "$EID" ]  || continue
            [ -n "$STEP" ] || { echo "noetl-k8s-watcher: $NAME missing noetl.step-name label; skipping"; continue; }

            # Already posted for this Job UID?
            [ -f "$POSTED_DIR/$UID" ] && continue

            # Classify; empty means not-yet-terminal.
            STATE=$(printf '%s' "$JOB" | classify_state)
            [ -n "$STATE" ] || continue

            # Refine a generic Job failure into the specific
            # pod-level variant (OOMKilled -> failed_oom,
            # image-pull -> failed_image_pull) when the Pod status
            # carries one.  Success / timeout are already precise.
            case "$STATE" in
              failed)
                REFINED=$(classify_pod_failure "$NAME")
                [ -n "$REFINED" ] && STATE="$REFINED"
                ;;
            esac

            BODY=$(build_body "$JOB" "$STATE")
            echo "noetl-k8s-watcher: posting callback for $NAME ($STATE) execution=$EID step=$STEP"
            if post_callback "$EID" "$STEP" "$BODY"; then
              touch "$POSTED_DIR/$UID"
              echo "noetl-k8s-watcher: posted callback for $NAME ($STATE)"
            fi
          done
      echo "noetl-k8s-watcher: watch stream ended; restarting in 3s"
      sleep 3
    done
