# Client-facing Services for kind.
#
# `noetl` is the in-cluster name the gateway / doctor / CLI contexts use; it must
# select the Rust server (the Python-era `app: noetl-server` label matches no pod).
# `noetl-ext` is the NodePort that ci/kind/config.yaml maps to host port 8082
# (containerPort 30082 -> hostPort 8082).
apiVersion: v1
kind: Service
metadata:
  name: noetl
  namespace: noetl
  labels:
    app: noetl
spec:
  type: ClusterIP
  selector:
    app: noetl-server-rust
  ports:
    - name: noetl
      port: 8082
      targetPort: 8082
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: noetl-ext
  namespace: noetl
  labels:
    app: noetl-server-rust
spec:
  type: NodePort
  selector:
    app: noetl-server-rust
  ports:
    - name: http
      port: 8082
      targetPort: 8082
      nodePort: 30082
      protocol: TCP
