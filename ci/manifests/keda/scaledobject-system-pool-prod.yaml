# System worker pool autoscaler — noetl/ai-meta#318
#
# Why this exists. `POST /api/execute` issues an `__orchestrate__` drive routed
# to the `system` pool (server `handlers/execute.rs`, "so it doesn't compete with
# user compute for slots"). That pool was TWO deployments at one replica each --
# a fixed two-worker ceiling -- while `noetl-worker-rust` scaled 2->20. Under an
# in-cluster load run the user pool reached 20/20, `commands.system.shard.0` lag
# reached 103, and successful requests took 22s until they crossed the client
# timeout. The system pool was the ceiling.
#
# Why adding replicas is SAFE here (this was checked, not assumed):
#   * `ClaimCoordinator::claim_next` guarantees "members sharing a filter compete
#     exactly-once", and both system-pool deployments ALREADY share
#     `NOETL_FEED_FILTER_SUBJECT=noetl.commands.system.>`. Competing consumers is
#     the designed shape, not a new one.
#   * `NOETL_SHARD_INDEX` does not gate exclusivity here: the command consumer
#     filters by SUBJECT, and the state materializer keys on
#     `NOETL_RESULT_SHARD_COUNT` (content-addressed object placement), not on the
#     shard index.
#
# ⚠⚠ THE ONE CONDITION THAT WOULD MAKE THIS UNSAFE.
# `NOETL_SHARD_INDEX` IS load-bearing for the DURABLE event-log backend
# (`ownership_from_env` -> `ShardOwnership`). That backend is selected by
# `NOETL_EHDB_EVENTLOG_BACKEND`, which is UNSET on both system-pool deployments,
# so the default `LocalReference` applies and the ownership path is not reached.
# If that variable is ever set to `durable` while this autoscaler is active,
# replicas would share a shard index and become two owners of one shard.
# `playbooks/drift-audit.sh system-pool-scaling` fails loudly on exactly that
# combination -- these are two numbers that must agree.
#
# Mirrors the WORKING prod scaler (`noetl-worker-rust`), which uses `metrics-api`
# against the writer's :9102 exposition.
# ⚠ NOT the VictoriaMetrics-based `scaledobject-worker-ehdb-command-bus.yaml`:
# that trigger points at `vmsingle-...vmstack.svc`, and no VictoriaMetrics
# service exists in this cluster, so it would never resolve.
#
# Rollback is capacity-only: delete this ScaledObject and the Deployment returns
# to its static replica count. No ownership state changes either way.
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: noetl-worker-system-pool
  namespace: noetl
  labels:
    app: noetl-worker-system-pool
    worker-pool: worker-system-pool
    managed-by: noetl
spec:
  scaleTargetRef:
    name: noetl-worker-system-pool
  # min 1 preserves today's baseline, so applying this changes nothing until
  # backlog appears. max 10 bounds the blast radius: the writer is replicas:1 and
  # every drive still funnels through its command bus, so unbounded fan-out would
  # only move the queue.
  minReplicaCount: 1
  maxReplicaCount: 10
  pollingInterval: 10
  cooldownPeriod: 30
  triggers:
    - type: metrics-api
      metadata:
        url: http://noetl-cmdbus-writer-0.noetl.svc.cluster.local:9102/metrics
        format: prometheus
        # The SYSTEM subject -- the user pool's scaler reads commands.shared.
        valueLocation: ehdb_feed_subject_lag{subject="commands.system.shard.0"}
        targetValue: "5"
        activationTargetValue: "1"
