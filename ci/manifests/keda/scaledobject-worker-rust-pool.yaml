# NoETL worker pool autoscaler — Rust pool
#
# Pairs with the existing `scaledobject-worker-cpu-01.yaml` (Python
# noetl-worker scaler).  Both pools claim from the SAME NATS stream +
# consumer (`NOETL_COMMANDS` / `noetl_worker_pool`), so NATS dispatches
# each pending message to whichever pool's pod sends the next pull
# request.  Adding this Rust-pool scaler lets KEDA scale both halves
# of the worker fleet on real consumer lag instead of leaving the Rust
# pool at a fixed 1 replica.
#
# Generated by:
#   from noetl.core.runtime.keda import (
#       ScaledObjectSpec, build_worker_scaledobject, dump_scaledobject_yaml,
#   )
#   spec = ScaledObjectSpec(
#       worker_pool_urn="noetl://tenant/default/org/default/worker/worker-rust-pool",
#       deployment="noetl-worker-rust",
#       nats_consumer="noetl_worker_pool",
#   )
#   print(dump_scaledobject_yaml(build_worker_scaledobject(spec)))
#
# The explicit `nats_consumer=` matches both the existing
# `noetl-worker-config` ConfigMap (`NATS_CONSUMER=noetl_worker_pool`)
# AND the Rust deployment's explicit env override at
# `worker-rust-deployment.yaml::env[NATS_CONSUMER]=noetl_worker_pool`.
# That shared-consumer wiring is the whole point — see the README
# section "Apply the rust-pool scaler" for the dispatch semantics.
#
# Sample manifest — committed verbatim so the noetl/noetl drift guard
# (`tests/core/runtime/test_keda.py::test_sample_manifest_matches_generator_output[worker-rust-pool-rust-pool]`)
# catches any hand-edit.  To regenerate after a generator update,
# re-run the snippet above and overwrite this file.
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: noetl-worker-rust-scaler-worker-rust-pool
  namespace: noetl
  labels:
    app: noetl-worker-rust
    worker-pool: worker-rust-pool
    managed-by: noetl
spec:
  scaleTargetRef:
    name: noetl-worker-rust
  minReplicaCount: 1
  maxReplicaCount: 20
  pollingInterval: 10
  cooldownPeriod: 30
  triggers:
  - type: nats-jetstream
    metadata:
      natsServerMonitoringEndpoint: nats.nats.svc.cluster.local:8222
      account: NOETL
      stream: NOETL_COMMANDS
      consumer: noetl_worker_pool
      lagThreshold: '10'
      activationLagThreshold: '1'
      useHttps: 'false'
