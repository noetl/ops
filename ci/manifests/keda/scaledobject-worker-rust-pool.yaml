# NoETL worker pool autoscaler — Rust pool
#
# Pairs with `scaledobject-worker-cpu-01.yaml` (the Python pool's
# multi-trigger scaler).  Both pools claim from the same NATS stream
# `NOETL_COMMANDS`, but the Rust pool only subscribes to the shared
# pool segment (`noetl_worker_pool_shared` consumer, filter subject
# `noetl.commands.shared.>`) per noetl/ai-meta#42 PR-2b / PR-3.  This
# scaler therefore reads ONLY the shared consumer's backlog — when
# PR-5 flips the routing flag, publishes for Python-only tool kinds
# (today: `agent`) land on `.python.>` and won't show up here; the
# Rust pool stays idle on those without spinning up extra capacity.
#
# Generated by:
#   from noetl.core.runtime.keda import (
#       ScaledObjectSpec, build_worker_scaledobject, dump_scaledobject_yaml,
#   )
#   spec = ScaledObjectSpec(
#       worker_pool_urn="noetl://tenant/default/org/default/worker/worker-rust-pool",
#       deployment="noetl-worker-rust",
#       nats_consumer="noetl_worker_pool_shared",
#   )
#   print(dump_scaledobject_yaml(build_worker_scaledobject(spec)))
#
# The `noetl_worker_pool_shared` consumer name matches the Rust
# deployment's env override at
# `worker-rust-deployment.yaml::env[NATS_CONSUMER]=noetl_worker_pool_shared`
# AND the `NATS_FILTER_SUBJECT=noetl.commands.shared.>` env that
# pins the Rust pool to the shared segment.
# That shared-consumer wiring is the whole point — see the README
# section "Apply the rust-pool scaler" for the dispatch semantics.
#
# Sample manifest — committed verbatim so the noetl/noetl drift guard
# (`tests/core/runtime/test_keda.py::test_sample_manifest_matches_generator_output[worker-rust-pool-rust-pool]`)
# catches any hand-edit.  To regenerate after a generator update,
# re-run the snippet above and overwrite this file.
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: noetl-worker-rust-scaler-worker-rust-pool
  namespace: noetl
  labels:
    app: noetl-worker-rust
    worker-pool: worker-rust-pool
    managed-by: noetl
spec:
  scaleTargetRef:
    name: noetl-worker-rust
  minReplicaCount: 1
  maxReplicaCount: 20
  pollingInterval: 10
  cooldownPeriod: 30
  triggers:
  - type: nats-jetstream
    metadata:
      natsServerMonitoringEndpoint: nats.nats.svc.cluster.local:8222
      account: NOETL
      stream: NOETL_COMMANDS
      consumer: noetl_worker_pool_shared
      lagThreshold: '10'
      activationLagThreshold: '1'
      useHttps: 'false'
