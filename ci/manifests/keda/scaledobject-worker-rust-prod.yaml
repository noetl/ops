# NoETL Rust worker pool autoscaler — PRODUCTION (GKE shastaratech-noetl-prod)
# =============================================================================
# Phase F R5 of noetl/ai-meta#49 — autoscaling for the post-cutover Rust worker
# pool.  Mirrors the Python pool's KEDA scaler (2→20 on backlog) but reads the
# DEDICATED Rust command stream + consumer:
#   - stream:   NOETL_COMMANDS_RUST   (subjects noetl.commands.>)
#   - consumer: noetl_worker_rust_shared (filter noetl.commands.shared.>)
# Endpoint + account match the prod Python scaler (nats-headless / $G), NOT the
# kind sample (scaledobject-worker-rust-pool.yaml, which is drift-guarded and
# targets the shared NOETL_COMMANDS stream on kind).
#
# ── SECOND TRIGGER: EHDB command-bus lag (noetl/ai-meta#194 T5 prerequisite) ──
# The command bus is LIVE on EHDB in prod (`NOETL_COMMAND_BUS=ehdb` on the
# server and every pool).  NATS still exists but no longer carries commands, so
# the `nats-jetstream` trigger below reads a consumer whose backlog is
# permanently 0 — and at T5 (NATS deletion) it loses its signal entirely.  With
# only that trigger, deleting NATS freezes this pool at its current slots
# (minReplicaCount 2 × WORKER_MAX_CONCURRENT 4 = 8) with no way to absorb a
# burst.  That is the hard-ordering rule from the RFC: **scaling must have a
# signal before NATS goes away.**
#
# So the EHDB trigger is ADDED alongside the NATS one rather than replacing it.
# KEDA's HPA reconciler takes the MAX desired-replicas across triggers, so:
#   - today  — the NATS trigger reads 0, the EHDB trigger drives scaling; no
#              regression while NATS is still installed.
#   - at T5  — the NATS trigger is deleted with the rest of the NATS wiring and
#              nothing about this pool's scaling changes.
# Removing the NATS trigger is a T5 step, not a prerequisite for it.
#
# ── WHY metrics-api AND NOT prometheus ───────────────────────────────────────
# This cluster has **no in-cluster PromQL endpoint**.  Prod monitoring is Google
# Managed Prometheus: the writer's `/metrics` is scraped by
# `PodMonitoring/noetl-cmdbus-writer` (gmp/podmonitoring-cmdbus-writer.yaml) and
# the samples land in Cloud Monitoring — queryable over the GMP HTTP API, not
# from inside the cluster.  (The VictoriaMetrics endpoint the kind sample
# `scaledobject-worker-ehdb-command-bus.yaml` points at does not exist here; the
# `vmservicescrape` CRD is not even installed.)
#
# Two ways to give KEDA a `prometheus` trigger were considered and rejected:
#   1. Deploy the GMP query frontend (gmp-public/frontend) — needs a GSA with
#      `roles/monitoring.viewer` + a Workload Identity binding.  The project has
#      NO monitoring.* role binding today, so this is a new IAM grant: a
#      human-gated change, and a new always-on workload sitting in the query
#      path of an autoscaler.
#   2. KEDA's `gcp-stackdriver` trigger — same IAM problem, plus either a
#      service-account key in a Secret or Workload Identity on keda-operator.
#
# `metrics-api` needs neither: it scrapes the writer's Prometheus endpoint
# **directly, in-cluster**, over the same ClusterIP the workers already claim
# through.  Fewer moving parts between the backlog and the scaler, and no
# dependency on the monitoring pipeline being healthy for autoscaling to work —
# the right coupling for a T5 prerequisite.  The GMP scrape stays as the
# *observability* path (dashboards, alerting, auditing this scaler).
#
# ── THE valueLocation IS A CONTRACT ──────────────────────────────────────────
# KEDA's metrics-api scaler in `format: prometheus` has NO label selector: it
# prefix-matches `valueLocation` against the whole `name{labels}` token of each
# exposition line and takes the first match
# (kedacore/keda@v2.15.0 pkg/scalers/metrics_api_scaler.go).  The ehdb renderer
# emits sorted, single-label, space-free lines precisely so this stays stable; a
# test in noetl/ehdb (`the_exposition_line_is_byte_stable_for_kedas_prefix_match`)
# pins the byte shape.  Do not "tidy" the value below.
#
# ── THRESHOLD ────────────────────────────────────────────────────────────────
# `targetValue` is an AverageValue: desiredReplicas = ceil(lag / targetValue).
# Each replica runs WORKER_MAX_CONCURRENT=4 commands, so at minReplicaCount=2
# the pool has 8 slots.  targetValue=2 adds a replica per 2 queued commands —
# the pool reaches its 8-slot capacity in replicas at a backlog of 8, with a
# replica of headroom already on the way up.  Scaling only once backlog exceeds
# capacity (targetValue=4) is too late: the #205 saturating-burst measurement
# showed p50 dispatch spiking to ~2 s purely from queueing once the slots were
# full.  maxReplicaCount 20 × 4 = 80 slots, reached at a backlog of 40.
#
# ── FALLBACK ─────────────────────────────────────────────────────────────────
# If the writer's /metrics is unreachable (writer pod restarting, per
# noetl/ai-meta#208) the scaler errors.  Without a fallback KEDA holds the last
# known replica count indefinitely; with it the pool settles at 2 — the same
# floor it has when idle — after 3 consecutive failures (~30 s at
# pollingInterval 10).  A writer that is down means the bus is down, so holding
# a floor beats scaling on a stale reading.
#
# ── ACTIVATION (2026-07-31) ──────────────────────────────────────────────────
# This object carried `autoscaling.keda.sh/paused: "true"` from 2026-07-26 until
# 2026-07-31.  That was not a soft pause: **KEDA 2.15 deletes the HPA and stops
# running the scaler loop** while the annotation is set, so the user pool had no
# autoscaling of any kind for that window (noetl/ai-meta#210) — `get hpa`
# returned nothing and the external-metrics API 404'd.  Worse, the object still
# *looked* configured, because `.status.externalMetricNames` does not refresh on
# a paused object and went on naming the old NATS metric.
#
# The annotation is now removed and the pool scales on the EHDB per-subject lag
# above.  Two consequences worth knowing before editing this file:
#
#   - Re-adding the annotation is the instant rollback, but it re-enters the
#     no-autoscaling state above; it pins the Deployment at its current replica
#     count rather than returning it to a floor.
#   - A paused ScaledObject cannot be *proven* on the cluster.  The trigger shape
#     was proven in kind against a real EHDB bus before unpausing here.
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: noetl-worker-rust
  namespace: noetl
  labels:
    app: noetl-worker-rust
    worker-pool: worker-rust-pool
    command-bus: ehdb
    managed-by: noetl
    # KEDA stamps this itself; carried in the manifest so a re-apply does not
    # prune it out from under the controller.
    scaledobject.keda.sh/name: noetl-worker-rust
  # ACTIVE.  The `autoscaling.keda.sh/paused` annotation this file used to carry
  # is gone deliberately — see "Activation" in the header comment.
spec:
  scaleTargetRef:
    name: noetl-worker-rust
  minReplicaCount: 2
  maxReplicaCount: 20
  pollingInterval: 10
  cooldownPeriod: 30
  fallback:
    failureThreshold: 3
    replicas: 2
  triggers:
    # (1) EHDB command bus — the authoritative signal today, and the only one
    #     that survives T5.
    - type: metrics-api
      metadata:
        url: "http://noetl-cmdbus-writer-0.noetl.svc.cluster.local:9102/metrics"
        format: prometheus
        # THIS POOL'S OWN backlog, not the whole shard's.  Prod runs a single
        # command shard (NOETL_COMMAND_SHARD_COUNT=1) carrying BOTH
        # `commands.shared.shard.0` (this pool) and `commands.system.shard.0`, and
        # `SubjectConsumerGroup::lag` counts every subject past one committed
        # cursor.  Triggering on `ehdb_feed_total_lag` would therefore over-report
        # this pool's queue by the system pool's — safe upward, but a **stuck
        # system-pool command pins the global committed cursor**, pinning
        # whole-shard lag high forever and holding this pool at maxReplicaCount
        # indefinitely.  noetl/ehdb#303 splits the backlog by routing subject;
        # noetl/worker#197 exposes it from the writer.
        #
        # The quoting matters: KEDA prefix-matches this against the whole
        # `name{labels}` token, so the label must be byte-identical to what the
        # writer renders (single label, no spaces).  YAML single quotes keep the
        # inner double quotes literal.
        valueLocation: 'ehdb_feed_subject_lag{subject="commands.shared.shard.0"}'
        targetValue: "2"
        activationTargetValue: "1"
    # (2) NATS JetStream — a no-op while the bus is EHDB (this consumer's
    #     backlog is permanently 0), kept until the T5 NATS teardown removes it.
    - type: nats-jetstream
      metadata:
        natsServerMonitoringEndpoint: nats-headless.nats.svc.cluster.local:8222
        account: "$G"
        stream: NOETL_COMMANDS_RUST
        consumer: noetl_worker_rust_shared
        lagThreshold: "10"
        activationLagThreshold: "1"
        useHttps: "false"
