# NoETL Python worker pool autoscaler — multi-trigger after R-3 Phase C-1
#
# Generated by:
#   from noetl.core.runtime.keda import (
#       ScaledObjectSpec, build_worker_scaledobject, dump_scaledobject_yaml,
#   )
#   spec = ScaledObjectSpec(
#       worker_pool_urn="noetl://tenant/default/org/default/worker/worker-cpu-01",
#       deployment="noetl-worker",
#       nats_consumer="noetl_worker_pool",
#       additional_consumers=(
#           "noetl_worker_pool_shared",
#           "noetl_worker_pool_python",
#       ),
#   )
#   print(dump_scaledobject_yaml(build_worker_scaledobject(spec)))
#
# The Python pool subscribes to three NATS JetStream consumers per
# noetl/ai-meta#42 PR-2b (one per pool segment in
# `NOETL_WORKER_POOL_SEGMENTS=legacy,shared,python`).  KEDA reads
# the backlog of each consumer as an independent trigger and the
# HPA reconciler picks the MAX desired-replicas count across them —
# so the pool scales on whichever segment has the largest backlog.
#
# Why three triggers (not one):
# - PR-1 / PR-5 routing flag is OFF today, so all publishes still
#   go to bare `noetl.commands` and only the legacy consumer
#   accumulates backlog.  Single-trigger would scale fine RIGHT NOW.
# - At PR-5 cutover, publishes start landing on
#   `noetl.commands.shared.<eid>` / `noetl.commands.python.<eid>`.
#   The legacy consumer becomes empty; the shared + python
#   consumers receive all new commands.  Without the additional
#   triggers, KEDA would see zero legacy backlog and scale the
#   Python pool DOWN to minReplicas while the new consumers
#   drown — a real production-traffic failure mode.
# - With three triggers, the scaler stays correct across the
#   cutover window (and after PR-6 cleanup removes the legacy
#   consumer entirely).
#
# Sample manifest — committed verbatim so the noetl/noetl drift
# guard (`tests/core/runtime/test_keda.py::test_sample_manifest_matches_generator_output[worker-cpu-01-python-pool]`)
# catches any hand-edit.  To regenerate after a generator update,
# re-run the snippet above and overwrite this file (keeping these
# header comments).
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: noetl-worker-scaler-worker-cpu-01
  namespace: noetl
  labels:
    app: noetl-worker
    worker-pool: worker-cpu-01
    managed-by: noetl
spec:
  scaleTargetRef:
    name: noetl-worker
  minReplicaCount: 1
  maxReplicaCount: 20
  pollingInterval: 10
  cooldownPeriod: 30
  triggers:
  - type: nats-jetstream
    metadata:
      natsServerMonitoringEndpoint: nats.nats.svc.cluster.local:8222
      account: NOETL
      stream: NOETL_COMMANDS
      consumer: noetl_worker_pool
      lagThreshold: '10'
      activationLagThreshold: '1'
      useHttps: 'false'
  - type: nats-jetstream
    metadata:
      natsServerMonitoringEndpoint: nats.nats.svc.cluster.local:8222
      account: NOETL
      stream: NOETL_COMMANDS
      consumer: noetl_worker_pool_shared
      lagThreshold: '10'
      activationLagThreshold: '1'
      useHttps: 'false'
  - type: nats-jetstream
    metadata:
      natsServerMonitoringEndpoint: nats.nats.svc.cluster.local:8222
      account: NOETL
      stream: NOETL_COMMANDS
      consumer: noetl_worker_pool_python
      lagThreshold: '10'
      activationLagThreshold: '1'
      useHttps: 'false'
