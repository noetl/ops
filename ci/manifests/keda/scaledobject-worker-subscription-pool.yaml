# NoETL worker pool autoscaler — subscription/IoT pool (noetl/ai-meta#90 Phase 2)
#
# Pairs with `scaledobject-worker-rust-pool.yaml` (the shared Rust pool).
# This scaler reads the backlog of the dedicated subscription command
# segment ONLY — the `noetl_worker_pool_subscription` consumer, filter
# subject `noetl.commands.subscription.>`.  A subscription firehose
# scales `noetl-worker-rust-subscription-pool` independently; the shared
# pool (`noetl-worker-rust`) is unaffected (RFC requirement 2 + 4 — the
# in-cluster isolation boundary).
#
# The continuous subscription runtime itself stays at replicas: 1 (a
# pull runtime must hold the source open); KEDA scales the *execution*
# pool that drains the per-message commands, not the runtime.
#
# Generated by (same helper as the shared-pool scaler):
#   from noetl.core.runtime.keda import (
#       ScaledObjectSpec, build_worker_scaledobject, dump_scaledobject_yaml,
#   )
#   spec = ScaledObjectSpec(
#       worker_pool_urn="noetl://tenant/default/org/default/worker/worker-subscription-pool",
#       deployment="noetl-worker-rust-subscription-pool",
#       nats_consumer="noetl_worker_pool_subscription",
#   )
#   print(dump_scaledobject_yaml(build_worker_scaledobject(spec)))
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: noetl-worker-rust-scaler-worker-subscription-pool
  namespace: noetl
  labels:
    app: noetl-worker-rust-subscription-pool
    worker-pool: worker-subscription-pool
    managed-by: noetl
spec:
  scaleTargetRef:
    name: noetl-worker-rust-subscription-pool
  minReplicaCount: 1
  maxReplicaCount: 20
  pollingInterval: 10
  cooldownPeriod: 30
  triggers:
  - type: nats-jetstream
    metadata:
      natsServerMonitoringEndpoint: nats.nats.svc.cluster.local:8222
      account: NOETL
      stream: NOETL_COMMANDS
      consumer: noetl_worker_pool_subscription
      lagThreshold: '10'
      activationLagThreshold: '1'
      useHttps: 'false'
