# NoETL worker pool autoscaler — System pool
#
# Pairs with `scaledobject-worker-rust-pool.yaml` (user pool) and
# `scaledobject-worker-cpu-01.yaml` (Python pool's multi-trigger
# scaler).  The system pool subscribes to a dedicated NATS consumer
# (`noetl_worker_pool_system` with filter subject
# `noetl.commands.system.>`) and only sees commands routed under the
# `system_*` tool-kind family.  Per noetl/ai-meta#46 Phase 1.b.
#
# Today the consumer is empty — Phase 2 of #46 will land the routing
# extension that publishes to `noetl.commands.system.<eid>` and the
# first system playbook (`system/outbox_publisher`).  The scaler is
# active now so the pool spins up the moment work arrives.
#
# Generated by:
#   from noetl.core.runtime.keda import (
#       ScaledObjectSpec, build_worker_scaledobject, dump_scaledobject_yaml,
#   )
#   spec = ScaledObjectSpec(
#       worker_pool_urn="noetl://tenant/default/org/default/worker/worker-system-pool",
#       deployment="noetl-worker-system-pool",
#       nats_consumer="noetl_worker_pool_system",
#   )
#   print(dump_scaledobject_yaml(build_worker_scaledobject(spec)))
#
# Sample manifest — committed verbatim so the noetl/noetl drift guard
# (`tests/core/runtime/test_keda.py::test_sample_manifest_matches_generator_output`)
# catches any hand-edit.  Adding this manifest to the drift test's
# parametrize list lands in a sibling PR on noetl/noetl.  Until that
# lands, this file is a generator-output fixture without an automated
# drift check.
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: noetl-worker-system-pool-scaler-worker-system-pool
  namespace: noetl
  labels:
    app: noetl-worker-system-pool
    worker-pool: worker-system-pool
    managed-by: noetl
spec:
  scaleTargetRef:
    name: noetl-worker-system-pool
  minReplicaCount: 1
  maxReplicaCount: 20
  pollingInterval: 10
  cooldownPeriod: 30
  triggers:
  - type: nats-jetstream
    metadata:
      natsServerMonitoringEndpoint: nats.nats.svc.cluster.local:8222
      account: NOETL
      stream: NOETL_COMMANDS
      consumer: noetl_worker_pool_system
      lagThreshold: '10'
      activationLagThreshold: '1'
      useHttps: 'false'
