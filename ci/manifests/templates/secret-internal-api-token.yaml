# Stub Secret for ``NOETL_INTERNAL_API_TOKEN``.
#
# Per noetl/ai-meta#46 Phase 1.b.  The system worker pool mounts this
# Secret as env via ``secretKeyRef`` in
# ``worker-system-pool-deployment.yaml``.  The token is the bearer
# credential the system playbooks pass on every call to
# ``/api/internal/*`` (per ``agents/rules/data-access-boundary.md``).
#
# IMPORTANT: This file does NOT contain a real token.  The committed
# value is an obvious placeholder so checkouts can't accidentally
# match a production token.  Operators generate the live token
# out-of-band and apply with:
#
#     # local kind (development)
#     openssl rand -hex 32 > /tmp/internal_api_token.txt
#     kubectl --context kind-noetl -n noetl create secret generic \
#       noetl-internal-api-token \
#       --from-literal=token="$(cat /tmp/internal_api_token.txt)" \
#       --dry-run=client -o yaml | kubectl --context kind-noetl apply -f -
#
#     # also set the matching env on noetl-server so the auth gate
#     # accepts the token:
#     kubectl --context kind-noetl -n noetl set env deployment/noetl-server \
#       "NOETL_INTERNAL_API_TOKEN=$(cat /tmp/internal_api_token.txt)"
#
# For GKE production, the token is provisioned via the operator's
# Secret-management workflow (GCP Secret Manager, sealed-secrets,
# etc. — out of scope for the kind manifest).
#
# This stub is committed so ``kubectl apply -f ci/manifests/noetl/``
# in a fresh kind cluster doesn't fail with "Secret not found" on
# the worker pod startup — but the placeholder token won't grant
# access until replaced with a real value.
apiVersion: v1
kind: Secret
metadata:
  name: noetl-internal-api-token
  namespace: noetl
  labels:
    app: noetl-worker-system-pool
    component: system-worker
    managed-by: noetl
  annotations:
    # Explicit reminder for operators reading the live cluster
    # state: the committed value is a placeholder.  Replace it.
    noetl.io/placeholder: "true"
type: Opaque
stringData:
  # Obvious placeholder.  See file header for the kubectl create
  # command that overwrites with a real token.
  token: "REPLACE_ME_GENERATE_A_TOKEN"
