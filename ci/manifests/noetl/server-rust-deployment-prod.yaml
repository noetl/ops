# NoETL control plane — PROD.  Captured from the live cluster (noetl/ai-meta#267)
# so that `kubectl apply` of THIS FILE is a no-op rather than a mass deletion.
#
# ⚠ Do NOT `kubectl apply -f ci/manifests/noetl/` against prod.  A directory apply
# also picks up server-rust-deployment.yaml, which declares the SAME Deployment and
# sorts AFTER this file — so the dev variant wins.  See noetl/ai-meta#309.
#
# noetl/ai-meta#267 Tier 2: the three bootstrap secrets come from CSI-projected
# Secret Manager files; the secretKeyRefs were removed at stage 5.
#
# noetl/ai-meta#253: NOETL_COMMAND_BUS_INGEST_ADDRS is GONE, from here and from the
# cluster, in one deploy.  It was read by nothing (0 hits across all six Rust repos)
# and duplicated NOETL_COMMAND_BUS_WRITER_ADDRS byte-for-byte.
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    autopilot.gke.io/resource-adjustment: '{"input":{"containers":[{"limits":{"cpu":"2","memory":"1Gi"},"requests":{"cpu":"250m","memory":"256Mi"},"name":"noetl-server"}]},"output":{"containers":[{"limits":{"cpu":"2","ephemeral-storage":"1Gi","memory":"1Gi"},"requests":{"cpu":"250m","ephemeral-storage":"1Gi","memory":"256Mi"},"name":"noetl-server"}]},"computeClassAtAdmission":"Default","modified":true}'
    autopilot.gke.io/warden-version: 35.26.4-gke.2
  labels:
    app: noetl-server-rust
    component: server
    runtime: rust
  name: noetl-server-rust
  namespace: noetl
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: noetl-server-rust
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/restartedAt: '2026-08-14T22:03:31-07:00'
      labels:
        app: noetl-server-rust
        component: server
        runtime: rust
    spec:
      containers:
      - env:
        - name: NOETL_ENCRYPTION_KEY_FILE
          value: /var/secrets/sm/encryption-key
        - name: POSTGRES_PASSWORD_FILE
          value: /var/secrets/sm/postgres-password
        - name: NOETL_INTERNAL_API_TOKEN_FILE
          value: /var/secrets/sm/token
        - name: NOETL_OBJECT_STORE_BACKEND
          value: gcs
        - name: NOETL_OBJECT_STORE_GCS_BUCKET
          value: shastaratech-noetl-prod-results
        - name: NOETL_OBJECT_STORE_GCS_ENDPOINT
          value: https://storage.googleapis.com
        - name: NOETL_OBJECT_STORE_GCS_AUTH
          value: auto
        - name: NOETL_RESULT_CELL_ENV
          value: prod
        - name: NOETL_RESULT_CELL_REGION
          value: usc1
        - name: NOETL_RESULT_CELL
          value: usc1-a
        - name: NOETL_RESULT_SHARD_COUNT
          value: '256'
        - name: NOETL_HOST
          value: 0.0.0.0
        - name: NOETL_PORT
          value: '8082'
        - name: RUST_LOG
          value: info,noetl_server=info,sqlx=warn
        - name: POSTGRES_HOST
          value: pgbouncer.postgres.svc.cluster.local
        - name: POSTGRES_PORT
          value: '5432'
        - name: POSTGRES_USER
          value: noetl
        - name: POSTGRES_DATABASE
          value: noetl
        - name: NOETL_SCHEMA
          value: noetl
        - name: NOETL_PG_STATEMENT_CACHE_CAPACITY
          value: '0'
        - name: NOETL_PUBLIC_SERVER_URL
          value: http://noetl-server-rust.noetl.svc.cluster.local:8082
        - name: NOETL_SERVER_MACHINE_ID
          value: '2'
        - name: NOETL_EVENT_READ_PATH
          value: event_scan
        - name: NOETL_RESULT_MINT_AUTHORITATIVE
          value: 'true'
        - name: NOETL_RESULT_STORE_DUAL_WRITE
          value: 'false'
        - name: NOETL_OFFSERVER_ATTACH_TAIL
          value: 'false'
        - name: NOETL_OFFSERVER_TAIL_PLAYBOOK_PREFIXES
          value: muno/playbooks/itinerary-planner,automation/agents/mcp/
        - name: NOETL_ORPHAN_SWEEP_ENABLED
          value: 'true'
        - name: NOETL_AUTH_VERIFY_SIGNATURE
          value: shadow
        - name: NOETL_AUTH0_DOMAIN
          value: mestumre-development.us.auth0.com
        - name: NOETL_AUTH0_AUDIENCE
          value: Jqop7YoaiZalLHdBRo5ScNQ1RJhbhbDN
        - name: NOETL_SHARD_SUBJECT_ROUTE
          value: 'true'
        - name: NOETL_COMMAND_BUS
          value: ehdb
        - name: NOETL_EVENT_BUS
          value: ehdb
        - name: NOETL_COMMAND_SHARD_COUNT
          value: '1'
        - name: NOETL_COMMAND_BUS_WRITER_ADDRS
          value: 0@noetl-cmdbus-writer-0.noetl.svc.cluster.local:9100
        - name: NOETL_EVENT_BUS_WRITER_ADDRS
          value: 0@noetl-cmdbus-writer-0.noetl.svc.cluster.local:9103
        - name: NOETL_EVENT_INGEST_PUBLISH_ONLY
          value: 'true'
        - name: NOETL_STATE_BUILDER
          value: offserver
        - name: NOETL_EVENT_SHARD_COUNT
          value: '1'
        - name: NOETL_PERMANENT_LOG_LEAN
          value: 'true'
        - name: NOETL_EHDB_EVENTLOG_MIRROR_SOURCE
          value: server
        - name: NOETL_EHDB_WORKER_QUERY_URL
          value: http://noetl-worker-system-pool-metrics.noetl.svc.cluster.local:9090
        - name: NOETL_EHDB_CROSSSTORE_PARITY_ENABLED
          value: 'true'
        - name: NOETL_ORCH_RETRIGGER_ON_CLEAR
          value: 'true'
        - name: NOETL_EHDB_EVENTLOG_MIRROR_ASYNC
          value: 'true'
        - name: NOETL_EHDB_CROSSSTORE_PARITY_LAG_TOLERANCE_SECS
          value: '30'
        - name: NOETL_EHDB_PROJECTION_MIRROR_SOURCE
          value: server
        - name: NOETL_EHDB_PROJECTION_PARITY_ENABLED
          value: 'true'
        - name: NOETL_EHDB_PROJECTION_READ_SOURCE
          value: wal
        image: us-central1-docker.pkg.dev/shastaratech-noetl-prod/noetl/server-rust@sha256:e911e375bda9ab43b5d8c6a72dfb58f63842f1dc69ebdac6c6157ba7dccfdd06
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 6
          httpGet:
            path: /api/health
            port: 8082
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        name: noetl-server
        ports:
        - containerPort: 8082
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 12
          httpGet:
            path: /api/health
            port: 8082
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        resources:
          limits:
            cpu: '2'
            ephemeral-storage: 1Gi
            memory: 1Gi
          requests:
            cpu: 250m
            ephemeral-storage: 1Gi
            memory: 256Mi
        securityContext:
          capabilities:
            drop:
            - NET_RAW
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /var/secrets/sm
          name: sm-secrets
          readOnly: true
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      serviceAccount: noetl-server-rust
      serviceAccountName: noetl-server-rust
      terminationGracePeriodSeconds: 30
      tolerations:
      - effect: NoSchedule
        key: kubernetes.io/arch
        operator: Equal
        value: amd64
      volumes:
      - csi:
          driver: secrets-store-gke.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: noetl-server-secrets
        name: sm-secrets
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    cloud.google.com/neg: '{"ingress":true}'
  labels:
    app: noetl-server-rust
  name: noetl-server-rust
  namespace: noetl
spec:
  clusterIP: 34.118.232.85
  clusterIPs:
  - 34.118.232.85
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - name: http
    port: 8082
    protocol: TCP
    targetPort: 8082
  selector:
    app: noetl-server-rust
  sessionAffinity: None
  type: ClusterIP
