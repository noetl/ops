# noetl-server-rust — PRODUCTION Deployment + Service (GKE noetl-demo-19700101)
# =============================================================================
# The Rust control plane ("noetl-control-plane" binary) for the production GKE
# stack.  Originally the noetl/ai-meta#49 Python→Rust cutover candidate; that
# cutover is DONE (prod's `noetl` Service already selects app=noetl-server-rust
# and there is no Python deployment).  This manifest is now the ROLL-FORWARD
# artifact for the post-#115/#116/#117/#118/#119 image (CQRS PUBLISH_ONLY gate +
# cancel/finalize chokepoint + one-level prev_event_id event chain + off-server
# state builder + FinalizedGuard + WAL-index restart-rehydration, server v3.39.1).
#
# PREREQUISITE (one-time, owner-applied) for this image: the v3.39.1 write path
# binds `prev_event_id` on every noetl.event / noetl.command INSERT.  The runtime
# `noetl` role is NOT the table owner (owner=postgres), so the server's startup
# `ensure_columns` best-effort ADD COLUMN is swallowed with a harmless
# "event-chain DDL skipped (server role likely not table owner)" WARN — that line
# PERSISTS by design even after the columns exist (Postgres checks ownership
# before the IF-NOT-EXISTS skip).  The columns + idx_event_prev_event_id were
# provisioned ONCE by the DB owner (`postgres`) on 2026-06-20; see
# runbooks/noetl-cqrs-publish-only-flip.md "prev_event_id migration" record.
#
# This is the PRODUCTION-shaped manifest (distinct from the kind-only
# `server-rust-deployment.yaml` in this directory, which uses a local
# `localhost/...:dev` image with `imagePullPolicy: Never`).
#
# *** DO NOT `kubectl apply` THIS BLINDLY. ***  The Deployment name
# `noetl-server-rust` IS the live, traffic-serving deployment, so applying this
# ROLLS the live server (zero-downtime rolling update: maxUnavailable=0,
# maxSurge=1).  Treat it as a normal prod server release, gated on the
# operator.  It does NOT flip the CQRS gate — `NOETL_EVENT_INGEST_PUBLISH_ONLY`
# is pinned `false` below.  Follow the "Production (GKE)" section of
# `repos/ops/runbooks/noetl-cqrs-publish-only-flip.md`.
#
# Image: built by `automation/gcp_gke/assets/server/cloudbuild.yaml` from
# noetl/server v3.39.1 (commit c5f8cb2).  Pinned below by the immutable @sha256
# digest (NOT a mutable tag) so a re-pushed tag can never silently change what
# prod runs.
#
# Prereqs the operator MUST satisfy (ALL ALREADY PRESENT in prod as of
# 2026-06-19 — created when the Rust cutover landed; verify before apply):
#   1. Secret `noetl-secret` carries key `NOETL_ENCRYPTION_KEY` (base64 32-byte).
#      The Rust server FAILS CLOSED without it (no insecure default —
#      noetl/ai-meta#61).  Credentials were re-entered under the Rust AES-GCM
#      scheme at cutover; this roll-forward does NOT re-touch them.
#   2. Secret `noetl-internal-api-token` (key `token`) — referenced
#      non-optionally below; absent → pod CreateContainerConfigError.
#   3. Prod pgbouncer runs `pool_mode=transaction`; this manifest sets
#      NOETL_PG_STATEMENT_CACHE_CAPACITY=0 so sqlx is safe behind it.
#      No pgbouncer change needed.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: noetl-server-rust
  namespace: noetl
  labels:
    app: noetl-server-rust
    component: server
    runtime: rust
spec:
  replicas: 1
  selector:
    matchLabels:
      app: noetl-server-rust
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: noetl-server-rust
        component: server
        runtime: rust
    spec:
      containers:
        - name: noetl-server
          # Pinned by immutable digest (AR push 2026-06-20T14:57:59Z) so a
          # re-pushed tag can never silently change what prod runs.  The
          # :v3.39.1 / :c5f8cb2 tags resolve to this same digest and are shown
          # for human traceability.
          image: us-central1-docker.pkg.dev/noetl-demo-19700101/noetl/server-rust@sha256:197a6d109e7eb14fb39a6e950cee06313078c76b38fed239a4a09f28966ce672
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
              name: http
          env:
            - name: NOETL_HOST
              value: "0.0.0.0"
            - name: NOETL_PORT
              value: "8082"
            - name: RUST_LOG
              value: "info,noetl_server=info,sqlx=warn"
            # --- Database -----------------------------------------------------
            # Prod has NO direct postgres Service — DB is Cloud SQL
            # (noetl-shared-pg) reached through `pgbouncer` (pool_mode=
            # transaction, via cloud-sql-proxy).  sqlx is made safe behind
            # transaction pooling by NOETL_PG_STATEMENT_CACHE_CAPACITY=0
            # below.  Same endpoint the Python server uses.
            - name: POSTGRES_HOST
              value: "pgbouncer.postgres.svc.cluster.local"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              value: "noetl"
            # The CLIENT password pgbouncer expects for user `noetl` is the
            # value Python authenticates with — stored under the `NOETL_PASSWORD`
            # key of `noetl-secret` (the separate `POSTGRES_PASSWORD` key is a
            # different value and makes pgbouncer SASL-auth fail).  The Rust
            # server reads it from the POSTGRES_PASSWORD *env var* (envy prefix),
            # so the env name stays POSTGRES_PASSWORD but the secret key is
            # NOETL_PASSWORD.
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: noetl-secret
                  key: NOETL_PASSWORD
            - name: POSTGRES_DATABASE
              value: "noetl"
            - name: NOETL_SCHEMA
              value: "noetl"
            # REQUIRED for the pgbouncer path above.  Prod pgbouncer runs
            # `pool_mode=transaction` (in front of Cloud SQL via cloud-sql-
            # proxy).  sqlx's default named prepared-statement cache collides
            # across pooled backend connections under transaction pooling
            # ("prepared statement \"sqlx_s_N\" does not exist").  Setting the
            # cache capacity to 0 makes sqlx use one-shot unnamed statements,
            # which are safe.  (noetl/server e7df366+.)  Leave UNSET for a
            # direct/session-mode Postgres.
            - name: NOETL_PG_STATEMENT_CACHE_CAPACITY
              value: "0"
            # --- NATS ---------------------------------------------------------
            # Matches the prod broker used by the Python server + gateway
            # (configmap noetl-server-config NATS_URL).  Inline-credential
            # format is what the Rust client expects (resolves prereq 3a).
            - name: NOETL_NATS_URL
              value: "nats://noetl:noetl@nats.nats.svc.cluster.local:4222"
            # Callback URL embedded in NATS command notifications.  Points at
            # the Rust Service DNS — valid both during canary (before the
            # `noetl` selector flip) and after cutover.
            - name: NOETL_PUBLIC_SERVER_URL
              value: "http://noetl-server-rust.noetl.svc.cluster.local:8082"
            # 10-bit snowflake machine id.  Set to a value DISTINCT from the
            # Python server's so the two can run concurrently during canary
            # without minting colliding execution/command/event IDs.
            - name: NOETL_SERVER_MACHINE_ID
              value: "2"
            # --- Internal-API bearer token (REQUIRED) -------------------------
            # Gate for /api/internal/* (system worker pool).  Secret must be
            # created before apply (runbook step 2b); referenced non-optionally
            # so a missing secret fails loudly rather than silently disabling
            # the gate.
            - name: NOETL_INTERNAL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: noetl-internal-api-token
                  key: token
            # --- Credential encryption key (REQUIRED, fail-closed) ------------
            # NOT `optional: true` (unlike the kind manifest).  The Rust server
            # refuses to start without a real key (noetl/ai-meta#61); making it
            # required here surfaces a missing key as a clear CreateContainer
            # error at apply time instead of a CrashLoop with a buried log.
            - name: NOETL_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: noetl-secret
                  key: NOETL_ENCRYPTION_KEY
            # --- CQRS write-path gate (noetl/ai-meta#103) --------------------
            # Pinned EXPLICITLY false so this roll-forward does NOT flip the
            # gate.  When false the server writes noetl.event synchronously
            # (today's behavior).  The flip to "true" — server publishes to the
            # noetl_events JetStream stream and the system-pool materializer
            # becomes the sole writer — is a SEPARATE, staged operator action
            # taken behind the materializer-lag alerts (GMP Rules
            # `noetl-materializer-lag`).  See the "Production (GKE)" section of
            # runbooks/noetl-cqrs-publish-only-flip.md.  Revert is one command:
            # set this back to false.  Default is already false in the binary;
            # naming it here makes the gate visible in the manifest.
            - name: NOETL_EVENT_INGEST_PUBLISH_ONLY
              value: "false"
            # RFC noetl/ai-meta#115 Phase 6 — how the execution-lifecycle hot path
            # reads noetl.event.  Pinned EXPLICITLY "event_scan" so this roll-
            # forward does NOT change read behavior.  The flip to "audit_only" —
            # the hot-path readers (get_catalog_id, inherit_parent_trace, the
            # subscription dedup-audit + container-callback catalog/existence
            # reads) are served from the in-memory execute-time ExecDescriptor and
            # noetl.event becomes audit-only (still written by the materializer,
            # read by operator/status/replay APIs, never scanned by the lifecycle)
            # — is a SEPARATE, staged operator action taken WITH
            # NOETL_STATE_BUILDER=offserver so the drive + ingest/callback paths
            # are both scan-free.  Cold-descriptor reads fall back to the scan, so
            # correctness never regresses.  Revert is one command: set back to
            # "event_scan".  Default is already "event_scan" in the binary; naming
            # it here makes the read-path mode visible in the manifest.
            - name: NOETL_EVENT_READ_PATH
              value: "event_scan"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "2"
              memory: "1Gi"
          # /api/health returns DB + NATS connectivity, so readiness gates the
          # pod on both being live — exactly the canary signal we want.
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
---
# Dedicated `noetl-server-rust` Service (already present in prod; apply is
# idempotent).  The production `noetl` Service ALREADY selects
# app=noetl-server-rust (the Python→Rust cutover is done), so both this Service
# and the `noetl` Service resolve to the same pods.  This manifest does not
# change the `noetl` Service.
apiVersion: v1
kind: Service
metadata:
  name: noetl-server-rust
  namespace: noetl
  labels:
    app: noetl-server-rust
spec:
  selector:
    app: noetl-server-rust
  ports:
    - name: http
      port: 8082
      targetPort: 8082
      protocol: TCP
  type: ClusterIP
