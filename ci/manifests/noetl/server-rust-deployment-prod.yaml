# noetl/ai-meta#267 — RECONCILED AGAINST LIVE PROD 2026-08-26.
#
# Captured from the running cluster, not hand-written.  Applying the previous
# version would have DELETED live configuration; a DR re-apply would have
# silently unconfigured prod.
#
# Secrets are REFERENCED (valueFrom.secretKeyRef), never resolved:
# NOETL_ENCRYPTION_KEY, POSTGRES_PASSWORD and NOETL_INTERNAL_API_TOKEN all
# resolve from Secret objects.  The capture tool fails closed on any
# credential-shaped or high-entropy literal:
# playbooks/267-iac-reconcile/capture.py in noetl/ai-meta.
#
# ⚠ NOETL_AUTH0_AUDIENCE is a literal ON PURPOSE.  It holds the Auth0 CLIENT ID,
# which is public by construction — the identical value is served to browsers in
# ci/manifests/gateway/configmap-ui-files.yaml, compiled into the GUI bundle as
# VITE_AUTH0_CLIENT_ID, hard-coded as DEFAULT_AUTH0_CLIENT_ID in travel, and
# committed as a plaintext default in the get_auth0_token playbook.  The Auth0
# client SECRET is a different value and lives in the NoETL keychain as
# `auth0_client`.  See docs/rfc/secret-manager-retrieval.md §1.4.
#
# Cluster-authored annotations (autopilot.gke.io/*, cloud.google.com/*) are kept
# DELIBERATELY — stripping them leaves a diff that still mutates live state.
#
# Proof:  kubectl --context <prod> -n noetl diff -f <this file>   ->  no-op.
