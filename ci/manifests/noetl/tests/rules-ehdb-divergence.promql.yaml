groups:
- name: ehdb-crossstore-divergence
  interval: 30s
  rules:
  - alert: EhdbTierDiverged
    expr: sum(increase(noetl_ehdb_crossstore_divergence_total{kind!~"content|duplicate_event"}[10m])) > 0
    for: 1800s
    labels:
      severity: page
    annotations:
      displayName: 'NoETL EHDB: tier diverged from the authoritative event log'
  - alert: EhdbTierContentDiverged
    expr: sum(increase(noetl_ehdb_crossstore_divergence_total{kind="content"}[30m])) > 2
    for: 0s
    labels:
      severity: page
    annotations:
      displayName: 'NoETL EHDB: tier content diverged from the authoritative event log'
  - alert: EhdbMirrorRedeliveringInBulk
    expr: sum(increase(noetl_ehdb_crossstore_divergence_total{kind="duplicate_event"}[1h])) > 5
    for: 0s
    labels:
      severity: page
    annotations:
      displayName: 'NoETL EHDB: the mirror is re-delivering events in bulk'
