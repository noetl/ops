# noetl/ai-meta#267 Tier 2 — the three BOOTSTRAP secrets for the control plane.
#
# These cannot come from the Secrets Wallet, and the reason is structural: the
# wallet reads the credential table over Postgres, and Postgres needs
# POSTGRES_PASSWORD; NOETL_ENCRYPTION_KEY protects that table's contents.  A
# credential the credential system depends on cannot live in the credential
# system.  Files instead — present or absent, nothing to hang at startup
# (noetl/ai-meta#297).
#
# Requires roles/secretmanager.secretAccessor on each secret for
# noetl-result-tier@shastaratech-noetl-prod.iam.gserviceaccount.com, AND the
# matching KSA annotation — see serviceaccount-noetl-server-rust.yaml.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: noetl-server-secrets
  namespace: noetl
spec:
  parameters:
    # +2 on 2026-11-10 for the embedded ehgraph topology writer
    # (ci/manifests/noetl/ehgraph-topology/): the rendered ehgraph config (it holds the
    # writer's grant token) and that token alone. Created by ehgraph-topology/stage-secrets.sh.
    secrets: |-
      - resourceName: "projects/shastaratech-noetl-prod/secrets/noetl-encryption-key/versions/latest"
        path: "encryption-key"
      - resourceName: "projects/shastaratech-noetl-prod/secrets/noetl-postgres-password/versions/latest"
        path: "postgres-password"
      - resourceName: "projects/shastaratech-noetl-prod/secrets/noetl-internal-api-token/versions/latest"
        path: "token"
      - resourceName: "projects/shastaratech-noetl-prod/secrets/noetl-ehgraph-config/versions/latest"
        path: "ehgraph-config.toml"
      - resourceName: "projects/shastaratech-noetl-prod/secrets/noetl-ehgraph-topology-token/versions/latest"
        path: "ehgraph-topology-token"
  provider: gke
