# noetl-worker-system-pool — PRODUCTION Rust system worker pool
# (GKE noetl-demo-19700101).  noetl/ai-meta#96.
# =============================================================================
# Privileged worker pool that runs platform-internal `system/*` playbooks.
# First job: `system/scheduled_cleanup` (retention/purge of transient noetl.*
# rows via POST /api/internal/cleanup/purge).
#
# This is the PROD variant of `worker-system-pool-deployment.yaml` (which is
# dev-shaped: localhost image, NOETL_COMMANDS stream, Python server URL).
# Prod differences mirror `worker-rust-deployment-prod.yaml`:
#   - prod Artifact Registry image, pinned by digest (same noetl-worker-rust
#     image as the shared pool — the worker binary is identical; only the
#     consumer/filter differ),
#   - NATS_STREAM = NOETL_COMMANDS_RUST (the dedicated Rust-stack stream that
#     owns `noetl.commands.>`, so it includes `noetl.commands.system.>`),
#   - NOETL_SERVER_URL = the Rust server Service.
#
# Per data-access-boundary.md the system playbooks call /api/internal/* — this
# pod mounts NOETL_INTERNAL_API_TOKEN from the K8s Secret `noetl-internal-api-token`
# (already present in prod) and lifts it into ctx.secrets via
# NOETL_KEYCHAIN_ENV_VARS so the playbooks' `tool: http` bearer auth resolves.
#
# Requires `serviceaccount-worker-system-pool.yaml` applied first.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: noetl-worker-system-pool
  namespace: noetl
  labels:
    app: noetl-worker-system-pool
    component: system-worker
    runtime: rust
    worker-pool: worker-system-pool
spec:
  replicas: 1
  selector:
    matchLabels:
      app: noetl-worker-system-pool
      worker-pool: worker-system-pool
  template:
    metadata:
      labels:
        app: noetl-worker-system-pool
        component: system-worker
        runtime: rust
        worker-pool: worker-system-pool
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: noetl-worker-system-pool
      initContainers:
        - name: wait-for-api
          image: curlimages/curl:8.7.1
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - "until curl -sf http://noetl-server-rust.noetl.svc.cluster.local:8082/api/health; do echo 'Waiting for NoETL Rust server...'; sleep 3; done"
      containers:
        - name: noetl-worker
          # worker v5.35.0 (commit b910341) — the post-#103 image carrying the
          # materializer loop + the JetStream lag poller's materializer-consumer
          # tracking (the CQRS flip guardrail's lag gauge).  Same binary as the
          # shared Rust worker pool; only the NATS consumer + filter subject
          # differ.  Pinned by immutable digest (Cloud Build b238027b,
          # 2026-06-19); the :v5.35.0 / :b910341 tags resolve to it.
          image: us-central1-docker.pkg.dev/noetl-demo-19700101/noetl/noetl-worker-rust@sha256:9912b032473b20893a1f06c1ae0c13f9a0120c3a73ee6c616407622c990eac94
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            - name: WORKER_POOL_NAME
              value: worker-system-pool
            - name: WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NATS_URL
              value: nats://noetl:noetl@nats.nats.svc.cluster.local:4222
            # Dedicated Rust-stack stream (subjects noetl.commands.>), same as
            # the shared Rust worker pool.  Includes noetl.commands.system.>.
            - name: NATS_STREAM
              value: NOETL_COMMANDS_RUST
            # Distinct durable consumer for the system segment.
            - name: NATS_CONSUMER
              value: noetl_worker_system_rust
            - name: NATS_FILTER_SUBJECT
              value: noetl.commands.system.>
            - name: NOETL_SERVER_URL
              value: http://noetl-server-rust.noetl.svc.cluster.local:8082
            - name: WORKER_HEARTBEAT_INTERVAL
              value: "15"
            # System playbooks are low-frequency; keep concurrency low.
            - name: WORKER_MAX_CONCURRENT
              value: "2"
            - name: WORKER_METRICS_BIND
              value: "0.0.0.0:9090"
            - name: WORKER_NATS_LAG_POLL_INTERVAL
              value: "5"
            # Bearer token for the system playbooks' tool: http calls to
            # /api/internal/*.  Secret already present in prod.
            - name: NOETL_INTERNAL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: noetl-internal-api-token
                  key: token
            # Lift the token into ctx.secrets under the verbatim env-var name
            # so `auth: { type: bearer, credential: NOETL_INTERNAL_API_TOKEN }`
            # resolves in the system playbooks.
            - name: NOETL_KEYCHAIN_ENV_VARS
              value: NOETL_INTERNAL_API_TOKEN
            - name: RUST_LOG
              value: "info,noetl_worker=info,noetl_executor=info"
            # Arrow IPC shared-memory cache budget (noetl-arrow-cache).
            # Pinned here next to the /dev/shm sizeLimit below so the two
            # stay coherent: sizeLimit (320Mi) MUST exceed this budget
            # (256Mi) or the worker SIGBUSes (exit 135) when the cache
            # fills past the tmpfs.  worker.rs:91 / arrow-cache cache.rs:12.
            - name: NOETL_IPC_CACHE_BUDGET_BYTES
              value: "268435456" # 256 MiB
            # CQRS event materializer (noetl/ai-meta#103) — ack-after-materialize
            # sole-writer loop for noetl.event under NOETL_EVENT_INGEST_PUBLISH_ONLY.
            # Staging order for the operator-gated flip (do BOTH, materializer first):
            #   1. Flip this to "true" → the loop runs as a HARMLESS SHADOW while the
            #      server still writes synchronously (events/project is idempotent,
            #      so the drain only logs duplicates, never loss). Watch
            #      noetl_worker_materializer_* + the consumer ack-pending lag.
            #   2. Then flip the server's NOETL_EVENT_INGEST_PUBLISH_ONLY=true → the
            #      server stops INSERTing and this loop becomes the sole writer.
            # Kept "false" here so NO production default changes on apply.
            - name: NOETL_MATERIALIZER_ENABLED
              value: "false"
          volumeMounts:
            # Memory-backed /dev/shm for the Arrow IPC cache.  The k8s
            # container-runtime default /dev/shm is a 64 MiB tmpfs; the
            # cache writes shm regions up to NOETL_IPC_CACHE_BUDGET_BYTES
            # and overruns 64 MiB, page-faulting into SIGBUS (exit 135).
            - name: dshm
              mountPath: /dev/shm
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1"
              # 320Mi (/dev/shm tmpfs, charged to the cgroup) + worker RSS.
              memory: "768Mi"
          livenessProbe:
            tcpSocket:
              port: 9090
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 6
          readinessProbe:
            tcpSocket:
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            # >= NOETL_IPC_CACHE_BUDGET_BYTES (256Mi) + 64Mi headroom for
            # tmpfs page rounding / fragmentation.  tmpfs usage counts
            # against the container memory limit above (768Mi), which
            # covers this plus the worker RSS.
            sizeLimit: 320Mi
---
apiVersion: v1
kind: Service
metadata:
  name: noetl-worker-system-pool-metrics
  namespace: noetl
  labels:
    app: noetl-worker-system-pool
spec:
  clusterIP: None
  selector:
    app: noetl-worker-system-pool
  ports:
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
