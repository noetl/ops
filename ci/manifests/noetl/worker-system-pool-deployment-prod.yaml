# noetl-worker-system-pool — PRODUCTION Rust system worker pool
# (GKE noetl-demo-19700101).  noetl/ai-meta#96.
# =============================================================================
# Privileged worker pool that runs platform-internal `system/*` playbooks.
# First job: `system/scheduled_cleanup` (retention/purge of transient noetl.*
# rows via POST /api/internal/cleanup/purge).
#
# This is the PROD variant of `worker-system-pool-deployment.yaml` (which is
# dev-shaped: localhost image, NOETL_COMMANDS stream, Python server URL).
# Prod differences mirror `worker-rust-deployment-prod.yaml`:
#   - prod Artifact Registry image, pinned by digest (same noetl-worker-rust
#     image as the shared pool — the worker binary is identical; only the
#     consumer/filter differ),
#   - NATS_STREAM = NOETL_COMMANDS_RUST (the dedicated Rust-stack stream that
#     owns `noetl.commands.>`, so it includes `noetl.commands.system.>`),
#   - NOETL_SERVER_URL = the Rust server Service.
#
# Per data-access-boundary.md the system playbooks call /api/internal/* — this
# pod mounts NOETL_INTERNAL_API_TOKEN from the K8s Secret `noetl-internal-api-token`
# (already present in prod) and lifts it into ctx.secrets via
# NOETL_KEYCHAIN_ENV_VARS so the playbooks' `tool: http` bearer auth resolves.
#
# Requires `serviceaccount-worker-system-pool.yaml` applied first.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: noetl-worker-system-pool
  namespace: noetl
  labels:
    app: noetl-worker-system-pool
    component: system-worker
    runtime: rust
    worker-pool: worker-system-pool
spec:
  replicas: 1
  selector:
    matchLabels:
      app: noetl-worker-system-pool
      worker-pool: worker-system-pool
  template:
    metadata:
      labels:
        app: noetl-worker-system-pool
        component: system-worker
        runtime: rust
        worker-pool: worker-system-pool
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: noetl-worker-system-pool
      initContainers:
        - name: wait-for-api
          image: curlimages/curl:8.7.1
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - "until curl -sf http://noetl-server-rust.noetl.svc.cluster.local:8082/api/health; do echo 'Waiting for NoETL Rust server...'; sleep 3; done"
      containers:
        - name: noetl-worker
          # worker v5.40.3 (commit 6dd3449) — carries the materializer loop + the
          # JetStream lag poller's materializer-consumer tracking (the CQRS flip
          # guardrail's lag gauge) PLUS the off-server state builder with #117
          # spine causal-order + #119 WAL-index restart-rehydration.  Shipped
          # alongside the #121 system-exec off-server drive wedge fix (server-
          # side).  Same binary as the shared Rust worker pool; only the NATS
          # consumer + filter subject differ.  Pinned by immutable digest (AR
          # push 2026-06-21T16:57:05Z); the :v5.40.3 / :6dd3449 tags resolve to
          # it.  This is the LIVE prod image as of the 2026-06-21 off-server
          # cutover.
          image: us-central1-docker.pkg.dev/noetl-demo-19700101/noetl/noetl-worker-rust@sha256:5e80493bc496c8921d6dbf54f62abd7a732cc04bfadb951d39420d396f18170a
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            - name: WORKER_POOL_NAME
              value: worker-system-pool
            - name: WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NATS_URL
              value: nats://noetl:noetl@nats.nats.svc.cluster.local:4222
            # Dedicated Rust-stack stream (subjects noetl.commands.>), same as
            # the shared Rust worker pool.  Includes noetl.commands.system.>.
            - name: NATS_STREAM
              value: NOETL_COMMANDS_RUST
            # Distinct durable consumer for the system segment.
            - name: NATS_CONSUMER
              value: noetl_worker_system_rust
            - name: NATS_FILTER_SUBJECT
              value: noetl.commands.system.>
            - name: NOETL_SERVER_URL
              value: http://noetl-server-rust.noetl.svc.cluster.local:8082
            - name: WORKER_HEARTBEAT_INTERVAL
              value: "15"
            # System playbooks are low-frequency; keep concurrency low.
            - name: WORKER_MAX_CONCURRENT
              value: "2"
            - name: WORKER_METRICS_BIND
              value: "0.0.0.0:9090"
            - name: WORKER_NATS_LAG_POLL_INTERVAL
              value: "5"
            # Bearer token for the system playbooks' tool: http calls to
            # /api/internal/*.  Secret already present in prod.
            - name: NOETL_INTERNAL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: noetl-internal-api-token
                  key: token
            # Lift the token into ctx.secrets under the verbatim env-var name
            # so `auth: { type: bearer, credential: NOETL_INTERNAL_API_TOKEN }`
            # resolves in the system playbooks.
            - name: NOETL_KEYCHAIN_ENV_VARS
              value: NOETL_INTERNAL_API_TOKEN
            - name: RUST_LOG
              value: "info,noetl_worker=info,noetl_executor=info"
            # Arrow IPC shared-memory cache budget (noetl-arrow-cache).
            # Pinned here next to the /dev/shm sizeLimit below so the two
            # stay coherent: sizeLimit (320Mi) MUST exceed this budget
            # (256Mi) or the worker SIGBUSes (exit 135) when the cache
            # fills past the tmpfs.  worker.rs:91 / arrow-cache cache.rs:12.
            - name: NOETL_IPC_CACHE_BUDGET_BYTES
              value: "268435456" # 256 MiB
            # CQRS event materializer (noetl/ai-meta#103) — ack-after-materialize
            # sole-writer loop for noetl.event under NOETL_EVENT_INGEST_PUBLISH_ONLY.
            # Pinned "true" to MATCH THE LIVE PROD CUTOVER (2026-06-21): the
            # server runs with NOETL_EVENT_INGEST_PUBLISH_ONLY=true (it no longer
            # INSERTs into noetl.event) and this loop is the SOLE noetl.event
            # writer.  The flip was performed live behind the materializer-lag
            # alerts and LEFT ON; this manifest records that state so apply is a
            # no-op.  Revert (paired with the server's gate): set this back to
            # "false" AND the server's NOETL_EVENT_INGEST_PUBLISH_ONLY to
            # "false".
            - name: NOETL_MATERIALIZER_ENABLED
              value: "true"
            # Off-server state builder (noetl/ai-meta#115 Phase 4).  Where the
            # orchestrator drive's WorkflowState is CONSTRUCTED:
            #   server     (default) — the server builds it in-process and ships
            #                it to the worker plug-in (run_state). PROD BEHAVIOR.
            #   offserver  — this system-pool worker builds the drive state from
            #                the noetl_events WAL spine (durable consumer
            #                `noetl_state_builder`, wasm run/from_events entry),
            #                with the server-built state as the incomplete-chain
            #                fallback — state construction runs off the server.
            # Pinned "offserver" to MATCH THE LIVE PROD CUTOVER (2026-06-21): the
            # drive plug-in runs on this system pool and builds state off the
            # server from the WAL.  The server carries the same flag set to
            # "offserver".  Recorded here so apply is a no-op; revert: set back
            # to "server" on both this pool and the server.
            - name: NOETL_STATE_BUILDER
              value: "offserver"
            - name: NOETL_STATE_BUILDER_CONSUMER
              value: "noetl_state_builder"
            # noetl/ai-meta#166 Phase 1 — bounded off-server WAL index.  The
            # index grew O(all non-terminal event history × full-envelope) to
            # ~1.28 GiB at idle (654 execs pinned, #163 OOM).  These knobs cap it
            # to O(active working set).  Prod-verified 2026-06-30: idle RSS
            # 1265Mi -> 67Mi, holding, 0 OOMKills, drives still served.
            #   SLIM           — store a lossless projection to the orchestrate-core
            #                    Event fields (output-equivalent from_events).
            #   TTL_SECS=900   — evict idle/abandoned non-terminal chains (the class
            #                    terminal eviction misses); 15min >> a Muno hop so
            #                    active flows are never evicted mid-drive.
            #   MAX_BYTES      — hard ceiling on the byte LEDGER (the approx
            #                    JSON-byte estimate, ~5-7× under true resident); 256Mi
            #                    ledger ≈ ~1.5-1.7 GiB RSS backstop, under the 2Gi limit.
            #   REHYDRATE_ON_MISS — targeted retained-WAL re-replay on a cache miss,
            #                    makes eviction wedge-safe with tail-attach off.
            #   SWEEP_SECS=30  — bounded-cache sweep cadence (runs idle + busy).
            # Instant rollback: remove these 5 vars (behavior-neutral, unbounded).
            - name: NOETL_STATE_INDEX_SLIM
              value: "true"
            - name: NOETL_STATE_INDEX_TTL_SECS
              value: "900"
            - name: NOETL_STATE_INDEX_MAX_BYTES
              value: "268435456"
            - name: NOETL_STATE_INDEX_REHYDRATE_ON_MISS
              value: "true"
            - name: NOETL_STATE_INDEX_SWEEP_SECS
              value: "30"
          volumeMounts:
            # Memory-backed /dev/shm for the Arrow IPC cache.  The k8s
            # container-runtime default /dev/shm is a 64 MiB tmpfs; the
            # cache writes shm regions up to NOETL_IPC_CACHE_BUDGET_BYTES
            # and overruns 64 MiB, page-faulting into SIGBUS (exit 135).
            - name: dshm
              mountPath: /dev/shm
          resources:
            requests:
              # noetl/ai-meta#127 — raised 100m -> 250m (matches the shared
              # Rust worker pool + server-rust).  This single pod carries the
              # off-server orchestrate drive AND the sole-writer CQRS
              # materializer for the whole prod system, so it pegs CPU under a
              # large batch the same way the step workers do.
              # noetl/ai-meta#298 — raised 250m -> 1500m.  Not a CPU need:
              # GKE Autopilot enforces a 1:6.5 CPU:memory ratio, so the 8Gi
              # below is not admissible at 250m.  Ratio here is 1:5.5.
              cpu: "1500m"
              # noetl/ai-meta#298 — raised 1Gi -> 8Gi, and the reason changed.
              #
              # The #163 sizing below was built on a STEADY-RSS model: put the
              # request at/above the resting index so the scheduler guarantees
              # it.  Measurement on 2026-08-26 shows that model does not
              # describe what kills this pod.  Read from cgroup v2
              # `memory.peak` on a pod given deliberate headroom:
              #
              #   peak    = 3473883136 B = 3313 MiB   <-- boot transient
              #   current =  117022720 B =  112 MiB   <-- resting index
              #
              # ...while replaying 29,608 events / 78 executions in 24s.  The
              # replay-from-0 drain allocates ~0.108 MiB per event transiently
              # and produces a 112 MiB index — a ~30x spike over the result.
              # So the binding constraint is a boot transient proportional to
              # the WHOLE log, not resting RSS.
              #
              # Request == limit so the scheduler reserves the spike; a pod
              # that cannot get it should fail to schedule, loudly, rather
              # than OOM 20s into every boot for 12 days (which is what
              # happened).
              memory: "8Gi"
            limits:
              # noetl/ai-meta#127 — raised 1 -> 2 alongside the shared pool.
              # Raising the limit only lifts the burst ceiling for this single
              # drive+materializer pod (request stays low), protecting drive +
              # materialize throughput under load so the off-server cutover
              # stays healthy.  Nodes are 16-CPU and ~98% idle; pure upside.
              cpu: "2"
              # noetl/ai-meta#298 — raised 2Gi -> 8Gi.  This is the SECOND
              # raise for the same mechanism (#163 took it 768Mi -> 2Gi), and
              # that is the argument for stopping: raising the ceiling is a
              # treadmill while boot cost stays proportional to the log.
              #
              # #163's "~1.3Gi headroom over steady" never existed for the
              # case that actually kills the pod.  The transient is 3313 MiB;
              # 2Gi was under it, so every boot died ~16-50s in.
              #
              # ⚠ THIS LIMIT HAS AN EXPIRY.  At 0.108 MiB of transient per
              # event, 8192 MiB is exhausted at ~74,700 events — roughly 2.5x
              # the 29,608 present on 2026-08-26.  The real fix is bounded-boot
              # rehydration (snapshot + tail replay) tracked on #298; until it
              # lands, this number is a deadline, not a solution.
              #
              # Includes the 320Mi /dev/shm tmpfs (Arrow IPC cache), which is
              # charged to this cgroup.
              memory: "8Gi"
          livenessProbe:
            tcpSocket:
              port: 9090
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 6
          readinessProbe:
            tcpSocket:
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            # >= NOETL_IPC_CACHE_BUDGET_BYTES (256Mi) + 64Mi headroom for
            # tmpfs page rounding / fragmentation.  tmpfs usage counts
            # against the container memory limit above (8Gi, noetl/ai-meta#298),
            # which covers this plus the worker RSS (state_builder index).
            sizeLimit: 320Mi
---
apiVersion: v1
kind: Service
metadata:
  name: noetl-worker-system-pool-metrics
  namespace: noetl
  labels:
    app: noetl-worker-system-pool
spec:
  clusterIP: None
  selector:
    app: noetl-worker-system-pool
  ports:
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
