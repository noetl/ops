# noetl-worker-system-pool — DEV/kind Rust system worker pool.
# noetl/ai-meta#96.
# =============================================================================
# Privileged worker pool that runs platform-internal `system/*` playbooks.
# First job: `system/scheduled_cleanup` (retention/purge of transient noetl.*
# rows via POST /api/internal/cleanup/purge).
#
# Dev/kind variant: local worker image + the flat `NOETL_COMMANDS` stream the
# kind cluster uses + the Rust server Service.  The prod variant
# (`worker-system-pool-deployment-prod.yaml`) pins the prod registry image and
# the dedicated `NOETL_COMMANDS_RUST` stream.
#
# Per data-access-boundary.md the system playbooks call /api/internal/* — this
# pod mounts NOETL_INTERNAL_API_TOKEN from the K8s Secret and lifts it into
# ctx.secrets via NOETL_KEYCHAIN_ENV_VARS so the playbooks' `tool: http` bearer
# auth resolves.  Requires `serviceaccount-worker-system-pool.yaml` first.
#
# The Python-era outbox-publisher/projector system playbooks are gone — the
# Rust server publishes commands directly to NATS and writes events inline,
# so the transactional outbox is unused.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: noetl-worker-system-pool
  namespace: noetl
  labels:
    app: noetl-worker-system-pool
    component: system-worker
    runtime: rust
    worker-pool: worker-system-pool
spec:
  replicas: 1
  selector:
    matchLabels:
      app: noetl-worker-system-pool
      worker-pool: worker-system-pool
  template:
    metadata:
      labels:
        app: noetl-worker-system-pool
        component: system-worker
        runtime: rust
        worker-pool: worker-system-pool
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: noetl-worker-system-pool
      initContainers:
        - name: wait-for-api
          image: curlimages/curl:8.7.1
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - "until curl -sf http://noetl-server-rust.noetl.svc.cluster.local:8082/api/health; do echo 'Waiting for NoETL Rust server...'; sleep 3; done"
      containers:
        - name: noetl-worker
          image: localhost/noetl-worker:dev
          imagePullPolicy: Never
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            - name: WORKER_POOL_NAME
              value: worker-system-pool
            - name: WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NATS_URL
              value: nats://noetl:noetl@nats.nats.svc.cluster.local:4222
            # kind uses the flat NOETL_COMMANDS stream (subjects
            # noetl.commands.>), so it captures noetl.commands.system.>.
            - name: NATS_STREAM
              value: NOETL_COMMANDS
            # Consumer name follows the per-pool convention
            # `noetl_worker_pool_<segment>` (shared / subscription / system) and
            # MUST equal the consumer the system-pool KEDA scaler reads
            # (`scaledobject-worker-system-pool.yaml`).  When the two drift, the
            # scaler watches a consumer the worker never creates and the pool
            # never scales on its backlog — the worker-driven orchestrate drive
            # (noetl/ai-meta#108) publishes to `noetl.commands.system.<eid>` and
            # is drained here.  The filter_subject below is what isolates this
            # consumer to the system segment; the shared pool's consumer
            # (`noetl.commands.shared.>`) cannot see these subjects.
            - name: NATS_CONSUMER
              value: noetl_worker_pool_system
            - name: NATS_FILTER_SUBJECT
              value: noetl.commands.system.>
            - name: NOETL_SERVER_URL
              value: http://noetl-server-rust.noetl.svc.cluster.local:8082
            - name: WORKER_HEARTBEAT_INTERVAL
              value: "15"
            - name: WORKER_MAX_CONCURRENT
              value: "2"
            - name: WORKER_METRICS_BIND
              value: "0.0.0.0:9090"
            - name: WORKER_NATS_LAG_POLL_INTERVAL
              value: "5"
            - name: NOETL_INTERNAL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: noetl-internal-api-token
                  key: token
            - name: NOETL_KEYCHAIN_ENV_VARS
              value: NOETL_INTERNAL_API_TOKEN
            - name: RUST_LOG
              value: "info,noetl_worker=debug,noetl_executor=debug"
            # Arrow IPC shared-memory cache budget (noetl-arrow-cache).
            # Pinned here next to the /dev/shm sizeLimit below so the two
            # stay coherent: sizeLimit (320Mi) MUST exceed this budget
            # (256Mi) or the worker SIGBUSes (exit 135) when the cache
            # fills past the tmpfs.  worker.rs:91 / arrow-cache cache.rs:12.
            - name: NOETL_IPC_CACHE_BUDGET_BYTES
              value: "268435456" # 256 MiB
            # CQRS event materializer (noetl/ai-meta#103).  When the server
            # runs with NOETL_EVENT_INGEST_PUBLISH_ONLY=true, the server stops
            # writing noetl.event synchronously and publishes every event to
            # the noetl_events JetStream stream; THIS loop becomes the sole
            # noetl.event writer.  It drains noetl_events with DEFERRED ack and
            # acks each batch only after POST /api/internal/events/project
            # durably inserts it (ack-after-materialize) — a transient project
            # failure redelivers the batch instead of losing it.  Replaces the
            # ack-on-fetch `system/event_materializer` playbook (which acked
            # before the insert ran).  Safe to leave on while the server gate
            # is off: the synchronous INSERT is the real writer and
            # events/project is idempotent (ON CONFLICT), so the drain is a
            # harmless shadow double-write (duplicates, never loss).
            - name: NOETL_MATERIALIZER_ENABLED
              value: "true"
            # Off-server state builder (noetl/ai-meta#115 Phase 4).  Where the
            # orchestrator drive's WorkflowState is CONSTRUCTED:
            #   server     (default) — the server builds state in-process and
            #                ships it to the worker plug-in (run_state).
            #   offserver  — this system-pool worker drains the noetl_events WAL
            #                into a pool-side chain index (durable consumer
            #                `noetl_state_builder`) and builds the drive state
            #                from the WAL spine via the wasm `run`/from_events
            #                entry — state construction runs HERE, off the server,
            #                with zero noetl.event reads.  The server-built state
            #                rides along as the fallback the worker uses only when
            #                its WAL chain is incomplete (lag/cold), so progress +
            #                correctness never regress below the server-built path.
            # Default `server` (prod unchanged); the kind off-server parity rig
            # (e2e kind_validate_state_builder_offserver.sh) flips this to
            # `offserver` for its run.  Mirrors NOETL_MATERIALIZER_ENABLED — the
            # builder is a first-class system-pool loop, not a separate Deployment.
            - name: NOETL_STATE_BUILDER
              value: "server"
            # Durable consumer name for the authoritative (offserver) WAL drain —
            # makes the builder's backlog observable (KEDA/VMAlert), like the
            # materializer's noetl_materializer consumer.
            - name: NOETL_STATE_BUILDER_CONSUMER
              value: "noetl_state_builder"
            # Shadow result materializer (noetl/ai-meta#104 Phase B).  A SEPARATE
            # noetl_events consumer (noetl_result_materializer) that writes the
            # over-budget result payload to object store at the derivable §7 key —
            # tabular -> Arrow Feather, non-tabular -> JSON — ALONGSIDE the
            # authoritative noetl.result_store path.  SHADOW: nothing reads the
            # Feather tier until Phase C; it never alters the authoritative result
            # and never fails an event.  Isolated consumer so object-store latency
            # never back-pressures the noetl.event audit fold / lag alert.
            # Default OFF (true no-op — the loop is not spawned).  The e2e rig
            # kind_validate_result_materializer.sh flips this on for its run.
            - name: NOETL_RESULT_MATERIALIZER_ENABLED
              value: "false"
            # Single-cell seed (RFC §4.3) for the write-side URN resolution: every
            # shard homes on this one configured cell.  The numeric shard= segment
            # of the §7 key is still derived per-result from the stable shard hash.
            # (The server-served multi-cell endpoint registry + miss behavior —
            # OQ6 — is deferred to Phase C, where the read path needs it.)
            - name: NOETL_RESULT_CELL_ENV
              value: "dev"
            - name: NOETL_RESULT_CELL_REGION
              value: "local"
            - name: NOETL_RESULT_CELL
              value: "local-0"
          volumeMounts:
            # Memory-backed /dev/shm for the Arrow IPC cache.  The k8s
            # container-runtime default /dev/shm is a 64 MiB tmpfs; the
            # cache writes shm regions up to NOETL_IPC_CACHE_BUDGET_BYTES
            # and overruns 64 MiB, page-faulting into SIGBUS (exit 135).
            - name: dshm
              mountPath: /dev/shm
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1"
              # 320Mi (/dev/shm tmpfs, charged to the cgroup) + worker RSS.
              memory: "768Mi"
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            # >= NOETL_IPC_CACHE_BUDGET_BYTES (256Mi) + 64Mi headroom for
            # tmpfs page rounding / fragmentation.  tmpfs usage counts
            # against the container memory limit above (768Mi), which
            # covers this plus the worker RSS.
            sizeLimit: 320Mi
---
apiVersion: v1
kind: Service
metadata:
  name: noetl-worker-system-pool-metrics
  namespace: noetl
  labels:
    app: noetl-worker-system-pool
spec:
  clusterIP: None
  selector:
    app: noetl-worker-system-pool
  ports:
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
