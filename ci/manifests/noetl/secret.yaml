apiVersion: v1
kind: Secret
metadata:
  name: noetl-secret
  namespace: noetl
  labels:
    app: noetl
type: Opaque
data:
  POSTGRES_PASSWORD: ZGVtbw==  # 'demo' encoded in base64
  NOETL_PASSWORD: bm9ldGw=    # 'noetl' encoded in base64
  # Stable dev/kind credential-encryption key (32-byte AES key, base64-encoded
  # value, then base64 for the Secret).  The server reads NOETL_ENCRYPTION_KEY
  # from here; without it the server falls back to a RANDOM default key
  # (NOETL_ALLOW_INSECURE_DEFAULT_KEY=true) that changes on every restart, so
  # credentials encrypted before a restart fail to decrypt after — surfacing
  # as intermittent "Decryption failed" on postgres/credentialed fixtures.
  # This is a DEV-ONLY key; prod sets its own NOETL_ENCRYPTION_KEY secret.
  NOETL_ENCRYPTION_KEY: SXMyMkczUnlDdkdoeTRjRTE1UEppYjJVbjVBRFZKVFB1Mjh1UFZkSHB2RT0=
