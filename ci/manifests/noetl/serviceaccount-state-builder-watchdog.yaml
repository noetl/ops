# RBAC for the state-builder watchdog CronJob (noetl/ai-meta#163).
# Least-privilege: enough to detect the wedge (read pods) and remediate
# (rollout restart + annotate the deployment).  RESTART-ONLY — no delete,
# no scale, no exec, no secret/configmap access, no data plane.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: noetl-state-builder-watchdog
  namespace: noetl
  labels:
    app: noetl-state-builder-watchdog
    component: system-cron
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: noetl-state-builder-watchdog-role
  namespace: noetl
  labels:
    app: noetl-state-builder-watchdog
rules:
  # Read the target deployment + its pods to detect the wedge / confirm
  # the rollout.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  # Remediate: `kubectl rollout restart` patches the deployment's pod
  # template annotation; the watchdog also writes its own cooldown/flap
  # state annotations.  `patch` + `update` on deployments only — NOT
  # delete, NOT scale.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["patch", "update"]
  # Optional: append-only audit events for the remediation (if the
  # playbook is extended to POST k8s Events).  Harmless to grant.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: noetl-state-builder-watchdog-rolebinding
  namespace: noetl
  labels:
    app: noetl-state-builder-watchdog
subjects:
  - kind: ServiceAccount
    name: noetl-state-builder-watchdog
    namespace: noetl
roleRef:
  kind: Role
  name: noetl-state-builder-watchdog-role
  apiGroup: rbac.authorization.k8s.io
