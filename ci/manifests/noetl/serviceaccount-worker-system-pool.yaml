# ServiceAccount + RBAC for the system worker pool.
#
# Per noetl/ai-meta#46 Phase 1.b.  Distinct from ``noetl-worker``
# (the user-pool SA) because the data-access-boundary rule
# (``agents/rules/data-access-boundary.md`` in ai-meta) means the
# system pool calls ``/api/internal/*`` on the noetl-server instead
# of touching ``noetl.*`` tables directly.
#
# Capabilities (Kubernetes-side):
#
# - Read the K8s Secret ``noetl-internal-api-token`` to mount
#   ``NOETL_INTERNAL_API_TOKEN`` as env.
# - Read the K8s ConfigMap that holds shared NoETL config (if/when
#   the system pool needs it).
# - NO Job / Pod / Secret create permissions — system playbooks call
#   the server API instead of dispatching K8s Jobs directly.  If
#   Phase 2 reveals a need for K8s-side dispatch (eg. container tool
#   kind, #43), we add it then with the narrowest verbs.
#
# Application-side capability (NOT enforced via K8s RBAC) — the
# system pool's bearer-token gives it access to ``/api/internal/*``
# endpoints on the noetl-server.  That's the actual "system pool
# privilege" boundary; this K8s RBAC just lets the pod boot.
#
# ⚠ noetl/ai-meta#267 Tier 2 — the iam.gke.io/gcp-service-account annotation below
# is load-bearing.  Workload Identity needs BOTH halves: the GSA must allow this
# KSA (an IAM grant) AND this annotation must name the GSA.  With only the first,
# the Secret Manager CSI mount fails PermissionDenied on
# secretmanager.versions.access, because the pod authenticates as the node's
# default identity.  That is exactly how this was first mis-deployed.
#
# ⚠ It is declared here rather than left to `kubectl annotate` because a clean
# `kubectl diff` does NOT prove it is present: 3-way merge will not report the
# removal of an annotation absent from last-applied, so an undeclared annotation
# passes the no-op check and is still at risk on a re-apply.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: noetl-worker-system-pool
  namespace: noetl
  labels:
    app: noetl-worker-system-pool
    component: system-worker
    worker-pool: worker-system-pool
  annotations:
    iam.gke.io/gcp-service-account: noetl-system-pool@shastaratech-noetl-prod.iam.gserviceaccount.com
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: noetl-worker-system-pool-role
  namespace: noetl
  labels:
    app: noetl-worker-system-pool
rules:
- apiGroups:
  - ''
  resources:
  - secrets
  resourceNames:
  - noetl-internal-api-token
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ''
  resources:
  - configmaps
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: noetl-worker-system-pool-rolebinding
  namespace: noetl
subjects:
- kind: ServiceAccount
  name: noetl-worker-system-pool
  namespace: noetl
roleRef:
  kind: Role
  name: noetl-worker-system-pool-role
  apiGroup: rbac.authorization.k8s.io
