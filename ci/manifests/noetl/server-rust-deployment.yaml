# noetl-server-rust — Rust control plane (noetl/server crate v2.1.1+)
#
# Deployed alongside the Python noetl-server for strangler-fig
# parity validation (Phase C of noetl/ai-meta#49).  Listens on
# port 8082 internally; the headless Service exposes it under a
# distinct DNS name so the Python server can keep its existing
# Service unchanged.
#
# This deployment exists for kind validation only — production
# rollout requires the sharding work in #49 Phase F.
#
# Generated from repos/server/Dockerfile (multi-stage cargo-chef
# build).  Image rebuilt locally for arm64 because the GHCR
# ``ghcr.io/noetl/server:2.1.1`` published manifest is amd64-only
# today.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: noetl-server-rust
  namespace: noetl
  labels:
    app: noetl-server-rust
    component: server
    runtime: rust
spec:
  replicas: 1
  selector:
    matchLabels:
      app: noetl-server-rust
  template:
    metadata:
      labels:
        app: noetl-server-rust
        component: server
        runtime: rust
    spec:
      containers:
        - name: noetl-server
          image: localhost/noetl-server-rust:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 8082
              name: http
          env:
            - name: NOETL_HOST
              value: "0.0.0.0"
            - name: NOETL_PORT
              value: "8082"
            - name: RUST_LOG
              value: "info,noetl_server=debug,sqlx=warn"
            # Database — reuse the existing Postgres service.  These
            # match the Python server's noetl-secret + configmap-
            # server values; only env-var NAMES differ
            # (POSTGRES_* on Rust vs NOETL_PG_* on Python).
            - name: POSTGRES_HOST
              value: "postgres.postgres.svc.cluster.local"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              value: "noetl"
            - name: POSTGRES_PASSWORD
              value: "noetl"
            - name: POSTGRES_DATABASE
              value: "noetl"
            - name: NOETL_SCHEMA
              value: "noetl"
            # NATS connection — same broker the Python server uses.
            # Publicly-reachable URL embedded in NATS command
            # notifications so workers know where to call back
            # for command details + result POSTs.  Required by
            # /api/execute's NATS publish (noetl/server#26).
            - name: NOETL_PUBLIC_SERVER_URL
              value: "http://noetl-server-rust.noetl.svc.cluster.local:8082"
            # EHDB Data Query Interface (noetl/ai-meta#178) — the worker
            # data-plane query base URL the server relays raw tier queries
            # (`GET /api/ehdb/tiers/{tier}`) to.  The server stays control-plane
            # and never opens EHDB tier storage; it makes a synchronous HTTP read
            # straight to the worker's query port (the worker metrics/query
            # Service on :9090).  Points at the user drive pool, which executes
            # real playbook drives and holds the mirrored eventlog/kv + durable
            # per-shard segment stores.  Harmless when EHDB is disabled (the
            # default): the worker returns an `outcome=disabled` body.
            - name: NOETL_EHDB_WORKER_QUERY_URL
              value: "http://noetl-worker-rust-metrics.noetl.svc.cluster.local:9090"
            # ---------------------------------------------------------------
            # EHDB tiers (noetl/ai-meta#155, #257, #265).
            #
            # ⚠ THESE WERE UNDECLARED UNTIL noetl/ai-meta#265 G5, AND FIVE OF
            # THEM ARE LIVE ON PROD.  Applying this file without them would
            # strip `NOETL_EHDB_EVENTLOG_MIRROR_ASYNC=true` and the parity
            # window from the server — silently disarming the async mirror and
            # the comparator on the tier that is SERVING PRIMARY.  That is
            # ai-meta#267 ("a re-apply would silently unconfigure prod"),
            # measured here rather than inferred.
            #
            # The event-log values below are PROD'S LIVE VALUES, read off the
            # cluster on 2026-08-25, so applying this is a no-op for tier 1.
            # Do not "tidy" them; they are a capture, not a preference.
            # ---------------------------------------------------------------
            #
            # -- tier 1: the event log.  PRIMARY and serving.  Do not change. --
            - name: NOETL_EHDB_EVENTLOG_MIRROR_SOURCE
              value: "server"
            - name: NOETL_EHDB_EVENTLOG_MIRROR_ASYNC
              value: "true"
            - name: NOETL_EHDB_CROSSSTORE_PARITY_ENABLED
              value: "true"
            # Paired with MIRROR_ASYNC above: set both or neither.  Async on
            # with this at 0 makes the comparator judge a healthy tier on its
            # own liveness (noetl/ai-meta#155).
            - name: NOETL_EHDB_CROSSSTORE_PARITY_LAG_TOLERANCE_SECS
              value: "30"
            #
            # -- tier 2: the projection tier.  BUILT, GATED, NOT SERVING. -----
            #
            # Declared at their OFF values rather than omitted, deliberately:
            # a shadow cutover is then a value edit on a line that already
            # exists, the off state is visible in `kubectl get -o yaml`, and
            # nothing has to remember that these variables exist.  Turning any
            # of them on is a per-step decision recorded in
            # ai-meta:playbooks/265-projection-tier/CUTOVER.md and needs an
            # explicit go from the owner.
            #
            # `""` is OFF for the mirror source: it arms only on the exact
            # string `server`.
            - name: NOETL_EHDB_PROJECTION_MIRROR_SOURCE
              value: ""
            - name: NOETL_EHDB_PROJECTION_PARITY_ENABLED
              value: "false"
            # C1 (shadow) sets MIRROR_SOURCE=server + PARITY_ENABLED=true.
            # C3 moves READ_SOURCE postgres -> verify.  C5 -> tier, and only
            # after a soak; see CUTOVER.md §2 for why `verify` is not optional.
            - name: NOETL_EHDB_PROJECTION_READ_SOURCE
              value: "postgres"
            # G3's pair.  The queue REFUSES to arm if ASYNC is on while the
            # window is 0, and stays inline — loudly, with async_enabled=0.
            - name: NOETL_EHDB_PROJECTION_MIRROR_ASYNC
              value: "false"
            - name: NOETL_EHDB_PROJECTION_PARITY_LAG_TOLERANCE_SECS
              value: "0"
            # 10-bit machine id for the application-side snowflake
            # generator added in Phase F R1.5 of noetl/ai-meta#49
            # (server v2.10.1+; see noetl/server#42 + #43).  Each
            # replica MUST set a distinct value (0–1023) to avoid
            # snowflake id collisions producing duplicate event /
            # execution / command IDs.
            #
            # Single-replica deployment (current): "1" is fine.
            # When scaling beyond 1 replica:
            #   - StatefulSet pattern: derive from pod ordinal via
            #     fieldRef on metadata.labels['apps.kubernetes.io/pod-index']
            #     piped through an initContainer that emits the
            #     integer to a shared file → exposed back as an env.
            #   - Deployment pattern: set per-replica via Helm
            #     values (replicaIndex) or via the K8s
            #     replica-controller's ordinal.
            #   - Fallback: leave unset; the binary derives a 10-
            #     bit id from HOSTNAME via FNV-1a.  Hash collisions
            #     in the 1024-bucket space are rare for small fleets.
            #
            # See https://github.com/noetl/server/wiki/deployment-specification#snowflake-id-generation
            # for the layout + collision-risk discussion.
            - name: NOETL_SERVER_MACHINE_ID
              value: "1"
            # Internal-API bearer token — mounted from the same
            # K8s Secret the system worker pool reads.  Worker's
            # NOETL_KEYCHAIN_ENV_VARS allow-list lifts this into
            # ctx.secrets at dispatch time; server's
            # require_internal_api_token extractor compares the
            # request's `Authorization: Bearer <token>` against
            # this env var with constant-time equality.
            - name: NOETL_INTERNAL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: noetl-internal-api-token
                  key: token
            # Encryption key for credential store (same key the
            # Python server uses so credentials written by either
            # decode on the other).
            - name: NOETL_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: noetl-secret
                  key: NOETL_ENCRYPTION_KEY
                  optional: true
            # Result-tier GC (noetl/ai-meta#104 Phase F).  Gates the
            # POST /api/internal/result-tier/gc sweep endpoint the
            # system/scheduled_cleanup playbook calls.  Default OFF →
            # the endpoint returns a disabled no-op report and deletes
            # nothing.  When ON, the sweep is still dry-run by default
            # (the playbook's result_tier_gc_dry_run) and NEVER deletes a
            # live-referenced object (an object whose execution still has
            # surviving noetl.event rows).  The e2e rig
            # kind_validate_result_tier_gc_dr.sh flips this on for its run.
            - name: NOETL_RESULT_TIER_GC
              value: "false"
          resources:
            limits:
              cpu: "2"
              memory: "512Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
---
apiVersion: v1
kind: Service
metadata:
  name: noetl-server-rust
  namespace: noetl
  labels:
    app: noetl-server-rust
spec:
  selector:
    app: noetl-server-rust
  ports:
    - name: http
      port: 8082
      targetPort: 8082
      protocol: TCP
  type: ClusterIP
