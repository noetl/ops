# EHDB durable storage — PROD.  noetl/ai-meta#267.
#
# ⚠ THESE WERE DECLARED NOWHERE.  The cmdbus-writer StatefulSet does NOT use
# volumeClaimTemplates -- it mounts these PVCs by static claimName -- so a
# disaster-recovery `kubectl apply` would have created a StatefulSet whose pods
# could never schedule, with no error anywhere saying why.  These volumes hold the
# command-bus WAL, the event-bus WAL and the event-bus KV: the durable side of
# EHDB.
#
# ⚠ `volumeName` is deliberately OMITTED.  It binds a claim to one specific
# PersistentVolume; carrying it here would make a DR apply into a fresh cluster
# reference a PV that does not exist.  Omitting it lets the storage class
# provision, and is still a no-op against the running cluster because three-way
# merge only removes fields present in `last-applied` -- and these were never
# applied.
#
# `noetl-cmdbus-writer-1-data` used to be called out here as deliberately
# undeclared, pending a disposition decision.  That is settled: the whole
# writer-1 debris set -- Deployment, Service and PVC -- was DELETED from prod on
# 2026-08-28 (noetl/ai-meta#305), so there is nothing left to declare or exclude.
#
# It was the shard-1 half of an abandoned 2-shard command-bus experiment: 0
# replicas since 2026-07-27, a Service with no endpoints for a month, referenced
# by nothing, and still carrying NOETL_COMMAND_BUS=nats -- a transport deleted at
# T5.  The volume held one 30KB unsealed part written in a two-minute window on
# the day it was created; the owner accepted losing it.
#
# ⚠ PVC specs are largely immutable once bound.  Do not edit size or storageClass
# here expecting an apply to resize; that is a separate, deliberate operation.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: noetl-cmdbus-writer-0-data
  namespace: noetl
  annotations:
    volume.kubernetes.io/selected-node: gk3-noetl-prod-autopilot-pool-3-0e057c22-489h
  labels:
    app: noetl-cmdbus-writer-0
    component: cmdbus-writer
    managed-by: noetl
    shard: '0'
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: premium-rwo
  volumeMode: Filesystem
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: noetl-eventbus-writer-0-data
  namespace: noetl
  annotations:
    volume.kubernetes.io/selected-node: gk3-noetl-prod-autopilot-pool-3-0e057c22-489h
  labels:
    app: noetl-cmdbus-writer-0
    component: eventbus-writer
    managed-by: noetl
    shard: '0'
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  storageClassName: premium-rwo
  volumeMode: Filesystem
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  # noetl/ehdb#332 — an INDEPENDENT failure domain for the EHDB tier store.
  #
  # Today NOETL_EHDB_TIER_SERVICE_DIR=/data/eventbus/ehdb-tier sits INSIDE
  # NOETL_EVENT_BUS_WRITER_DIR=/data/eventbus, i.e. the tier and the event log
  # it is meant to be independent of share one PVC. Losing that volume loses
  # both, which makes "replicated" mean one disk and makes a quorum across
  # replicas that share it a quorum of one (see ehdb#322).
  #
  # ⚠ Declaring and mounting this claim changes NOTHING on its own. The tier
  # only moves when NOETL_EHDB_TIER_SERVICE_DIR is repointed AND the existing
  # data is relocated — both owner-run, see
  # ai-meta playbooks/324-cutover-prep/ehdb332-volume-separation.md
  name: noetl-ehdb-tier-0-data
  namespace: noetl
  labels:
    app: noetl-cmdbus-writer-0
    component: ehdb-tier
    managed-by: noetl
    shard: '0'
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      # The tier held ~168 MB at the time of writing against a 50Gi shared
      # volume. 30Gi is generous headroom without over-provisioning a claim
      # that cannot be shrunk later.
      storage: 30Gi
  storageClassName: premium-rwo
  volumeMode: Filesystem
---
kind: PersistentVolumeClaim
metadata:
  name: noetl-eventbus-kv-0-data
  namespace: noetl
  annotations:
    volume.kubernetes.io/selected-node: gk3-noetl-prod-autopilot-pool-3-0e057c22-489h
  labels:
    app: noetl-cmdbus-writer-0
    component: eventbus-kv
    managed-by: noetl
    shard: '0'
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: premium-rwo
  volumeMode: Filesystem
