# Workload Identity ServiceAccount for the NoETL control plane.
#
# ⚠ THIS FILE EXISTS BECAUSE THE OBJECT WAS DECLARED NOWHERE.  Before
# noetl/ai-meta#267 Tier 2, ServiceAccount/noetl-server-rust existed only in the
# live cluster: it was created out of band, every manifest referenced it by name
# via `serviceAccountName`, and no manifest defined it.  A disaster-recovery
# apply into a fresh cluster would therefore have produced a Deployment pointing
# at a ServiceAccount that does not exist.
#
# ⚠ AND A CLEAN `kubectl diff` DOES NOT PROVE THIS FILE IS COMPLETE.  Three-way
# merge does not report the REMOVAL of an annotation that is absent from
# `last-applied`, so an undeclared annotation shows up as a no-op while still
# being dropped on the next apply.  The Workload Identity binding below must be
# checked by reading the live object, not by trusting the diff:
#
#   kubectl -n noetl get sa noetl-server-rust \
#     -o jsonpath='{.metadata.annotations.iam\.gke\.io/gcp-service-account}'
#
# The GSA needs roles/secretmanager.secretAccessor on noetl-encryption-key,
# noetl-postgres-password and noetl-internal-api-token.  Workload Identity needs
# BOTH halves — the IAM grant AND this annotation; with only the grant, the pod
# authenticates as the node identity and the CSI mount fails PermissionDenied.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: noetl-server-rust
  namespace: noetl
  annotations:
    iam.gke.io/gcp-service-account: noetl-result-tier@shastaratech-noetl-prod.iam.gserviceaccount.com
