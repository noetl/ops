# Local kind validation manifest for the Rust noetl-worker (5.1.0).
#
# Deploys a SINGLE Rust worker pod alongside the existing Python
# worker pool (`worker-cpu-01`).  Both pools claim from the same
# NATS stream + consumer (`NOETL_COMMANDS` / `noetl_worker_pool`) so
# whichever pulls a command first wins — exactly the Appendix H §
# R-3.x design.
#
# Image: `noetl-worker:dev` (built locally with podman from
# noetl/worker@2821149, the v5.1.0 head).  imagePullPolicy: Never so
# kind uses the loaded image, not GHCR.
#
# Per agents/rules/deployment-validation.md — every container-image
# change validates here before GKE.  This manifest is the validation
# rig for noetl-worker 3.0.0+ (post PR-EE-3 + snowflake event_id +
# meta.attempts + NATS consumer-lag metric).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: noetl-worker-rust
  namespace: noetl
  labels:
    app: noetl-worker-rust
    component: worker
    runtime: rust
    worker-pool: worker-rust-pool
spec:
  replicas: 1
  selector:
    matchLabels:
      app: noetl-worker-rust
      worker-pool: worker-rust-pool
  template:
    metadata:
      labels:
        app: noetl-worker-rust
        component: worker
        runtime: rust
        worker-pool: worker-rust-pool
      annotations:
        # Make the metrics port scrapable by KEDA + Prometheus
        # without an explicit Service.
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: noetl-worker
      initContainers:
        - name: wait-for-api
          image: curlimages/curl:8.7.1
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - "until curl -sf http://noetl.noetl.svc.cluster.local:8082/api/health; do echo 'Waiting for NoETL API...'; sleep 3; done"
      containers:
        - name: worker
          # Podman tags images with the `localhost/` prefix by
          # default; containerd inside the kind node is strict about
          # the registry portion, so we reference the full local
          # name.
          image: localhost/noetl-worker:dev
          imagePullPolicy: Never
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            # Pool name distinguishes Rust heartbeats from the
            # Python pool's heartbeats so register/deregister
            # don't collide.
            - name: WORKER_POOL_NAME
              value: worker-rust-pool
            # Unique worker_id per pod — used for the snowflake
            # generator's node_id hash + the structured-log
            # correlation field per observability.md Principle 4.
            - name: WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # Per noetl/ai-meta#42 PR-2b/PR-3/PR-4b: the Rust pool
            # subscribes to the *shared* segment of the per-pool
            # routing scheme.  The consumer name has a `_shared`
            # suffix; the consumer-side filter pins it to commands
            # published under `noetl.commands.shared.>`.  Until
            # PR-5's flag flip, the server is still publishing to
            # the bare subject so this consumer is empty; after
            # cutover it drains shared-segment commands.  The
            # Python pool's deployment continues to read the legacy
            # `NATS_CONSUMER=noetl_worker_pool` from the ConfigMap
            # and uses its multi-subscriber loop (PR-2b) to also
            # bind `*_shared` and `*_python` consumers.
            # The command transport + pool filter.  Both are REQUIRED with no
            # default (noetl/ai-meta#243, noetl/ai-meta#218); neither was in this
            # file, so the live kind Deployment carried them out-of-band.
            # ---------------------------------------------------------------
            # EHDB tiers (noetl/ai-meta#155, #257, #265).
            #
            # ⚠ UNDECLARED UNTIL noetl/ai-meta#265 G5, AND ELEVEN OF THESE ARE
            # LIVE ON PROD.  Applying this file without them would strip
            # `NOETL_EHDB_EVENTLOG=primary` and the tier-service address from
            # the worker pool — taking the tier that is SERVING PRIMARY off its
            # store, silently.  ai-meta#267, measured.
            #
            # Every value below is PROD'S LIVE VALUE, read off the cluster on
            # 2026-08-25.  This block is a capture, not a preference.
            # ---------------------------------------------------------------
            - name: NOETL_EHDB_ENABLED
              value: "true"
            - name: NOETL_EHDB_MODE
              value: "local_reference"
            - name: NOETL_EHDB_CLIENT_ROLE
              value: "worker"
            - name: NOETL_EHDB_LOCAL_REFERENCE_LOG
              value: "/tmp/ehdb/ref.jsonl"
            #
            # -- per-tier mode.  eventlog is PRIMARY AND SERVING.  Do not change.
            - name: NOETL_EHDB_EVENTLOG
              value: "primary"
            # Tier 2.  `shadow` here is PRE-EXISTING and long-standing — it is
            # NOT part of #265's cutover, and the 2026-08-14 gate note claiming
            # no NOETL_EHDB_PROJECTION* variable existed on prod was wrong.
            # Under #265 this same value additionally reaches the tier-generic
            # store and the write-path serve decision; it still resolves to
            # "the incumbent is authoritative" and writes nothing without
            # NOETL_EHDB_PROJECTION_MIRROR_SOURCE=server on the SERVER.
            - name: NOETL_EHDB_PROJECTION
              value: "shadow"
            - name: NOETL_EHDB_KV
              value: "shadow"
            - name: NOETL_EHDB_OBJECT
              value: "shadow"
            #
            # -- where tier reads and server-authored appends resolve ---------
            # `service` is a hard prerequisite for any event-log flip: tier
            # reads are POD-LOCAL otherwise, so at 3 replicas 2 of 3 read the
            # tier as EMPTY (ai-meta#257 PR4).  It is equally a prerequisite for
            # the projection tier, which has NO pod-local write path at all and
            # refuses one with 503 by design.
            - name: NOETL_EHDB_TIER_QUERY_SOURCE
              value: "service"
            # Stable per-pod DNS.  MUST resolve to ONE process: the headless
            # Service would round-robin, and the tier service is a single store.
            - name: NOETL_EHDB_TIER_SERVICE_ADDR
              value: "noetl-cmdbus-writer-0.noetl.svc.cluster.local:9110"
            - name: NOETL_EHDB_EVENTLOG_MIRROR_SOURCE
              value: "server"
            - name: NOETL_COMMAND_BUS
              value: ehdb
            - name: NOETL_FEED_FILTER_SUBJECT
              value: noetl.commands.shared.>
            - name: NOETL_SERVER_URL
              value: http://noetl.noetl.svc.cluster.local:8082
            - name: WORKER_HEARTBEAT_INTERVAL
              value: "15"
            - name: WORKER_MAX_CONCURRENT
              value: "4"
            - name: WORKER_METRICS_BIND
              value: "0.0.0.0:9090"
            # Default 5s; override for validation so the lag
            # gauges populate visibly fast.
            - name: RUST_LOG
              value: "info,noetl_worker=debug,noetl_executor=debug"
            # Arrow IPC shared-memory cache budget (noetl-arrow-cache).
            # Pinned here next to the /dev/shm sizeLimit below so the two
            # stay coherent: sizeLimit (320Mi) MUST exceed this budget
            # (256Mi) or the worker SIGBUSes (exit 135) when the cache
            # fills past the tmpfs.  worker.rs:91 / arrow-cache cache.rs:12.
            - name: NOETL_IPC_CACHE_BUDGET_BYTES
              value: "268435456" # 256 MiB
          volumeMounts:
            # Memory-backed /dev/shm for the Arrow IPC cache.  The k8s
            # container-runtime default /dev/shm is a 64 MiB tmpfs; the
            # cache writes shm regions up to NOETL_IPC_CACHE_BUDGET_BYTES
            # and overruns 64 MiB, page-faulting into SIGBUS (exit 135).
            - name: dshm
              mountPath: /dev/shm
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              # 320Mi (/dev/shm tmpfs, charged to the cgroup) + worker RSS.
              memory: "768Mi"
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            # >= NOETL_IPC_CACHE_BUDGET_BYTES (256Mi) + 64Mi headroom for
            # tmpfs page rounding / fragmentation.  tmpfs usage counts
            # against the container memory limit above (768Mi), which
            # covers this plus the worker RSS.
            sizeLimit: 320Mi
---
# Headless service so Prometheus / KEDA can scrape every pod's
# /metrics endpoint directly.  Mirrors `noetl-worker-metrics`.
apiVersion: v1
kind: Service
metadata:
  name: noetl-worker-rust-metrics
  namespace: noetl
  labels:
    app: noetl-worker-rust
spec:
  clusterIP: None
  selector:
    app: noetl-worker-rust
  ports:
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
