# drift-audit: kind-only
#   Never deployed to prod, by design — this exists only so the e2e script can
#   scale it to 0 and back to simulate a downstream outage.  Without this marker
#   `drift-audit.sh workloads` reports it as "declared but not running in prod"
#   and asks whether it is dead legacy, a gated feature, or a fixture.  The
#   answer is stable and belongs with the artifact rather than in a list inside
#   the checker, which would be a second representation and would drift.
#   See noetl/ai-meta#97.
# Toggleable downstream for the Phase-4 spool live validation
# (noetl/ai-meta#90, RFC §8).
#
# A trivial in-cluster HTTP service that the `spool_outage_stream`
# subscription's circuit breaker probes (http GET to :5678/). The e2e
# script simulates a downstream outage by scaling this Deployment to 0
# replicas (the probe then fails → the circuit opens → incoming messages
# buffer to the spool), and recovery by scaling it back to 1 (the probe
# succeeds → the circuit closes → the spool drains and replays).
#
#   kubectl -n noetl scale deploy/spool-downstream-echo --replicas=0   # outage
#   kubectl -n noetl scale deploy/spool-downstream-echo --replicas=1   # recovery
#
# hashicorp/http-echo answers every request with a fixed body on :5678 —
# enough for the circuit's reachability probe (any answered status = up).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spool-downstream-echo
  namespace: noetl
  labels:
    app: spool-downstream-echo
    component: e2e-spool-downstream
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spool-downstream-echo
  template:
    metadata:
      labels:
        app: spool-downstream-echo
    spec:
      containers:
        - name: http-echo
          image: hashicorp/http-echo:1.0.0
          args:
            - "-listen=:5678"
            - "-text=warehouse-up"
          ports:
            - name: http
              containerPort: 5678
          readinessProbe:
            httpGet:
              path: /
              port: 5678
            initialDelaySeconds: 1
            periodSeconds: 2
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: spool-downstream-echo
  namespace: noetl
  labels:
    app: spool-downstream-echo
spec:
  selector:
    app: spool-downstream-echo
  ports:
    - name: http
      port: 5678
      targetPort: 5678
