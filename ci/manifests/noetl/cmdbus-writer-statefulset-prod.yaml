# noetl/ai-meta#267 — RECONCILED AGAINST LIVE PROD 2026-08-26.
#
# Captured from the running cluster, not hand-written.  Applying this file used
# to DELETE live configuration: a server-side dry-run of the system pool showed
# 51 environment variables removed, three of them unsurvivable — NOETL_COMMAND_BUS
# and its claim address, the NOETL_INTERNAL_API_TOKEN secretKeyRef, and
# NOETL_STATE_BUILDER/_SOURCE (the off-server topology itself).  A DR re-apply
# would have silently unconfigured prod.
#
# Secrets are REFERENCED (valueFrom.secretKeyRef), never resolved.  The capture
# tool fails closed on any credential-shaped or high-entropy literal:
# playbooks/267-iac-reconcile/capture.py in noetl/ai-meta.
#
# Cluster-authored annotations (autopilot.gke.io/*, cloud.google.com/*) are kept
# DELIBERATELY.  Stripping them leaves a diff that still mutates live state; a
# manifest whose apply is a no-op has to declare what the webhooks wrote.
#
# Proof:  kubectl --context <prod> -n noetl diff -f <this file>   ->  no-op.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  annotations:
    autopilot.gke.io/resource-adjustment: '{"input":{"containers":[{"limits":{"cpu":"2","memory":"4Gi"},"requests":{"cpu":"250m","memory":"512Mi"},"name":"noetl-worker"}]},"output":{"containers":[{"limits":{"cpu":"2","ephemeral-storage":"1Gi","memory":"4Gi"},"requests":{"cpu":"250m","ephemeral-storage":"1Gi","memory":"512Mi"},"name":"noetl-worker"}]},"computeClassAtAdmission":"Default","modified":true}'
    autopilot.gke.io/warden-version: 35.26.5-gke.2
  labels:
    app: noetl-cmdbus-writer
    command-bus: ehdb
    component: cmdbus-writer
    managed-by: noetl
  name: noetl-cmdbus-writer
  namespace: noetl
spec:
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  podManagementPolicy: Parallel
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: noetl-cmdbus-writer
  serviceName: noetl-cmdbus-writer-headless
  template:
    metadata:
      labels:
        app: noetl-cmdbus-writer
        command-bus: ehdb
        component: cmdbus-writer
        managed-by: noetl
    spec:
      containers:
      - args:
        - 'set -e

          ORD="${HOSTNAME##*-}"

          case "$ORD" in ''''|*[!0-9]*) echo "cannot derive shard from HOSTNAME=$HOSTNAME" >&2; exit 1
          ;; esac

          export NOETL_COMMAND_BUS_SHARD="$ORD"

          export NOETL_EVENT_BUS_SHARD="$ORD"

          echo "writer shard $ORD (host $HOSTNAME)"

          exec ./noetl-worker

          '
        command:
        - /bin/sh
        - -c
        env:
        - name: NOETL_EHDB_TIER_SERVICE_BIND
          value: 0.0.0.0:9110
        - name: NOETL_EHDB_TIER_SERVICE_DIR
          value: /data/eventbus/ehdb-tier
        - name: WORKER_POOL_NAME
          value: cmdbus-writer
        - name: NOETL_SERVER_URL
          value: http://noetl-server-rust.noetl.svc.cluster.local:8082
        - name: WORKER_MAX_CONCURRENT
          value: '1'
        - name: WORKER_METRICS_BIND
          value: 0.0.0.0:9090
        - name: RUST_LOG
          value: info,noetl_worker=info,ehdb_feed=info
        - name: NOETL_COMMAND_BUS
          value: ehdb
        - name: NOETL_COMMAND_BUS_HOST
          value: 'true'
        - name: NOETL_COMMAND_SHARD_COUNT
          value: '1'
        - name: NOETL_COMMAND_BUS_WRITER_DIR
          value: /data/cmdbus
        - name: NOETL_COMMAND_BUS_INGEST_BIND
          value: 0.0.0.0:9100
        - name: NOETL_COMMAND_BUS_CLAIM_BIND
          value: 0.0.0.0:9101
        - name: NOETL_COMMAND_BUS_METRICS_BIND
          value: 0.0.0.0:9102
        - name: NOETL_COMMAND_BUS_ACK_WAIT_SECS
          value: '30'
        - name: NOETL_COMMAND_BUS_CLAIM_ADDR
          value: 127.0.0.1:9101
        - name: NOETL_FEED_FILTER_SUBJECT
          value: noetl.commands.cmdbus.>
        - name: NOETL_EVENT_BUS_HOST
          value: 'true'
        - name: NOETL_EVENT_SHARD_COUNT
          value: '1'
        - name: NOETL_EVENT_BUS_WRITER_DIR
          value: /data/eventbus
        - name: NOETL_EVENT_BUS_KV_DIR
          value: /data/eventkv
        - name: NOETL_EVENT_BUS_INGEST_BIND
          value: 0.0.0.0:9103
        - name: NOETL_EVENT_BUS_CLAIM_BIND
          value: 0.0.0.0:9104
        - name: NOETL_EVENT_BUS_SSE_BIND
          value: 0.0.0.0:9105
        - name: NOETL_EVENT_BUS_METRICS_BIND
          value: 0.0.0.0:9106
        - name: NOETL_EVENT_BUS_KV_BIND
          value: 0.0.0.0:9107
        - name: NOETL_EVENT_BUS_WAL_BIND
          value: 0.0.0.0:9108
        - name: NOETL_EVENT_BUS_ACK_WAIT_SECS
          value: '30'
        - name: NOETL_EVENT_BUS_CURSOR_PERSIST_SECS
          value: '5'
        - name: NOETL_EVENT_BUS_CURSOR_FALLBACK
          value: tail
        - name: NOETL_EHDB_REFERENCE_RUNTIME_CACHE
          value: 'true'
        image: us-central1-docker.pkg.dev/shastaratech-noetl-prod/noetl/noetl-worker-rust@sha256:8b7948a8203547d7b5916766833f3b19c78503e7fa24e3fe2d0b773ed04ad418
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          initialDelaySeconds: 30
          periodSeconds: 20
          successThreshold: 1
          tcpSocket:
            port: cmdbus-claim
          timeoutSeconds: 1
        name: noetl-worker
        ports:
        - containerPort: 9110
          name: tier-service
          protocol: TCP
        - containerPort: 9100
          name: cmdbus-ingest
          protocol: TCP
        - containerPort: 9101
          name: cmdbus-claim
          protocol: TCP
        - containerPort: 9102
          name: cmdbus-lag
          protocol: TCP
        - containerPort: 9090
          name: metrics
          protocol: TCP
        - containerPort: 9103
          name: events-ingest
          protocol: TCP
        - containerPort: 9104
          name: events-claim
          protocol: TCP
        - containerPort: 9105
          name: events-sse
          protocol: TCP
        - containerPort: 9106
          name: events-lag
          protocol: TCP
        - containerPort: 9107
          name: events-kv
          protocol: TCP
        - containerPort: 9108
          name: events-wal
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          initialDelaySeconds: 5
          periodSeconds: 5
          successThreshold: 1
          tcpSocket:
            port: cmdbus-claim
          timeoutSeconds: 1
        resources:
          limits:
            cpu: '2'
            ephemeral-storage: 1Gi
            memory: 4Gi
          requests:
            cpu: 250m
            ephemeral-storage: 1Gi
            memory: 512Mi
        securityContext:
          capabilities:
            drop:
            - NET_RAW
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /data/cmdbus
          name: cmdbus-data
        - mountPath: /data/eventbus
          name: eventbus-data
        - mountPath: /data/eventkv
          name: eventbus-kv
        # noetl/ehdb#332 — mounted but NOT yet used. The tier still writes to
        # /data/eventbus/ehdb-tier until NOETL_EHDB_TIER_SERVICE_DIR is repointed.
        - mountPath: /data/ehdb-tier
          name: ehdb-tier-data
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
      tolerations:
      - effect: NoSchedule
        key: kubernetes.io/arch
        operator: Equal
        value: amd64
      volumes:
      - name: cmdbus-data
        persistentVolumeClaim:
          claimName: noetl-cmdbus-writer-0-data
      - name: eventbus-data
        persistentVolumeClaim:
          claimName: noetl-eventbus-writer-0-data
      - name: eventbus-kv
        persistentVolumeClaim:
          claimName: noetl-eventbus-kv-0-data
      - name: ehdb-tier-data
        persistentVolumeClaim:
          claimName: noetl-ehdb-tier-0-data
  updateStrategy:
    type: RollingUpdate
---
