# noetl/ai-meta#267 — RECONCILED AGAINST LIVE PROD 2026-08-26.
#
# Captured from the running cluster, not hand-written.  Applying this file used
# to DELETE live configuration: a server-side dry-run of the system pool showed
# 51 environment variables removed, three of them unsurvivable — NOETL_COMMAND_BUS
# and its claim address, the NOETL_INTERNAL_API_TOKEN secretKeyRef, and
# NOETL_STATE_BUILDER/_SOURCE (the off-server topology itself).  A DR re-apply
# would have silently unconfigured prod.
#
# Secrets are REFERENCED (valueFrom.secretKeyRef), never resolved.  The capture
# tool fails closed on any credential-shaped or high-entropy literal:
# playbooks/267-iac-reconcile/capture.py in noetl/ai-meta.
#
# Cluster-authored annotations (autopilot.gke.io/*, cloud.google.com/*) are kept
# DELIBERATELY.  Stripping them leaves a diff that still mutates live state; a
# manifest whose apply is a no-op has to declare what the webhooks wrote.
#
# Proof:  kubectl --context <prod> -n noetl diff -f <this file>   ->  no-op.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  annotations:
    autopilot.gke.io/resource-adjustment: '{"input":{"containers":[{"limits":{"cpu":"2","ephemeral-storage":"1Gi","memory":"12Gi"},"requests":{"cpu":"1","ephemeral-storage":"1Gi","memory":"512Mi"},"name":"noetl-worker"}]},"output":{"containers":[{"limits":{"cpu":"2","ephemeral-storage":"1Gi","memory":"12Gi"},"requests":{"cpu":"1","ephemeral-storage":"1Gi","memory":"1Gi"},"name":"noetl-worker"}]},"computeClassAtAdmission":"Default","modified":true}'
    autopilot.gke.io/warden-version: 35.26.6-gke.0
  labels:
    app: noetl-cmdbus-writer
    command-bus: ehdb
    component: cmdbus-writer
    managed-by: noetl
  name: noetl-cmdbus-writer
  namespace: noetl
spec:
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  podManagementPolicy: Parallel
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: noetl-cmdbus-writer
  serviceName: noetl-cmdbus-writer-headless
  template:
    metadata:
      labels:
        app: noetl-cmdbus-writer
        command-bus: ehdb
        component: cmdbus-writer
        managed-by: noetl
    spec:
      containers:
      - args:
        - 'set -e

          ORD="${HOSTNAME##*-}"

          case "$ORD" in ''''|*[!0-9]*) echo "cannot derive shard from HOSTNAME=$HOSTNAME" >&2; exit 1
          ;; esac

          export NOETL_COMMAND_BUS_SHARD="$ORD"

          export NOETL_EVENT_BUS_SHARD="$ORD"

          echo "writer shard $ORD (host $HOSTNAME)"

          exec ./noetl-worker

          '
        command:
        - /bin/sh
        - -c
        env:
        - name: NOETL_EHDB_TIER_SERVICE_BIND
          value: 0.0.0.0:9110
        - name: NOETL_EHDB_TIER_SERVICE_DIR
          value: /data/eventbus/ehdb-tier
        # --- noetl/ai-meta#267: live on prod, declared nowhere --------------
        # A re-apply would have removed both.
        - name: NOETL_EHDB_CATALOG_MIRROR_SOURCE
          value: server
        # The age-based seal trigger.  There is an alert on this NOT firing, so
        # losing the value would silently disarm the thing the alert watches as
        # well as the behaviour it watches for.
        - name: NOETL_EHDB_SEAL_MAX_AGE_MS
          value: '5000'
        - name: WORKER_POOL_NAME
          value: cmdbus-writer
        - name: NOETL_SERVER_URL
          value: http://noetl-server-rust.noetl.svc.cluster.local:8082
        - name: WORKER_MAX_CONCURRENT
          value: '1'
        - name: WORKER_METRICS_BIND
          value: 0.0.0.0:9090
        - name: RUST_LOG
          value: info,noetl_worker=info,ehdb_feed=info
        - name: NOETL_COMMAND_BUS
          value: ehdb
        - name: NOETL_COMMAND_BUS_HOST
          value: 'true'
        - name: NOETL_COMMAND_SHARD_COUNT
          value: '1'
        - name: NOETL_COMMAND_BUS_WRITER_DIR
          value: /data/cmdbus
        - name: NOETL_COMMAND_BUS_INGEST_BIND
          value: 0.0.0.0:9100
        - name: NOETL_COMMAND_BUS_CLAIM_BIND
          value: 0.0.0.0:9101
        - name: NOETL_COMMAND_BUS_METRICS_BIND
          value: 0.0.0.0:9102
        - name: NOETL_COMMAND_BUS_ACK_WAIT_SECS
          value: '30'
        - name: NOETL_COMMAND_BUS_CLAIM_ADDR
          value: 127.0.0.1:9101
        - name: NOETL_FEED_FILTER_SUBJECT
          value: noetl.commands.cmdbus.>
        - name: NOETL_EVENT_BUS_HOST
          value: 'true'
        - name: NOETL_EVENT_SHARD_COUNT
          value: '1'
        - name: NOETL_EVENT_BUS_WRITER_DIR
          value: /data/eventbus
        - name: NOETL_EVENT_BUS_KV_DIR
          value: /data/eventkv
        - name: NOETL_EVENT_BUS_INGEST_BIND
          value: 0.0.0.0:9103
        - name: NOETL_EVENT_BUS_CLAIM_BIND
          value: 0.0.0.0:9104
        - name: NOETL_EVENT_BUS_SSE_BIND
          value: 0.0.0.0:9105
        - name: NOETL_EVENT_BUS_METRICS_BIND
          value: 0.0.0.0:9106
        - name: NOETL_EVENT_BUS_KV_BIND
          value: 0.0.0.0:9107
        - name: NOETL_EVENT_BUS_WAL_BIND
          value: 0.0.0.0:9108
        - name: NOETL_EVENT_BUS_ACK_WAIT_SECS
          value: '30'
        - name: NOETL_EVENT_BUS_CURSOR_PERSIST_SECS
          value: '5'
        - name: NOETL_EVENT_BUS_CURSOR_FALLBACK
          value: tail
        - name: NOETL_EHDB_REFERENCE_RUNTIME_CACHE
          value: 'true'
        # ⚠ The five below were set LIVE and never written back (found
        # 2026-10-21 by a field-by-field diff of live vs this file). Two of them
        # are load-bearing safety switches: an apply that dropped them would have
        # silently turned off writer election and epoch fencing. Values match
        # live exactly; change them here, not with `kubectl set env`.
        - name: NOETL_EXECUTION_FAIL_ON_STEP_ERROR
          value: 'true'
        - name: NOETL_EHDB_TIER_SEAL_MAX_BYTES
          value: '268435456'
        - name: NOETL_EHDB_TIER_MAX_INFLIGHT
          value: '4'
        - name: NOETL_EHDB_ELECTION
          value: 'true'
        - name: NOETL_EHDB_FENCING
          value: enforce
        # image: DECLARED BY THE DEPLOY, NOT HERE — noetl/ai-meta#323.
        # Prod is rolled by digest (`kubectl set image`), and nothing wrote that
        # digest back here, so every pin in this directory was BEHIND live: a
        # re-apply rolled prod back past shipped incident fixes.  Rather than
        # keep a copy true, the copy is removed: this file declares SHAPE.
        # Server-side apply leaves a field this manifest does not claim, which
        # is what makes the omission safe on an EXISTING object (proved by
        # server-side dry-run against live).  Creating from nothing still needs
        # a digest: that comes from the release ledger, not from here.
        imagePullPolicy: IfNotPresent
        # ⚠ LIVENESS STAYS tcpSocket — do not "upgrade" this to match readiness
        # below.  Gating liveness on bus freshness would let a slow bind KILL the
        # writer, and this writer has looped fatally on restart before.  A
        # restart loop on the single-writer host is a worse outcome than a writer
        # that is up and not serving, because the second state is at least
        # diagnosable.  The startupProbe is what covers the bind window.
        livenessProbe:
          failureThreshold: 3
          initialDelaySeconds: 30
          periodSeconds: 20
          successThreshold: 1
          tcpSocket:
            port: cmdbus-claim
          timeoutSeconds: 1
        name: noetl-worker
        ports:
        - containerPort: 9110
          name: tier-service
          protocol: TCP
        - containerPort: 9100
          name: cmdbus-ingest
          protocol: TCP
        - containerPort: 9101
          name: cmdbus-claim
          protocol: TCP
        - containerPort: 9102
          name: cmdbus-lag
          protocol: TCP
        - containerPort: 9090
          name: metrics
          protocol: TCP
        - containerPort: 9103
          name: events-ingest
          protocol: TCP
        - containerPort: 9104
          name: events-claim
          protocol: TCP
        - containerPort: 9105
          name: events-sse
          protocol: TCP
        - containerPort: 9106
          name: events-lag
          protocol: TCP
        - containerPort: 9107
          name: events-kv
          protocol: TCP
        - containerPort: 9108
          name: events-wal
          protocol: TCP
        # ⛔ LIVE readiness is the TCP check below, and there is NO startupProbe.
        #
        # The commented block after it is the STAGED #470 probe swap (httpGet
        # /readyz + a 300 s startupProbe). It is NOT LIVE: ops#336 holds it until
        # boot warmup no longer gates /readyz for minutes (ai-meta#480 shipped
        # role-aware /readyz; ai-meta#481's CPU request is now live). Enabling it
        # is its own gated writer roll — uncomment deliberately, never as a side
        # effect of applying this file. Until 2026-10-21 these lines were live
        # YAML while prod ran tcpSocket, so applying the file would have stacked
        # the swap onto any other change (a server-side diff rejected the merge:
        # "may not specify more than 1 handler type").
        readinessProbe:
          failureThreshold: 3
          initialDelaySeconds: 5
          periodSeconds: 5
          successThreshold: 1
          tcpSocket:
            port: cmdbus-claim
          timeoutSeconds: 1
        #
        # ---- STAGED, NOT LIVE: the #470 probe swap ----
        # # Readiness reads /readyz, not a TCP handshake (noetl/ai-meta#470).
        # #
        # # A port that accepts a connection and then answers nothing passes a TCP
        # # probe forever.  That is noetl/ai-meta#469: this writer accepted TCP and
        # # never sent HTTP headers for over a day, across two pod generations,
        # # while the pod read Ready, restarts=0, every listener logged "up", and
        # # there were zero ERROR lines.  `tcpSocket: cmdbus-claim` cannot see it,
        # # by construction.
        # #
        # # /readyz returns 200 only when boot warmup is done AND every required
        # # serving face is bound AND each ticked inside the freshness threshold;
        # # otherwise 503 with a body naming the failed check and the face.  The
        # # comparison happens in-process because a probe is stateless — it cannot
        # # diff two scrapes, so it cannot notice a number that stopped moving.
        # #
        # # ⚠ On the metrics port deliberately.  :9090 is one of the ports that
        # # wedged in #469, so a probe that cannot get an HTTP response out of
        # # :9090 SHOULD fail — that is the signal, not a flaw in the target.
        # #
        # # Which faces are required is NOETL_SERVING_REQUIRED on the container
        # # (default: command ingest + command claim).  Measured container-relative
        # # bind times on this pod, 2026-10-16 (startedAt 17:05:13Z, restarts=0):
        # # metrics 1.6 s, command ingest/claim 2.6 s, event ingest 56.0 s, tier
        # # 60.5 s, event claim 308.4 s.  A NotReady pod leaves EVERY Service that
        # # selects it, so requiring a later-binding face makes the faces that are
        # # already up unreachable for the difference: +51 s per restart to require
        # # event ingest, +303 s to require event claim.  The default costs
        # # nothing — it is ready before the old probe's 5 s initialDelay elapsed.
        # # Widening it means raising the startupProbe budget below to match.
        # readinessProbe:
        #   failureThreshold: 3
        #   httpGet:
        #     path: /readyz
        #     port: metrics
        #   periodSeconds: 5
        #   successThreshold: 1
        #   timeoutSeconds: 2
        # # The bind window, so startup slowness cannot trip liveness.
        # #
        # # While a startupProbe is running, kubelet suppresses BOTH the readiness
        # # and liveness probes — which is the point: /readyz legitimately answers
        # # 503 until the required faces bind, and that must read as "not started
        # # yet" rather than as a failure.
        # #
        # # ⚠⚠ 60 x 5 s = 300 s, NOT the 60 s a bind-window reading suggests.
        # #
        # # Sizing this to the 2.6 s bind window was wrong and kind proved it: at
        # # 12 x 5 s the writer CRASH-LOOPED.  The container was SIGTERMed at
        # # exactly 61 s with exitCode 0 — `Startup probe failed: HTTP probe
        # # failed with statuscode: 503`, for the whole 62 s budget, then
        # # `failed startup probe, will be restarted`.
        # #
        # # The cause is that /readyz gates on boot warmup as well as on the bus
        # # faces, and warmup is a separate, much longer thing than binding.  A
        # # budget derived from bind times measures the wrong quantity.
        # #
        # # ⚠ Not fully isolated: the FIRST container on a new image took > 62 s
        # # to answer 200, while every subsequent fresh container answered within
        # # ~16 s, and nothing was logged in the 61 s gap.  No on-disk warmup
        # # cache was found, so the obvious cold-start explanation is unconfirmed.
        # # The budget is sized to absorb it either way.
        # #
        # # 300 s is ~19x the ~16 s a fresh container actually takes.  Generous on
        # # purpose, because the downside is asymmetric: an over-generous budget
        # # delays nothing, since startup ends on the first success rather than at
        # # the budget, while an under-generous one kills the single-writer host —
        # # which is exactly what 60 s did.
        # #
        # # Raise to >= 70 (350 s) before setting NOETL_SERVING_REQUIRED to a set
        # # that includes event claim, which binds at 308 s.
        # startupProbe:
        #   failureThreshold: 60
        #   httpGet:
        #     path: /readyz
        #     port: metrics
        #   initialDelaySeconds: 2
        #   periodSeconds: 5
        #   successThreshold: 1
        #   timeoutSeconds: 2
        resources:
          limits:
            cpu: '2'
            ephemeral-storage: 1Gi
            # ⚠⚠ 12Gi, matching live, and NOT a tuning change — a drift
            # correction.  This file said 4Gi while live has been 12Gi since the
            # OOM work (raised live by `kubectl patch`, which nothing wrote
            # back).  The writer OOMs at 4Gi: ~3 GiB baseline from the unsealed
            # tier store plus an episodic spike on mass worker reconnect, and
            # 4Gi -> 8Gi restored dispatch then OOMed again in 81 minutes.
            #
            # So applying this file at 4Gi would have OOMed the single-writer
            # host — from a change whose stated purpose was a readiness probe.
            # Found by diffing the FULL rendered object against live rather than
            # the field being changed (agents/rules/apply-safety.md); a targeted
            # check of the probe fields would have reported clean.
            memory: 12Gi
          requests:
            # 1 core since the 2026-10-21 writer roll (ai-meta#481): it ran at
            # 2-3.5x a 250m request and lost that headroom under contention.
            cpu: '1'
            ephemeral-storage: 1Gi
            # 1Gi is what Autopilot ADMITS for a 1-core request: its webhook
            # enforces a minimum memory:CPU ratio, and the resource-adjustment
            # annotation above records input 512Mi -> output 1Gi. Declared at the
            # admitted value so applying this file is a no-op.
            memory: 1Gi
        securityContext:
          capabilities:
            drop:
            - NET_RAW
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /data/cmdbus
          name: cmdbus-data
        - mountPath: /data/eventbus
          name: eventbus-data
        - mountPath: /data/eventkv
          name: eventbus-kv
        # ⚠⚠ ehdb-tier-data mount REMOVED — 2026-09-08 incident, noetl/ai-meta#323.
        #
        # This declared a mount for PVC `noetl-ehdb-tier-0-data`, which HAS NEVER
        # EXISTED in prod.  The live StatefulSet had three volumes; this file had
        # four.  Applying it left `noetl-cmdbus-writer-0` unschedulable
        # (`FailedScheduling: persistentvolumeclaim "noetl-ehdb-tier-0-data" not
        # found`) and took the bus down — the writer hosts both cmdbus and
        # eventbus, so every worker pool sat in `EHDB claim connect failed`.
        #
        # The lesson is not "the volume was wrong".  It is that the manifest
        # diverged from prod in MORE ways than the image pin, and the pre-apply
        # proof only compared the image field.  A server-side dry-run answers the
        # question you ask it; `kubectl diff` against live would have shown the
        # added volume outright.
        #
        # Re-adding this needs the PVC created first (noetl/ehdb#332), applied as
        # its own change with its own verification.
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      # Live since before this file tracked it; omitting it would leave the pod
      # on the namespace default service account on any recreate-from-file.
      serviceAccountName: noetl-cmdbus-writer
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
      tolerations:
      - effect: NoSchedule
        key: kubernetes.io/arch
        operator: Equal
        value: amd64
      volumes:
      - name: cmdbus-data
        persistentVolumeClaim:
          claimName: noetl-cmdbus-writer-0-data
      - name: eventbus-data
        persistentVolumeClaim:
          claimName: noetl-eventbus-writer-0-data
      - name: eventbus-kv
        persistentVolumeClaim:
          claimName: noetl-eventbus-kv-0-data
      # ⚠⚠ ehdb-tier-data volume REMOVED — see the matching note on the
      # volumeMounts above.  PVC `noetl-ehdb-tier-0-data` does not exist in prod;
      # declaring it here made the pod unschedulable and took the bus down.
      # The three PVCs above are the ones prod actually has, all Bound.
  updateStrategy:
    type: RollingUpdate
---
