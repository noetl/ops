spec:
  ports:
  - name: tier-service
    port: 9110
    protocol: TCP
    targetPort: tier-service
  - name: cmdbus-ingest
    port: 9100
    protocol: TCP
    targetPort: cmdbus-ingest
  - name: cmdbus-claim
    port: 9101
