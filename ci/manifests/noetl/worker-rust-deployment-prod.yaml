# noetl-worker-rust — PRODUCTION Rust worker pool (GKE noetl-demo-19700101)
# =============================================================================
# Phase F R5 of noetl/ai-meta#49 — the Rust worker half of the full-stack
# cutover.  The server-only flip (attempt 1, 2026-06-13) failed because the
# Rust server publishes commands to the hierarchical subject
# `noetl.commands.{pool}.{execution_id}` which the Python workers + the prod
# NATS stream (flat `noetl.commands`) don't consume.  The Rust worker is what
# consumes the hierarchical subjects — so the cutover is the FULL Rust stack.
#
# *** This is applied as a CANARY first (off the public traffic path) ***:
# while Python still serves the `noetl` Service, this Rust worker subscribes to
# `noetl.commands.shared.>` on the (widened) NOETL_COMMANDS stream and talks to
# the Rust server canary directly (NOETL_SERVER_URL below).  Prod Python
# workers consume only the flat `noetl.commands`, so there is no consumer clash.
#
# Prereqs before this becomes useful:
#   1. A SEPARATE stream `NOETL_COMMANDS_RUST` owning `noetl.commands.>`
#      (disjoint from Python's flat `noetl.commands`; the two coexist —
#      Python's NOETL_COMMANDS stream is untouched):
#        nats stream add NOETL_COMMANDS_RUST --subjects "noetl.commands.>" \
#          --storage memory --retention limits --discard old --max-msgs=-1 \
#          --max-bytes=-1 --max-age=0 --dupe-window=2m --replicas 1
#   2. noetl-server-rust Deployment running (the canary server).
#
# Image: built by automation/gcp_gke/assets/... from noetl/worker 7b8a09a
# (v5.20.0).  Pinned by digest below.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: noetl-worker-rust
  namespace: noetl
  labels:
    app: noetl-worker-rust
    component: worker
    runtime: rust
    worker-pool: worker-rust-pool
spec:
  replicas: 1
  selector:
    matchLabels:
      app: noetl-worker-rust
      worker-pool: worker-rust-pool
  template:
    metadata:
      labels:
        app: noetl-worker-rust
        component: worker
        runtime: rust
        worker-pool: worker-rust-pool
    spec:
      containers:
        - name: noetl-worker
          # Pinned by digest after the Cloud Build (filled in once built).
          # tags :v5.20.1 / :9ce4d6d resolve to this digest (linux/amd64).
          # 9ce4d6d = noetl/worker#81 (nats_url credential field-map fix that
          # unblocked auth0_login's NATS kv_put — noetl/ai-meta#49 Phase F R5).
          image: us-central1-docker.pkg.dev/noetl-demo-19700101/noetl/noetl-worker-rust@sha256:61278cb62c412d1d477a44fbf2f10b2261d9df6338c4d4e1de80e8538f524658
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9090
              name: metrics
          env:
            # Distinct pool name so Rust heartbeats don't collide with the
            # Python pool's register/deregister.
            - name: WORKER_POOL_NAME
              value: worker-rust-pool
            - name: WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NATS_URL
              value: nats://noetl:noetl@nats.nats.svc.cluster.local:4222
            # Dedicated Rust-stack stream (subjects noetl.commands.>).
            # Disjoint from Python's NOETL_COMMANDS (flat noetl.commands),
            # so Python's stream is never touched.
            - name: NATS_STREAM
              value: NOETL_COMMANDS_RUST
            # DISTINCT durable consumer — must not collide with the Python
            # pool's `noetl_worker_pool` / `*_shared` consumers.
            - name: NATS_CONSUMER
              value: noetl_worker_rust_shared
            # Consume the shared-segment hierarchical commands the Rust server
            # publishes (noetl.commands.shared.<execution_id>).  Python workers
            # consume only the flat `noetl.commands`, so no clash.
            - name: NATS_FILTER_SUBJECT
              value: noetl.commands.shared.>
            # Talk to the Rust server directly — valid during the canary (while
            # Python still owns the `noetl` Service) AND after cutover (the Rust
            # server keeps its own Service).
            - name: NOETL_SERVER_URL
              value: http://noetl-server-rust.noetl.svc.cluster.local:8082
            - name: WORKER_HEARTBEAT_INTERVAL
              value: "15"
            - name: WORKER_MAX_CONCURRENT
              value: "4"
            - name: WORKER_METRICS_BIND
              value: "0.0.0.0:9090"
            - name: RUST_LOG
              value: "info,noetl_worker=info,noetl_executor=info"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          livenessProbe:
            tcpSocket:
              port: 9090
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 6
          readinessProbe:
            tcpSocket:
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: noetl-worker-rust-metrics
  namespace: noetl
  labels:
    app: noetl-worker-rust
spec:
  clusterIP: None
  selector:
    app: noetl-worker-rust
  ports:
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
