# Server-specific configuration with database credentials
# Completely independent from worker config - no shared ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: noetl-server-config
  namespace: noetl
  labels:
    app: noetl-server
data:
  # Timezone - Must match Postgres timezone for correct timestamp handling
  TZ: "UTC"
  LOG_LEVEL: "INFO"
  PYTHONPATH: "/opt/noetl"
  NOETL_RUN_MODE: "server"
  NOETL_DATA_DIR: "/opt/noetl/data"
  NOETL_DEBUG: "true"
  NOETL_HTTP_MOCK_LOCAL: "false"
  PAGINATION_API_URL: "http://paginated-api.test-server.svc.cluster.local:5555"
  NOETL_SERVER_URL: "http://noetl.noetl.svc.cluster.local:8082"
  NOETL_DISABLE_METRICS: "true"
  NOETL_VICTORIALOGS_URL: "http://vmlogs-single-server.vmlogs.svc.cluster.local:9428"
  NOETL_LOG_FORMAT: ""
  # Removed with the NATS deletion (noetl/ai-meta#212 T5) — none of these has a
  # reader.  The server config is `envy::prefixed("NOETL_")` over `AppConfig`,
  # which has no NATS field; the worker reads only NATS_SUBJECT (kept below,
  # value equals its code default).  NOETL_EVENT_NATS_{STREAM,SUBJECT_PREFIX,
  # SHARD_COUNT} + NOETL_EVENT_MIRROR_ENABLED configured the retired Python
  # projector, deleted in this change set:
  #   NOETL_EVENT_MIRROR_ENABLED, NOETL_EVENT_NATS_STREAM,
  #   NOETL_EVENT_NATS_SUBJECT_PREFIX, NOETL_EVENT_NATS_SHARD_COUNT,
  #   NATS_USER, NATS_PASSWORD, NATS_STREAM, NATS_CONSUMER
  NATS_SUBJECT: "noetl.commands"
  # Per noetl/ai-meta#42 PR-5 — the cutover flag.  When true the
  # server publishes command notifications to
  # `noetl.commands.<pool>.<execution_id>` instead of bare
  # `noetl.commands`, where `<pool>` is derived from the playbook
  # step's `tool.kind` via `POOL_FILTER_MAP` (today: `agent` →
  # `python`, everything else → `shared`).  Workers in both pools
  # already subscribe to the right consumers per PR-2b / PR-3 /
  # PR-4b.  Flipping this on completes the routing roll-out: the
  # Rust pool stops seeing Python-only tool kinds; the Python pool
  # continues to drain shared + Python-only segments via its
  # multi-subscriber loop.  PR-6 cleans up the legacy
  # `noetl_worker_pool` durable once verification soak completes.
  NOETL_COMMAND_ROUTING_ENABLED: "true"
  # Keychain cache refresh threshold (15 minutes - prevents expiration during long loops)
  NOETL_KEYCHAIN_REFRESH_THRESHOLD: "900"
  # Server Runtime Configuration
  NOETL_ENABLE_UI: "true"
  NOETL_HOST: "0.0.0.0"
  NOETL_PORT: "8082"
  NOETL_SERVER_NAME: "server-k8s"
  NOETL_SERVER: "uvicorn"
  NOETL_SERVER_WORKERS: "1"
  NOETL_SERVER_RELOAD: "false"
  NOETL_AUTO_RECREATE_RUNTIME: "true"
  NOETL_HEARTBEAT_RETRY_AFTER: "3"
  NOETL_RUNTIME_SWEEP_INTERVAL: "15"
  NOETL_RUNTIME_OFFLINE_SECONDS: "60"
  NOETL_SERVER_METRICS_INTERVAL: "60"
  # Database Configuration (SERVER ONLY - not accessible to workers)
  # Note: POSTGRES_USER/POSTGRES_DB removed - those are application-level and defined in playbook credentials
  POSTGRES_HOST: "postgres.postgres.svc.cluster.local"
  POSTGRES_PORT: "5432"
  NOETL_POSTGRES_DB: "noetl"
  NOETL_USER: "noetl"
  NOETL_SCHEMA: "noetl"
  NOETL_DB_STARTUP_TIMEOUT: "180"
  NOETL_DB_RETRY_INTERVAL: "5"
  # Result Storage Configuration (RisingWave-aligned, phase 1)
  # Threshold for inline vs external storage (64KB default)
  NOETL_INLINE_MAX_BYTES: "65536"
  # Preview size for large results
  NOETL_PREVIEW_MAX_BYTES: "1024"
  # Default storage tier: memory, kv, disk, s3, gcs
  NOETL_DEFAULT_STORAGE_TIER: "kv"
  # Cloud tier for DISK async spill ('s3' covers S3-compatible endpoints, or 'gcs').
  NOETL_STORAGE_CLOUD_TIER: "s3"
  NOETL_S3_ENDPOINT: "http://object-store.object-store.svc.cluster.local:9000"
  NOETL_S3_BUCKET: "noetl"
  NOETL_S3_REGION: "us-east-1"
  # Default dev credentials. Replace with a Secret in prod.
  AWS_ACCESS_KEY_ID: "noetl-access"
  AWS_SECRET_ACCESS_KEY: "noetl-secret"
