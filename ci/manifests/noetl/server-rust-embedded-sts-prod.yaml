# NoETL control plane — PROD SERVING WORKLOAD, as built.
#
# ════════════════════════════════════════════════════════════════════════════
#  ⚠⚠⚠ APPLYING THIS FILE IS OWNER-GATED.  DO NOT `kubectl apply` IT.
#
#  This is `sts/noetl-server-rust-embedded` — the SOLE serving control plane.
#  Both svc/noetl and svc/noetl-server-rust resolve to its single endpoint.
#
#  Committed as an AS-BUILT RECORD so prod's serving configuration is
#  reproducible from the repo (noetl/ai-meta#359).  Until now nothing in ops
#  described the workload that actually serves traffic.
#
#  Applying a slightly-wrong manifest to the only serving workload is the
#  noetl/ai-meta#323 shape exactly: there, a targeted dry-run proved ONE field
#  and the apply changed a volume, taking prod dispatch down for 55 minutes.
#  Before any apply:
#
#    kubectl --context <prod> -n noetl diff --server-side -f <this file>
#
#  and read EVERY hunk — per `agents/rules/apply-safety.md`, a hunk you cannot
#  explain is a hunk you have not verified.  Much of a StatefulSet spec is also
#  IMMUTABLE after creation, so an apply may be rejected rather than reconciled.
#
#  ⚠ `replicas` MUST stay 1.  A second replica is a second snowflake generator
#  on the same NOETL_SERVER_MACHINE_ID=2 bits => duplicate event_id on the
#  APPEND-ONLY event log (noetl/ai-meta#332).  The retired
#  Deployment/noetl-server-rust is pinned at replicas: 0 for the same reason,
#  and `machine-id-collision-check.py --live` checks the pair.
# ════════════════════════════════════════════════════════════════════════════
#
# Captured 2026-09-29 13:29Z with
#   kubectl -n noetl get sts noetl-server-rust-embedded -o json
# and stripped of server-populated fields ONLY: status, managedFields,
# resourceVersion, uid, creationTimestamp, generation, and the circular
# last-applied-configuration annotation.  Cluster-assigned Service fields
# (clusterIP, ipFamilies, ...) are dropped so the file is portable.  Everything
# else — all 64 env vars, the 10Gi PVC template, probes, resources, the image
# digest — is exactly what runs.
#
# ⚠⚠ ENV COUNT IS NOW 67: THE THREE NOETL_CHAIN_* GATES ARE ARMED AGAIN.
#
# History, because the count has moved three times in one day and each value was
# briefly the truth:
#
#   64  post-rollback.  The first capture held 67 with the gates armed for the
#       chain-store ramp (noetl/ai-meta#357); that ramp was ROLLED BACK at 13:28Z
#       on 6.3% comparator divergence (5 in 79) at burst concurrency.  Committing
#       the 67 capture would have described a configuration that no longer
#       existed — an as-built that is not as-built is worse than none.
#   67  re-ramped 2026-09-29 17:30Z on server v3.117.2, after the two defects
#       behind that divergence were fixed (noetl/ai-meta#360).  Comparator:
#       772 comparisons, 0 failures, 100.00% agreement, up to 6 concurrent
#       executions, all 80 driven executions COMPLETED.
#
# ⚠⚠⚠ THESE THREE LINES ARE LOAD-BEARING IN BOTH DIRECTIONS.  They are recorded
# here because the live object has them, and an as-built that omits live config is
# drift.  But note what applying this file would then mean: with them PRESENT an
# apply keeps the chain path armed, and with them ABSENT an apply would silently
# DISARM it.  Either way the apply is a behaviour change, not a no-op — which is
# the whole reason applying this file is owner-gated.
#
# ⚠ All three must move together.  NOETL_CHAIN_SOURCE=chain resolves to OFF
# without NOETL_CHAIN_POPULATE, deliberately, so that a repoint can never read an
# unpopulated store.  And since the emit-path call site was removed with
# noetl/ai-meta#358, NOETL_CHAIN_POPULATE ALONE IS INERT — the populator's only
# caller is behind the source gate.  Setting it by itself measures nothing;
# verified on prod at 17:25Z, where every chain_populate outcome stayed 0.
#
# ⚠ The image digest below is v3.118.0 and is a POINT-IN-TIME record.  The
# ROLLBACK TARGET is v3.117.2 = sha256:3adf97b2a4bd334472ad961c7b587d6672a7eb7e012f9e6b9d89d6adf632672f.
#
# ⚠⚠ Prefer flipping the three gates off (~17s env change) over rolling the image,
# and the reason is now stronger than convenience: every build BELOW v3.118.0 orders
# the chain by `event_id`, which noetl/ai-meta#362 proved is not the chain order — a
# snowflake id is minted before the insert, so an event can commit into the MIDDLE of
# an id-ordered read.  Rolling the image back therefore restores a known-wrong
# ordering, while the env flip just stops using the chain store at all.  The
# release ledger (ci/manifests/noetl/ledger/server-rust.tsv) is the authority
# for which digest to restore; noetl/ai-meta#323 is why image pins inside
# manifests are a drift source.  Treat this pin as documentation, not as the
# deploy mechanism.
#
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app: noetl-server-rust-embedded
    component: server
    runtime: rust
    variant: embedded
  name: noetl-server-rust-embedded
  namespace: noetl
spec:
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  podManagementPolicy: OrderedReady
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: noetl-server-rust-embedded
  serviceName: noetl-server-rust-embedded-headless
  template:
    metadata:
      labels:
        app: noetl-server-rust-embedded
        component: server
        runtime: rust
        variant: embedded
    spec:
      containers:
      - env:
        - name: NOETL_ENCRYPTION_KEY_FILE
          value: /var/secrets/sm/encryption-key
        - name: POSTGRES_PASSWORD_FILE
          value: /var/secrets/sm/postgres-password
        - name: NOETL_INTERNAL_API_TOKEN_FILE
          value: /var/secrets/sm/token
        - name: NOETL_OBJECT_STORE_BACKEND
          value: gcs
        - name: NOETL_OBJECT_STORE_GCS_BUCKET
          value: shastaratech-noetl-prod-results
        - name: NOETL_OBJECT_STORE_GCS_ENDPOINT
          value: https://storage.googleapis.com
        - name: NOETL_OBJECT_STORE_GCS_AUTH
          value: auto
        - name: NOETL_RESULT_CELL_ENV
          value: prod
        - name: NOETL_RESULT_CELL_REGION
          value: usc1
        - name: NOETL_RESULT_CELL
          value: usc1-a
        - name: NOETL_RESULT_SHARD_COUNT
          value: '256'
        - name: NOETL_HOST
          value: 0.0.0.0
        - name: NOETL_PORT
          value: '8082'
        - name: RUST_LOG
          value: info,noetl_server=info,sqlx=warn
        - name: POSTGRES_HOST
          value: pgbouncer.postgres.svc.cluster.local
        - name: POSTGRES_PORT
          value: '5432'
        - name: POSTGRES_USER
          value: noetl
        - name: POSTGRES_DATABASE
          value: noetl
        - name: NOETL_SCHEMA
          value: noetl
        - name: NOETL_PG_STATEMENT_CACHE_CAPACITY
          value: '0'
        - name: NOETL_PUBLIC_SERVER_URL
          value: http://noetl-server-rust.noetl.svc.cluster.local:8082
        - name: NOETL_SERVER_MACHINE_ID
          value: '2'
        # The chain-store gates (noetl/ai-meta#357, #360, #362).  ARMED.  See the
        # header: all three move together, and NOETL_CHAIN_POPULATE alone is inert.
        #
        # ⚠ These were briefly disarmed on 2026-10-06 18:36Z and RE-ARMED at 19:23Z
        # within the hour, after the "is it blocking anything?" test was applied and
        # came back NO.  The evidence, recorded so the question is not reopened from
        # scratch:
        #
        #   * noetl/ai-meta#362 — the mechanism that made arming unsafe (an event
        #     committing into the MIDDLE of an `ORDER BY event_id` read, because a
        #     snowflake id is minted before the insert) — is CLOSED.  Fixed in ehdb
        #     v0.4.5 (`order_by_links`, mutation 5/5) + server#477.
        #   * The re-ramp verdict on 2026-09-30 was GREEN over 8h 28m spanning ~8
        #     divergence cycles: coverage 278, divergence 0, refusals 1
        #     (dangling_prev), multi_root/no_root/fork/unreachable all 0.
        #   * Measured again on the armed pod 2026-10-06 over 3h55m: extended=50,
        #     in_sync=1, opened=1, diverged=0, fork=0, multiple_roots=0, stale_log=0,
        #     one_root=1088, divergence 0 across 16 series, refusals 0 across 10.
        #   * noetl/ai-meta#360 remains open, but it is about FALSE divergence in the
        #     comparator — not corruption of the chain.
        #   * No interaction with the noetl/catalog work: that store owns datasets
        #     c1-c4 under its own caller-supplied root, and every mention of "chain"
        #     in its source is a doc comment.
        #
        # So the machinery is working and failing safe, and disarming it mid-flight
        # would have removed a measured-good capability for no stated benefit — the
        # riskier move of the two.
        #
        # ⚠ If they ever DO need disarming: absent is the correct off, not '0'.  The
        # three off-states are different shapes --
        #
        #   NOETL_CHAIN_ADVANCE   matches!("1"|"true"|"yes"|"on")  -> unset is false
        #   NOETL_CHAIN_POPULATE  same matcher, in ehdb-l0          -> unset is false
        #   NOETL_CHAIN_SOURCE    match { ... _ => None }           -> unset is off
        #
        # -- so a blanket '0' reads off only by landing in each reader's FAIL-SAFE
        # branch, and for SOURCE it is an UNRECOGNISED value rather than an off one.
        # And do it with a targeted env patch, never by applying this file: the image
        # pin below is stale and a server-side apply conflicts on .image with field
        # manager "kubectl-set", which would roll the image BACKWARD.
        #
        #   kubectl --context "$PROD" -n noetl patch sts noetl-server-rust-embedded \
        #     --type=json -p '[{"op":"test","path":"/spec/template/spec/containers/0/env/66/name","value":"NOETL_CHAIN_SOURCE"},
        #                      {"op":"remove","path":"/spec/template/spec/containers/0/env/66"},
        #                      {"op":"test","path":"/spec/template/spec/containers/0/env/65/name","value":"NOETL_CHAIN_ADVANCE"},
        #                      {"op":"remove","path":"/spec/template/spec/containers/0/env/65"},
        #                      {"op":"test","path":"/spec/template/spec/containers/0/env/64/name","value":"NOETL_CHAIN_POPULATE"},
        #                      {"op":"remove","path":"/spec/template/spec/containers/0/env/64"}]'
        #
        # (test ops assert each name at its index; remove in DESCENDING index order so
        # earlier removals do not shift later ones.  Verify the dry run whole-object:
        # expect exactly 6 changed leaf paths and every survivor byte-identical.)
        #
        # ⚠ Verifying either direction needs a POSITIVE CONTROL, because the patch
        # touches spec.template and the pod rolls, zeroing every counter -- so a 0 on
        # chain_populate_total is also what an idle new pod shows.  The cleanest
        # discriminator found: an ARMED boot logs `event-chain DDL skipped` warns as
        # the chain path initialises, where a DISARMED pod logs ZERO chain lines at
        # all.  Config alone can also be read straight out of the process:
        # `kubectl exec ... -- env | grep "^NOETL_CHAIN_"`.
        - name: NOETL_CHAIN_POPULATE
          value: 'true'
        - name: NOETL_CHAIN_ADVANCE
          value: 'true'
        - name: NOETL_CHAIN_SOURCE
          value: chain
        - name: NOETL_EVENT_READ_PATH
          value: event_scan
        - name: NOETL_RESULT_MINT_AUTHORITATIVE
          value: 'true'
        - name: NOETL_RESULT_STORE_DUAL_WRITE
          value: 'false'
        - name: NOETL_OFFSERVER_ATTACH_TAIL
          value: 'false'
        - name: NOETL_OFFSERVER_TAIL_PLAYBOOK_PREFIXES
          value: muno/playbooks/itinerary-planner,automation/agents/mcp/
        - name: NOETL_ORPHAN_SWEEP_ENABLED
          value: 'true'
        - name: NOETL_AUTH_VERIFY_SIGNATURE
          value: shadow
        - name: NOETL_AUTH0_DOMAIN
          value: mestumre-development.us.auth0.com
        - name: NOETL_AUTH0_AUDIENCE
          value: Jqop7YoaiZalLHdBRo5ScNQ1RJhbhbDN
        - name: NOETL_SHARD_SUBJECT_ROUTE
          value: 'true'
        - name: NOETL_COMMAND_BUS
          value: ehdb
        - name: NOETL_EVENT_BUS
          value: ehdb
        - name: NOETL_COMMAND_SHARD_COUNT
          value: '1'
        - name: NOETL_COMMAND_BUS_WRITER_ADDRS
          value: 0@noetl-cmdbus-writer-0.noetl.svc.cluster.local:9100
        - name: NOETL_EVENT_BUS_WRITER_ADDRS
          value: 0@noetl-cmdbus-writer-0.noetl.svc.cluster.local:9103
        - name: NOETL_EVENT_INGEST_PUBLISH_ONLY
          value: 'true'
        - name: NOETL_STATE_BUILDER
          value: offserver
        - name: NOETL_EVENT_SHARD_COUNT
          value: '1'
        - name: NOETL_PERMANENT_LOG_LEAN
          value: 'true'
        - name: NOETL_EHDB_EVENTLOG_MIRROR_SOURCE
          value: server
        - name: NOETL_EHDB_WORKER_QUERY_URL
          value: http://noetl-worker-system-pool-metrics.noetl.svc.cluster.local:9090
        - name: NOETL_EHDB_CROSSSTORE_PARITY_ENABLED
          value: 'true'
        - name: NOETL_ORCH_RETRIGGER_ON_CLEAR
          value: 'true'
        - name: NOETL_EHDB_EVENTLOG_MIRROR_ASYNC
          value: 'true'
        - name: NOETL_EHDB_CROSSSTORE_PARITY_LAG_TOLERANCE_SECS
          value: '30'
        - name: NOETL_EHDB_PROJECTION_MIRROR_SOURCE
          value: server
        - name: NOETL_EHDB_PROJECTION_PARITY_ENABLED
          value: 'true'
        - name: NOETL_EHDB_PROJECTION_READ_SOURCE
          value: wal
        - name: NOETL_CATALOG_SNAPSHOT
          value: digest
        - name: NOETL_CATALOG_LOG
          value: shadow
        - name: NOETL_DATABASE_ROUTES_AUTH
          value: disable_execute
        - name: NOETL_CATALOG_READ_SOURCE
          value: postgres
        - name: NOETL_EHDB_EVENTLOG_MIRROR_DRAIN_CONCURRENCY
          value: '1'
        - name: NOETL_EHDB_CROSSSTORE_PARITY_CONTENT
          value: 'true'
        - name: NOETL_NONCONVERGENCE_SWEEP_ENABLED
          value: 'true'
        - name: NOETL_EHDB_EVENTLOG_MIRROR_MAX_RETRIES
          value: '7'
        - name: NOETL_EHDB_EVENTLOG_MIRROR_RETRY_BACKOFF_MS
          value: '500'
        - name: NOETL_EHDB_RECOVERY_SOURCE
          value: tier
        - name: NOETL_EHDB_EMBEDDED
          value: 'true'
        - name: NOETL_EHDB_EMBEDDED_DIR
          value: /data/ehdb-embedded
        - name: NOETL_EHDB_MIRROR_REPAIR_SWEEP
          value: 'true'
        - name: NOETL_EHDB_PROJECTION_SERVE_ON_BEHIND
          value: 'true'
        image: us-central1-docker.pkg.dev/shastaratech-noetl-prod/noetl/server-rust@sha256:03c1fee683fd1ab8acc89f481c06f1daa01dc176424bbdb2abacdec0a07bae92
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 6
          httpGet:
            path: /api/health
            port: 8082
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        name: noetl-server
        ports:
        - containerPort: 8082
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /api/health/ready
            port: 8082
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        resources:
          limits:
            cpu: '2'
            ephemeral-storage: 1Gi
            memory: 1Gi
          requests:
            cpu: 250m
            ephemeral-storage: 1Gi
            memory: 256Mi
        securityContext:
          capabilities:
            drop:
            - NET_RAW
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /var/secrets/sm
          name: sm-secrets
          readOnly: true
        - mountPath: /data
          name: ehdb-embedded
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      serviceAccount: noetl-server-rust
      serviceAccountName: noetl-server-rust
      terminationGracePeriodSeconds: 30
      tolerations:
      - effect: NoSchedule
        key: kubernetes.io/arch
        operator: Equal
        value: amd64
      volumes:
      - csi:
          driver: secrets-store-gke.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: noetl-server-secrets
        name: sm-secrets
  updateStrategy:
    type: RollingUpdate
  volumeClaimTemplates:
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: ehdb-embedded
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
      storageClassName: standard-rwo
      volumeMode: Filesystem

---
apiVersion: v1
kind: Service
metadata:
  annotations:
    cloud.google.com/neg: '{"ingress":true}'
  labels:
    app: noetl-server-rust-embedded
    component: server
    runtime: rust
    variant: embedded
  name: noetl-server-rust-embedded-headless
  namespace: noetl
spec:
  ports:
  - name: http
    port: 8082
    protocol: TCP
    targetPort: 8082
  selector:
    app: noetl-server-rust-embedded
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  annotations:
    cloud.google.com/neg: '{"ingress":true}'
  labels:
    app: noetl
    app.kubernetes.io/managed-by: Helm
  name: noetl
  namespace: noetl
spec:
  ports:
  - name: noetl
    port: 8082
    protocol: TCP
    targetPort: 8082
  selector:
    app: noetl-server-rust-embedded
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  annotations:
    cloud.google.com/neg: '{"ingress":true}'
  labels:
    app: noetl-server-rust
  name: noetl-server-rust
  namespace: noetl
spec:
  ports:
  - name: http
    port: 8082
    protocol: TCP
    targetPort: 8082
  selector:
    app: noetl-server-rust-embedded
  type: ClusterIP
