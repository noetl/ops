# Scheduled cleanup CronJob — PROD.  Captured from the live cluster (noetl/ai-meta#267).
#
# ⚠ The `autopilot.gke.io/*` annotations below are CLUSTER-AUTHORED and change
# when GKE upgrades its warden (this file drifted from 35.26.4 to 35.26.5).  They
# are kept rather than stripped, because stripping a field that is present in
# `last-applied` makes the next apply DELETE it — a mutating apply, which is the
# opposite of what #267 wants.  The cost is that this file needs a re-capture
# after a warden upgrade; a diff limited to these keys is drift in the cluster's
# own bookkeeping, not in NoETL config.
apiVersion: batch/v1
kind: CronJob
metadata:
  annotations:
    autopilot.gke.io/resource-adjustment: '{"input":{"containers":[{"limits":{"cpu":"100m","ephemeral-storage":"1Gi","memory":"64Mi"},"requests":{"cpu":"10m","ephemeral-storage":"1Gi","memory":"32Mi"},"name":"trigger"}]},"output":{"containers":[{"limits":{"cpu":"100m","ephemeral-storage":"1Gi","memory":"64Mi"},"requests":{"cpu":"50m","ephemeral-storage":"1Gi","memory":"52Mi"},"name":"trigger"}]},"computeClassAtAdmission":"Default","modified":true}'
    autopilot.gke.io/warden-version: 35.26.4-gke.2
  labels:
    app: noetl-scheduled-cleanup
    component: system-cron
  name: noetl-scheduled-cleanup
  namespace: noetl
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata: {}
    spec:
      activeDeadlineSeconds: 120
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: noetl-scheduled-cleanup
        spec:
          containers:
          - command:
            - sh
            - -c
            - "set -e\necho \"Triggering system/scheduled_cleanup ...\"\ncurl -fsS -X POST \\\n  http://noetl-server-rust.noetl.svc.cluster.local:8082/api/execute\
              \ \\\n  -H 'Content-Type: application/json' \\\n  -d '{\"path\": \"system/scheduled_cleanup\"\
              , \"payload\": {\"event_retention_days\": 365}}'\necho\necho \"Triggered.\"\n"
            image: curlimages/curl:8.7.1
            imagePullPolicy: IfNotPresent
            name: trigger
            resources:
              limits:
                cpu: 100m
                ephemeral-storage: 1Gi
                memory: 64Mi
              requests:
                cpu: 50m
                ephemeral-storage: 1Gi
                memory: 52Mi
            securityContext:
              capabilities:
                drop:
                - NET_RAW
            terminationMessagePath: /dev/termination-log
            terminationMessagePolicy: File
          dnsPolicy: ClusterFirst
          restartPolicy: Never
          schedulerName: default-scheduler
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          terminationGracePeriodSeconds: 30
          tolerations:
          - effect: NoSchedule
            key: kubernetes.io/arch
            operator: Equal
            value: amd64
  schedule: 0 * * * *
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 3
  suspend: false
