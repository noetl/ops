# GMP PodMonitoring — production scrape for noetl worker + server /metrics.
# =============================================================================
# PROD-ONLY (GKE noetl-demo-19700101).  The production cluster runs **Google
# Managed Prometheus** (namespaces gke-gmp-system / gmp-public), NOT the
# VictoriaMetrics operator that the kind cluster uses.  The kind scrape config
# (`ci/manifests/noetl-scrape/vmscrape*.yaml`, kind:
# `operator.victoriametrics.com/v1beta1/VMServiceScrape`) cannot apply here —
# the VM CRDs do not exist.  This file is the GMP-native equivalent.
#
# GMP does NOT honor `prometheus.io/scrape` pod annotations — it only scrapes
# targets named by a PodMonitoring / ClusterPodMonitoring.  Before this file,
# the noetl namespace had NO PodMonitoring, so neither the server nor the
# worker /metrics endpoints reached Managed Prometheus.  This is the scrape
# half of the CQRS materializer-lag guardrail (noetl/ai-meta#103): the lag
# gauge (noetl_worker_nats_consumer_pending{consumer="noetl_materializer"}) and
# the materializer counters (noetl_worker_materializer_*) live on the
# system-pool worker; noetl_event_ingest_published_total lives on the server.
# The materializer-lag Rules (rules-materializer-lag.yaml) are blind without
# both scrapes.
#
# Applying this is observability-only and non-traffic-affecting.  It is safe to
# apply BEFORE the materializer worker rolls — the new series simply appear
# once the v5.35.0 worker (lag poller + materializer counters) is deployed.
# Until then it captures the existing worker dispatch / command-consumer lag
# surface, a net observability win.
#
# GMP auto-attaches target labels (cluster, location, namespace, pod,
# container, job), so no relabelConfigs are needed — the materializer rules key
# off metric labels (stream, consumer), not target relabels.
---
apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata:
  name: noetl-workers
  namespace: noetl
  labels:
    app: noetl
    component: worker
    # The scrape half of the flip guardrail for noetl/ai-meta#103.
    noetl.io/flip-guardrail: publish-only
spec:
  selector:
    # `worker-pool` must merely EXIST — do not enumerate `app` names here.
    #
    # This file carried an `app In [...]` list of four names until 2026-10-04,
    # while the LIVE object had already been corrected to this expression.  The
    # manifest was the stale copy, in the direction that silently loses coverage:
    # measured on prod 2026-10-04, `worker-pool Exists` selects 11 pods and the
    # enumerated list selects 9, dropping BOTH
    # noetl-worker-system-pool-shard1 pods (live since noetl/ai-meta#166 phase 5).
    # Two of its four names — noetl-worker-rust-subscription-pool and
    # noetl-worker — selected nothing at all.
    #
    # That is noetl/ai-meta#238 recurring: an enumerated selector is a copy of
    # the workload set, and nothing forces it to agree when a pool is added.
    # Partial monitoring coverage emits no error, so it is only findable by
    # comparing the selector against the cluster.
    matchExpressions:
      - key: worker-pool
        operator: Exists
  endpoints:
    - port: metrics        # named container port (9090) on every worker pool
      path: /metrics
      interval: 15s
---
apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata:
  name: noetl-server
  namespace: noetl
  labels:
    app: noetl
    component: server
    noetl.io/flip-guardrail: publish-only
spec:
  selector:
    # `component: server`, NOT an `app` name.
    #
    # This selected `app: noetl-server-rust` until 2026-10-04, which is the
    # Deployment — and that Deployment has been scaled to 0 since the serving
    # workload moved to StatefulSet/noetl-server-rust-embedded on 2026-09-09.
    # So this PodMonitoring selected a workload with no pods while the pod that
    # actually serves carried `app: noetl-server-rust-embedded` and was scraped
    # by nothing, for 25 days.  An enumerated `app` name is a copy of the
    # workload set; nothing forces it to agree when a workload is replaced.
    #
    # Both pod templates carry `component: server` — the Deployment's and the
    # StatefulSet's — so this selector covers the current serving pod, the
    # dormant Deployment if it is ever scaled back up, and a future variant,
    # without naming any of them.  Verified on prod: `-l component=server`
    # returns exactly noetl-server-rust-embedded-0 and nothing else.
    #
    # Same reasoning as podmonitoring-cmdbus-writer.yaml, which selects
    # `component: cmdbus-writer` so a new shard's writer is picked up.
    matchLabels:
      component: server
  endpoints:
    # The server exposes Prometheus metrics on its HTTP port (8082) at
    # /metrics — including noetl_event_ingest_published_total, the
    # "gate is ON and active" signal the MaterializerStalledUnderGate /
    # MaterializerAbsentUnderGate alerts depend on.
    #
    # The StatefulSet's container declares the same port name `http` (8082),
    # so only the selector needed to change.
    - port: http
      path: /metrics
      interval: 30s
