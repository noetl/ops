# noetl/ai-meta#267 Tier 2 — projects the internal API token from GCP Secret
# Manager into a file, for the system pools.
#
# ⚠ provider: gke, and the Deployment's csi.driver is `secrets-store-gke.csi.k8s.io`
# — NOT the upstream `secrets-store.csi.k8s.io`. The GKE add-on registers its own
# driver name; using the upstream one fails the mount with "driver name ... not
# found in the list of registered CSI drivers".
#
# ⚠ Workload Identity needs BOTH halves. The GSA must allow the KSA (an IAM
# grant, owner-run) AND the KSA must carry
# `iam.gke.io/gcp-service-account: noetl-system-pool@…`. With only the first, the
# mount fails PermissionDenied on secretmanager.versions.access because the pod
# authenticates as the node's default identity.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: noetl-internal-api-token
  namespace: noetl
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/shastaratech-noetl-prod/secrets/noetl-internal-api-token/versions/latest"
        path: "token"
