apiVersion: v1
kind: Service
metadata:
  name: noetl-ext
  namespace: noetl
  labels:
    app: noetl-server
spec:
  type: NodePort
  ports:
    - port: 8082
      nodePort: 30082
      protocol: TCP
      name: http
    # R-2.3 Phase A: Arrow Flight gRPC endpoint exposed via NodePort
    # for kind-cluster validation.  The kind config.yaml maps host
    # port 8083 → nodePort 30083 so `grpc://localhost:8083` reaches
    # the in-pod Flight server.
    - port: 8083
      nodePort: 30083
      protocol: TCP
      name: flight-grpc
  selector:
    app: noetl-server
