# ClickHouse MCP server (github.com/ClickHouse/mcp-clickhouse, Apache-2.0), streamable
# HTTP transport on /mcp. Tools: run_query, list_databases, list_tables.
#
# It connects as mcp_reader (readonly=2, SELECT on logs.* only), and the server itself
# keeps CLICKHOUSE_ALLOW_WRITE_ACCESS at its default (false): two independent read-only
# guards. Clients authenticate with the bearer token in log-analytics-credentials
# (key mcp-token); /health stays unauthenticated for probes.
#
# Reach it from the host at http://127.0.0.1:30124/mcp (kind hostPort, loopback only),
# from pods at http://clickhouse-mcp.log-analytics.svc.cluster.local:8000/mcp.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clickhouse-mcp
  namespace: log-analytics
  labels:
    app.kubernetes.io/managed-by: noetl
    app.kubernetes.io/part-of: log-analytics
    app.kubernetes.io/name: clickhouse-mcp
    noetl.io/stack: log-analytics
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: clickhouse-mcp
      noetl.io/stack: log-analytics
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: noetl
        app.kubernetes.io/part-of: log-analytics
        app.kubernetes.io/name: clickhouse-mcp
        noetl.io/stack: log-analytics
    spec:
      containers:
        - name: mcp
          image: ghcr.io/clickhouse/mcp-clickhouse:0.7.0
          imagePullPolicy: IfNotPresent
          env:
            - name: CLICKHOUSE_HOST
              value: clickhouse.log-analytics.svc.cluster.local
            - name: CLICKHOUSE_PORT
              value: "8123"
            - name: CLICKHOUSE_SECURE
              value: "false"
            - name: CLICKHOUSE_VERIFY
              value: "false"
            - name: CLICKHOUSE_USER
              value: mcp_reader
            - name: CLICKHOUSE_PASSWORD
              valueFrom: { secretKeyRef: { name: log-analytics-credentials, key: reader-password } }
            - name: CLICKHOUSE_DATABASE
              value: logs
            - name: CLICKHOUSE_MCP_SERVER_TRANSPORT
              value: http
            - name: CLICKHOUSE_MCP_BIND_HOST
              value: 0.0.0.0
            - name: CLICKHOUSE_MCP_BIND_PORT
              value: "8000"
            - name: CLICKHOUSE_MCP_AUTH_TOKEN
              valueFrom: { secretKeyRef: { name: log-analytics-credentials, key: mcp-token } }
            # Host headers this server answers for: the kind hostPort and the in-cluster DNS names.
            - name: CLICKHOUSE_MCP_ALLOWED_HOSTS
              value: "127.0.0.1:*,localhost:*,clickhouse-mcp:*,clickhouse-mcp.log-analytics:*,clickhouse-mcp.log-analytics.svc:*,clickhouse-mcp.log-analytics.svc.cluster.local:*"
          ports:
            - name: mcp
              containerPort: 8000
          readinessProbe:
            httpGet: { path: /health, port: mcp }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: mcp }
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse-mcp
  namespace: log-analytics
  labels:
    app.kubernetes.io/managed-by: noetl
    app.kubernetes.io/part-of: log-analytics
    app.kubernetes.io/name: clickhouse-mcp
    noetl.io/stack: log-analytics
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: clickhouse-mcp
    noetl.io/stack: log-analytics
  ports:
    - name: mcp
      port: 8000
      targetPort: mcp
      nodePort: 30124
