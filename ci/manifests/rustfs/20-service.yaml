apiVersion: v1
kind: Service
metadata:
  name: object-store
  namespace: object-store
  labels:
    app: object-store
    object-store.noetl.io/backend: rustfs
spec:
  type: NodePort
  ports:
    - port: 9000
      targetPort: 9000
      protocol: TCP
      name: s3
      nodePort: 30902
  selector:
    app: rustfs
