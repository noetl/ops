apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
  namespace: object-store
  labels:
    app: rustfs
    object-store.noetl.io/backend: rustfs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rustfs
  template:
    metadata:
      labels:
        app: rustfs
        object-store.noetl.io/backend: rustfs
    spec:
      securityContext:
        fsGroup: 10001
      initContainers:
        - name: prepare-rustfs-volumes
          image: busybox:1.36
          command:
            - sh
            - -c
            - mkdir -p /data /logs && chown -R 10001:10001 /data /logs && chmod -R u+rwX,g+rwX /data /logs
          volumeMounts:
            - name: object-store-data
              mountPath: /data
            - name: rustfs-logs
              mountPath: /logs
      containers:
        - name: rustfs
          image: rustfs/rustfs:latest
          args:
            - /data
          env:
            - name: RUSTFS_ADDRESS
              value: ":9000"
            - name: RUSTFS_ACCESS_KEY
              value: noetl-access
            - name: RUSTFS_SECRET_KEY
              value: noetl-secret
          ports:
            - name: s3
              containerPort: 9000
          volumeMounts:
            - name: object-store-data
              mountPath: /data
            - name: rustfs-logs
              mountPath: /logs
          livenessProbe:
            tcpSocket:
              port: s3
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: s3
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: object-store-data
          persistentVolumeClaim:
            claimName: object-store-data
        - name: rustfs-logs
          emptyDir: {}
