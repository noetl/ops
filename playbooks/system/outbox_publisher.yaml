# noetl-server outbox publisher — system playbook
#
# Replaces the today's `python -m noetl.outbox_publisher` Python pod
# with a NoETL playbook running on the system worker pool.  Per
# noetl/ai-meta#46 Phase 2.a + noetl/ai-meta#50.
#
# Per the data-access-boundary rule
# (`agents/rules/data-access-boundary.md` in ai-meta), all
# interaction with the `noetl.outbox` table goes through the
# server's `/api/internal/*` HTTP endpoints — the playbook does NOT
# use `tool: postgres` directly against `noetl.outbox`.
#
# Architecture:
#
#                    +-------------------------+
#                    |  /api/execute           |
#                    |  path=system/outbox_publisher
#                    +-----------+-------------+
#                                |
#                                v (publishes command to
#                                   noetl.commands.system.<eid>
#                                   once routing extension lands —
#                                   Phase 2.a.2)
#                    +-----------+-------------+
#                    |  worker-system-pool     |
#                    |  (NATS consumer         |
#                    |   noetl_worker_pool_    |
#                    |   system, filter        |
#                    |   noetl.commands.       |
#                    |   system.>)             |
#                    +-----------+-------------+
#                                |
#                                v
#       +------------------------+------------------------+
#       |                                                 |
#       |  claim_batch                                    |
#       |  POST /api/internal/outbox/claim                |
#       |  (server runs SELECT FOR UPDATE SKIP LOCKED,    |
#       |   marks IN_FLIGHT, returns batch of rows)       |
#       |                                                 |
#       +------------------------+------------------------+
#                                |
#                                v
#       +------------------------+------------------------+
#       |  publish_batch (iterator over rows)             |
#       |  tool: nats js_publish                          |
#       |    subject = noetl.events.<tenant>.<org>.<eid>  |
#       |    payload = item.payload (JSON)                |
#       +------------------------+------------------------+
#                                |
#                                v
#       +------------------------+------------------------+
#       |  mark_published                                 |
#       |  POST /api/internal/outbox/mark-published       |
#       |  (server batch-UPDATE status=PUBLISHED)         |
#       +-------------------------------------------------+
#
# Per-row failure branch: if `publish_batch` fails for a row, the
# playbook calls `/api/internal/outbox/mark-failed` with the
# `attempts` counter so the server applies exponential backoff to
# `available_at`.  Out of scope for this minimal first cut — added
# in a follow-up round after the happy path is validated.
#
# Triggering: today, manually via
#   curl -X POST {server}/api/execute -d '{"path": "system/outbox_publisher"}'
# The scheduled-execute mechanism that fires this on a cadence is
# tracked separately under noetl/ai-meta#50 (Phase 2.a.4 / trigger
# sub-issue).
#
# Each invocation processes ONE batch (default 100 rows) and exits.
# The Python publisher today runs a tight poll loop; the playbook
# model has one execution per batch, which lets retry / replay /
# audit work the same way as user playbooks.
apiVersion: noetl.io/v2
kind: Playbook

metadata:
  name: outbox_publisher
  path: system/outbox_publisher
  description: |
    System playbook that drains the noetl.outbox transactional outbox
    to the NOETL_EVENTS NATS JetStream stream.  Replaces today's
    Python noetl-outbox-publisher pod.

workload:
  # Maximum rows to claim per invocation.  Mirrors the Python
  # publisher's NOETL_OUTBOX_PUBLISHER_BATCH_SIZE env default.
  batch_size: 100

  # NoETL server URL — the system pool's pod has this in env via the
  # deployment manifest, but the playbook reads it from the workload
  # to keep the playbook portable across server locations.
  server_url: "http://noetl.noetl.svc.cluster.local:8082"

  # Bearer-token credential alias.  Resolved at dispatch time by the
  # worker's `AuthResolver.resolve_bearer` against the keychain
  # entry of the same name.  Phase 2.a.3 (noetl/ai-meta#50)
  # added ``NOETL_KEYCHAIN_ENV_VARS=NOETL_INTERNAL_API_TOKEN`` to the
  # system pool's deployment manifest, so on worker startup
  # ``load_keychain_env_allowlist()`` lifts the bearer token from
  # the pod env into ``ctx.secrets["NOETL_INTERNAL_API_TOKEN"]``
  # under the verbatim env-var name.  Each ``tool: http`` step
  # below references this alias via the standard NoETL
  # ``auth: { type: bearer, credential: ... }`` block — the
  # AuthResolver then emits ``Authorization: Bearer <token>``.
  api_token_alias: NOETL_INTERNAL_API_TOKEN

workflow:
  - step: start
    desc: "Outbox publisher invocation entry"
    tool:
      kind: python
      input: {}
      code: |
        result = {"status": "started"}
    next:
      spec:
        mode: exclusive
      arcs:
        - step: claim_batch

  - step: claim_batch
    desc: "Claim up to batch_size rows from noetl.outbox via the server"
    tool:
      kind: http
      method: POST
      url: "{{ server_url }}/api/internal/outbox/claim"
      headers:
        Content-Type: "application/json"
      auth:
        type: bearer
        credential: "{{ api_token_alias }}"
      body:
        limit: "{{ batch_size }}"
    next:
      spec:
        mode: exclusive
      arcs:
        - step: publish_batch
          when: "{{ claim_batch.output.claimed > 0 }}"
        - step: end
          when: "{{ claim_batch.output.claimed == 0 }}"

  - step: publish_batch
    desc: "Publish each claimed row's payload to NOETL_EVENTS via NATS JetStream"
    tool:
      kind: nats
      operation: js_publish
      stream: NOETL_EVENTS
      # Subject pattern mirrors NATSEventPublisher.subject_for_event
      # in repos/noetl/noetl/core/messaging/nats_client.py:
      #   <prefix>.<tenant_or_none>.<org_or_none>.<execution_id_or_none>.<shard>
      # For the system-playbook iteration, each row already carries
      # the resolved subject in its `subject` column when emitted by
      # the server's enqueue_outbox; we use it verbatim.
      subject: "{{ item.subject if item.subject else 'noetl.events.none.none.none.0' }}"
      data: "{{ item.payload }}"
      encoding: json
      # Iterate over the rows the claim step returned.  Each
      # iteration runs as its own sub-execution (per NoETL iterator
      # semantics) so per-row failures don't block the rest.
      iterator:
        items: "{{ claim_batch.output.rows }}"
        item: row
    next:
      spec:
        mode: exclusive
      arcs:
        - step: mark_published

  - step: mark_published
    desc: "Mark successfully-published rows PUBLISHED via the server"
    tool:
      kind: http
      method: POST
      url: "{{ server_url }}/api/internal/outbox/mark-published"
      headers:
        Content-Type: "application/json"
      auth:
        type: bearer
        credential: "{{ api_token_alias }}"
      body:
        # All rows we claimed — the publish_batch step's iterator
        # guarantees they're all sent before this step.  Per-row
        # failure tracking is the follow-up (mark_failed step).
        outbox_ids: "{{ claim_batch.output.rows | map(attribute='outbox_id') | list }}"
    next:
      spec:
        mode: exclusive
      arcs:
        - step: end

  - step: end
    desc: "Outbox publisher iteration complete"
    tool:
      kind: python
      input:
        claimed: "{{ claim_batch.output.claimed if claim_batch.output else 0 }}"
      code: |
        result = {
            "status": "complete",
            "data": {
                "claimed": claimed,
                "message": (
                    f"Outbox publisher processed {claimed} rows"
                    if claimed > 0
                    else "Outbox publisher found no rows ready"
                ),
            },
        }
